// ── MARCO DE GO-LIVE ──────────────────────────────────────────────
// O Go-live só é considerado realizado quando esta tarefa recebe baixa.
// Enquanto ela estiver pendente, a data de Go-live é apenas uma previsão.
const GOLIVE_MARKER_LABEL = 'Marco: Go-live realizado';
const GOLIVE_MARKER_TASK = {
  fase: 'Fase 5 - Go-Live', tema: 'Geral', tarefa: GOLIVE_MARKER_LABEL,
  responsavel: 'Consultor', esforco: '',
  help: 'Dê baixa nesta tarefa quando o Go-live for efetivamente realizado. É ela que confirma a virada: enquanto estiver pendente, o sistema trata a data de Go-live como previsão e pode sinalizá-la como vencida.',
  _goLiveMarker: true
};
function isGoLiveMarkerTask(t) {
  if (!t) return false;
  if (t._goLiveMarker === true) return true;
  return _normTxt(t.tarefa || '') === _normTxt(GOLIVE_MARKER_LABEL);
}
function getGoLiveMarkerTask(project) {
  return (Array.isArray(project?.tasks) ? project.tasks : []).find(isGoLiveMarkerTask) || null;
}
// O Go-live foi confirmado? Usa a tarefa-marco; se o projeto não tiver essa
// tarefa (criado antes desta versão), considera realizado quando está 100%.
function isGoLiveConfirmado(project) {
  const t = getGoLiveMarkerTask(project);
  if (t) return t.status === 'concluida';
  const prog = calculateProjectProgress(project);
  return prog.totalTasks > 0 && prog.percent === 100;
}
// Go-live vencido = data passou E a virada não foi confirmada.
function isGoLiveVencido(project) {
  if (!project?.goLive) return false;
  if (isGoLiveConfirmado(project)) return false;
  return daysLeft(project.goLive) < 0;
}
function getOpenProjectRisks(project) { return getProjectRisks(project).filter(r => r.status === 'aberto' || r.status === 'monitoramento'); }
function getActiveGoLiveBlockers(project) {
  return getProjectRisks(project).filter(r => r.goLiveBlocker === true && r.status !== 'mitigado' && r.status !== 'encerrado');
}
function getOverdueProjectRisks(project) {
  return getProjectRisks(project).filter(r => r.dueDate && r.status !== 'mitigado' && r.status !== 'encerrado' && daysLeft(r.dueDate) < 0);
}
function calculateProjectRiskSummary(project) {
  const risks = getProjectRisks(project);
  return {
    total: risks.length,
    open: risks.filter(r => r.status === 'aberto').length,
    monitoring: risks.filter(r => r.status === 'monitoramento').length,
    mitigated: risks.filter(r => r.status === 'mitigado').length,
    closed: risks.filter(r => r.status === 'encerrado').length,
    highImpact: risks.filter(r => r.impact === 'alto' && r.status !== 'mitigado' && r.status !== 'encerrado').length,
    overdue: getOverdueProjectRisks(project).length,
    activeBlockers: getActiveGoLiveBlockers(project).length
  };
}
function sortProjectRisks(risks) {
  const impactRank = { alto:0, medio:1, baixo:2 };
  const probRank = { alta:0, media:1, baixa:2 };
  const ativo = r => r.status !== 'mitigado' && r.status !== 'encerrado';
  return [...risks].sort((a,b) => {
    const ab = (a.goLiveBlocker && ativo(a)) ? 0 : 1, bb = (b.goLiveBlocker && ativo(b)) ? 0 : 1;
    if (ab !== bb) return ab - bb;
    if ((impactRank[a.impact]??9) !== (impactRank[b.impact]??9)) return (impactRank[a.impact]??9) - (impactRank[b.impact]??9);
    if ((probRank[a.probability]??9) !== (probRank[b.probability]??9)) return (probRank[a.probability]??9) - (probRank[b.probability]??9);
    const ao = (a.dueDate && ativo(a) && daysLeft(a.dueDate) < 0) ? 0 : 1;
    const bo = (b.dueDate && ativo(b) && daysLeft(b.dueDate) < 0) ? 0 : 1;
    if (ao !== bo) return ao - bo;
    return (b.identifiedAt || '').localeCompare(a.identifiedAt || '');
  });
}

// ── Progresso (só microtarefas) ──
function calculateProjectProgress(project) {
  const tasks = Array.isArray(project?.tasks) ? project.tasks : [];
  const total = tasks.length;
  const completed = tasks.filter(t => t.status === 'concluida').length;
  const inProgress = tasks.filter(t => t.status === 'em_andamento').length;
  const pending = tasks.filter(t => t.status === 'pendente').length;
  const blocked = tasks.filter(t => t.status === 'bloqueada').length;
  const overdue = tasks.filter(t => t.prazo && t.status !== 'concluida' && daysLeft(t.prazo) < 0).length;
  let percent = total ? Math.round(completed / total * 100) : 0;
  percent = Math.max(0, Math.min(100, percent));
  return { totalTasks: total, completedTasks: completed, inProgressTasks: inProgress, pendingTasks: pending, blockedTasks: blocked, overdueTasks: overdue, percent };
}

// ── Fase atual (pela primeira fase com tarefa não concluída) ──
function getProjectCurrentPhase(project) {
  const ordem = Object.keys(FASE_COLORS);
  const tasks = Array.isArray(project?.tasks) ? project.tasks : [];
  const totalPhases = ordem.length;
  if (!tasks.length) {
    return { key: null, name: 'Não iniciada', index: -1, totalPhases, completedTasks: 0, totalTasks: 0, progress: 0, notStarted: true };
  }
  const fasesComTarefa = ordem.filter(f => tasks.some(t => t.fase === f));
  // primeira fase com tarefa não concluída
  for (let i = 0; i < ordem.length; i++) {
    const fase = ordem[i];
    const tf = tasks.filter(t => t.fase === fase);
    if (!tf.length) continue;
    const naoConcl = tf.some(t => t.status !== 'concluida');
    if (naoConcl) {
      const comp = tf.filter(t => t.status === 'concluida').length;
      return { key: fase, name: fase, index: i, totalPhases, completedTasks: comp, totalTasks: tf.length, progress: tf.length ? Math.round(comp/tf.length*100) : 0 };
    }
  }
  // todas concluídas → última fase existente, projeto concluído
  const ultima = fasesComTarefa[fasesComTarefa.length - 1] || ordem[ordem.length-1];
  const tf = tasks.filter(t => t.fase === ultima);
  return { key: ultima, name: ultima, index: ordem.indexOf(ultima), totalPhases, completedTasks: tf.length, totalTasks: tf.length, progress: 100, completed: true };
}

// ── Linha do tempo (progresso temporal esperado vs realizado) ──
function calculateProjectTimeline(project) {
  const start = project?.dataInicio || null;
  const goLive = project?.goLive || null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const tasks = Array.isArray(project?.tasks) ? project.tasks : [];
  const totalTasks = tasks.length;
  // Universo planejado: tarefas que têm prazo definido (vindo do cronograma macro
  // ou definido manualmente). É sobre ele que medimos realizado x esperado.
  const comPrazo = tasks.filter(t => t.prazo);
  const plannedTasks = comPrazo.length;

  // Posição do "hoje" na barra (visual) — depende das datas do projeto
  let todayPosition = 0;
  let totalDays = 0, elapsedDays = 0, remainingDays = 0;
  if (start && goLive) {
    const d0 = new Date(start + 'T00:00:00');
    const d1 = new Date(goLive + 'T00:00:00');
    totalDays = Math.max(1, Math.round((d1 - d0) / 86400000));
    const elapsed = Math.round((hoje - d0) / 86400000);
    elapsedDays = Math.max(0, Math.min(totalDays, elapsed));
    remainingDays = Math.round((d1 - hoje) / 86400000);
    todayPosition = Math.max(0, Math.min(100, ((hoje - d0) / (d1 - d0)) * 100));
  }

  let actualPercent, expectedPercent, basis;

  if (plannedTasks > 0) {
    // ── Base PRAZO: compara o que já deveria estar entregue com o que foi entregue.
    // Reflete a curva real do plano (que raramente é linear no calendário).
    const concluidas = comPrazo.filter(t => t.status === 'concluida').length;
    const vencidas = comPrazo.filter(t => {
      const d = parseLocalDate(t.prazo);
      return d && d <= hoje;
    }).length;
    actualPercent = Math.round(concluidas / plannedTasks * 100);
    expectedPercent = Math.round(vencidas / plannedTasks * 100);
    basis = 'prazo';
  } else {
    // ── Base CALENDÁRIO (fallback): sem cronograma/prazos, só resta o relógio.
    if (!start || !goLive) {
      return { startDate:start, goLiveDate:goLive, today:hoje, totalDays:0, elapsedDays:0, remainingDays:0,
               expectedPercent:0, actualPercent:0, variance:0, todayPosition:0, status:'sem-dados',
               basis:'sem-dados', plannedTasks:0, totalTasks };
    }
    actualPercent = calculateProjectProgress(project).percent;
    const d0 = new Date(start + 'T00:00:00');
    const d1 = new Date(goLive + 'T00:00:00');
    const elapsed = Math.round((hoje - d0) / 86400000);
    if (hoje < d0) expectedPercent = 0;
    else if (hoje > d1) expectedPercent = 100;
    else expectedPercent = Math.round(elapsed / totalDays * 100);
    basis = 'calendario';
  }

  actualPercent = Math.max(0, Math.min(100, actualPercent));
  expectedPercent = Math.max(0, Math.min(100, expectedPercent));
  const variance = actualPercent - expectedPercent;

  let status;
  if (variance >= -10) status = 'no-prazo';
  else if (variance >= -20) status = 'atencao';
  else status = 'critico';

  return { startDate:start, goLiveDate:goLive, today:hoje, totalDays, elapsedDays, remainingDays,
           expectedPercent, actualPercent, variance, todayPosition, status,
           basis, plannedTasks, totalTasks };
}

// ── Situação executiva (calculada, nunca salva) ──
function getProjectExecutiveStatus(project) {
  const prog = calculateProjectProgress(project);
  const reasons = [];
  const blockers = getActiveGoLiveBlockers(project);
  const dlGoLive = project?.goLive ? daysLeft(project.goLive) : null;
  // Vencido só quando a virada NÃO foi confirmada pela tarefa-marco de Go-live
  const goLiveVencido = isGoLiveVencido(project);
  const concluido = prog.totalTasks > 0 && prog.percent === 100;
  const timeline = calculateProjectTimeline(project);
  const risks = getProjectRisks(project);
  const altoAberto = risks.filter(r => r.impact === 'alto' && (r.status === 'aberto' || r.status === 'monitoramento'));

  // CRÍTICO
  if (blockers.length > 0) reasons.push(`${blockers.length} risco(s) impeditivo(s) aberto(s)`);
  if (goLiveVencido && !concluido) reasons.push(`Go-live vencido há ${Math.abs(dlGoLive)} dia(s)`);
  const bloqComGoLiveProx = prog.blockedTasks > 0 && dlGoLive != null && dlGoLive >= 0 && dlGoLive <= 30;
  if (bloqComGoLiveProx) reasons.push(`${prog.blockedTasks} tarefa(s) bloqueada(s) com Go-live em ${dlGoLive} dia(s)`);
  if (blockers.length > 0 || (goLiveVencido && !concluido) || bloqComGoLiveProx) {
    return { key:'critical', label:'Crítico', badgeClass:'badge-red', reasons };
  }
  // CONCLUÍDO
  if (concluido) return { key:'completed', label:'Concluído', badgeClass:'badge-green', reasons:['100% das tarefas concluídas'] };
  // ATENÇÃO
  const rAtencao = [];
  if (altoAberto.length > 0) rAtencao.push(`${altoAberto.length} risco(s) de impacto alto aberto(s)`);
  if (prog.overdueTasks > 0) rAtencao.push(`${prog.overdueTasks} tarefa(s) atrasada(s)`);
  if (prog.blockedTasks > 0) rAtencao.push(`${prog.blockedTasks} tarefa(s) bloqueada(s)`);
  if (timeline.status === 'critico' || timeline.status === 'atencao') rAtencao.push(`Progresso ${timeline.variance} p.p. abaixo do esperado`);
  if (rAtencao.length > 0) return { key:'attention', label:'Atenção', badgeClass:'badge-warn', reasons:rAtencao };
  // PLANEJADO
  const inicioFuturo = project?.dataInicio && daysLeft(project.dataInicio) > 0;
  const nenhumaIniciada = prog.completedTasks === 0 && prog.inProgressTasks === 0;
  if (inicioFuturo && nenhumaIniciada) return { key:'planned', label:'Planejado', badgeClass:'badge-gray', reasons:['Início ainda não chegou'] };
  // EM ANDAMENTO
  return { key:'on-track', label:'Em andamento', badgeClass:'badge-blue', reasons:['Projeto ativo sem alertas'] };
}

// ==================== DASHBOARD EXECUTIVO — FILTROS ====================
function normalizeExecutiveFilters() {
  if (!state.executiveFilters || typeof state.executiveFilters !== 'object') {
    state.executiveFilters = {};
  }
  const f = state.executiveFilters;
  ['search','module','goLivePeriod','currentPhase','projectStatus','consultant','analyst','analistaProjetos','riskFilter','blockerFilter'].forEach(k => {
    if (typeof f[k] !== 'string') f[k] = '';
  });
  // Com o portfólio crescendo, a leitura útil é o que está em andamento.
  // Entra como padrão na primeira abertura; depois vale a escolha do usuário.
  if (!f._padraoAplicado) { f.projectStatus = 'nao-concluidos'; f._padraoAplicado = true; }
  return f;
}

// Verifica se o Go-live do projeto cai no período selecionado
function matchesGoLivePeriod(project, periodKey) {
  if (!periodKey) return true;
  const gl = project?.goLive;
  if (periodKey === 'sem-data') return !gl;
  if (!gl) return false;
  const dl = daysLeft(gl);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const d = new Date(gl + 'T00:00:00');
  const mesAtual = hoje.getMonth(), anoAtual = hoje.getFullYear();
  const triAtual = Math.floor(mesAtual / 3);
  const triProjeto = Math.floor(d.getMonth() / 3);
  switch (periodKey) {
    case 'vencidos': return dl < 0;
    case 'prox30': return dl >= 0 && dl <= 30;
    case 'prox60': return dl >= 0 && dl <= 60;
    case 'prox90': return dl >= 0 && dl <= 90;
    case 'este-mes': return d.getMonth() === mesAtual && d.getFullYear() === anoAtual;
    case 'prox-mes': { const nm = new Date(anoAtual, mesAtual+1, 1); return d.getMonth() === nm.getMonth() && d.getFullYear() === nm.getFullYear(); }
    case 'este-tri': return triProjeto === triAtual && d.getFullYear() === anoAtual;
    case 'prox-tri': { let t = triAtual+1, ano=anoAtual; if(t>3){t=0;ano++;} return triProjeto === t && d.getFullYear() === ano; }
    case 'este-ano': return d.getFullYear() === anoAtual;
    default: return true;
  }
}

function getFilteredExecutiveProjects() {
  const f = normalizeExecutiveFilters();
  const busca = _normTxt(f.search || '');
  return (state.projetos || []).filter(p => {
    if (busca) {
      const alvo = _normTxt([p.nome, p.cliente, p.consultor, p.analista, (p.modulos||[]).join(' '), p.itensCustomizados].filter(Boolean).join(' '));
      if (!alvo.includes(busca)) return false;
    }
    if (f.module && !projectHasModule(p, f.module)) return false;
    if (f.goLivePeriod && !matchesGoLivePeriod(p, f.goLivePeriod)) return false;
    if (f.currentPhase) {
      const fase = getProjectCurrentPhase(p);
      if (f.currentPhase === '__none__') { if (!fase.notStarted) return false; }
      else if (fase.name !== f.currentPhase) return false;
    }
    if (f.projectStatus === 'nao-concluidos') {
      if (getProjectExecutiveStatus(p).key === 'completed') return false;
    } else if (f.projectStatus) {
      const st = getProjectExecutiveStatus(p);
      if (st.key !== f.projectStatus) return false;
    }
    if (f.consultant && !pessoaEstaEm(p.consultor, f.consultant)) return false;
    if (f.analyst && !pessoaEstaEm(p.analista, f.analyst)) return false;
    // Analista de projetos: quem acompanha o projeto na gestão. Projeto com mais de um aparece no filtro de cada um.
    if (f.analistaProjetos === '__sem__') { if (listaPessoas(p.analistaProjetos).length) return false; }
    else if (f.analistaProjetos && !pessoaEstaEm(p.analistaProjetos, f.analistaProjetos)) return false;
    if (f.riskFilter) {
      const rs = calculateProjectRiskSummary(p);
      if (f.riskFilter === 'com-abertos' && rs.open + rs.monitoring === 0) return false;
      if (f.riskFilter === 'sem-abertos' && rs.open + rs.monitoring > 0) return false;
      if (f.riskFilter === 'alto-impacto' && rs.highImpact === 0) return false;
      if (f.riskFilter === 'vencidos' && rs.overdue === 0) return false;
    }
    if (f.blockerFilter) {
      const blk = getActiveGoLiveBlockers(p).length;
      if (f.blockerFilter === 'com-impeditivo' && blk === 0) return false;
      if (f.blockerFilter === 'sem-impeditivo' && blk > 0) return false;
    }
    return true;
  });
}

function clearExecutiveFilters() {
  state.executiveFilters = {};
  normalizeExecutiveFilters();
  renderExecutiveDashboard();
}
function execSetFilter(key, value) {
  normalizeExecutiveFilters();
  state.executiveFilters[key] = value;
  renderExecutiveDashboard();
}

// ==================== DASHBOARD EXECUTIVO — AGREGAÇÕES ====================
function calculateExecutiveIndicators(projects) {
  let emAndamento = 0, criticos = 0, goLive30 = 0, riscosAbertos = 0, impeditivos = 0, somaProg = 0;
  projects.forEach(p => {
    const st = getProjectExecutiveStatus(p);
    if (['on-track','attention','critical'].includes(st.key)) emAndamento++;
    if (st.key === 'critical') criticos++;
    const dl = p.goLive ? daysLeft(p.goLive) : null;
    if (dl != null && dl >= 0 && dl <= 30) goLive30++;
    const rs = calculateProjectRiskSummary(p);
    riscosAbertos += rs.open + rs.monitoring;
    impeditivos += rs.activeBlockers;
    somaProg += calculateProjectProgress(p).percent;
  });
  const progMedio = projects.length ? Math.round(somaProg / projects.length) : 0;
  return { emAndamento, criticos, goLive30, riscosAbertos, impeditivos, progMedio, total: projects.length };
}
function calculateProjectsByPhase(projects) {
  const ordem = Object.keys(FASE_COLORS);
  const cont = {}; ordem.forEach(f => cont[f] = 0); cont['Não iniciada'] = 0;
  projects.forEach(p => {
    const fase = getProjectCurrentPhase(p);
    const nome = fase.notStarted ? 'Não iniciada' : fase.name;
    cont[nome] = (cont[nome] || 0) + 1;
  });
  return cont;
}
function calculateProjectsByModule(projects) {
  const cont = {}; PROJECT_MODULE_OPTIONS.forEach(m => cont[m] = 0);
  // Conta cada módulo uma vez por projeto; submódulos não somam separadamente
  // (um projeto com 5 submódulos de RH conta como 1 em RH).
  projects.forEach(p => PROJECT_MODULE_OPTIONS.forEach(m => { if (projectHasModule(p, m)) cont[m]++; }));
  return cont;
}
function calculateProjectsByStatus(projects) {
  const cont = { planned:0, 'on-track':0, attention:0, critical:0, completed:0 };
  projects.forEach(p => { const st = getProjectExecutiveStatus(p); cont[st.key] = (cont[st.key]||0)+1; });
  return cont;
}

function _demoDateISO(offsetDias) {
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + offsetDias);
  return d.toISOString().slice(0,10);
}

// Aplica um status às N primeiras tarefas de cada fase até uma "fase alvo",
// simulando um projeto que avançou até determinado ponto.
function _demoAplicarProgresso(tasks, faseAlvoIndex, percentUltimaFase, opcoes = {}) {
  const ordem = Object.keys(FASE_COLORS);
  const hoje = _demoDateISO(0);
  tasks.forEach(t => {
    const idxFase = ordem.indexOf(t.fase);
    if (idxFase < 0) return;
    if (idxFase < faseAlvoIndex) {
      t.status = 'concluida';
    } else if (idxFase === faseAlvoIndex) {
      t._naFaseAlvo = true; // marca para tratar depois
    } else {
      t.status = 'pendente';
    }
  });
  // na fase alvo, conclui uma fração e deixa o resto em andamento/pendente
  const naFase = tasks.filter(t => t._naFaseAlvo);
  const qtdConcluir = Math.round(naFase.length * (percentUltimaFase/100));
  naFase.forEach((t, i) => {
    if (i < qtdConcluir) t.status = 'concluida';
    else if (i === qtdConcluir) t.status = 'em_andamento';
    else t.status = 'pendente';
    delete t._naFaseAlvo;
  });
  // prazos: distribui algumas tarefas abertas com prazo próximo/vencido conforme opções
  const abertas = tasks.filter(t => t.status !== 'concluida');
  if (opcoes.atrasadas) {
    for (let i = 0; i < Math.min(opcoes.atrasadas, abertas.length); i++) {
      abertas[i].prazo = _demoDateISO(-(3 + i*4));
    }
  }
  if (opcoes.proximas) {
    const base = opcoes.atrasadas || 0;
    for (let i = 0; i < Math.min(opcoes.proximas, abertas.length - base); i++) {
      abertas[base + i].prazo = _demoDateISO(2 + i*3);
    }
  }
  if (opcoes.bloqueadas) {
    for (let i = 0; i < Math.min(opcoes.bloqueadas, abertas.length); i++) {
      const alvo = abertas[abertas.length - 1 - i];
      if (alvo) alvo.status = 'bloqueada';
    }
  }
}

function renderUpcomingGoLives(projects) {
  const comData = projects.filter(p => p.goLive).map(p => ({p, dl: daysLeft(p.goLive)}))
    .filter(x => x.dl != null && x.dl <= 90)
    .sort((a,b) => a.dl - b.dl);
  if (!comData.length) return '';
  const linhas = comData.map(({p, dl}) => {
    const fase = getProjectCurrentPhase(p);
    const prog = calculateProjectProgress(p);
    const st = getProjectExecutiveStatus(p);
    const blk = getActiveGoLiveBlockers(p).length;
    let cor, txt;
    if (dl < 0) { cor = 'var(--danger)'; txt = `${Math.abs(dl)}d vencido`; }
    else if (dl <= 7) { cor = 'var(--danger)'; txt = `${dl}d`; }
    else if (dl <= 30) { cor = 'var(--warn)'; txt = `${dl}d`; }
    else { cor = 'var(--gray-500)'; txt = `${dl}d`; }
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray-100);cursor:pointer" onclick="abrirProjeto('${p.id}')">
      <div style="min-width:70px;text-align:center"><div style="font-size:15px;font-weight:800;color:${cor}">${txt}</div><div style="font-size:10px;color:var(--gray-400)">${fmt(p.goLive)}</div></div>
      <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:var(--gray-900)">${p.nome}</div><div style="font-size:11px;color:var(--gray-500)">${p.cliente} · ${fase.notStarted?'Não iniciada':fase.name}</div></div>
      <div style="min-width:90px"><div style="display:flex;align-items:center;gap:5px"><div style="flex:1;height:5px;background:var(--gray-100);border-radius:3px;overflow:hidden"><div style="height:100%;width:${prog.percent}%;background:${prog.percent===100?'var(--success)':'var(--accent)'}"></div></div><span style="font-size:11px;font-weight:700;color:var(--gray-600)">${prog.percent}%</span></div></div>
      <span class="badge ${st.badgeClass}" style="font-size:10px">${st.label}</span>
      ${blk>0?`<span class="badge badge-red" style="font-size:10px"><i class="ti ti-ban"></i>${blk}</span>`:''}
    </div>`;
  }).join('');
  return `<div class="card" style="margin-bottom:16px">
    <div class="card-header"><div class="card-title"><i class="ti ti-rocket" style="margin-right:6px;color:var(--accent)"></i>Próximos Go-lives (90 dias)</div></div>
    ${linhas}
  </div>`;
}

// Linha do tempo visual (barra com progresso realizado, hoje e esperado)
function renderProjectTimeline(project) {
  const tl = calculateProjectTimeline(project);
  if (tl.status === 'sem-dados') {
    return `<div style="font-size:11px;color:var(--gray-400)"><i class="ti ti-calendar-off" style="font-size:12px"></i> Sem datas</div>`;
  }
  const corVar = tl.status === 'no-prazo' ? 'var(--success)' : tl.status === 'atencao' ? 'var(--warn)' : 'var(--danger)';
  const sinal = tl.variance >= 0 ? '+' : '';
  const baseTxt = tl.basis === 'prazo'
    ? `Base: prazos planejados (${tl.plannedTasks} de ${tl.totalTasks} tarefas com prazo)`
    : `Base: calendário — sem prazos definidos (estimativa)`;
  const marcaEstimativa = tl.basis === 'calendario' ? '~' : '';
  return `<div title="Realizado ${tl.actualPercent}% · Esperado ${tl.expectedPercent}% · Desvio ${sinal}${tl.variance} p.p.&#10;${baseTxt}" style="min-width:150px">
    <div style="position:relative;height:10px;background:var(--gray-100);border-radius:5px;overflow:visible">
      <div style="position:absolute;left:0;top:0;height:100%;width:${tl.actualPercent}%;background:${corVar};border-radius:5px"></div>
      <div style="position:absolute;left:${tl.expectedPercent}%;top:-2px;height:14px;width:2px;background:var(--gray-700)" title="Esperado ${tl.expectedPercent}%"></div>
      <div style="position:absolute;left:${tl.todayPosition}%;top:-4px;transform:translateX(-50%);font-size:9px;color:var(--accent)"><i class="ti ti-caret-down-filled"></i></div>
    </div>
    <div style="font-size:10px;color:${corVar};margin-top:3px;font-weight:600">Real ${tl.actualPercent}% · Esp ${marcaEstimativa}${tl.expectedPercent}% · ${sinal}${tl.variance}p.p.</div>
  </div>`;
}

function renderExecutiveProjectsTable(projects) {
  // Ordenação executiva: por Go-live (mais próximo primeiro).
  // Projetos sem Go-live vão para o fim da lista.
  const ordenados = [...projects].sort((a, b) => {
    const da = a.goLive ? parseLocalDate(a.goLive) : null;
    const db = b.goLive ? parseLocalDate(b.goLive) : null;
    if (!da && !db) return (a.nome || '').localeCompare(b.nome || '');
    if (!da) return 1;
    if (!db) return -1;
    if (da.getTime() !== db.getTime()) return da - db;
    return (a.nome || '').localeCompare(b.nome || '');
  });

  const linhas = ordenados.map(p => {
    const fase = getProjectCurrentPhase(p);
    const prog = calculateProjectProgress(p);
    const st = getProjectExecutiveStatus(p);
    const rs = calculateProjectRiskSummary(p);
    const dl = p.goLive ? daysLeft(p.goLive) : null;
    const reasonsTxt = st.reasons.join(' · ').replace(/"/g,'&quot;');
    const riscoCel = rs.total === 0
      ? `<span style="font-size:11px;color:var(--gray-400)">Sem riscos cadastrados</span>`
      : `<div style="font-size:11px;color:var(--gray-600)">${rs.open+rs.monitoring} aberto(s)</div>${rs.activeBlockers>0?`<div style="font-size:11px;color:var(--danger);font-weight:600"><i class="ti ti-ban" style="font-size:11px"></i> ${rs.activeBlockers} impeditivo(s)</div>`:''}`;
    return `<tr>
      <td style="cursor:pointer" onclick="abrirProjeto('${p.id}')"><div style="font-size:13px;font-weight:600;color:var(--accent)">${p.nome}</div><div style="font-size:11px;color:var(--gray-400)">${p.cliente}</div></td>
      <td>${fase.notStarted?`<span class="badge badge-gray" style="font-size:10px">Não iniciada</span>`:faseBadge(fase.name)}${!fase.notStarted?`<div style="font-size:10px;color:var(--gray-400);margin-top:3px">${fase.completedTasks} de ${fase.totalTasks} tarefas</div>`:''}</td>
      <td>${renderProjectTimeline(p)}</td>
      <td><div style="font-size:14px;font-weight:800;color:${prog.percent===100?'var(--success)':'var(--accent)'}">${prog.percent}%</div><div style="font-size:10px;color:var(--gray-400)">${prog.completedTasks}/${prog.totalTasks}</div></td>
      <td><div style="font-size:12px;font-weight:600">${fmt(p.goLive)}</div>${(() => {
        if (!p.goLive) return '';
        if (isGoLiveConfirmado(p)) return `<div style="font-size:10px;color:var(--success);font-weight:600"><i class="ti ti-circle-check" style="font-size:11px"></i> Realizado</div>`;
        if (isGoLiveVencido(p)) return `<div style="font-size:10px;color:var(--danger);font-weight:600">${Math.abs(dl)}d vencido</div>`;
        return `<div style="font-size:10px;color:${dl<=30?'var(--warn)':'var(--gray-400)'}">${dl}d</div>`;
      })()}</td>
      <td><span class="badge ${st.badgeClass}" style="font-size:10px;cursor:help" title="${st.label}: ${reasonsTxt}" onclick="showProjectExecutiveSummary('${p.id}')">${st.label}</span></td>
      <td style="cursor:pointer" onclick="showProjectExecutiveSummary('${p.id}')">${riscoCel}</td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap">${renderProjectModules(p,{compact:true,hideWhenEmpty:true})||'<span style="font-size:11px;color:var(--gray-300)">—</span>'}</div></td>
    </tr>`;
  }).join('');
  return `<div class="card" style="padding:0;overflow:hidden">
    <div class="card-header" style="padding:14px 16px"><div class="card-title"><i class="ti ti-folder" style="margin-right:6px;color:var(--accent)"></i>Portfólio de projetos (${ordenados.length})</div><div style="font-size:11px;color:var(--gray-400)">Ordenado por Go-live</div></div>
    <div style="overflow-x:auto"><table style="width:100%;min-width:760px;table-layout:fixed">
      <colgroup>
        <col style="width:20%">
        <col style="width:14%">
        <col style="width:16%">
        <col style="width:9%">
        <col style="width:11%">
        <col style="width:10%">
        <col style="width:11%">
        <col style="width:9%">
      </colgroup>
      <thead><tr><th>Projeto</th><th>Fase atual</th><th>Linha do tempo</th><th>Conclusão</th><th>Go-live</th><th>Situação</th><th>Riscos</th><th>Módulos</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table></div>
  </div>`;
}

// Resumo executivo do projeto (modal)
function showProjectExecutiveSummary(projectId) {
  const p = state.projetos.find(x => x.id === projectId);
  if (!p) return;
  const prog = calculateProjectProgress(p);
  const fase = getProjectCurrentPhase(p);
  const tl = calculateProjectTimeline(p);
  const st = getProjectExecutiveStatus(p);
  const rs = calculateProjectRiskSummary(p);
  const blockers = getActiveGoLiveBlockers(p);
  const custom = (p.itensCustomizados||'').trim();
  const sinal = tl.variance >= 0 ? '+' : '';
  // macro entregas atrasadas (quando calculável)
  let macroAtrasadas = 0;
  try {
    // conta cada macro UMA vez, pela situação da macro inteira (antes contava uma por fase em que ela tinha tarefas)
    const resumos = resumoPorMacro(p, p.macroActivities || [], mapaMacroTarefas(p));
    macroAtrasadas = Object.values(resumos).filter(r => r.status.key === 'atrasada').length;
  } catch(e) {}
  const top5 = sortProjectRisks(getProjectRisks(p)).slice(0,5);

  openModal(`<div class="modal-header">
    <div class="modal-title"><i class="ti ti-briefcase" style="margin-right:8px;color:var(--accent)"></i>Resumo executivo — ${p.nome}</div>
    <button class="btn btn-ghost" onclick="closeModal()"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <span class="badge ${st.badgeClass}">${st.label}</span>
      ${fase.notStarted?`<span class="badge badge-gray">Não iniciada</span>`:faseBadge(fase.name)}
      <span style="font-size:12px;color:var(--gray-500)">${p.cliente}</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:6px">
      <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px"><div style="font-size:11px;color:var(--gray-500)">Progresso realizado</div><div style="font-size:20px;font-weight:800;color:${prog.percent===100?'var(--success)':'var(--accent)'}">${prog.percent}%</div></div>
      <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px"><div style="font-size:11px;color:var(--gray-500)">Esperado (linha do tempo)</div><div style="font-size:20px;font-weight:800;color:var(--gray-600)">${tl.status==='sem-dados'?'—':tl.expectedPercent+'%'}</div></div>
      <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px"><div style="font-size:11px;color:var(--gray-500)">Desvio</div><div style="font-size:20px;font-weight:800;color:${tl.variance>=-10?'var(--success)':tl.variance>=-20?'var(--warn)':'var(--danger)'}">${tl.status==='sem-dados'?'—':sinal+tl.variance+' p.p.'}</div></div>
    </div>
    <div style="font-size:11px;color:var(--gray-400);margin-bottom:16px;display:flex;gap:6px;align-items:flex-start">
      <i class="ti ti-info-circle" style="font-size:12px;margin-top:1px"></i>
      <span>${tl.basis==='prazo'
        ? `Esperado e desvio calculados sobre os prazos planejados — ${tl.plannedTasks} de ${tl.totalTasks} tarefas com prazo definido. Realizado no card acima considera todas as tarefas.`
        : tl.basis==='calendario'
          ? `Sem prazos definidos nas tarefas: o esperado é uma estimativa pelo calendário (proporção do tempo decorrido), que assume ritmo linear. Importe o cronograma para um cálculo fiel ao plano.`
          : `Sem datas e sem prazos definidos — não é possível calcular o esperado.`}</span>
    </div>
    <table style="width:100%;margin-bottom:14px"><tbody style="font-size:13px">
      <tr><td style="color:var(--gray-500);padding:5px 0">Início</td><td style="text-align:right">${fmt(p.dataInicio)}</td><td style="color:var(--gray-500);padding:5px 0 5px 20px">Go-live</td><td style="text-align:right">${fmt(p.goLive)}</td></tr>
      <tr><td style="color:var(--gray-500);padding:5px 0">Consultor</td><td style="text-align:right">${exibirPessoas(p.consultor)}</td><td style="color:var(--gray-500);padding:5px 0 5px 20px">Analista</td><td style="text-align:right">${exibirPessoas(p.analista)}</td></tr>
      <tr><td style="color:var(--gray-500);padding:5px 0">Tech lead</td><td style="text-align:right">${exibirPessoas(p.techLead)}</td><td style="color:var(--gray-500);padding:5px 0 5px 20px">Analista de projetos</td><td style="text-align:right">${exibirPessoas(p.analistaProjetos)}</td></tr>
      <tr><td style="color:var(--gray-500);padding:5px 0">Tarefas bloqueadas</td><td style="text-align:right;color:${prog.blockedTasks?'var(--danger)':'inherit'}">${prog.blockedTasks}</td><td style="color:var(--gray-500);padding:5px 0 5px 20px">Tarefas atrasadas</td><td style="text-align:right;color:${prog.overdueTasks?'var(--danger)':'inherit'}">${prog.overdueTasks}</td></tr>
      <tr><td style="color:var(--gray-500);padding:5px 0">Riscos abertos</td><td style="text-align:right">${rs.open+rs.monitoring}</td><td style="color:var(--gray-500);padding:5px 0 5px 20px">Impeditivos ativos</td><td style="text-align:right;color:${rs.activeBlockers?'var(--danger)':'inherit'}">${rs.activeBlockers}</td></tr>
      <tr><td style="color:var(--gray-500);padding:5px 0">Macro entregas atrasadas</td><td style="text-align:right">${macroAtrasadas}</td><td style="color:var(--gray-500);padding:5px 0 5px 20px">Riscos vencidos</td><td style="text-align:right">${rs.overdue}</td></tr>
    </tbody></table>
    <div style="margin-bottom:14px"><div style="font-size:11px;color:var(--gray-500);margin-bottom:4px">Módulos</div><div style="display:flex;gap:6px;flex-wrap:wrap">${renderProjectModules(p,{})}</div>${custom?`<div style="font-size:12px;color:var(--gray-500);margin-top:8px"><i class="ti ti-puzzle" style="font-size:12px"></i> <strong>Customizados:</strong> ${custom}</div>`:''}</div>
    ${st.reasons.length?`<div class="alert ${st.key==='critical'?'alert-danger':st.key==='attention'?'alert-warn':'alert-info'}" style="margin-bottom:14px"><div style="font-weight:600;margin-bottom:4px">Por que "${st.label}"?</div><ul style="margin:0;padding-left:18px;font-size:12px">${st.reasons.map(r=>`<li>${r}</li>`).join('')}</ul></div>`:''}
    ${(() => {
      const todos = getProjectRisks(p);
      if (!todos.length) return `<div style="font-size:12px;color:var(--gray-400)">Nenhum risco cadastrado para este projeto.</div>`;
      const ativo = r => r.status !== 'mitigado' && r.status !== 'encerrado';
      const pesoImp = { alto:0, medio:1, baixo:2 };
      const ordenados = [...todos].sort((a,b) => {
        const ia = (a.goLiveBlocker && ativo(a)) ? 0 : 1, ib = (b.goLiveBlocker && ativo(b)) ? 0 : 1;
        if (ia !== ib) return ia - ib;
        if (ativo(a) !== ativo(b)) return ativo(a) ? -1 : 1;
        return (pesoImp[a.impact] ?? 3) - (pesoImp[b.impact] ?? 3);
      });
      return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-size:12px;font-weight:700;color:var(--gray-600)">Riscos do projeto (${todos.length})</div>
          <div style="font-size:11px;color:var(--gray-400)">Clique em um risco para ver os detalhes</div>
        </div>
        <div style="max-height:30vh;overflow-y:auto;border:1px solid var(--gray-200);border-radius:8px">
        <table style="width:100%"><thead><tr>
          <th style="font-size:10px">Risco</th><th style="font-size:10px">Categoria</th>
          <th style="font-size:10px">Prob.</th><th style="font-size:10px">Impacto</th>
          <th style="font-size:10px">Situação</th><th style="font-size:10px">Responsável</th><th style="font-size:10px">Prazo</th>
        </tr></thead><tbody>${ordenados.map(r => {
          const imp = r.goLiveBlocker && ativo(r);
          const venc = r.dueDate && ativo(r) && daysLeft(r.dueDate) < 0;
          return `<tr style="cursor:pointer;${imp?'background:#fef2f2':''}" title="Abrir detalhes do risco" onclick="verRiscoDoResumo('${p.id}','${r.id}')">
            <td style="font-size:12px;font-weight:500">${imp?`<i class="ti ti-ban" style="color:var(--danger);font-size:12px" title="Impeditivo de Go-live"></i> `:''}${r.title}</td>
            <td style="font-size:11px;color:var(--gray-600)">${r.category||'—'}</td>
            <td>${renderRiskProbabilityBadge(r.probability)}</td>
            <td>${renderRiskImpactBadge(r.impact)}</td>
            <td>${renderRiskStatusBadge(r.status)}</td>
            <td style="font-size:11px;color:var(--gray-600)">${r.owner||'—'}</td>
            <td style="font-size:11px;color:${venc?'var(--danger)':'var(--gray-500)'};font-weight:${venc?'600':'400'}">${r.dueDate?fmt(r.dueDate):'—'}</td>
          </tr>`;
        }).join('')}</tbody></table>
        </div>`;
    })()}
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="closeModal();abrirProjeto('${p.id}')"><i class="ti ti-folder"></i> Abrir projeto</button>
    <button class="btn btn-primary" onclick="closeModal();abrirProjetoNaAba('${p.id}','riscos')"><i class="ti ti-alert-triangle"></i> Ver riscos</button>
  </div>`, true);
}

// Abre o detalhe de um risco a partir do resumo executivo, guardando de onde veio
// para permitir voltar ao resumo ao fechar.
function verRiscoDoResumo(pId, riskId) {
  window._voltarResumoExecutivo = pId;
  renderRiskForm(pId, riskId);
}
function voltarAoResumoExecutivo() {
  const pId = window._voltarResumoExecutivo;
  window._voltarResumoExecutivo = null;
  if (pId) showProjectExecutiveSummary(pId); else closeModal();
}

function abrirProjetoNaAba(pId, aba) {
  state.viewMode = aba;
  abrirProjeto(pId);
}

// ==================== MÓDULO DE RISCOS ====================
function renderRiskStatusBadge(status) {
  const M = { aberto:['Aberto','badge-red','ti-alert-circle'], monitoramento:['Monitoramento','badge-warn','ti-eye'], mitigado:['Mitigado','badge-green','ti-shield-check'], encerrado:['Encerrado','badge-gray','ti-circle-check'] };
  const [l,b,i] = M[status] || M.aberto;
  return `<span class="badge ${b}" style="font-size:10px"><i class="ti ${i}"></i>${l}</span>`;
}
function renderRiskImpactBadge(impact) {
  const M = { alto:['Alto','badge-red'], medio:['Médio','badge-warn'], baixo:['Baixo','badge-gray'] };
  const [l,b] = M[impact] || M.medio;
  return `<span class="badge ${b}" style="font-size:10px">${l}</span>`;
}
function renderRiskProbabilityBadge(probability) {
  const M = { alta:['Alta','badge-red'], media:['Média','badge-warn'], baixa:['Baixa','badge-gray'] };
  const [l,b] = M[probability] || M.media;
  return `<span class="badge ${b}" style="font-size:10px">${l}</span>`;
}

function renderProjectRisks(project) {
  const container = document.getElementById('task-view');
  if (!container) return;
  const risks = sortProjectRisks(getProjectRisks(project));
  const rs = calculateProjectRiskSummary(project);
  const gestor = isGestor();

  const indicadores = `<div class="stats-grid" style="margin-bottom:16px">
    <div class="stat-card"><div class="stat-icon" style="background:#fee2e2"><i class="ti ti-alert-circle" style="color:var(--danger)"></i></div><div><div class="stat-label">Riscos abertos</div><div class="stat-value">${rs.open}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#fef3c7"><i class="ti ti-eye" style="color:var(--warn)"></i></div><div><div class="stat-label">Em monitoramento</div><div class="stat-value">${rs.monitoring}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#fee2e2"><i class="ti ti-flame" style="color:var(--danger)"></i></div><div><div class="stat-label">Impacto alto</div><div class="stat-value">${rs.highImpact}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#fee2e2"><i class="ti ti-ban" style="color:var(--danger)"></i></div><div><div class="stat-label">Impeditivos Go-live</div><div class="stat-value">${rs.activeBlockers}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#f1f5f9"><i class="ti ti-clock-exclamation" style="color:var(--gray-500)"></i></div><div><div class="stat-label">Riscos vencidos</div><div class="stat-value">${rs.overdue}</div></div></div>
  </div>`;

  const acoes = gestor ? `<div style="display:flex;justify-content:flex-end;margin-bottom:14px"><button class="btn btn-primary btn-sm" onclick="modalNovoRisco('${project.id}')"><i class="ti ti-plus"></i> Novo risco</button></div>` : '';

  if (!risks.length) {
    container.innerHTML = indicadores + acoes + `<div class="card"><div class="empty"><i class="ti ti-shield-check"></i><p>Nenhum risco cadastrado para este projeto.</p>${gestor?`<small>Cadastre riscos para acompanhar impactos e impedimentos do Go-live.</small>`:''}</div></div>`;
    return;
  }

  const linhas = risks.map(r => {
    const ativo = r.status !== 'mitigado' && r.status !== 'encerrado';
    const impeditivoAtivo = r.goLiveBlocker && ativo;
    const vencido = r.dueDate && ativo && daysLeft(r.dueDate) < 0;
    return `<tr style="${impeditivoAtivo?'background:#fef2f2':''}">
      <td style="max-width:280px"><div style="font-size:13px;font-weight:600;color:var(--gray-900)">${impeditivoAtivo?`<i class="ti ti-ban" style="color:var(--danger);font-size:13px" title="Impeditivo de Go-live"></i> `:''}${r.title}</div>${r.description?`<div style="font-size:11px;color:var(--gray-400);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px">${r.description}</div>`:''}</td>
      <td style="font-size:12px;color:var(--gray-600)">${r.category||'—'}</td>
      <td>${renderRiskProbabilityBadge(r.probability)}</td>
      <td>${renderRiskImpactBadge(r.impact)}</td>
      <td>${renderRiskStatusBadge(r.status)}</td>
      <td style="font-size:12px;color:var(--gray-600)">${r.owner||'—'}</td>
      <td style="font-size:12px;color:${vencido?'var(--danger)':'var(--gray-500)'};font-weight:${vencido?'600':'400'}">${r.dueDate?fmt(r.dueDate):'—'}${vencido?' <i class="ti ti-alert-triangle" style="font-size:11px"></i>':''}</td>
      <td style="text-align:center">${r.goLiveBlocker?`<i class="ti ti-ban" style="color:${impeditivoAtivo?'var(--danger)':'var(--gray-300)'};font-size:15px" title="${impeditivoAtivo?'Impeditivo ativo':'Marcado como impeditivo (risco não ativo)'}"></i>`:'<span style="color:var(--gray-300)">—</span>'}</td>
      <td style="white-space:nowrap">
        ${gestor ? `
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" style="padding:3px 8px;font-size:11px" title="Editar risco" onclick="editarRisco('${project.id}','${r.id}')"><i class="ti ti-edit"></i> Editar</button>
          ${ativo?`<button class="btn btn-secondary btn-sm" style="padding:3px 8px;font-size:11px;color:var(--success);border-color:#86efac" title="Marcar como mitigado" onclick="updateRiskStatus('${project.id}','${r.id}','mitigado')"><i class="ti ti-shield-check"></i> Mitigar</button>`:''}
          ${r.status!=='encerrado'
            ? `<button class="btn btn-secondary btn-sm" style="padding:3px 8px;font-size:11px" title="Encerrar risco" onclick="updateRiskStatus('${project.id}','${r.id}','encerrado')"><i class="ti ti-circle-check"></i> Encerrar</button>`
            : `<button class="btn btn-secondary btn-sm" style="padding:3px 8px;font-size:11px" title="Reabrir risco" onclick="updateRiskStatus('${project.id}','${r.id}','aberto')"><i class="ti ti-rotate"></i> Reabrir</button>`}
          <button class="btn btn-sm btn-excluir" style="font-size:11px" title="Excluir risco" onclick="deleteRisk('${project.id}','${r.id}')"><i class="ti ti-trash"></i> Excluir</button>
        </div>
        ` : `<button class="btn btn-secondary btn-sm" style="padding:3px 8px;font-size:11px" title="Ver detalhes" onclick="editarRisco('${project.id}','${r.id}')"><i class="ti ti-eye"></i> Detalhes</button>`}
      </td>
    </tr>`;
  }).join('');

  container.innerHTML = indicadores + acoes + `<div class="card" style="padding:0;overflow:hidden">

async function salvarRisco(projectId, riskId = null) {
  try {
    const p = state.projetos.find(x => x.id === projectId);
    if (!p) return;
    const el = id => document.getElementById(id);
    const obrig = [{id:'rTitle',l:'Título'},{id:'rDesc',l:'Descrição'},{id:'rCategory',l:'Categoria'},{id:'rProbability',l:'Probabilidade'},{id:'rImpact',l:'Impacto'}];
    obrig.forEach(c => limparErroCampo(c.id));
    const faltando = obrig.filter(c => !(el(c.id)?.value || '').trim());
    if (faltando.length) {
      faltando.forEach(c => marcarErroCampo(c.id));
      const ab=el('rFormAlert'), am=el('rFormAlertMsg');
      if(ab&&am){ am.textContent = faltando.length===1?`O campo "${faltando[0].l}" é obrigatório.`:`Preencha os ${faltando.length} campos obrigatórios.`; ab.style.display='flex'; }
      return;
    }
    let owner = (el('rOwner')?.value || '').trim();
    if (owner === '__custom') owner = (el('rOwnerCustom')?.value || '').trim();
    const status = el('rStatus')?.value || 'aberto';
    const agora = new Date().toISOString();
    if (!Array.isArray(p.risks)) p.risks = [];

    // Monta o objeto do risco (novo ou editado) sem ainda mexer no state.
    let riscoObj, ehNovo = false, riscoAntigo = null;
    if (riskId) {
      const r = p.risks.find(x => x.id === riskId);
      if (!r) return;
      riscoAntigo = { ...r };
      riscoObj = {
        ...r,
        title: el('rTitle').value.trim(),
        description: el('rDesc').value.trim(),
        category: el('rCategory').value,
        probability: el('rProbability').value,
        impact: el('rImpact').value,
        status,
        owner,
        mitigationPlan: (el('rMitigation')?.value || '').trim(),
        dueDate: el('rDueDate')?.value || null,
        goLiveBlocker: !!el('rBlocker')?.checked,
        updatedAt: agora,
        closedAt: status === 'encerrado' ? (r.closedAt || agora) : null
      };
    } else {
      ehNovo = true;
      riscoObj = {
        id: uid(), title: el('rTitle').value.trim(), description: el('rDesc').value.trim(),
        category: el('rCategory').value, probability: el('rProbability').value, impact: el('rImpact').value,
        status, goLiveBlocker: !!el('rBlocker')?.checked, owner,
        mitigationPlan: (el('rMitigation')?.value || '').trim(), dueDate: el('rDueDate')?.value || null,
        identifiedAt: agora, updatedAt: agora, closedAt: status === 'encerrado' ? agora : null,
        createdBy: state.currentUser?.name || ''
      };
    }

    // Botão em estado "salvando" (Opção 1: confirmar antes de refletir)
    const btn = el('rBtnSalvar');
    const lblOrig = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Salvando...'; }

    const res = ehNovo
      ? await inserirRiscoSupabase(riscoObj, projectId)
      : await atualizarRiscoSupabase(riscoObj, projectId);
    if (!res.ok) {
      if (btn) { btn.disabled = false; btn.innerHTML = lblOrig; }
      const ab=el('rFormAlert'), am=el('rFormAlertMsg');
      if(ab&&am){ am.textContent = 'Não foi possível salvar: ' + res.error; ab.style.display='flex'; }
      return;
    }

    // Confirmado no banco → reflete no state
    if (ehNovo) p.risks.push(riscoObj);
    else { const idx = p.risks.findIndex(x=>x.id===riskId); if (idx>=0) p.risks[idx] = riscoObj; }
    saveState();
    if (window._voltarResumoExecutivo) { voltarAoResumoExecutivo(); } else { closeModal(); }
    if (state.currentPage === 'projeto-detalhe' && state.viewMode === 'riscos') renderProjetoDetail(p);
    else if (state.currentPage === 'dashboard') renderDashboard();
    renderSidebar();
    notificar(riskId ? 'Risco atualizado com sucesso.' : 'Risco criado com sucesso.', 'sucesso');
  } catch (err) {
    console.error('Erro ao salvar risco:', err);
    const btn = document.getElementById('rBtnSalvar');
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i> Salvar'; }
    notificar('Erro ao salvar risco: ' + err.message, 'erro');
  }
}

async function updateRiskStatus(projectId, riskId, status) {
  const p = state.projetos.find(x => x.id === projectId);
  const r = p?.risks?.find(x => x.id === riskId);
  if (!r) return;
  const antigo = { status: r.status, closedAt: r.closedAt, updatedAt: r.updatedAt };
  r.status = status;
  r.updatedAt = new Date().toISOString();
  if (status === 'encerrado') r.closedAt = r.closedAt || new Date().toISOString();
  else if (status === 'aberto' || status === 'monitoramento') r.closedAt = null;
  const res = await atualizarRiscoSupabase(r, projectId);
  if (!res.ok) {
    // reverte
    r.status = antigo.status; r.closedAt = antigo.closedAt; r.updatedAt = antigo.updatedAt;
    notificar('Não foi possível atualizar o risco: ' + res.error, 'erro');
    return;
  }
  saveState();
  if (state.currentPage === 'projeto-detalhe' && state.viewMode === 'riscos') renderProjetoDetail(p);
  else if (state.currentPage === 'dashboard') renderDashboard();
  renderSidebar();
  const labels = {aberto:'reaberto',monitoramento:'em monitoramento',mitigado:'mitigado',encerrado:'encerrado'};
  notificar(`Risco ${labels[status]||'atualizado'}.`, 'sucesso');
}

async function deleteRisk(projectId, riskId) {
  const p = state.projetos.find(x => x.id === projectId);
  if (!p || !Array.isArray(p.risks)) return;
  if (!confirm('Excluir este risco permanentemente? Esta ação não pode ser desfeita.')) return;
  const res = await excluirRiscoSupabase(riskId);
  if (!res.ok) { notificar('Não foi possível excluir o risco: ' + res.error, 'erro'); return; }
  p.risks = p.risks.filter(r => r.id !== riskId);
  saveState();
  if (state.currentPage === 'projeto-detalhe' && state.viewMode === 'riscos') renderProjetoDetail(p);
  else if (state.currentPage === 'dashboard') renderDashboard();
  renderSidebar();
  notificar('Risco excluído.', 'sucesso');
}

// ==================== MÓDULOS PADRONIZADOS DO PROJETO ====================
const PROJECT_MODULE_OPTIONS = ["Folha", "GED", "Ponto", "Cargos e Salários", "Orçamento", "RH", "Customização"];

// Submódulos por módulo. Armazenados em project.modulos como "RH: <submódulo>".
// No filtro do dashboard o pai aparece uma única vez e casa com qualquer submódulo.
const PROJECT_SUBMODULE_OPTIONS = {
  "RH": [
    "Recrutamento & Seleção",
    "Treinamento & Desenvolvimento (T&D)",
    "Metas",
    "PDI",
    "Reconhecimento",
    "Rede Social",
    "Admissão Digital",
    "Avaliação de Desempenho",
    "Feedback",
    "Insight",
    "eNPS",
    "Pulso e Clima",
    "Sucessão",
    "Período de experiência",
    "DISC",
    "Quadro de posições",
    "Entrevista de desligamento",
    "Pesquisas, Enquetes e comunica Syn",
    "Integração com fornecedores terceiros"
  ],
  "Customização": [
    "Integração financeira",
    "Integração contábil",
    "Integração bancária",
    "Desenvolvimento de relatório",
    "Desenvolvimento de cálculo",
    "Outras integrações",
    "Cópia de base",
    "Transferência jurídica",
    "Outras customizações"
  ]
};
const SUBMODULE_SEP = ': ';

// "RH: Metas" → {parent:'RH', sub:'Metas'} | "Folha" → null
// Tolerante a variações de caixa/acento no nome do pai ("rh: pdi" também vale).
function splitSubmodule(value) {
  const txt = String(value || '').trim();
  const i = txt.indexOf(SUBMODULE_SEP);
  if (i <= 0) return null;
  const paiBruto = txt.slice(0, i).trim();
  const sub = txt.slice(i + SUBMODULE_SEP.length).trim();
  if (!sub) return null;
  // resolve o nome oficial do pai (aceita 'rh', 'RH', 'Recursos Humanos'...)
  const paiOficial = Object.keys(PROJECT_SUBMODULE_OPTIONS)
    .find(k => normalizeModuleText(k) === normalizeModuleText(paiBruto))
    || identifyStandardProjectModule(paiBruto);
  if (!paiOficial || !PROJECT_SUBMODULE_OPTIONS[paiOficial]) return null;
  return { parent: paiOficial, sub };
}
// Reconhece um submódulo escrito de forma livre e devolve o rótulo oficial
function identifySubmodule(parent, value) {
  const lista = PROJECT_SUBMODULE_OPTIONS[parent] || [];
  const n = normalizeModuleText(value);
  return lista.find(opt => normalizeModuleText(opt) === n) || null;
}
// Submódulos selecionados de um projeto para um módulo pai
function getProjectSubmodules(project, parent) {
  return (Array.isArray(project?.modulos) ? project.modulos : [])
    .map(splitSubmodule).filter(x => x && x.parent === parent).map(x => x.sub);
}
// O projeto tem este módulo? (o pai casa também com qualquer submódulo dele)
function projectHasModule(project, modulo) {
  const mods = Array.isArray(project?.modulos) ? project.modulos : [];
  if (mods.includes(modulo)) return true;
  if (PROJECT_SUBMODULE_OPTIONS[modulo]) {
    return mods.some(m => { const s = splitSubmodule(m); return s && s.parent === modulo; });
  }
  return false;
}
// Mesma regra, para listas de módulos já extraídas (usada na matriz de alocação)
function moduleListHasModule(lista, modulo) {
  return projectHasModule({ modulos: lista }, modulo);
}

// Normaliza texto para comparação (minúsculas, sem acento, espaços colapsados, trim)
function normalizeModuleText(value) {
  return String(value || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/\s+/g, ' ').trim();
}

// Identifica se um texto corresponde a um módulo padrão; retorna o nome oficial ou null
function identifyStandardProjectModule(value) {
  const n = normalizeModuleText(value);
  if (!n) return null;
  const MAP = {
    'folha': 'Folha', 'folha de pagamento': 'Folha', 'payroll': 'Folha',
    'ged': 'GED', 'ged/kit': 'GED', 'kit': 'GED', 'gestao eletronica de documentos': 'GED',
    'ponto': 'Ponto', 'ponto eletronico': 'Ponto', 'controle de ponto': 'Ponto',
    'cargos e salarios': 'Cargos e Salários', 'cargos': 'Cargos e Salários', 'plano de cargos': 'Cargos e Salários',
    'orcamento': 'Orçamento', 'budget': 'Orçamento',
    'rh': 'RH', 'recursos humanos': 'RH',
    'customizacao': 'Customização', 'customizacoes': 'Customização',
    'customizado': 'Customização', 'customizados': 'Customização'
  };
  return MAP[n] || null;
}

// Junta itens legados ao texto de customizados existente, sem duplicar (idempotente)
function mergeCustomProjectItems(currentText, legacyItems) {
  const sep = /[;\n]/;
  const existentes = String(currentText || '').split(sep).map(s => s.trim()).filter(Boolean);
  const setNorm = new Set(existentes.map(normalizeModuleText));
  (legacyItems || []).forEach(item => {
    const t = String(item || '').trim();
    if (t && !setNorm.has(normalizeModuleText(t))) { existentes.push(t); setNorm.add(normalizeModuleText(t)); }
  });
  return existentes.join('; ');
}

// Normaliza os módulos de um projeto: reconhecidos → nomes oficiais; não reconhecidos → itensCustomizados.
// Idempotente: rodar várias vezes não duplica dados.
function normalizeProjectModules(project) {
  if (!project) return;
  if (typeof project.itensCustomizados !== 'string') project.itensCustomizados = '';
  const brutos = Array.isArray(project.modulos) ? project.modulos : [];
  const oficiais = [];
  const subsPorPai = {};
  const naoReconhecidos = [];
  brutos.forEach(m => {
    // 1) submódulo no formato "Pai: Submódulo"
    const sp = splitSubmodule(m);
    if (sp) {
      const subOficial = identifySubmodule(sp.parent, sp.sub);
      if (subOficial) {
        (subsPorPai[sp.parent] = subsPorPai[sp.parent] || []);
        if (!subsPorPai[sp.parent].includes(subOficial)) subsPorPai[sp.parent].push(subOficial);
        if (!oficiais.includes(sp.parent)) oficiais.push(sp.parent); // submódulo implica o pai
        return;
      }
    }
    // 2) módulo padrão
    const oficial = identifyStandardProjectModule(m);
    if (oficial) { if (!oficiais.includes(oficial)) oficiais.push(oficial); return; }
    // 3) não reconhecido → vira item customizado
    const t = String(m || '').trim();
    if (t) naoReconhecidos.push(t);
  });
  // reordena conforme PROJECT_MODULE_OPTIONS, com os submódulos logo após o pai
  const saida = [];
  PROJECT_MODULE_OPTIONS.forEach(opt => {
    if (!oficiais.includes(opt)) return;
    saida.push(opt);
    const lista = PROJECT_SUBMODULE_OPTIONS[opt] || [];
    lista.forEach(sub => {
      if ((subsPorPai[opt] || []).includes(sub)) saida.push(opt + SUBMODULE_SEP + sub);
    });
  });
  project.modulos = saida;
  if (naoReconhecidos.length) {
    project.itensCustomizados = mergeCustomProjectItems(project.itensCustomizados, naoReconhecidos);
  }
}

// Gera os checkboxes dos módulos padrão (com os selecionados marcados).
// Módulos que têm submódulos ganham um painel que aparece ao marcá-los.
function renderProjectModuleCheckboxes(selectedModules = []) {
  const sel = selectedModules || [];
  const selNorm = new Set(sel.map(normalizeModuleText));
  const temSub = (opt, sub) => sel.some(m => normalizeModuleText(m) === normalizeModuleText(opt + SUBMODULE_SEP + sub));
  return `<div class="project-module-grid">
    ${PROJECT_MODULE_OPTIONS.map((opt, i) => {
      const checked = selNorm.has(normalizeModuleText(opt)) ? 'checked' : '';
      const subs = PROJECT_SUBMODULE_OPTIONS[opt];
      const onchange = subs ? ` onchange="toggleSubmodulePanel('${opt}')"` : '';
      return `<label class="project-module-option" for="pmod-${i}">
        <input type="checkbox" id="pmod-${i}" name="pModulo" value="${opt}" ${checked}${onchange}>
        <span>${opt}</span>
      </label>`;
    }).join('')}
  </div>
  ${Object.keys(PROJECT_SUBMODULE_OPTIONS).map(pai => {
    const aberto = selNorm.has(normalizeModuleText(pai));
    const marcados = (PROJECT_SUBMODULE_OPTIONS[pai] || []).filter(s => temSub(pai, s)).length;
    return `<div id="submod-panel-${pai}" style="${aberto?'':'display:none;'}margin-top:10px;border:1px solid var(--gray-200);border-radius:8px;padding:10px 12px;background:var(--gray-50)">
      <div style="font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <span>Submódulos de ${pai}</span>

      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 10px">
        ${(PROJECT_SUBMODULE_OPTIONS[pai]||[]).map((sub, j) => `
          <label for="psub-${pai}-${j}" style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-700);cursor:pointer;padding:2px 0">
            <input type="checkbox" id="psub-${pai}-${j}" name="pSubmodulo" data-parent="${pai}" value="${pai}${SUBMODULE_SEP}${sub}" ${temSub(pai,sub)?'checked':''} onchange="atualizarContagemSubmodulos('${pai}')">
            <span>${sub}</span>
          </label>`).join('')}
      </div>
    </div>`;
  }).join('')}`;
}

// Mostra/esconde o painel de submódulos ao marcar/desmarcar o módulo pai
function toggleSubmodulePanel(pai) {
  const cb = [...document.querySelectorAll('input[name="pModulo"]')].find(c => c.value === pai);
  const painel = document.getElementById('submod-panel-' + pai);
  if (!cb || !painel) return;
  painel.style.display = cb.checked ? '' : 'none';
  if (!cb.checked) {
    // desmarcar o pai limpa os submódulos, para não gravar filho sem pai
    document.querySelectorAll(`input[name="pSubmodulo"][data-parent="${pai}"]`).forEach(c => { c.checked = false; });
    atualizarContagemSubmodulos(pai);
  }
}
function atualizarContagemSubmodulos(pai) {
  const n = document.querySelectorAll(`input[name="pSubmodulo"][data-parent="${pai}"]:checked`).length;
  const el = document.getElementById('submod-count-' + pai);
  if (el) el.textContent = n;
  // marcar um submódulo implica o módulo pai
  if (n > 0) {
    const cb = [...document.querySelectorAll('input[name="pModulo"]')].find(c => c.value === pai);
    if (cb && !cb.checked) { cb.checked = true; const p = document.getElementById('submod-panel-'+pai); if (p) p.style.display=''; }
  }
}

// Lê os checkboxes marcados, na ordem de PROJECT_MODULE_OPTIONS, com submódulos após o pai
function getSelectedProjectModules() {
  const marcados = new Set(
    [...document.querySelectorAll('input[name="pModulo"]:checked')].map(c => c.value)
  );
  const subsMarcados = new Set(
    [...document.querySelectorAll('input[name="pSubmodulo"]:checked')].map(c => c.value)
  );
  const saida = [];
  PROJECT_MODULE_OPTIONS.forEach(opt => {
    const temSubMarcado = [...subsMarcados].some(v => { const s = splitSubmodule(v); return s && s.parent === opt; });
    if (!marcados.has(opt) && !temSubMarcado) return;
    saida.push(opt);
    (PROJECT_SUBMODULE_OPTIONS[opt] || []).forEach(sub => {
      const v = opt + SUBMODULE_SEP + sub;
      if (subsMarcados.has(v)) saida.push(v);
    });
  });
  return saida;
}

// Marca os checkboxes conforme uma lista de módulos (tolerante a variações)
function setSelectedProjectModules(modules) {
  const selNorm = new Set((modules || []).map(normalizeModuleText));
  document.querySelectorAll('input[name="pModulo"]').forEach(c => {
    c.checked = selNorm.has(normalizeModuleText(c.value));
  });
  document.querySelectorAll('input[name="pSubmodulo"]').forEach(c => {
    c.checked = selNorm.has(normalizeModuleText(c.value));
  });
  Object.keys(PROJECT_SUBMODULE_OPTIONS).forEach(pai => {
    const painel = document.getElementById('submod-panel-' + pai);
    const cb = [...document.querySelectorAll('input[name="pModulo"]')].find(c => c.value === pai);
    if (painel && cb) painel.style.display = cb.checked ? '' : 'none';
    atualizarContagemSubmodulos(pai);
  });
}

// Exibição central dos módulos (chips) — usada em todas as telas.
// Submódulos não viram chips individuais: o pai mostra a contagem e lista no tooltip.
function renderProjectModules(project, options = {}) {
  const mods = Array.isArray(project.modulos) ? project.modulos : [];
  const custom = (project.itensCustomizados || '').trim();
  const compact = options.compact === true;
  if (!mods.length && !custom) {
    return options.hideWhenEmpty ? '' : `<span style="font-size:12px;color:var(--gray-400)">Nenhum módulo informado</span>`;
  }
  const pais = mods.filter(m => !splitSubmodule(m));
  let chips = pais.map(m => {
    const subs = getProjectSubmodules(project, m);
    if (!subs.length) return `<span class="chip">${m}</span>`;
    const tip = `${m} — ${subs.length} submódulo(s):&#10;• ${subs.join('&#10;• ')}`;
    return `<span class="chip" title="${tip}">${m} <span style="opacity:.7">(${subs.length})</span></span>`;
  }).join('');
  if (custom) {
    if (compact) {
      chips += `<span class="chip" style="background:var(--gray-100);color:var(--gray-600)" title="${custom.replace(/"/g,'&quot;')}"><i class="ti ti-puzzle" style="font-size:11px;vertical-align:-1px"></i> + Customizados</span>`;
    } else {
      chips += `<span class="chip" style="background:var(--gray-100);color:var(--gray-600)"><i class="ti ti-puzzle" style="font-size:11px;vertical-align:-1px"></i> Customizados</span>`;
    }
  }
  return chips;
}

// Marca um campo como inválido (circula em vermelho + mostra mensagem)

async function salvarProjeto(editId) {
  try {
    const el = id => document.getElementById(id);
    if (!el('pNome') || !el('pCliente')) {
      alert('Erro ao ler o formulário. Feche e reabra o modal.');
      return;
    }

    // ── Validação de campos obrigatórios com destaque visual ──
    const obrigatorios = [
      { id: 'pNome',   label: 'Nome do projeto' },
      { id: 'pCliente',label: 'Cliente' },
      { id: 'pInicio', label: 'Data de início' },
      { id: 'pGoLive', label: 'Data Go-live' },
    ];
    obrigatorios.forEach(c => limparErroCampo(c.id));

    const faltando = obrigatorios.filter(c => !(el(c.id)?.value || '').trim());
    if (faltando.length) {
      faltando.forEach(c => marcarErroCampo(c.id));
      const alertBox = el('pFormAlert'), alertMsg = el('pFormAlertMsg');
      if (alertBox && alertMsg) {
        alertMsg.textContent = faltando.length === 1
          ? `O campo "${faltando[0].label}" é obrigatório.`
          : `Preencha os ${faltando.length} campos obrigatórios destacados.`;
        alertBox.style.display = 'flex';
      }
      const primeiro = el(faltando[0].id);
      if (primeiro) { primeiro.focus(); primeiro.scrollIntoView({behavior:'smooth', block:'center'}); }
      return;
    }

    const dataInicio = el('pInicio').value;
    const goLive = el('pGoLive').value;
    if (dataInicio && goLive && goLive < dataInicio) {
      marcarErroCampo('pGoLive');
      const alertBox = el('pFormAlert'), alertMsg = el('pFormAlertMsg');
      if (alertBox && alertMsg) {
        alertMsg.textContent = 'A data de Go-live não pode ser anterior à data de início.';
        alertBox.style.display = 'flex';
      }
      el('pGoLive').focus();
      return;
    }

    // ── Passou na validação: monta os dados ──
    const nome = el('pNome').value.trim();
    const cliente = el('pCliente').value.trim();
    const modulos = getSelectedProjectModules();
    const itensCustomizados = (el('pItensCustomizados')?.value || '').trim();
    const consultor = lerPessoasCheckboxes('pConsultor');
    const analista = lerPessoasCheckboxes('pAnalista');
    const techLead = lerPessoasCheckboxes('pTechLead');
    const analistaProjetos = lerPessoasCheckboxes('pAnalistaProjetos');

    if (!Array.isArray(state.projetos)) state.projetos = [];

    // ── Estado "salvando" no botão (Opção 1: salvar e confirmar) ──
    const btnSalvar = el('pBtnSalvar');
    const btnLabelOrig = btnSalvar ? btnSalvar.innerHTML : '';
    if (btnSalvar) { btnSalvar.disabled = true; btnSalvar.innerHTML = '<i class="ti ti-loader-2"></i> Salvando...'; }
    const reativarBotao = () => { if (btnSalvar) { btnSalvar.disabled = false; btnSalvar.innerHTML = btnLabelOrig; } };

    let projectId = editId;
    let contexto = 'lista';

    if (editId) {
      const p = state.projetos.find(x=>x.id===editId);
      if (!p) { reativarBotao(); alert('Projeto não encontrado.'); return; }
      // Monta a versão atualizada (sem tocar em tasks/cronograma)
      const atualizado = { ...p, nome, cliente, modulos, itensCustomizados, dataInicio, goLive, consultor, analista, techLead, analistaProjetos };
      if (_logoFormAtual.alterada) { atualizado.logoCliente = _logoFormAtual.dataUrl; atualizado._logoAlterada = true; }   // a coluna só vai ao banco quando a logo muda
      // Grava no banco PRIMEIRO; só reflete na tela se confirmar.
      const res = await atualizarProjetoSupabase(atualizado);
      if (!res.ok) {
        reativarBotao();
        const alertBox = el('pFormAlert'), alertMsg = el('pFormAlertMsg');
        if (alertBox && alertMsg) { alertMsg.textContent = 'Não foi possível salvar: ' + res.error; alertBox.style.display = 'flex'; }
        else alert('Não foi possível salvar: ' + res.error);
        return;
      }
      Object.assign(p, { nome, cliente, modulos, itensCustomizados, dataInicio, goLive, consultor, analista, techLead, analistaProjetos, atualizadoEm: new Date().toISOString() });
      if (_logoFormAtual.alterada) p.logoCliente = _logoFormAtual.dataUrl;
      contexto = (state.currentProjetoId === editId && state.currentPage === 'projeto-detalhe') ? 'detalhe' : 'lista';
    } else {
      const tplId = el('pTemplate')?.value || '';
      const tpl = (state.checklistTemplates||[]).find(t=>t.id===tplId);
      const tasks = (tpl && Array.isArray(tpl.tasks))
        ? tpl.tasks.map(t=>({...t, id:uid(), templateTaskId:t.id, status:'pendente', prazo:null, comentario:'', macroActivityId:null}))
        : [];
      const novo = {
        id:uid(), nome, cliente, modulos, itensCustomizados, dataInicio, goLive,
        consultor, analista, techLead, analistaProjetos, tasks, templateId: tplId || null,
        macroActivities: [], macroMappings: [], risks: [], criadoEm: new Date().toISOString()
      };
      if (_logoFormAtual.dataUrl) { novo.logoCliente = _logoFormAtual.dataUrl; novo._logoAlterada = true; }
      // O cronograma macro nasce do próprio checklist — sem depender de importação.
      instanciarMacrosDoTemplate(novo, tpl);
      // Grava projeto + tarefas no banco PRIMEIRO.
      const res = await inserirProjetoSupabase(novo);
      if (!res.ok) {
        reativarBotao();
        const alertBox = el('pFormAlert'), alertMsg = el('pFormAlertMsg');
        if (alertBox && alertMsg) { alertMsg.textContent = 'Não foi possível criar o projeto: ' + res.error; alertBox.style.display = 'flex'; }
        else alert('Não foi possível criar o projeto: ' + res.error);
        return;
      }
      delete novo._logoAlterada;
      state.projetos.push(novo);
      projectId = novo.id;
    }

    reativarBotao();
    closeModal();
    refreshProjectViewAfterSave(projectId, contexto);
    notificar(editId ? 'Projeto atualizado com sucesso.' : 'Projeto criado com sucesso.', 'sucesso');
  } catch (err) {
    console.error('Erro ao salvar projeto:', err);
    const btnSalvar = document.getElementById('pBtnSalvar');
    if (btnSalvar) { btnSalvar.disabled = false; btnSalvar.innerHTML = '<i class="ti ti-check"></i> Salvar'; }
    alert('Não foi possível salvar o projeto: ' + err.message);
  }
}

function abrirProjeto(id) {
  const p = state.projetos.find(x=>x.id===id);
  if (!p) return;
  // Segurança: não-gestores só acessam seus próprios projetos
  if (!isGestor() && !projetosVisiveis().find(x=>x.id===id)) return;
  state.currentProjetoId = id;
  state.viewMode = 'lista';
  state.cronoEdicao = false;
  state.listaEdicaoPrazos = false;
  state.filterFase = ''; state.filterTema = ''; state.filterStatus = ''; state.filterResp = '';
  state.filterMacro = ''; state.filterMacroStatus = '';
  // Auto-expande a primeira fase (e suas macro entregas) uma vez por projeto, para não abrir tudo colapsado.
  if (!uiState._initedProjects[id]) {
    uiState._initedProjects[id] = true;
    const ordemFases = Object.keys(FASE_COLORS);
    const primeira = ordemFases.find(f => (p.tasks||[]).some(t => t.fase === f)) || (p.tasks||[])[0]?.fase;
    if (primeira) {
      uiState.expandedPhases[id + '::' + primeira] = true;
      // expande também as macro entregas da primeira fase
      try {
        const g = groupProjectTasksHierarchy(p, (p.tasks||[]).filter(t=>t.fase===primeira))[0];
        if (g) {
          g.macroDeliveries.forEach(d => {
            const dk = (d.macroActivity && d.macroActivity.id) || (d.macroActivity && d.macroActivity.macroKey) || d.status.key;
            uiState.expandedMacroDeliveries[id + '::' + primeira + '::' + dk] = true;
          });
          uiState.expandedMacroDeliveries[id + '::' + primeira + '::__unmapped'] = true;
        }
      } catch(e) {}
    }
  }
  renderProjetoDetail(p);
}
