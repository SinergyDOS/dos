      ${s.preservadas?`· <strong>${s.preservadas}</strong> concluída(s) serão mantidas como registro<br>`:''}
      ${s.macrosNovas === 0
        ? `· este checklist <strong>não usa cronograma macro</strong>: ${s.macrosAtuais ? `as ${s.macrosAtuais} atividade(s) macro atuais serão removidas, <strong>perdendo as datas já preenchidas</strong>` : 'o projeto seguirá sem atividades macro'}`
        : `· o cronograma macro será refeito (${s.macrosAtuais} atividade(s) atual(is) → ${s.macrosNovas} nova(s)), <strong>perdendo as datas já preenchidas</strong>`}
    </div>
  </div>`;
}

async function executarTrocaChecklist(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode trocar o checklist.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p) return;
  const el = id => document.getElementById(id);
  const erro = msg => { const a=el('tcAlert'), b=el('tcAlertMsg'); if(a&&b){ b.textContent=msg; a.style.display='flex'; } };
  if (el('tcAlert')) el('tcAlert').style.display = 'none';

  const tplId = el('tcTpl')?.value;
  if (!tplId) { erro('Selecione o novo checklist.'); return; }
  const preservar = el('tcPreservar')?.checked !== false;
  const s = _trocaSimular(p, tplId, preservar);
  if (!s) { erro('Checklist não encontrado.'); return; }
  if (!confirm(`Trocar o checklist de "${p.nome}"?\n\n${s.novas} tarefa(s) serão adicionadas e ${s.removidas} removidas${s.removidasConcluidas?` (${s.removidasConcluidas} concluídas)`:''}.\nO cronograma macro será refeito e as datas atuais serão perdidas.\n\nEsta ação não pode ser desfeita.`)) return;

  const btn = el('tcBtn');
  const lbl = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Trocando...'; }

  const antesTasks = [...(p.tasks || [])];
  const antesMacros = JSON.parse(JSON.stringify(p.macroActivities || []));
  const antesMaps = JSON.parse(JSON.stringify(p.macroMappings || []));
  const antesTpl = p.templateId;

  const manter = preservar ? antesTasks.filter(t => t.status === 'concluida') : [];
  const remover = antesTasks.filter(t => !manter.includes(t));
  const novas = (s.tpl.tasks || []).map(t => ({
    ...t, id: uid(), templateTaskId: t.id, status: 'pendente',
    prazo: null, prazoOrigem: null, _prazoManual: false,
    comentario: '', concluidaEm: null, macroActivityId: null,
    bloqueioCom: '', bloqueioDesde: null, bloqueioObs: ''
  }));

  // Concluídas preservadas ficam ao final, desvinculadas do novo cronograma.
  // O templateTaskId precisa ser limpo: senão colide com o das tarefas novas
  // (ambas usariam 'ct0', 'ct1'...) e o vínculo com as macros sai errado.
  const preservadas = manter.map(t => ({ ...t, macroActivityId: null, templateTaskId: null }));
  p.tasks = [...novas, ...preservadas];
  p.templateId = tplId;
  instanciarMacrosDoTemplate(p, s.tpl);

  try {
    if (sbClient) {
      if (remover.length) {
        const ids = remover.map(t => t.id);
        for (let i = 0; i < ids.length; i += 200) {
          const { error } = await sbClient.from('tasks').delete().in('id', ids.slice(i, i + 200));
          if (error) throw new Error(error.message);
        }
      }
      const rows = novas.map((t, i) => _tarefaParaRow(t, p.id, i));
      for (let i = 0; i < rows.length; i += 200) {
        const { error } = await sbClient.from('tasks').insert(rows.slice(i, i + 200));
        if (error) throw new Error(error.message);
      }
      if (preservadas.length) {
        // As concluídas preservadas ficam depois das tarefas novas. Regravar a ordem delas evita que o número
        // antigo colida com o das novas e as misture no meio da sequência do checklist.
        const rp = await persistirTarefasEmLote(p, preservadas);
        if (!rp.ok) throw new Error(rp.error);
      }
      const { data, error: pErr } = await sbClient.from('projects').update({
        template_id: tplId,
        macro_activities: p.macroActivities,
        macro_mappings: p.macroMappings
      }).eq('id', p.id).select('id');
      if (pErr) throw new Error(pErr.message);
      if (!data || data.length === 0) throw new Error('o projeto não foi atualizado no servidor (verifique suas permissões).');
    }
  } catch (e) {
    // desfaz na tela para não divergir do banco
    p.tasks = antesTasks; p.macroActivities = antesMacros; p.macroMappings = antesMaps; p.templateId = antesTpl;
    if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
    erro('Não foi possível trocar: ' + e.message + ' Recarregue a página para conferir o estado real.');
    return;
  }

  saveState();
  closeModal();
  renderProjetoDetail(p);
  renderSidebar();
  notificar(`Checklist trocado para "${s.tpl.nome}". ${novas.length} tarefa(s) adicionada(s)${manter.length?`, ${manter.length} concluída(s) preservada(s)`:''}.`, 'sucesso');
}

// ==================== PROJETOS SEM CRONOGRAMA MACRO ====================
// Projetos pequenos (ex.: Customização) não usam atividades macro: as tarefas ficam
// direto na fase e não há datas de macro para editar.
function projetoTemMacro(p) { return Array.isArray(p?.macroActivities) && p.macroActivities.length > 0; }

// Tarefas listadas direto na fase, sem a camada de macro entrega
function renderTarefasDiretas(p, tasks) {
  return `<div style="border:1px solid var(--gray-200);border-radius:10px;overflow:hidden;background:#fff">
    <table style="width:100%">
      <thead><tr><th style="width:28px"></th><th>Tarefa</th><th>Responsável</th><th>Status</th><th>Prazo</th><th>Esforço</th><th style="width:150px"></th></tr></thead>
      <tbody>${tasks.map(t => renderHierarchicalTaskRow(p, t)).join('')}</tbody>
    </table>
  </div>`;
}

// Botão "Editar datas" (edição em lote das datas das macros). Sem cronograma macro, fica bloqueado.
function renderBotaoEditarDatas(p) {
  if (!isGestor()) return '';
  if (state.cronoEdicao) {
    return `<span style="display:inline-flex;gap:6px">
      <button class="btn btn-secondary btn-sm" onclick="sairModoEdicaoDatas('${p.id}')">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="salvarTodasDatasMacro('${p.id}')"><i class="ti ti-check"></i> Salvar e replanejar</button>
    </span>`;
  }
  const tem = projetoTemMacro(p);
  return `<button class="btn btn-secondary btn-sm" ${tem ? '' : 'disabled'} style="${tem ? '' : 'opacity:.5;cursor:not-allowed'}"
      title="${tem ? 'Editar as datas de todas as macros de uma vez' : 'Este projeto não tem cronograma macro'}"
      onclick="entrarModoEdicaoDatas('${p.id}')"><i class="ti ti-calendar-event"></i> Editar datas</button>
    ${tem ? '' : '<span style="font-size:11px;color:var(--gray-400)">sem cronograma macro</span>'}`;
}

// ── Vínculo tarefa ↔ macro ──
// O vínculo vive em DOIS lugares: t.macroActivityId e macroMappings[].microTaskIds. A tela usa o
// primeiro; o replanejamento de prazos usa o segundo. Este é o único ponto que grava os dois,
// para que a tarefa apareça na macro certa E acompanhe as datas dela.
function vincularTarefaAMacro(p, t, macroId) {
  if (!Array.isArray(p.macroMappings)) p.macroMappings = [];
  const agora = new Date().toISOString();
  p.macroMappings.forEach(mp => {
    if (Array.isArray(mp.microTaskIds) && mp.microTaskIds.includes(t.id)) {
      mp.microTaskIds = mp.microTaskIds.filter(id => id !== t.id);
      mp.updatedAt = agora;
    }
  });
  t.macroActivityId = macroId || null;
  if (!macroId) return;
  let mp = p.macroMappings.find(x => x.macroActivityId === macroId);
  if (!mp) {
    const m = (p.macroActivities || []).find(a => a.id === macroId);
    mp = { id: uid(), macroKey: (m && m.macroKey) || null, macroActivityId: macroId,
           macroExternalId: (m && m.externalId) || null, macroNameSnapshot: (m && m.name) || '',
           microTaskIds: [], origem: 'manual', createdAt: agora, updatedAt: agora };
    p.macroMappings.push(mp);
  }
  if (!Array.isArray(mp.microTaskIds)) mp.microTaskIds = [];
  if (!mp.microTaskIds.includes(t.id)) mp.microTaskIds.push(t.id);
  mp.updatedAt = agora;
}

// Corrige tarefas ligadas a uma macro só por t.macroActivityId (criadas por "Nova tarefa" ou
// religadas no detalhe antes desta correção). Retorna quantas foram ajustadas.
function sincronizarVinculosMacro(p) {
  const macros = Array.isArray(p.macroActivities) ? p.macroActivities : [];
  if (!macros.length) return 0;
  const ids = new Set(macros.map(m => m.id));
  const mappings = Array.isArray(p.macroMappings) ? p.macroMappings : [];
  let corrigidos = 0;
  (p.tasks || []).forEach(t => {
    if (!t.macroActivityId || !ids.has(t.macroActivityId)) return;
    const alvo = mappings.find(x => x.macroActivityId === t.macroActivityId);
    const jaEsta = !!alvo && (alvo.microTaskIds || []).includes(t.id);
    const emOutro = mappings.some(x => x !== alvo && (x.microTaskIds || []).includes(t.id));
    if (jaEsta && !emOutro) return;
    vincularTarefaAMacro(p, t, t.macroActivityId);
    corrigidos++;
  });
  return corrigidos;
}

// ==================== MACROS: progresso da macro inteira e ordem no Cronograma ====================
// A cadeia é micro → macro → fase: cada macro pertence a UMA fase e todas as tarefas dela estão nessa fase.

// macroId → todas as tarefas da macro
function mapaMacroTarefas(p) {
  const out = new Map();
  (p.tasks || []).forEach(t => {
    const d = resolveTaskMacroDelivery(p, t);
    const id = d.hasDelivery ? ((d._macro && d._macro.id) || d.macroActivityId) : null;
    if (!id) return;
    if (!out.has(id)) out.set(id, []);
    out.get(id).push(t);
  });
  return out;
}

// Progresso e situação da macro INTEIRA, somando todas as tarefas dela
function resumoPorMacro(p, macros, tarefasPorMacro) {
  const out = {};
  macros.forEach(m => {
    const tarefas = tarefasPorMacro.get(m.id) || [];
    if (!tarefas.length) return;   // sem tarefas: sem resumo
    const mp = (p.macroMappings || []).find(x => x.macroActivityId === m.id);
    const prog = calculateMacroDeliveryProgress(p, m, tarefas);
    out[m.id] = { macroActivity: m, mapping: mp, status: determineMacroDeliveryStatus(m, mp, prog), progress: prog };
  });
  return out;
}

// Posição da macro DENTRO de uma fase na sequência do checklist (a 1ª tarefa dela nessa fase). É o mesmo critério
// de desempate da Lista, para que as duas telas ordenem igual; sem tarefas na fase, cai para a ordem cadastrada.
function posMacroNaFase(p, m, fase, tarefasPorMacro, ordem) {
  let min = null;
  (tarefasPorMacro.get(m.id) || []).forEach(t => {
    if (t.fase !== fase) return;
    const i = ordem.get(t.id);
    if (i != null && (min == null || i < min)) min = i;
  });
  return min != null ? min : 1e6 + (p.macroActivities || []).indexOf(m);
}

// ── Cadeia micro → macro → fase ──
// Uma macro pertence a UMA fase e todas as tarefas dela estão nessa fase; o nome de uma macro é único no checklist.
// Devolve o que viola isso: macros com tarefas em mais de uma fase e nomes de macro repetidos.
function inconsistenciasDoTemplate(tpl) {
  const porId = new Map(((tpl && tpl.tasks) || []).map(t => [t.id, t]));
  const out = [];
  const nomes = new Map();
  ((tpl && tpl.deParaTemplate) || []).forEach(d => {
    const fases = [...new Set((d.checklistTaskIds || []).map(id => porId.get(id)).filter(Boolean).map(t => t.fase))];
    if (fases.length > 1) out.push({ tipo: 'varias-fases', macro: d.macroNameLabel || d.macroKey, fases });
    const nome = String(d.macroNameLabel || d.macroKey || '').trim().toLowerCase();
    if (nome) nomes.set(nome, (nomes.get(nome) || 0) + 1);
  });
  nomes.forEach((q, nome) => { if (q > 1) out.push({ tipo: 'nome-repetido', macro: nome, fases: [] }); });
  return out;
}
function descreverInconsistencias(lista) {
  const txt = lista.slice(0, 2).map(i => i.tipo === 'varias-fases'
    ? `"${i.macro}" ficaria com tarefas em ${i.fases.join(' e ')}`
    : `o nome "${i.macro}" aparece em mais de uma macro`).join('; ');
  return txt + (lista.length > 2 ? ` (e mais ${lista.length - 2})` : '');
}

// Nos projetos: a tarefa só pode ser ligada a uma macro da MESMA fase. Macros importadas do Planner, cuja fase tem
// outro nome que as do checklist, ficam de fora da regra (não há como comparar).
function macroServeFase(p, m, fase) {
  if (!m) return true;
  const fasesReais = new Set((p.tasks || []).map(t => t.fase).filter(Boolean));
  if (!m.phase || !fasesReais.has(m.phase)) return true;
  return m.phase === fase;
}

// ==================== PRAZOS DAS TAREFAS EM LOTE (aba Lista) ====================
// "Editar prazos" libera o prazo de todas as tarefas de uma vez e salva tudo junto. Quando a tarefa
// pertence a uma macro, o prazo não pode passar do fim dela. Sem macros, os campos só ficam livres.

// Limite do prazo de uma tarefa: o fim da macro (ou o início, se a macro não tem fim). null = sem limite.
function limiteMacroDaTarefa(p, t) {
  const d = resolveTaskMacroDelivery(p, t);
  if (!d.hasDelivery) return null;
  return d.endDate || d.startDate || null;
}

function renderBotaoEditarPrazos(p) {
  if (!isGestor()) return '';
  if (state.listaEdicaoPrazos) {
    return `<span style="display:inline-flex;gap:6px">
      <button class="btn btn-secondary btn-sm" onclick="sairModoEdicaoPrazos('${p.id}')">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="salvarPrazosEmLote('${p.id}')"><i class="ti ti-check"></i> Salvar prazos</button>
    </span>`;
  }
  return `<button class="btn btn-secondary btn-sm" title="Editar o prazo de todas as tarefas de uma vez" onclick="entrarModoEdicaoPrazos('${p.id}')"><i class="ti ti-calendar-event"></i> Editar prazos</button>`;
}

function entrarModoEdicaoPrazos(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode editar prazos.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p) return;
  state.listaEdicaoPrazos = true;
  expandAllHierarchy(pId);   // abre fases e macros, para os campos de prazo ficarem à vista (e redesenha a Lista)
}
function sairModoEdicaoPrazos(pId) {
  state.listaEdicaoPrazos = false;
  const p = state.projetos.find(x => x.id === pId);
  if (p) renderTaskView(p);
}

// Lê os campos da tela e devolve só o que mudou
function _coletarEdicoesPrazos(p) {
  const mudancas = [];
  (p.tasks || []).forEach(t => {
    const campo = document.getElementById('ep-' + t.id);
    if (!campo) return;
    const novo = campo.value || '';
    if (novo !== (t.prazo || '')) mudancas.push({ t, novo });
  });
  return mudancas;
}

let _prazosPendentes = null;

function salvarPrazosEmLote(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode editar prazos.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p) return;
  const mudancas = _coletarEdicoesPrazos(p);
  if (!mudancas.length) { sairModoEdicaoPrazos(pId); notificar('Nenhum prazo foi alterado.', 'sucesso'); return; }
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  // 1) Nenhuma tarefa pode passar do fim da macro. Se alguma passar, nada é salvo.
  const acima = mudancas.filter(c => { const lim = limiteMacroDaTarefa(p, c.t); return c.novo && lim && c.novo > lim; });
  if (acima.length) {
    openModal(`<div class="modal-header">
      <div class="modal-title" style="color:var(--danger)"><i class="ti ti-alert-triangle" style="margin-right:8px"></i>Prazo além do fim da macro</div>
      <button class="btn btn-ghost" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--gray-700);margin-bottom:10px"><strong>Nada foi salvo.</strong> ${acima.length === 1 ? 'Esta tarefa passa' : 'Estas ' + acima.length + ' tarefas passam'} do fim da macro a que pertence${acima.length === 1 ? '' : 'm'}:</div>
      <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px;max-height:240px;overflow-y:auto">
        ${acima.map(c => { const d = resolveTaskMacroDelivery(p, c.t); return `<div style="padding:5px 0;border-top:1px solid var(--gray-100);font-size:12px">
          <div style="color:var(--gray-800);font-weight:600">${esc(c.t.tarefa)}</div>
          <div style="color:var(--gray-500)">${esc(d.macroName)} · você informou <strong style="color:var(--danger)">${fmt(c.novo)}</strong>, a macro termina em <strong>${fmt(limiteMacroDaTarefa(p, c.t))}</strong></div>
        </div>`; }).join('')}
      </div>
      <div style="font-size:11.5px;color:var(--gray-500);margin-top:10px">Ajuste a data para o fim da macro ou antes dele. Se a macro precisar de mais tempo, altere a data dela na aba Cronograma macro.</div>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">Voltar e ajustar</button></div>`);
    return;
  }

  // 2) Confirmação do que será gravado
  const seguem = mudancas.filter(c => !c.novo && limiteMacroDaTarefa(p, c.t)).length;
  const semPrazo = mudancas.filter(c => !c.novo && !limiteMacroDaTarefa(p, c.t)).length;
  _prazosPendentes = mudancas.map(c => ({ taskId: c.t.id, novo: c.novo }));
  const linhas = mudancas.slice(0, 8).map(c => {
    const lim = limiteMacroDaTarefa(p, c.t);
    const para = c.novo ? fmt(c.novo) : (lim ? 'segue a macro (' + fmt(lim) + ')' : 'sem prazo');
    return `<div style="display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:3px 0;border-top:1px solid var(--gray-100)">
      <span style="color:var(--gray-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.t.tarefa)}</span>
      <span style="color:var(--gray-500);white-space:nowrap">${c.t.prazo ? fmt(c.t.prazo) : 'sem prazo'} → <strong style="color:var(--accent)">${para}</strong></span>
    </div>`;
  }).join('');
  openModal(`<div class="modal-header">
    <div class="modal-title"><i class="ti ti-calendar-event" style="margin-right:8px;color:var(--accent)"></i>Confirmar novos prazos</div>
    <button class="btn btn-ghost" onclick="closeModal()"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body">
    <div style="font-size:13px;color:var(--gray-700);line-height:1.7;margin-bottom:12px">
      <strong style="color:var(--accent)">${mudancas.length}</strong> prazo(s) de tarefa serão alterados.
      ${seguem ? `<br>${seguem} voltam a seguir a data da macro.` : ''}${semPrazo ? `<br>${semPrazo} ficam sem prazo.` : ''}
    </div>
    <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px">
      ${linhas}${mudancas.length > 8 ? `<div style="font-size:11px;color:var(--gray-400);padding-top:5px">e mais ${mudancas.length - 8}...</div>` : ''}
    </div>
    <div style="font-size:11.5px;color:var(--gray-400);margin-top:10px">Prazos digitados aqui passam a valer só para a tarefa: não mudam mais quando a macro for replanejada.</div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" id="cpBtn" onclick="aplicarPrazosEmLote('${pId}')"><i class="ti ti-check"></i> Salvar prazos</button>
  </div>`);
}

// Grava só as tarefas alteradas (não reescreve o cronograma do projeto)
async function persistirTarefasEmLote(projeto, tarefas) {
  if (!sbClient) return { ok: false, error: 'Sem conexão com o servidor.' };
  try {
    const rows = tarefas.map(t => _tarefaParaRow(t, projeto.id, (projeto.tasks || []).indexOf(t)));
    const { error } = await sbClient.from('tasks').upsert(rows, { onConflict: 'id' });
    if (error) return { ok: false, error: error.message };
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
}

async function aplicarPrazosEmLote(pId) {
  const p = state.projetos.find(x => x.id === pId);
  if (!p || !_prazosPendentes) return;
  const btn = document.getElementById('cpBtn');
  const lbl = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Salvando...'; }
  const antes = [], afetadas = [];
  _prazosPendentes.forEach(e => {
    const t = (p.tasks || []).find(x => x.id === e.taskId);
    if (!t) return;
    antes.push({ t, prazo: t.prazo, origem: t.prazoOrigem, manual: t._prazoManual });
    const lim = limiteMacroDaTarefa(p, t);
    if (e.novo) { t.prazo = e.novo; t._prazoManual = true; t.prazoOrigem = 'manual'; }
    else if (lim) { t.prazo = lim; t._prazoManual = false; t.prazoOrigem = 'macro'; }   // volta a seguir a macro
    else { t.prazo = null; t._prazoManual = false; t.prazoOrigem = null; }
    afetadas.push(t);
  });
  const res = await persistirTarefasEmLote(p, afetadas);
  if (!res.ok) {
    antes.forEach(a => { a.t.prazo = a.prazo; a.t.prazoOrigem = a.origem; a.t._prazoManual = a.manual; });
    if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
    notificar('Não foi possível salvar os prazos: ' + res.error + ' Nada foi alterado.', 'erro');
    return;
  }
  _prazosPendentes = null;
  state.listaEdicaoPrazos = false;
  saveState();
  closeModal();
  renderProjetoDetail(p);
  renderSidebar();
  notificar(`${afetadas.length} prazo(s) atualizado(s).`, 'sucesso');
}

// ==================== EXCLUSÃO DE PROJETO ====================
// Ação irreversível: remove o projeto e, por cascata no banco, suas tarefas,
// riscos e follow ups. Restrita ao gestor e protegida por confirmação digitada.
function modalExcluirProjeto(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode excluir projetos.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p) return;
  const nTar = (p.tasks || []).length;
  const nCon = (p.tasks || []).filter(t => t.status === 'concluida').length;
  const nRis = (p.risks || []).length;
  const nFu  = (p.followUps || []).length;
  openModal(`<div class="modal-header">
    <div class="modal-title" style="color:var(--danger)"><i class="ti ti-alert-triangle" style="margin-right:8px"></i>Excluir projeto</div>
    <button class="btn btn-ghost" onclick="closeModal()"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body">
    <div style="background:var(--danger-bg);border-radius:8px;padding:12px 14px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:#991b1b;margin-bottom:6px">Esta ação não pode ser desfeita.</div>
      <div style="font-size:12.5px;color:#7f1d1d;line-height:1.7">
        Serão apagados junto com <strong>${p.nome}</strong>:<br>
        · ${nTar} tarefa(s)${nCon?` — incluindo ${nCon} já concluída(s)`:''}<br>
        · ${nRis} risco(s)<br>
        · ${nFu} registro(s) de follow up<br>
        · o cronograma macro e os vínculos DE-PARA
      </div>
    </div>
    <div id="exAlert" class="form-alert" style="display:none"><i class="ti ti-alert-circle" style="font-size:15px"></i><span id="exAlertMsg"></span></div>
    <div class="form-group" style="margin-bottom:0">
      <label class="form-label">Para confirmar, digite o nome do projeto</label>
      <input class="form-input" id="exNome" placeholder="${p.nome.replace(/"/g,'&quot;')}" autocomplete="off">
      <div style="font-size:11px;color:var(--gray-400);margin-top:4px">Precisa ser exatamente: <strong>${p.nome}</strong></div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-danger" id="exBtn" onclick="confirmarExcluirProjeto('${pId}')"><i class="ti ti-trash"></i> Excluir definitivamente</button>
  </div>`);
}

async function confirmarExcluirProjeto(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode excluir projetos.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p) return;
  const el = id => document.getElementById(id);
  const erro = msg => { const a=el('exAlert'), b=el('exAlertMsg'); if(a&&b){ b.textContent=msg; a.style.display='flex'; } };
  if (el('exAlert')) el('exAlert').style.display = 'none';

  const digitado = (el('exNome')?.value || '').trim();
  if (_normTxt(digitado) !== _normTxt(p.nome)) {
    erro('O nome digitado não confere com o nome do projeto.');
    el('exNome')?.focus();
    return;
  }
  const btn = el('exBtn');
  const lbl = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Excluindo...'; }

  if (sbClient) {
    // tarefas, riscos e follow ups saem por cascata (on delete cascade)
    const { data, error } = await sbClient.from('projects').delete().eq('id', pId).select('id');
    if (error) {
      if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
      erro('Não foi possível excluir: ' + error.message);
      return;
    }
    if (!data || data.length === 0) {
      if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
      erro('O projeto não foi excluído no servidor (verifique suas permissões).');
      return;
    }
  }
  state.projetos = state.projetos.filter(x => x.id !== pId);
  state.currentProjetoId = null;
  saveState();
  closeModal();
  renderSidebar();
  nav('projetos');
  notificar(`Projeto "${p.nome}" excluído.`, 'sucesso');
}


// ==================== MISSÃO DA SEMANA ====================
// Um texto por projeto por semana, escrito na reunião de sexta.
// O texto é guardado como veio; os itens são derivados dele.

function _mapMissaoRow(r) {
  return {
    id: r.id, projectId: r.project_id,
    semanaRef: r.semana_ref || null,
    texto: r.texto || '',
    itens: Array.isArray(r.itens) ? r.itens : [],
    createdBy: r.created_by || '', createdAt: r.created_at || null,
    updatedAt: r.updated_at || null, atualizadoPor: r.atualizado_por || ''
  };
}

// Sexta da semana corrente (hoje, se hoje for sexta; senão a última que passou)
function _ultimaSexta(base) {
  const d = base ? new Date(base + 'T00:00:00') : new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() - 5 + 7) % 7));
  return d.toISOString().slice(0,10);
}
function _somaDias(iso, n) {
  const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function _proximoDiaUtil() {
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + 1);
  while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  return d;
}

const _DIAS_SEMANA = { dom:0, seg:1, ter:2, qua:3, qui:4, sex:5, sab:6 };

// Lê o prazo escrito no próprio item. Sem prazo, vale a sexta seguinte.
// Formatos aceitos: "até 05/11", "até dia 5", "até sex".
function _lerPrazoDoItem(texto, semanaRef) {
  const limite = _somaDias(semanaRef, 7);          // sexta seguinte
  const semAcento = texto.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

  // até 05/11 (ou 05/11/2026)
  let m = semAcento.match(/\bate\s+(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
  if (m) {
    const dia = +m[1], mes = +m[2];
    let ano = m[3] ? (+m[3] < 100 ? 2000 + (+m[3]) : +m[3]) : new Date(semanaRef + 'T00:00:00').getFullYear();
    // se a data cair bem antes da semana, assume o ano seguinte
    let iso = `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    if (iso < semanaRef && !m[3]) iso = `${ano+1}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    return { prazo: iso, trecho: m[0] };
  }
  // até dia 5
  m = semAcento.match(/\bate\s+(?:o\s+)?dia\s+(\d{1,2})\b/);
  if (m) {
    const dia = +m[1];
    const base = new Date(semanaRef + 'T00:00:00');
    let cand = new Date(base.getFullYear(), base.getMonth(), dia);
    if (cand < base) cand = new Date(base.getFullYear(), base.getMonth() + 1, dia);
    return { prazo: cand.toISOString().slice(0,10), trecho: m[0] };
  }
  // até seg / ter / qua / qui / sex — dentro da semana da missão
  m = semAcento.match(/\bate\s+(dom|seg|ter|qua|qui|sex|sab)[a-z]*\b/);
  if (m) {
    const alvo = _DIAS_SEMANA[m[1]];
    const base = new Date(semanaRef + 'T00:00:00');   // sexta
    let delta = (alvo - base.getDay() + 7) % 7;
    if (delta === 0) delta = 7;                        // "até sex" = a sexta seguinte
    return { prazo: _somaDias(semanaRef, delta), trecho: m[0] };
  }
  return { prazo: limite, trecho: null };
}

// Converte o texto colado em itens. Ignora linhas vazias e tira marcadores.
function interpretarTextoMissao(texto, semanaRef, itensAnteriores) {
  const antigos = Array.isArray(itensAnteriores) ? itensAnteriores : [];
  const chave = t => _normTxt(String(t || ''));
  return String(texto || '').split('\n')
    .map(l => l.replace(/^\s*(?:[-*•–—]|\d+[.)])\s*/, '').trim())
    .filter(Boolean)
    .map(linha => {
      const { prazo } = _lerPrazoDoItem(linha, semanaRef);
      // mantém o estado de "feito" quando o texto do item não mudou
      const anterior = antigos.find(a => chave(a.texto) === chave(linha));
      return {
        id: anterior ? anterior.id : uid(),
        texto: linha,
        prazo,
        feito: anterior ? !!anterior.feito : false,
        feito_em: anterior ? (anterior.feito_em || null) : null,
        feito_por: anterior ? (anterior.feito_por || null) : null
      };
    });
}

// ── acesso aos dados ──
function _missoesDoProjeto(p) { return Array.isArray(p?.missoes) ? p.missoes : []; }
function missaoDaSemana(p, semanaRef) {
  const s = semanaRef || _ultimaSexta();
  return _missoesDoProjeto(p).find(m => m.semanaRef === s) || null;
}
function missoesAnteriores(p) {
  const s = _ultimaSexta();
  return _missoesDoProjeto(p).filter(m => m.semanaRef !== s)
    .sort((a,b) => String(b.semanaRef||'').localeCompare(String(a.semanaRef||'')));
}
function itensAbertos(m) { return (m?.itens || []).filter(i => !i.feito); }

// Urgência de um item em aberto
function _itemUrgencia(it) {
  if (it.feito || !it.prazo) return null;
  const dl = daysLeft(it.prazo);
  if (dl < 0) return { nivel:'vencido', cor:'var(--danger)', bg:'#fef2f2', texto:`${Math.abs(dl)}d de atraso` };
  if (dl === 0) return { nivel:'hoje', cor:'var(--warn)', bg:'#fffbeb', texto:'vence hoje' };
  const p = parseLocalDate(it.prazo);
  if (p && p.getTime() <= _proximoDiaUtil().getTime()) return { nivel:'proximo', cor:'var(--warn)', bg:'#fffbeb', texto:'vence amanhã' };
  return { nivel:'ok', cor:'var(--gray-500)', bg:'', texto:`vence em ${dl}d` };
}


// ── Bloco no topo da aba Follow up ──
function renderMissoesSemana(p) {
  const sexta = _ultimaSexta();
  const m = missaoDaSemana(p, sexta);
  const antigas = missoesAnteriores(p);
  const feitos = m ? (m.itens || []).filter(i => i.feito).length : 0;
  const total = m ? (m.itens || []).length : 0;

  const cabecalho = `<div style="display:flex;align-items:center;gap:9px;padding:12px 15px;background:#f5f9ff;border-bottom:1px solid var(--gray-100);flex-wrap:wrap">
      <i class="ti ti-target" style="color:#2563eb;font-size:17px"></i>
      <span style="font-size:14px;font-weight:700;color:var(--gray-800)">Missão da semana</span>
      <span style="font-size:11.5px;color:var(--gray-500)">semana de ${fmt(sexta)}</span>
      ${total ? `<span class="badge" style="background:${feitos===total?'#dcfce7':'#dbeafe'};color:${feitos===total?'#166534':'#1e40af'};font-size:10px">${feitos} de ${total} feitos</span>` : ''}
      ${isGestor() ? `<button class="btn ${m?'btn-secondary':'btn-primary'} btn-sm" style="margin-left:auto" onclick="modalEscreverMissao('${p.id}')">
          <i class="ti ti-${m?'edit':'pencil-plus'}"></i> ${m?'Editar missão':'Escrever missão'}</button>` : ''}
    </div>`;

  const corpo = m
    ? `<div style="padding:11px 15px">
        ${(m.itens||[]).map(it => _itemMissaoLinha(p, m, it)).join('') || '<div style="font-size:12.5px;color:var(--gray-400)">A missão desta semana está sem itens.</div>'}
        <div style="font-size:11px;color:var(--gray-400);margin-top:9px">
          Escrita por ${m.createdBy || '—'}${m.atualizadoPor && m.atualizadoPor !== m.createdBy ? ` · editada por ${m.atualizadoPor}` : ''}
        </div>
      </div>`
    : `<div style="padding:14px 15px;font-size:12.5px;color:var(--gray-400)">
        Nenhuma missão escrita para esta semana.${isGestor() ? ' Use "Escrever missão" para registrar o que foi combinado na reunião.' : ''}
      </div>`;

  const historico = antigas.length ? `<div style="border-top:1px solid var(--gray-100)">
      <div onclick="toggleMissoesAnteriores('${p.id}')" style="padding:9px 15px;cursor:pointer;display:flex;align-items:center;gap:7px;background:var(--gray-50)">
        <i class="ti ti-chevron-${state.missoesHistAberto === p.id ? 'down':'right'}" style="font-size:13px;color:var(--gray-400)"></i>
        <span style="font-size:12px;font-weight:600;color:var(--gray-600)">Ver semanas anteriores</span>
        <span style="font-size:11px;color:var(--gray-400)">${antigas.length} semana${antigas.length!==1?'s':''}</span>
      </div>
      ${state.missoesHistAberto === p.id ? antigas.map(ma => {
        const f = (ma.itens||[]).filter(i=>i.feito).length, t = (ma.itens||[]).length;
        return `<div style="padding:10px 15px 10px 32px;border-top:1px solid var(--gray-100)">
          <div style="font-size:12px;font-weight:600;color:var(--gray-700);margin-bottom:6px">
            Semana de ${fmt(ma.semanaRef)} <span style="font-weight:400;color:var(--gray-400)">— ${f} de ${t} feitos</span>
          </div>
          ${(ma.itens||[]).map(it => `<div style="font-size:12px;color:${it.feito?'var(--gray-400)':'var(--gray-700)'};padding:2px 0;${it.feito?'text-decoration:line-through':''}">
              <i class="ti ti-${it.feito?'circle-check':'circle'}" style="font-size:12px;color:${it.feito?'var(--success)':'var(--gray-300)'};vertical-align:-2px"></i> ${it.texto}
            </div>`).join('')}
        </div>`;
      }).join('') : ''}
    </div>` : '';

  return `<div class="card" style="margin-bottom:16px;padding:0;overflow:hidden">${cabecalho}${corpo}${historico}</div>`;
}

function toggleMissoesAnteriores(pId) {
  state.missoesHistAberto = state.missoesHistAberto === pId ? null : pId;
  const p = state.projetos.find(x => x.id === pId);
  if (p) renderProjetoDetail(p);
}

// Linha de um item, com caixa de marcar e rótulo de texto
function _itemMissaoLinha(p, m, it, opts = {}) {
  const u = _itemUrgencia(it);
  const quando = it.feito_em ? new Date(it.feito_em) : null;
  const marca = it.feito
    ? `<span style="font-size:11px;color:var(--success)"><i class="ti ti-check" style="font-size:11px"></i> ${it.feito_por || '—'}${quando && !isNaN(quando) ? ' · ' + quando.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : ''}</span>`
    : (u ? `<span style="font-size:11px;color:${u.cor};font-weight:${u.nivel==='ok'?'400':'600'}">${fmt(it.prazo)} · ${u.texto}</span>` : '');
  return `<div style="display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-left:3px solid ${it.feito?'var(--success)':(u?u.cor:'var(--gray-200)')};background:${it.feito?'var(--gray-50)':(u&&u.bg?u.bg:'#fff')};border-radius:0 7px 7px 0;margin-bottom:6px">
    <input type="checkbox" ${it.feito?'checked':''} style="margin-top:3px;flex-shrink:0" onclick="marcarItemMissao('${p.id}','${m.id}','${it.id}',this.checked)">
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;color:${it.feito?'var(--gray-400)':'var(--gray-800)'};${it.feito?'text-decoration:line-through':''};line-height:1.4">${it.texto}</div>
      <div style="margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${opts.mostrarProjeto ? `<span style="font-size:11px;color:var(--accent);font-weight:600">${p.nome}</span>` : ''}
        ${marca}
      </div>
    </div>
    <button class="btn btn-secondary btn-sm" style="padding:3px 9px;font-size:11px;flex-shrink:0" onclick="marcarItemMissao('${p.id}','${m.id}','${it.id}',${it.feito?'false':'true'})">
      <i class="ti ti-${it.feito?'arrow-back-up':'check'}"></i> ${it.feito?'Desfazer':'Feito'}</button>
  </div>`;
}

async function marcarItemMissao(pId, mId, itemId, feito) {
  const p = state.projetos.find(x => x.id === pId);
  const m = _missoesDoProjeto(p).find(x => x.id === mId);
  const it = m && (m.itens||[]).find(x => x.id === itemId);
  if (!p || !m || !it) return;
  const antes = { feito: it.feito, feito_em: it.feito_em, feito_por: it.feito_por };
  it.feito = !!feito;
  it.feito_em = feito ? new Date().toISOString() : null;
  it.feito_por = feito ? (state.currentUser?.name || '') : null;
  _reRenderMissoes(p);
  if (sbClient) {
    // Função no banco: altera só este item, para duas pessoas marcando ao
    // mesmo tempo não sobrescreverem uma à outra.
    const { error } = await sbClient.rpc('marcar_item_missao', { p_mission_id: mId, p_item_id: itemId, p_feito: !!feito });
    if (error) {
      Object.assign(it, antes);
      _reRenderMissoes(p);
      notificar('Não foi possível registrar: ' + error.message, 'erro');
      return;
    }
  }
  saveState();
}

// Redesenha a tela certa. Detecta pela própria tela, porque state.currentPage
// não é atualizado ao abrir um projeto.
function _reRenderMissoes(p) {
  const naTelaDoProjeto = !!document.getElementById('task-view') && p && state.currentProjetoId === p.id;
  if (naTelaDoProjeto) { renderProjetoDetail(p); return; }
  if (state.currentPage === 'meu-dia') { renderMeuDia(); return; }
  if (p) renderProjetoDetail(p);
}


// ── Escrever / editar a missão da semana ──
function modalEscreverMissao(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode escrever a missão.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p) return;
  const sexta = _ultimaSexta();
  const m = missaoDaSemana(p, sexta);
  // itens que ficaram abertos na semana passada, para "trazer"
  const anterior = _missoesDoProjeto(p).find(x => x.semanaRef === _somaDias(sexta, -7));
  const pendentes = anterior ? itensAbertos(anterior) : [];
  const textoInicial = m ? m.texto : '';

  openModal(`<div class="modal-header">
    <div class="modal-title"><i class="ti ti-target" style="margin-right:8px;color:#2563eb"></i>${m?'Editar missão':'Escrever missão'} — ${p.nome}</div>
    <button class="btn btn-ghost" onclick="closeModal()"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body">
    <div style="font-size:12px;color:var(--gray-500);margin-bottom:12px">
      Semana de <strong>${fmt(sexta)}</strong>. Escreva um item por linha.
      Para dar prazo, escreva no próprio item: <em>até 05/11</em>, <em>até dia 5</em> ou <em>até ter</em>.
      Sem prazo, vale a sexta seguinte (${fmt(_somaDias(sexta,7))}).
    </div>
    ${pendentes.length ? `<div style="background:#fffbeb;border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span style="font-size:12px;color:#92400e;flex:1">${pendentes.length} item(ns) ficaram abertos na semana anterior.</span>
      <button class="btn btn-secondary btn-sm" style="font-size:11px" onclick="trazerItensAnteriores('${pId}')"><i class="ti ti-arrow-down"></i> Trazer itens abertos</button>
    </div>` : ''}
    <div id="emAlert" class="form-alert" style="display:none"><i class="ti ti-alert-circle" style="font-size:15px"></i><span id="emAlertMsg"></span></div>
    <div class="form-group">
      <label class="form-label">Missão da semana <span class="req-star">*</span></label>
      <textarea class="form-input form-textarea" id="emTexto" rows="7" placeholder="Fechar o DE-PARA de verbas até 05/11&#10;Validar a coleta do relógio até ter&#10;Enviar o layout de afastamentos" oninput="previewMissao('${pId}')">${textoInicial.replace(/</g,'&lt;')}</textarea>
    </div>
    <div id="emPreview"></div>
    ${m ? `<div style="font-size:11.5px;color:var(--gray-400);margin-top:10px">
      Itens já marcados como feitos continuam marcados, desde que o texto não mude.</div>` : ''}
  </div>
  <div class="modal-footer">
    ${m && isGestor() ? `<button class="btn btn-sm btn-excluir" style="margin-right:auto" onclick="excluirMissaoSemana('${pId}')"><i class="ti ti-trash"></i> Excluir missão</button>` : ''}
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" id="emBtn" onclick="salvarMissaoSemana('${pId}')"><i class="ti ti-check"></i> ${m?'Salvar alterações':'Registrar missão'}</button>
  </div>`);
  previewMissao(pId);
}

function trazerItensAnteriores(pId) {
  const p = state.projetos.find(x => x.id === pId);
  const sexta = _ultimaSexta();
  const anterior = _missoesDoProjeto(p).find(x => x.semanaRef === _somaDias(sexta, -7));
  const pendentes = anterior ? itensAbertos(anterior) : [];
  const ta = document.getElementById('emTexto');
  if (!ta || !pendentes.length) return;
  const atual = ta.value.trim();
  const novos = pendentes.map(i => i.texto).filter(t => !atual.includes(t));
  ta.value = (atual ? atual + '\n' : '') + novos.join('\n');
  previewMissao(pId);
}

// Mostra os itens que serão criados, com o prazo reconhecido em cada um
function previewMissao(pId) {
  const p = state.projetos.find(x => x.id === pId);
  const box = document.getElementById('emPreview');
  const texto = document.getElementById('emTexto')?.value || '';
  if (!p || !box) return;
  const sexta = _ultimaSexta();
  const m = missaoDaSemana(p, sexta);
  const itens = interpretarTextoMissao(texto, sexta, m ? m.itens : []);
  if (!itens.length) { box.innerHTML = `<div style="font-size:12px;color:var(--gray-400)">Nenhum item reconhecido ainda.</div>`; return; }
  box.innerHTML = `<div style="background:var(--gray-50);border-radius:8px;padding:11px 13px">
    <div style="font-size:12px;font-weight:700;color:var(--gray-700);margin-bottom:7px">
      <i class="ti ti-list-check" style="font-size:13px;vertical-align:-2px"></i> ${itens.length} item(ns) que serão criados
    </div>
    ${itens.map(i => `<div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0;border-top:1px solid var(--gray-100)">
      <span style="color:var(--gray-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.texto}${i.feito?' <span style="color:var(--success);font-size:11px">(já feito)</span>':''}</span>
      <span style="color:var(--gray-500);white-space:nowrap">${fmt(i.prazo)}</span>
    </div>`).join('')}
  </div>`;
}

async function salvarMissaoSemana(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode escrever a missão.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p) return;
  const el = id => document.getElementById(id);
  const erro = msg => { const a=el('emAlert'), b=el('emAlertMsg'); if(a&&b){ b.textContent=msg; a.style.display='flex'; } };
  if (el('emAlert')) el('emAlert').style.display = 'none';

  const texto = (el('emTexto')?.value || '').trim();
  if (!texto) { erro('Escreva a missão da semana.'); return; }
  const sexta = _ultimaSexta();
  const existente = missaoDaSemana(p, sexta);
  const itens = interpretarTextoMissao(texto, sexta, existente ? existente.itens : []);
  if (!itens.length) { erro('Nenhum item foi reconhecido no texto.'); return; }

  const btn = el('emBtn'); const lbl = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Salvando...'; }
  const quem = state.currentUser?.name || '';

  if (existente) {
    const antes = { texto: existente.texto, itens: existente.itens };
    if (sbClient) {
      const { data, error } = await sbClient.from('weekly_missions')
        .update({ texto, itens, atualizado_por: quem, updated_at: new Date().toISOString() })
        .eq('id', existente.id).select('id');
      if (error) { if(btn){btn.disabled=false;btn.innerHTML=lbl;} erro('Não foi possível salvar: ' + error.message); return; }
      if (!data || !data.length) { if(btn){btn.disabled=false;btn.innerHTML=lbl;} erro('A missão não foi gravada no servidor (verifique suas permissões).'); return; }
    }
    existente.texto = texto; existente.itens = itens; existente.atualizadoPor = quem;
  } else {
    const nova = { id: uid(), projectId: pId, semanaRef: sexta, texto, itens,
                   createdBy: quem, createdAt: new Date().toISOString(), atualizadoPor: '' };
    if (sbClient) {
      const { data, error } = await sbClient.from('weekly_missions').insert({
        id: nova.id, project_id: pId, semana_ref: sexta, texto, itens, created_by: quem
      }).select('id');
      if (error) { if(btn){btn.disabled=false;btn.innerHTML=lbl;} erro('Não foi possível salvar: ' + error.message); return; }
      if (!data || !data.length) { if(btn){btn.disabled=false;btn.innerHTML=lbl;} erro('A missão não foi gravada no servidor (verifique suas permissões).'); return; }
    }
    if (!Array.isArray(p.missoes)) p.missoes = [];
    p.missoes.push(nova);
  }
  saveState();
  closeModal();
  _reRenderMissoes(p);
  notificar('Missão da semana registrada.', 'sucesso');
}

async function excluirMissaoSemana(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode excluir a missão.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  const m = p && missaoDaSemana(p, _ultimaSexta());
  if (!p || !m) return;
  if (!confirm(`Excluir a missão da semana de ${fmt(m.semanaRef)}?\n\nOs ${(m.itens||[]).length} item(ns) e as marcações de feito serão perdidos. Esta ação não pode ser desfeita.`)) return;
  if (sbClient) {
    const { data, error } = await sbClient.from('weekly_missions').delete().eq('id', m.id).select('id');
    if (error) { notificar('Não foi possível excluir: ' + error.message, 'erro'); return; }
    if (!data || !data.length) { notificar('A missão não foi excluída no servidor (verifique suas permissões).', 'erro'); return; }
  }
  p.missoes = _missoesDoProjeto(p).filter(x => x.id !== m.id);
  saveState();
  closeModal();
  _reRenderMissoes(p);
  notificar('Missão excluída.', 'sucesso');
}

// ── Itens abertos para o Meu dia / Dia da equipe ──
function missoesParaMeuDia(projetos) {
  const sexta = _ultimaSexta();
  const grupos = [];
  (projetos || []).forEach(p => {
    const m = missaoDaSemana(p, sexta);
    const abertos = m ? itensAbertos(m) : [];
    if (m && abertos.length) {
      grupos.push({ p, m, itens: abertos.sort((a,b) => String(a.prazo||'').localeCompare(String(b.prazo||''))) });
    } else if (!m && isGestor()) {
      grupos.push({ p, m: null, itens: [] });   // "Sem missão", só para o gestor
    }
  });
  return grupos;
}

// ==================== FOLLOW UP ====================
// Histórico de alinhamentos do projeto. Cada registro é datado e imutável —
// serve como memória do que foi combinado com o time, consultável depois.
function _fuOrdenados(p) {
  return [...(Array.isArray(p.followUps) ? p.followUps : [])]
    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
}

function _mapFollowUpRow(r) {
  return { id: r.id, texto: r.texto || '', autor: r.autor || '', createdAt: r.created_at || null };
}

function renderFollowUp(p) {
  const container = document.getElementById('task-view');

    <textarea class="form-input form-textarea" id="fuTexto" rows="5"
      placeholder="Registre o que foi alinhado com o time: decisões, combinados, pontos de atenção, próximos passos..."></textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap">

  const historico = registros.length ? registros.map(r => {

    const quando = d && !isNaN(d)
      ? d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})
      : 'data não registrada';
    const iniciais = (r.autor || '?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
    return `<div class="card" style="margin-bottom:10px;padding:14px 16px">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
        <div class="user-avatar" style="width:28px;height:28px;font-size:11px;background:var(--navy)">${iniciais}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:12.5px;font-weight:600;color:var(--gray-800)">${r.autor || 'Autor não identificado'}</div>
          <div style="font-size:11px;color:var(--gray-400)"><i class="ti ti-clock" style="font-size:11px;vertical-align:-1px"></i> ${quando}</div>
        </div>
        ${isGestor() ? `<button class="btn btn-sm btn-excluir" title="Excluir registro" aria-label="Excluir registro" onclick="excluirFollowUp('${p.id}','${r.id}')"><i class="ti ti-trash"></i></button>` : ''}
      </div>
      <div style="font-size:13px;color:var(--gray-700);line-height:1.6;white-space:pre-wrap">${r.texto}</div>
    </div>`;
  }).join('') : `<div class="card"><div class="empty"><i class="ti ti-message-off"></i>
      <p>Nenhum registro de follow up</p>
      <small>${podeEscrever ? 'Use o campo acima para registrar o primeiro alinhamento.' : 'O gestor do projeto ainda não registrou alinhamentos.'}</small></div></div>`;

  container.innerHTML = renderMissoesSemana(p) + editor + (registros.length ? `<div style="font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:10px">

async function salvarFollowUp(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode registrar follow up.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p) return;
  const el = id => document.getElementById(id);
  const erro = msg => { const a=el('fuAlert'), m=el('fuAlertMsg'); if(a&&m){ m.textContent=msg; a.style.display='flex'; } };
  if (el('fuAlert')) el('fuAlert').style.display = 'none';

  const texto = (el('fuTexto')?.value || '').trim();
  if (!texto) { erro('Escreva o registro antes de salvar.'); el('fuTexto')?.focus(); return; }

  const btn = el('fuBtnSalvar');
  const lbl = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Salvando...'; }

  const registro = {
    id: uid(), texto,
    autor: state.currentUser?.name || '',
    createdAt: new Date().toISOString()
  };

  if (sbClient) {
    const { data, error } = await sbClient.from('follow_ups').insert({
      id: registro.id, project_id: pId, texto: registro.texto,
      autor: registro.autor, created_at: registro.createdAt
    }).select('id');
    if (error) {
      if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
      erro('Não foi possível salvar: ' + error.message);
      return;
    }
    if (!data || data.length === 0) {
      if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
      erro('O registro não foi gravado no servidor (verifique suas permissões).');
      return;
    }
  }
  if (!Array.isArray(p.followUps)) p.followUps = [];
  p.followUps.push(registro);
  saveState();
  renderProjetoDetail(p);
  notificar('Registro de follow up salvo.', 'sucesso');
}

async function excluirFollowUp(pId, fuId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode excluir registros.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p || !Array.isArray(p.followUps)) return;
  if (!confirm('Excluir este registro de follow up?\n\nEle faz parte do histórico do projeto e a exclusão não pode ser desfeita.')) return;
  if (sbClient) {
    const { data, error } = await sbClient.from('follow_ups').delete().eq('id', fuId).select('id');
    if (error) { notificar('Não foi possível excluir: ' + error.message, 'erro'); return; }
    if (!data || data.length === 0) { notificar('O registro não foi excluído no servidor (verifique suas permissões).', 'erro'); return; }
  }
  p.followUps = p.followUps.filter(r => r.id !== fuId);
  saveState();
  renderProjetoDetail(p);
  notificar('Registro excluído.', 'sucesso');
}

// ==================== CRONOGRAMA MACRO ====================
function renderCronogramaMacro(p) {
  const container = document.getElementById('task-view');
  const macros = Array.isArray(p.macroActivities) ? p.macroActivities : [];

  // Projeto sem cronograma macro (ex.: Customização): não há datas de macro para editar
  if (!macros.length) {
    container.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">${renderBotaoEditarDatas(p)}</div>
      <div class="card">
        <div class="empty">
          <i class="ti ti-timeline"></i>
          <p>Este projeto não tem cronograma macro</p>
          <small>Projetos sem atividades macro trabalham direto com as tarefas. Ajuste os prazos pela edição de cada tarefa, na aba Lista.</small>
          ${isGestor() ? `<div style="margin-top:16px"><button class="btn btn-secondary btn-sm" onclick="modalImportarCronograma('${p.id}')"><i class="ti ti-upload"></i> Importar cronograma</button></div>` : ''}
        </div>
      </div>`;
    return;
  }

  // Conta quantas tarefas micro estão vinculadas a cada atividade macro
  const vinculadasPorMacro = {};
  (p.tasks || []).forEach(t => {
    if (t.macroActivityId) vinculadasPorMacro[t.macroActivityId] = (vinculadasPorMacro[t.macroActivityId] || 0) + 1;
  });

  // Tabela agrupada por fase (na ordem correta) e, dentro dela, por data de início.
  // Cada macro pertence a UMA fase (a cadeia é micro → macro → fase) e aparece uma vez, nela.
  const tarefasPorMacro = mapaMacroTarefas(p);
  const ordemTar = ordemDasTarefas(p);
  const fasesTab = _ordenarFases([...new Set(macros.map(m => m.phase || 'Sem fase'))]);
  const macrosOrdenadas = [];
  fasesTab.forEach(fase => {
    macrosOrdenadas.push({ _cabecalhoFase: fase });
    macros.filter(m => (m.phase || 'Sem fase') === fase)
      .sort((a,b) => {
        const da = a.startDate || a.endDate || '9999-12-31';
        const db = b.startDate || b.endDate || '9999-12-31';
        if (da !== db) return da < db ? -1 : 1;
        return (posMacroNaFase(p, a, fase, tarefasPorMacro, ordemTar) - posMacroNaFase(p, b, fase, tarefasPorMacro, ordemTar)) || (a.name||'').localeCompare(b.name||'');
      })
      .forEach(m => macrosOrdenadas.push(m));
  });

  // Progresso e situação vêm das microtarefas (mesma fonte do Gantt).
  // O campo m.progress é o valor congelado da importação e não acompanha as baixas.
  const statusPorMacro = resumoPorMacro(p, macros, tarefasPorMacro);   // progresso da macro INTEIRA (todas as fases)

  const linhas = macrosOrdenadas.map(item => {
    if (item._cabecalhoFase) {
      const fc = FASE_COLORS[item._cabecalhoFase] || {bg:'var(--gray-100)',color:'var(--gray-600)'};
      return `<tr><td colspan="7" style="background:${fc.bg};color:${fc.color};font-weight:700;font-size:12px;padding:6px 10px">${item._cabecalhoFase}</td></tr>`;
    }
    const m = item;
    const nVinc = vinculadasPorMacro[m.id] || 0;
    const vincBadge = nVinc > 0
      ? `<span class="badge badge-green" style="font-size:10px"><i class="ti ti-link"></i>${nVinc} tarefa${nVinc>1?'s':''}</span>`
      : `<span class="badge badge-gray" style="font-size:10px"><i class="ti ti-unlink"></i>Sem vínculo</span>`;
    const dd = statusPorMacro[m.id];
    const prog = dd && dd.progress && dd.progress.microProgress != null
      ? dd.progress.microProgress
      : (typeof m.progress === 'number' ? m.progress : 0);
    const concl = dd ? dd.progress.completedTasks : null;
    const totalT = dd ? dd.progress.totalTasks : null;
    const atrasada = dd && dd.status.key === 'atrasada';
    const naoEncontrada = m.importStatus === 'not-found';
    return `<tr data-macro-row="${m.id}" style="${naoEncontrada?'background:#fef2f2':''}">
      <td style="font-weight:500;color:var(--gray-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(m.name||'').replace(/"/g,'&quot;')}">${m.name || '—'}
        ${naoEncontrada ? `<span class="badge badge-red" style="font-size:9px;margin-left:4px" title="Não encontrada na última importação"><i class="ti ti-alert-triangle"></i>não encontrada</span>` : ''}
      </td>
      <td style="font-size:12px;color:${m.startDate?'var(--gray-600)':'var(--gray-300)'}">${state.cronoEdicao
        ? `<input type="date" class="form-input" style="padding:3px 6px;font-size:12px" id="ed-ini-${m.id}" value="${m.startDate||''}">`
        : (m.startDate?fmt(m.startDate):'—')}</td>
      <td style="font-size:12px;color:${m.endDate?'var(--gray-600)':'var(--gray-300)'}">${state.cronoEdicao
        ? `<input type="date" class="form-input" style="padding:3px 6px;font-size:12px" id="ed-fim-${m.id}" value="${m.endDate||''}">`
        : (m.endDate?fmt(m.endDate):'—')}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="progress" style="flex:1"><div class="progress-bar${prog===100?' green':''}" style="width:${prog}%${atrasada&&prog<100?';background:var(--danger)':''}"></div></div>
          <span style="font-size:11px;font-weight:600;color:${atrasada&&prog<100?'var(--danger)':'var(--gray-600)'}" ${totalT!=null?`title="${concl} de ${totalT} tarefa(s) concluída(s)"`:''}>${prog}%</span>
        </div>
      </td>
      <td style="font-size:12px;color:var(--gray-600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(m.responsible||'').replace(/"/g,'&quot;')}">${m.responsible || '—'}</td>
      <td style="white-space:nowrap">${vincBadge}</td>
    </tr>`;
  }).join('');

  container.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div class="tabs" style="padding:2px">
          <button class="tab ${state.ganttModo!=='tabela'?'active':''}" style="padding:5px 10px;font-size:12px" onclick="state.ganttModo='gantt';renderProjetoDetail(state.projetos.find(x=>x.id==='${p.id}'))"><i class="ti ti-chart-bar"></i> Gantt</button>
          <button class="tab ${state.ganttModo==='tabela'?'active':''}" style="padding:5px 10px;font-size:12px" onclick="state.ganttModo='tabela';renderProjetoDetail(state.projetos.find(x=>x.id==='${p.id}'))"><i class="ti ti-table"></i> Tabela</button>
        </div>
        ${state.ganttModo!=='tabela' ? `<div class="tabs" style="padding:2px">
          <button class="tab ${state.ganttEscala!=='semana'?'active':''}" style="padding:5px 10px;font-size:12px" onclick="setGanttEscala('mes')">Mês</button>
          <button class="tab ${state.ganttEscala==='semana'?'active':''}" style="padding:5px 10px;font-size:12px" onclick="setGanttEscala('semana')">Semana</button>
        </div>` : ''}
        <span style="font-size:12px;color:var(--gray-400)">${macros.length} atividade${macros.length>1?'s':''}</span>
        ${isGestor() ? (state.cronoEdicao
          ? `<span style="display:flex;gap:6px">
               <button class="btn btn-secondary btn-sm" onclick="sairModoEdicaoDatas('${p.id}')">Cancelar</button>
               <button class="btn btn-primary btn-sm" onclick="salvarTodasDatasMacro('${p.id}')"><i class="ti ti-check"></i> Salvar e replanejar</button>
             </span>`
          : `<button class="btn btn-secondary btn-sm" onclick="entrarModoEdicaoDatas('${p.id}')"><i class="ti ti-calendar-event"></i> Editar datas</button>`) : ''}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" onclick="modalExportarCronogramaPDF('${p.id}')"><i class="ti ti-file-type-pdf"></i> Exportar PDF</button>
        <button class="btn btn-secondary btn-sm" onclick="modalConfigurarDePara('${p.id}')"><i class="ti ti-arrows-exchange"></i> Configurar DE-PARA</button>
        <button class="btn btn-secondary btn-sm" onclick="modalImportarCronograma('${p.id}')"><i class="ti ti-upload"></i> Importar cronograma</button>
        <button class="btn btn-secondary btn-sm" style="color:var(--danger)" onclick="limparCronogramaMacro('${p.id}')"><i class="ti ti-trash"></i> Limpar cronograma</button>
      </div>
    </div>
    ${(state.ganttModo!=='tabela' && !state.cronoEdicao) ? renderGanttCronograma(p, macros) : `
    ${state.cronoEdicao?`<div class="card" style="margin-bottom:12px;padding:10px 14px;background:#fffbeb;border-color:#fed7aa">
      <div style="font-size:12.5px;color:#92400e"><i class="ti ti-pencil" style="font-size:13px;vertical-align:-2px"></i>
        Modo de edição: ajuste as datas que precisar e clique em <strong>Salvar e replanejar</strong>. As tarefas concluídas e as com prazo manual são preservadas.</div>
    </div>`:''}
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table style="width:100%;table-layout:fixed;min-width:820px">
          <thead><tr>
            <th style="width:27%">Atividade</th>
            <th style="width:10%">Início</th>
            <th style="width:10%">Término</th>
            <th style="width:15%">Progresso</th>
            <th style="width:16%">Responsável</th>
            <th style="width:22%">Vinculação</th>
          </tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
    </div>`}`;
}

// Limpa todo o cronograma macro do projeto (atividades, mapeamentos DE-PARA e prazos herdados),
// deixando o projeto pronto para uma nova importação do zero.
// Preserva tarefas concluídas e prazos definidos manualmente.
function limparCronogramaMacro(pId) {
  const p = state.projetos.find(x=>x.id===pId);
  if (!p) return;
  const nMacros = (p.macroActivities||[]).length;
  const nMaps = (p.macroMappings||[]).length;
  if (!confirm(
    `Limpar o cronograma macro deste projeto?\n\n`
    + `Serão removidas:\n`
    + `• ${nMacros} atividade(s) macro importada(s)\n`
    + `• ${nMaps} mapeamento(s) DE-PARA do projeto\n`
    + `• os prazos das tarefas que vieram do cronograma\n\n`
    + `Tarefas concluídas e prazos definidos manualmente serão preservados. `
    + `O DE-PARA padrão do template NÃO é afetado.\n\nDeseja continuar?`
  )) return;

  // Remove atividades macro e mapeamentos do projeto
  p.macroActivities = [];
  p.macroMappings = [];

  // Limpa o vínculo e o prazo herdado das tarefas (preserva concluídas e prazos manuais)
  let prazosLimpos = 0;
  (p.tasks||[]).forEach(t => {
    t.macroActivityId = null;
    if (t.status === 'concluida') return;
    if (t._prazoManual) return;
    if (t.prazoOrigem === 'macro') { t.prazo = null; t.prazoOrigem = null; prazosLimpos++; }
  });

  saveState();
  renderProjetoDetail(p);
  // Persiste no banco: cronograma zerado + prazos das tarefas limpos
  persistirCronograma(p).then(res => {
    if (!res.ok) notificar('Cronograma limpo localmente, mas houve falha ao salvar no servidor: ' + res.error + '. Recarregue a página.', 'erro');
  });
  notificar(`Cronograma macro limpo: ${nMacros} atividade(s) e ${nMaps} mapeamento(s) removidos, ${prazosLimpos} prazo(s) limpo(s). Pronto para nova importação.`, 'sucesso');
}

// Converte um valor de data do Excel (serial ou string) para 'YYYY-MM-DD'
function excelParaDataISO(v) {
  if (v === null || v === undefined || v === '') return null;
  // Número serial do Excel
  if (typeof v === 'number' && isFinite(v)) {
    // SheetJS: usa epoch 1899-12-30
    const d = XLSX.SSF ? XLSX.SSF.parse_date_code(v) : null;
    if (d && d.y) {
      const mm = String(d.m).padStart(2,'0');
      const dd = String(d.d).padStart(2,'0');
      return `${d.y}-${mm}-${dd}`;
    }
  }
  // Objeto Date
  if (v instanceof Date && !isNaN(v)) {
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  }
  // String: tenta dd/mm/yyyy ou yyyy-mm-dd
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let [_, dd, mm, yy] = m;
    if (yy.length === 2) yy = '20'+yy;
    return `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  return null;
}

// Normaliza texto de cabeçalho para comparação (sem acento, minúsculo, sem espaços extras)
function normHeader(s) {
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}

// Converte "% concluída" (0-1, 0-100 ou "50%") em inteiro 0-100
function parseProgresso(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return Math.round(v <= 1 ? v*100 : v);
  const s = String(v).replace('%','').replace(',','.').trim();
  const n = parseFloat(s);
  if (isNaN(n)) return 0;
  return Math.round(n <= 1 ? n*100 : n);
}

// Lê o arquivo selecionado e monta a prévia
function lerArquivoCronograma(ev, pId) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('importStatus');
  const showStatus = (msg, cor) => { if (statusEl) { statusEl.style.display='block'; statusEl.innerHTML = `<span style="color:${cor||'var(--gray-500)'}">${msg}</span>`; } };
  showStatus('<i class="ti ti-loader"></i> Lendo arquivo...');

  if (typeof XLSX === 'undefined') { showStatus('Biblioteca de leitura não carregada.', 'var(--danger)'); return; }

  const reader = new FileReader();
  reader.onerror = () => showStatus('Falha ao ler o arquivo.', 'var(--danger)');
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type:'array', cellDates:false });
      // Localizar a aba esperada (tolerante a variações)
      const abaNome = wb.SheetNames.find(n => normHeader(n) === normHeader('Tarefas do projeto'))
                   || wb.SheetNames.find(n => normHeader(n).includes('tarefas do projeto'));
      if (!abaNome) {
        showStatus('Aba "Tarefas do projeto" não encontrada no arquivo. Abas disponíveis: ' + wb.SheetNames.join(', '), 'var(--danger)');
        return;
      }
      const ws = wb.Sheets[abaNome];
      const matriz = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null });

      // Localizar a linha de cabeçalho procurando pelas 4 colunas obrigatórias
      const alvos = ['numero de tarefa','nome','inicio','concluir'];
      let headerRow = -1, colMap = {};
      for (let i=0; i<Math.min(matriz.length, 40); i++) {
        const linha = matriz[i] || [];
        const norms = linha.map(normHeader);
        const temTodos = alvos.every(a => norms.some(h => h === a || h.includes(a)));
        if (temTodos) { headerRow = i; break; }
      }
      if (headerRow === -1) {
        showStatus('Não foi possível localizar a linha de cabeçalho (colunas "Número de tarefa", "Nome", "Início" e "Concluir").', 'var(--danger)');
        return;
      }

      // Mapear índices das colunas conhecidas
      const cabec = (matriz[headerRow]||[]).map(normHeader);
      const acharCol = (...nomes) => {
        for (const nome of nomes) {
          const alvo = normHeader(nome);
          const idx = cabec.findIndex(h => h === alvo);
          if (idx !== -1) return idx;
          const idx2 = cabec.findIndex(h => h.includes(alvo));
          if (idx2 !== -1) return idx2;
        }
        return -1;
      };
      colMap = {
        numero:    acharCol('Número de tarefa'),
        hierarquia:acharCol('Número do nível hierárquico','nivel hierarquico'),
        nome:      acharCol('Nome'),
        inicio:    acharCol('Início'),
        concluir:  acharCol('Concluir'),
        rotulos:   acharCol('Rótulos'),
        progresso: acharCol('% concluída','concluida'),
        atribuida: acharCol('Atribuída a','atribuida a'),
        duracao:   acharCol('Duração'),
        bucket:    acharCol('Bucket'),
        prioridade:acharCol('Prioridade'),
        depende:   acharCol('Depende de'),
        marco:     acharCol('Marco'),
        notas:     acharCol('Notas'),
        concluido: acharCol('Concluído'),
        checklist: acharCol('Itens da Lista de Verificação','lista de verificacao'),
      };

      // Extrair linhas de dados
      const dados = [];
      for (let i=headerRow+1; i<matriz.length; i++) {
        const linha = matriz[i] || [];
        if (linha.every(c => c === null || String(c).trim() === '')) continue; // linha totalmente vazia
        const get = (idx) => idx>=0 ? linha[idx] : null;
        const numero = get(colMap.numero);
        const nome = get(colMap.nome);
        const hierarquia = colMap.hierarquia>=0 ? (get(colMap.hierarquia)!=null?String(get(colMap.hierarquia)).trim():null) : null;
        // Regra 1: ignorar linhas sem número de tarefa ou sem nome
        if (numero===null || String(numero).trim()==='' || nome===null || String(nome).trim()==='') continue;
        dados.push({
          numero: String(numero).trim(),
          hierarquia,
          nome: String(nome).trim(),
          inicio: excelParaDataISO(get(colMap.inicio)),
          concluir: excelParaDataISO(get(colMap.concluir)),
          rotulos: colMap.rotulos>=0 ? (get(colMap.rotulos)||'') : '',
          progresso: parseProgresso(get(colMap.progresso)),
          atribuida: colMap.atribuida>=0 ? (get(colMap.atribuida)||'') : '',
          bucket: colMap.bucket>=0 ? (get(colMap.bucket)||'') : '',
          _raw: linha
        });
      }

      // Índice de códigos hierárquicos para detectar agrupadores (regra 6)
      const codigos = new Set(dados.map(d => d.hierarquia).filter(Boolean));
      const temFilhos = (codigo) => {
        if (!codigo) return false;
        for (const c of codigos) { if (c !== codigo && c.startsWith(codigo + '.')) return true; }
        return false;
      };
      const nivelDe = (codigo) => codigo ? codigo.split('.').length : 1;

      // Nome do ancestral de nível 2 → usado como "fase" (regra de FASE DA ATIVIDADE)
      const mapaPorCodigo = {};
      dados.forEach(d => { if (d.hierarquia) mapaPorCodigo[d.hierarquia] = d; });
      const faseDe = (codigo) => {
        if (!codigo) return null;
        const seg = codigo.split('.');
        if (seg.length < 2) return null;
        const codNivel2 = seg.slice(0,2).join('.');
        const anc = mapaPorCodigo[codNivel2];
        return anc ? anc.nome : null;
      };

      // Classificar cada linha como importável ou não
      const macrosExistentes = (state.projetos.find(x=>x.id===pId)?.macroActivities)||[];
      const linhas = dados.map(d => {
        const nivel = nivelDe(d.hierarquia);
        const agrupador = temFilhos(d.hierarquia);
        const raiz = nivel === 1; // regra 2
        const temData = !!(d.inicio || d.concluir);
        // Regra 5: importável = tem nome + tem data + não é agrupador + não é raiz
        const importavel = !!d.nome && temData && !agrupador && !raiz;
        const externalId = 'planner:' + d.numero;
        // Status frente ao que já existe
        const existente = macrosExistentes.find(m => m.externalId === externalId);
        let situacao = 'nova';
        if (existente) {
          const mudou = existente.name !== d.nome
            || existente.startDate !== d.inicio
            || existente.endDate !== d.concluir
            || existente.progress !== d.progresso
            || existente.phase !== faseDe(d.hierarquia);
          situacao = mudou ? 'alterada' : 'existente';
        }
        return {
          numero: d.numero,
          hierarquia: d.hierarquia,
          nome: d.nome,
          fase: faseDe(d.hierarquia),
          inicio: d.inicio,
          concluir: d.concluir,
          progresso: d.progresso,
          responsavel: (d.atribuida && String(d.atribuida).trim()) ? String(d.atribuida).trim() : (String(d.rotulos||'').trim() || null), // regra 9
          bucket: String(d.bucket||'').trim() || null, // regra 10
          externalId,
          nivel, agrupador, raiz, temData,
          importavel,
          selecionado: importavel, // por padrão marca os importáveis
          situacao
        };
      });

      const validas = linhas.filter(l => l.importavel).length;
      if (validas === 0 && !linhas.some(l => l.agrupador)) {
        showStatus('Nenhuma atividade válida foi encontrada no arquivo. Verifique se as linhas possuem nome e datas.', 'var(--warn)');
        return;
      }

      _importPreview = { pId, linhas, nomeArquivo: file.name };
      abrirModalPrevia();
    } catch (err) {
      console.error('Erro ao processar cronograma:', err);
      showStatus('Erro ao processar o arquivo: ' + err.message, 'var(--danger)');
    }
  };
  reader.readAsArrayBuffer(file);
}

// Renderiza o modal de prévia com as linhas identificadas
