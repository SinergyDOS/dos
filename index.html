// Insere UMA tarefa nova no banco. Retorna {ok, error}.
async function inserirTarefaSupabase(projeto, task) {
  if (!sbClient) return { ok:false, error:'Sem conexão com o servidor.' };
  const ordem = (projeto.tasks || []).indexOf(task);
  const { data, error } = await sbClient.from('tasks')
    .insert(_tarefaParaRow(task, projeto.id, ordem >= 0 ? ordem : (projeto.tasks||[]).length))
    .select('id');
  if (error) return { ok:false, error: error.message };
  if (!data || data.length === 0) return { ok:false, error:'a tarefa não foi gravada no servidor (verifique suas permissões).' };
  return { ok:true };
}

async function salvarNovaTarefa(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode incluir tarefas.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p) return;
  const el = id => document.getElementById(id);
  const erro = msg => { const a=el('ntAlert'), m=el('ntAlertMsg'); if(a&&m){ m.textContent=msg; a.style.display='flex'; } };
  if (el('ntAlert')) el('ntAlert').style.display = 'none';

  const tarefa = (el('ntTarefa')?.value || '').trim();
  if (!tarefa) { erro('Descreva a tarefa.'); el('ntTarefa')?.focus(); return; }
  const responsaveis = [...document.querySelectorAll('input[name="ntResp"]:checked')].map(c => c.value);
  if (!responsaveis.length) { erro('Selecione ao menos um responsável.'); return; }

  const macroId = el('ntMacro')?.value || '';
  const macro = macroId ? (p.macroActivities||[]).find(m => m.id === macroId) : null;
  if (macro && !macroServeFase(p, macro, el('ntFase')?.value)) {
    erro(`A macro "${macro.name}" é da "${macro.phase}". A tarefa precisa estar na mesma fase da macro: escolha a fase dela ou outra macro.`);
    return;
  }
  let prazo = el('ntPrazo')?.value || null;
  let prazoOrigem = prazo ? 'manual' : null;
  // Prazo além do fim da macro: avisa e pede confirmação (2º clique em "Confirmar e adicionar")
  const limiteNova = macro ? (macro.endDate || macro.startDate || null) : null;
  if (prazo && limiteNova && prazo > limiteNova) {
    const chaveN = macroId + '|' + prazo;
    if (_avisoNovaTarefa !== chaveN) {
      _avisoNovaTarefa = chaveN;
      const caixaN = el('ntAviso');
      if (caixaN) {
        caixaN.innerHTML = `<strong><i class="ti ti-alert-triangle" style="font-size:13px;vertical-align:-2px"></i> Prazo depois do fim da macro.</strong><br>
          O prazo informado (<strong>${fmt(prazo)}</strong>) é depois do fim da macro "${(macro.name || '').replace(/</g,'&lt;')}" (<strong>${fmt(limiteNova)}</strong>).
          Para manter essa data, clique em <strong>Confirmar e adicionar</strong>. Para ajustar, mude o prazo.`;
        caixaN.style.display = 'block';
      }
      const btN = el('ntBtnSalvar');
      if (btN) btN.innerHTML = '<i class="ti ti-alert-triangle"></i> Confirmar e adicionar';
      return;
    }
  }
  _avisoNovaTarefa = null;
  if (!prazo && macro && macro.endDate) { prazo = macro.endDate; prazoOrigem = 'macro'; }

  if (!Array.isArray(p.tasks)) p.tasks = [];
  const nova = {
    id: uid(), tarefa,
    fase: el('ntFase').value, tema: el('ntTema').value,
    responsavel: responsaveis.join(';'),
    esforco: (el('ntEsforco')?.value || '').trim(),
    status: 'pendente', prazo, prazoOrigem,
    _prazoManual: prazoOrigem === 'manual',
    help: (el('ntHelp')?.value || '').trim(),
    comentario: '', templateTaskId: null,
    macroActivityId: macro ? macro.id : null
  };

  const btn = el('ntBtnSalvar');
  const lbl = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Salvando...'; }

  p.tasks.push(nova);
  const res = await inserirTarefaSupabase(p, nova);
  if (!res.ok) {
    p.tasks = p.tasks.filter(t => t.id !== nova.id);  // desfaz na tela
    if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
    erro('Não foi possível adicionar: ' + res.error);
    return;
  }
  if (macro) {
    vincularTarefaAMacro(p, nova, macro.id);   // a tarefa passa a acompanhar as datas da macro
    const rv = await persistirCronograma(p, [nova]);
    if (!rv.ok) notificar('A tarefa foi criada, mas o vínculo com a macro não foi gravado: ' + rv.error, 'erro');
  }
  saveState();
  if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
  closeModal();
  renderProjetoDetail(p);
  renderSidebar();
  notificar('Tarefa adicionada ao projeto.', 'sucesso');
}


// ==================== MEU DIA ====================
// Como as tarefas herdam o prazo da macro entrega, filtrar por data devolve
// um bloco indistinto. Esta tela ordena por CONTEXTO e separa por TIPO DE AÇÃO.

// Peso do contexto: atraso manda; criticidade do projeto amplifica, não promove.
function _mdScoreTarefa(p, t, ctx) {
  let s = 0;
  const dl = t.prazo ? daysLeft(t.prazo) : null;
  if (dl !== null) {
    if (dl < 0) s += 100 + Math.min(Math.abs(dl), 60) * 2;   // atraso domina
    else if (dl <= 3) s += 60;
    else if (dl <= 7) s += 40;
    else if (dl <= 14) s += 20;
  } else {
    s += 10; // sem prazo: entra, mas discreto
  }
  // amplificadores do projeto (multiplicam a urgência, não criam urgência)
  const st = ctx.status.key;
  if (st === 'critical') s += 30;
  else if (st === 'attention') s += 15;
  if (ctx.blockers > 0) s += 25;
  const dgl = p.goLive ? daysLeft(p.goLive) : null;
  if (dgl !== null && !isGoLiveConfirmado(p)) {
    if (dgl < 0) s += 25;
    else if (dgl <= 15) s += 20;
    else if (dgl <= 30) s += 10;
  }
  // tarefa da fase atual do projeto é assunto de hoje; fase futura, não
  if (ctx.fase && !ctx.fase.notStarted && t.fase === ctx.fase.name) s += 25;
  // desempate por sequência do checklist (a ordem do checklist é a ordem de execução)
  const ordem = (t._ordem ?? p.tasks.indexOf(t));
  s += Math.max(0, 20 - ordem * 0.05);
  return s;
}

// O usuário é consultor ou analista deste projeto?
function _mdSouDoProjeto(p, nome) { return projetoTemPessoa(p, nome); }
// Papéis que o usuário exerce NESTE projeto ('consultor' e/ou 'analista').
// A regra geral do sistema compara com o perfil cadastrado; aqui usamos o papel
// real no projeto, senão uma analista que atua como consultora não veria as
// tarefas marcadas como "Consultor".
function _mdPapeisNoProjeto(p, nome) { return papeisNoProjeto(p, nome); }
// A pessoa corresponde a esta parte do campo responsável?
// Casa por nome próprio, pelo perfil cadastrado ou pelo papel exercido no projeto.
function _mdCasaResponsavel(p, nome, parte) {
  if (!parte) return false;
  if (parte === normalizePersonName(nome)) return true;
  if (parte === (state.currentUser?.tipo || '').toLowerCase()) return true;
  return _mdPapeisNoProjeto(p, nome).includes(parte);
}
// Como a tarefa entra no Meu dia desta pessoa.
// Retorna null quando não é dela.
function _mdClassificarTarefa(p, t, nome) {
  const partes = String(t.responsavel || '').split(';').map(x => x.trim().toLowerCase()).filter(Boolean);
  const temCliente = partes.includes('cliente');
  const outras = partes.filter(x => x !== 'cliente');
  const souResponsavel = outras.some(parte => _mdCasaResponsavel(p, nome, parte));

  if (souResponsavel) {
    // Se a tarefa é minha E também envolve o cliente, é minha para despachar.
    return temCliente ? 'despachar' : 'fazer';
  }
  // Tarefa exclusivamente do cliente: quem toca o projeto é quem cobra.
  if (temCliente && outras.length === 0 && _mdSouDoProjeto(p, nome)) return 'despachar';
  return null;   // responsabilidade de outra pessoa
}

function _mdDiasParado(t) {
  if (!t.bloqueioDesde) return null;
  const d = parseLocalDate(t.bloqueioDesde);
  if (!d) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  return Math.max(0, Math.round((hoje - d) / 86400000));
}

// Monta os quatro blocos do dia para o usuário logado
// Filtros da visão do gestor (projeto / consultor / analista)
function normalizeMeuDiaFiltros() {
  if (!state.mdFiltros || typeof state.mdFiltros !== 'object') state.mdFiltros = {};
  ['modulo','projeto','consultor','analista'].forEach(k => { if (typeof state.mdFiltros[k] !== 'string') state.mdFiltros[k] = ''; });
  return state.mdFiltros;
}
function setMeuDiaFiltro(k, v) {
  const f = normalizeMeuDiaFiltros();
  f[k] = v || '';
  // Ao trocar o módulo, o projeto selecionado pode não pertencer mais à lista.
  if (k === 'modulo' && f.projeto) {
    const aindaVale = _mdProjetosAbertos(f.modulo).some(p => p.id === f.projeto);
    if (!aindaVale) f.projeto = '';
  }
  renderMeuDia();
}
function limparMeuDiaFiltros() { state.mdFiltros = { modulo:'', projeto:'', consultor:'', analista:'' }; renderMeuDia(); }

// Projetos em aberto (não concluídos) que o usuário enxerga, ordenados por Go-live.
// Alimenta o seletor de projeto — que muda conforme o módulo escolhido.
function _mdProjetosAbertos(modulo) {
  let lista = projetosVisiveis().filter(p => {
    const prog = calculateProjectProgress(p);
    return !(prog.totalTasks > 0 && prog.percent === 100);
  });
  if (modulo) lista = lista.filter(p => projectHasModule(p, modulo));
  return lista.sort((a, b) => {
    const da = a.goLive ? parseLocalDate(a.goLive) : null;
    const db = b.goLive ? parseLocalDate(b.goLive) : null;
    if (!da && !db) return (a.nome||'').localeCompare(b.nome||'');
    if (!da) return 1;
    if (!db) return -1;
    if (da.getTime() !== db.getTime()) return da - db;
    return (a.nome||'').localeCompare(b.nome||'');
  });
}

// Quem responde por esta tarefa, resolvendo o papel para a pessoa do projeto.
function _mdPessoaDaTarefa(p, t) {
  const partes = String(t.responsavel || '').split(';').map(x => x.trim()).filter(Boolean);
  const daEquipe = partes.filter(x => x.toLowerCase() !== 'cliente');
  // Tarefa só do cliente: quem o gestor cobra é quem toca o projeto.
  if (!daEquipe.length) {
    const dono = listaPessoas(p.consultor).concat(listaPessoas(p.analista))[0];
    return dono ? `${dono} (cobrar cliente)` : 'Sem responsável definido';
  }
  const nomes = daEquipe.map(parte => {
    const l = parte.toLowerCase();
    if (l === 'consultor') return listaPessoas(p.consultor).join(' · ') || 'Consultor (não definido)';
    if (l === 'analista') return listaPessoas(p.analista).join(' · ') || 'Analista (não definido)';
    return parte;
  });
  return [...new Set(nomes)].join(' · ');
}

function montarMeuDia() {
  const gestor = isGestor();
  const nome = state.currentUser?.name || '';
  const f = normalizeMeuDiaFiltros();
  let projetos = projetosVisiveis().filter(p => {
    const prog = calculateProjectProgress(p);
    if (prog.totalTasks > 0 && prog.percent === 100) {
      // projeto concluído sai, salvo se houve baixa hoje (para poder desfazer)
      return (p.tasks || []).some(tarefaConcluidaHoje);
    }
    return true;
  });
  if (gestor) {
    if (f.modulo)    projetos = projetos.filter(p => projectHasModule(p, f.modulo));
    if (f.projeto)   projetos = projetos.filter(p => p.id === f.projeto);
    if (f.consultor) projetos = projetos.filter(p => pessoaEstaEm(p.consultor, f.consultor));
    if (f.analista)  projetos = projetos.filter(p => pessoaEstaEm(p.analista, f.analista));
  }

  const destravar = [], despachar = [], fazer = [], radar = [];
  projetos.forEach(p => {
    const ctx = {
      status: getProjectExecutiveStatus(p),
      blockers: getActiveGoLiveBlockers(p).length,
      fase: getProjectCurrentPhase(p)
    };
    (p.tasks || []).forEach(t => {
      // concluídas somem, exceto as de hoje (para permitir desfazer)
      if (t.status === 'concluida' && !tarefaConcluidaHoje(t)) return;
      let destino;
      if (gestor) {
        // O gestor acompanha o trabalho da equipe inteira, não o próprio.
        const partes = String(t.responsavel || '').split(';').map(x => x.trim().toLowerCase());
        destino = partes.includes('cliente') ? 'despachar' : 'fazer';
      } else {
        destino = _mdClassificarTarefa(p, t, nome);
      }
      if (!destino) return;
      const item = { p, t, ctx, score: _mdScoreTarefa(p, t, ctx), dl: t.prazo ? daysLeft(t.prazo) : null };
      if (t.status === 'bloqueada') { destravar.push(item); return; }
      if (destino === 'despachar') { despachar.push(item); return; }
      fazer.push(item);
    });
  });

  // concluídas hoje ficam no fim do bloco, sem atrapalhar o foco
  const feitaDepois = (a,b) => (a.t.status==='concluida'?1:0) - (b.t.status==='concluida'?1:0);
  const porScore = (a,b) => feitaDepois(a,b) || (b.score - a.score);
  destravar.sort((a,b) => {
    const f = feitaDepois(a,b); if (f) return f;
    const da = _mdDiasParado(a.t) ?? -1, db = _mdDiasParado(b.t) ?? -1;
    if (da !== db) return db - da;      // parado há mais tempo primeiro
    return porScore(a,b);
  });
  despachar.sort(porScore);
  fazer.sort(porScore);
  // "Fazer agora" = acionável agora (atrasada, sem prazo ou vencendo em até 15 dias).
  // "No radar" = o que vem depois. Corte por horizonte, não por quantidade.
  const HORIZONTE = 15;
  const foco = fazer.filter(i => i.dl === null || i.dl <= HORIZONTE);
  const resto = fazer.filter(i => i.dl !== null && i.dl > HORIZONTE);
  const emAberto = arr => arr.filter(i => i.t.status !== 'concluida').length;
  const missoes = missoesParaMeuDia(projetos);
  return { destravar, despachar, foco, radar: resto, projetosNoRecorte: projetos.length, missoes,
           totalAberto: emAberto(destravar) + emAberto(despachar) + emAberto(fazer),
           feitasHoje: [...destravar, ...despachar, ...fazer].filter(i => i.t.status === 'concluida').length };
}

// Coluna de urgência à direita: um número e um rótulo, sempre na mesma posição.
function _mdUrgencia(item, modo) {
  const { t, dl } = item;
  if (t.status === 'concluida') return { num:'—', lbl:'', cor:'var(--gray-300)' };
  if (modo === 'parada') {
    const dias = _mdDiasParado(t);
    if (dias === null) return { num:'?', lbl:'sem data', cor:'var(--gray-400)' };
    const cor = dias >= 7 ? 'var(--danger)' : dias >= 3 ? 'var(--warn)' : 'var(--gray-500)';
    return { num: dias + 'd', lbl:'parada', cor };
  }
  if (dl === null) return { num:'—', lbl:'sem prazo', cor:'var(--gray-400)' };
  if (dl < 0) return { num: Math.abs(dl) + 'd', lbl:'atrasada', cor:'var(--danger)' };
  if (dl === 0) return { num:'hoje', lbl:'vence', cor:'var(--warn)' };
  if (dl === 1) return { num:'1d', lbl:'vence em', cor:'var(--warn)' };
  return { num: dl + 'd', lbl:'vence em', cor: dl <= 7 ? 'var(--warn)' : 'var(--gray-500)' };
}

function _mdLinha(item, modo) {
  const { p, t, ctx } = item;
  const feita = t.status === 'concluida';
  const u = _mdUrgencia(item, modo);
  // Um único sinal colorido por linha: ponto para projeto crítico ou com impeditivo
  const alerta = (ctx.status.key === 'critical' || ctx.blockers > 0) && !feita;
  let sub;
  if (feita) {
    sub = `<div class="md-sub" style="color:var(--success)">concluída hoje · desmarque para desfazer</div>`;
  } else {
    const origem = modo === 'parada' ? ` · ${t.bloqueioCom || 'origem não informada'}` : '';
    // Na visão do gestor, quem responde pela tarefa é a informação que falta.
    const quem = isGestor() ? ` · <span style="color:var(--gray-600);font-weight:500">${_mdPessoaDaTarefa(p, t)}</span>` : '';
    sub = `<div class="md-sub">${p.nome}${quem}${origem}${alerta ? '<span class="md-dot" title="Projeto crítico ou com impeditivo de Go-live"></span>' : ''}</div>`;
  }
  const obs = (modo === 'parada' && t.bloqueioObs && !feita)
    ? `<div class="md-obs">${t.bloqueioObs}</div>` : '';
  return `<div class="md-r${feita?' md-done':''}" onclick="abrirTarefa('${p.id}','${t.id}')">
    <input type="checkbox" ${feita?'checked':''} onclick="event.stopPropagation();toggleTaskMeuDia('${p.id}','${t.id}',this.checked)">
    <div style="min-width:0"><div class="md-tt">${t.tarefa}</div>${sub}${obs}</div>
    <div class="md-u"><div class="md-un" style="color:${u.cor}">${u.num}</div>${u.lbl?`<div class="md-ul">${u.lbl}</div>`:''}</div>
  </div>`;
}

// Bloco com rolagem interna: a contagem do cabeçalho é sempre o TOTAL,
// para que a rolagem não dê a impressão de esconder trabalho.
function _mdBloco(opts) {
  const { titulo, descricao, rail, tint, itens, modo, vazio, altura } = opts;
  const linhas = itens.map(i => _mdLinha(i, modo)).join('');
  // estimativa de altura por linha para saber se vai rolar (só afeta o rodapé/degradê)
  const alturaEstim = itens.reduce((s,i) => s + (modo==='parada' && i.t.bloqueioObs ? 62 : 48), 0);
  const rola = alturaEstim > altura;
  return `<div class="md-blk" style="--rail:${rail};--tint:${tint}">
    <div class="md-bh"><span class="md-bt">${titulo}</span><span class="md-bs">${descricao}</span><span class="md-bn">${itens.length}</span></div>
    ${itens.length ? `<div class="md-scroll" style="max-height:${altura}px">${linhas}</div>
      ${rola ? `<div class="md-fade"></div><div class="md-foot">${itens.length} no total · role para ver as demais</div>`
             : `<div class="md-foot">${itens.length === 1 ? '1 item' : itens.length + ' itens'} · todos visíveis</div>`}`
      : `<div class="md-vazio">${vazio}</div>`}
  </div>`;
}

function toggleTaskMeuDia(pId, tId, checked) {
  const p = state.projetos.find(x => x.id === pId);
  const t = p?.tasks?.find(x => x.id === tId);
  if (!t) return;
  aplicarStatusTarefa(t, checked ? 'concluida' : 'pendente');
  saveState();
  persistirTarefa(pId, t);
  renderMeuDia();
  renderSidebar();
  document.getElementById('nav-meu-dia')?.classList.add('active');
  notificar(checked ? 'Tarefa concluída. Você pode desfazer aqui mesmo até o fim do dia.' : 'Tarefa reaberta.', 'sucesso');
}

      <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:600;color:var(--gray-600)"><i class="ti ti-filter" style="font-size:14px;vertical-align:-2px"></i> Filtrar</span>
        <select class="filter-select" onchange="setMeuDiaFiltro('modulo',this.value)">
          <option value="">Todos os módulos</option>
          ${PROJECT_MODULE_OPTIONS.map(m => {
            const n = _mdProjetosAbertos(m).length;
            return `<option value="${m}" ${f.modulo===m?'selected':''}>${m} (${n})</option>`;
          }).join('')}
        </select>
        <select class="filter-select" style="max-width:280px" onchange="setMeuDiaFiltro('projeto',this.value)">
          <option value="">${f.modulo ? `Todos de ${f.modulo}` : 'Todos os projetos'} (${abertos.length})</option>
          ${abertos.map(p=>`<option value="${p.id}" ${f.projeto===p.id?'selected':''}>${p.nome} — Go-live ${p.goLive ? fmt(p.goLive) : 'não definido'}</option>`).join('')}
        </select>
        <select class="filter-select" onchange="setMeuDiaFiltro('consultor',this.value)">
          <option value="">Todo consultor</option>
          ${consultores.map(c=>`<option value="${c.replace(/"/g,'&quot;')}" ${f.consultor===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <select class="filter-select" onchange="setMeuDiaFiltro('analista',this.value)">
          <option value="">Todo analista</option>
          ${analistas.map(a=>`<option value="${a.replace(/"/g,'&quot;')}" ${f.analista===a?'selected':''}>${a}</option>`).join('')}
        </select>
        ${ativo ? `<button class="btn btn-ghost btn-sm" onclick="limparMeuDiaFiltros()"><i class="ti ti-x"></i> Limpar</button>` : ''}
        <span style="margin-left:auto;font-size:11.5px;color:var(--gray-400)">${d.projetosNoRecorte} projeto(s) no recorte</span>
      </div>
    </div>`;
  }
  // Missão da semana: itens abertos dos projetos do recorte, agrupados por projeto
  const grupos = d.missoes || [];
  const totalItens = grupos.reduce((s,g) => s + g.itens.length, 0);
  const semMissao = grupos.filter(g => !g.m).length;
  const blocoMissoes = grupos.length ? `<div class="card" style="margin-bottom:14px;padding:0;overflow:hidden">
      <div style="display:flex;align-items:center;gap:9px;padding:11px 14px;background:#f5f9ff;border-bottom:1px solid var(--gray-100);flex-wrap:wrap">
        <i class="ti ti-target" style="color:#2563eb;font-size:16px"></i>
        <span style="font-size:13.5px;font-weight:700;color:var(--gray-800)">Missão da semana</span>
        ${totalItens ? `<span class="badge" style="background:#dbeafe;color:#1e40af;font-size:10px">${totalItens} em aberto</span>` : ''}
        ${semMissao ? `<span class="badge badge-gray" style="font-size:10px">${semMissao} sem missão</span>` : ''}
        <span style="font-size:11px;color:var(--gray-400)">semana de ${fmt(_ultimaSexta())}</span>
      </div>
      <div style="padding:10px 14px">
        ${grupos.map(g => !g.m
          ? `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-left:3px solid var(--gray-300);background:var(--gray-50);border-radius:0 7px 7px 0;margin-bottom:6px">
               <span style="font-size:12.5px;color:var(--accent);font-weight:600">${g.p.nome}</span>
               <span class="badge badge-gray" style="font-size:10px">Sem missão</span>
               ${isGestor() ? `<button class="btn btn-secondary btn-sm" style="margin-left:auto;padding:3px 9px;font-size:11px" onclick="abrirProjetoNaAba('${g.p.id}','followup')"><i class="ti ti-pencil-plus"></i> Escrever</button>` : ''}
             </div>`
          : `<div style="margin-bottom:9px">
               <div style="font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:4px">${g.p.nome}</div>

  const strip = `<div class="md-strip">
    <div class="md-st"><div class="md-stn" style="color:var(--warn)">${naoFeitas(d.destravar)}</div><div class="md-stl">esperando alguém</div></div>
    <div class="md-st"><div class="md-stn" style="color:#2563eb">${naoFeitas(d.despachar)}</div><div class="md-stl">a despachar</div></div>
    <div class="md-st"><div class="md-stn" style="color:var(--gray-800)">${naoFeitas(d.foco) + naoFeitas(d.radar)}</div><div class="md-stl">a executar</div></div>
    <div class="md-st"><div class="md-stn" style="color:var(--success)">${d.feitasHoje}</div><div class="md-stl">${d.feitasHoje === 1 ? 'feita hoje' : 'feitas hoje'}</div></div>
  </div>`;

  const par = `<div class="md-pair">
    ${_mdBloco({ titulo:'Destravar', descricao: gestor ? 'parado esperando alguém — onde a equipe precisa de você' : 'você cobra, não executa',

    ${_mdBloco({ titulo:'Despachar', descricao: gestor ? 'depende do cliente e ainda não saiu' : 'depende do cliente e não saiu',
                 rail:'#2563eb', tint:'#f5f9ff', itens:d.despachar, modo:'prazo', altura:236, vazio:'Nada aguardando envio ao cliente.' })}
  </div>`;

  const fazer = _mdBloco({ titulo: gestor ? 'Em execução' : 'Fazer agora', descricao:'na ordem — atraso primeiro, depois risco',
                           rail:'#16a34a', tint:'#f5fbf7', itens:d.foco, modo:'prazo', altura:290,
                           vazio:'Sem tarefas de execução pendentes.' });

  const radar = d.radar.length ? _mdBloco({ titulo:'No radar', descricao:'vem depois — só para não haver surpresa',
                           rail:'#cbd5e1', tint:'#fafbfc', itens:d.radar, modo:'prazo', altura:150, vazio:'' }) : '';

  const legenda = `<div style="display:flex;gap:5px;align-items:center;font-size:11px;color:var(--gray-400);padding:6px 2px 4px">
      <span class="md-dot" style="margin:0 2px 0 0"></span> projeto crítico ou com impeditivo de Go-live
    </div>
    <div style="font-size:11px;color:var(--gray-400);padding:0 2px 14px">
      A ordem considera atraso, fase atual do projeto, proximidade do Go-live, impeditivos e a sequência do checklist.
      É uma sugestão de foco — sua leitura do contexto continua valendo mais.
    </div>`;

  page.innerHTML = filtros + blocoMissoes + strip + par + fazer + radar + legenda;
}

// ==================== MINHAS TAREFAS (drill-down: Projeto → Fase → Tarefas) ====================
// Estado de expansão persistente entre re-renders
if (!state.mtExpandProj) state.mtExpandProj = {};   // { projetoId: true/false }
if (!state.mtExpandFase) state.mtExpandFase = {};   // { "projetoId::fase": true/false }
if (!state.mtExpandMacro) state.mtExpandMacro = {}; // { "projetoId::fase::deliveryKey": true/false }
if (!state.mtAgrupar) state.mtAgrupar = 'proj-fase-macro'; // agrupamento padrão

function mtToggleProjeto(pId) {
  state.mtExpandProj[pId] = !state.mtExpandProj[pId];
  renderMinhasTarefas();
}
function mtToggleFase(pId, fase) {
  const key = pId + '::' + fase;
  state.mtExpandFase[key] = !state.mtExpandFase[key];
  renderMinhasTarefas();
}
function mtToggleMacro(pId, fase, dk) {
  const key = pId + '::' + fase + '::' + dk;
  state.mtExpandMacro[key] = !state.mtExpandMacro[key];
  renderMinhasTarefas();
}
function mtSetAgrupar(v) {
  state.mtAgrupar = v;
  renderMinhasTarefas();
}
function mtExpandirTodos(expandir) {
  const nome = state.currentUser?.name || '';
  projetosVisiveis().forEach(p => {
    const minhas = (p.tasks||[]).filter(t => taskPertenceAoUsuario(t, nome));
    if (!minhas.length) return;
    state.mtExpandProj[p.id] = expandir;
    [...new Set(minhas.map(t=>t.fase))].forEach(f => {
      state.mtExpandFase[p.id+'::'+f] = expandir;
      // expande também as macro entregas
      const g = groupProjectTasksHierarchy(p, minhas.filter(t=>t.fase===f))[0];
      if (g) {
        g.macroDeliveries.forEach(d => {
          const dk = (d.macroActivity && d.macroActivity.id) || (d.macroActivity && d.macroActivity.macroKey) || d.status.key;
          state.mtExpandMacro[p.id+'::'+f+'::'+dk] = expandir;
        });
        state.mtExpandMacro[p.id+'::'+f+'::__unmapped'] = expandir;
      }
    });
  });
  renderMinhasTarefas();
}

function renderMinhasTarefas() {
  if (isGestor()) { nav('dashboard'); return; }

  const nome = state.currentUser?.name || '';
  const tipo = (state.currentUser?.tipo || '').toLowerCase();
  const tipoLabel = tipo === 'analista' ? 'Analista' : 'Consultor';

  document.getElementById('topbar-actions').innerHTML = `
    <span style="font-size:12px;color:var(--gray-500);background:var(--gray-100);padding:5px 12px;border-radius:20px;display:flex;align-items:center;gap:6px">
      <i class="ti ti-filter" style="font-size:13px"></i>
      Filtrando por perfil: <strong style="color:var(--accent)">${tipoLabel}</strong>
    </span>`;

  // Abas: "Por projeto" (hierarquia) e "Por vencimento" (lista única)
  if (!state.mtView) {
    let saved = null;
    try { saved = localStorage.getItem('implanta_mtView'); } catch(e) {}
    state.mtView = (saved === 'vencimento' || saved === 'hierarquia') ? saved : 'hierarquia';
  }
  const tabsHTML = `
    <div class="tabs" style="margin-bottom:18px">
      <button class="tab ${state.mtView==='hierarquia'?'active':''}" onclick="mtSetView('hierarquia')"><i class="ti ti-subtask"></i> Por projeto</button>
      <button class="tab ${state.mtView==='vencimento'?'active':''}" onclick="mtSetView('vencimento')"><i class="ti ti-calendar-due"></i> Por vencimento</button>
    </div>`;

  if (state.mtView === 'vencimento') {
    renderMyTasksDueView(tabsHTML);
    return;
  }
  // ── VISÃO POR PROJETO (hierárquica) — preservada ──
  renderMinhasTarefasHierarquia(tabsHTML);
}

function mtSetView(v) {
  state.mtView = v;
  try { localStorage.setItem('implanta_mtView', v); } catch(e) {}
  renderMinhasTarefas();
}

function renderMinhasTarefasHierarquia(tabsHTML) {
  const nome = state.currentUser?.name || '';
  const fStatus = state.mtFiltroStatus || '';
  const fFase   = state.mtFiltroFase   || '';

  // Agrupa por projeto → fase, considerando só as tarefas do usuário
  const projetos = projetosVisiveis().map(p => {
    const minhas = (p.tasks || [])
      .filter(t => taskPertenceAoUsuario(t, nome))
      .map(t => ({ ...t, _pId: p.id, _pNome: p.nome, _pCliente: p.cliente }));
    const filtradas = minhas.filter(t =>
      (!fStatus || t.status === fStatus) && (!fFase || t.fase === fFase)
    );
    return { p, minhas, filtradas };
  }).filter(x => x.minhas.length > 0);

  // Auto-expande na primeira visita: se o usuário tem só 1 projeto, abre ele automaticamente.
  // Só faz isso uma vez (flag _mtInit) para não sobrescrever a escolha manual do usuário.
  if (!state._mtInit) {
    state._mtInit = true;
    if (projetos.length === 1) {
      state.mtExpandProj[projetos[0].p.id] = true;
    }
  }

  // Estatísticas globais (sobre todas as tarefas do usuário, sem filtro)
  const todas = projetos.flatMap(x => x.minhas);
  const totalPendentes  = todas.filter(t => t.status !== 'concluida').length;
  const totalConcluidas = todas.filter(t => t.status === 'concluida').length;
  const totalVencidas   = todas.filter(t => t.prazo && daysLeft(t.prazo) < 0 && t.status !== 'concluida').length;
  const fasesGlobais = [...new Set(todas.map(t => t.fase))];

  const porData = (a,b) => (a.prazo||'9999') < (b.prazo||'9999') ? -1 : 1;

  // ── Card de tarefa (linha dentro da fase) ──
  function tarefaCardHTML(t) {
    const dl = daysLeft(t.prazo);
    const vencida = dl !== null && dl < 0 && t.status !== 'concluida';
    const hojeF = dl === 0 && t.status !== 'concluida';
    const tc = TEMA_COLORS[t.tema] || '#64748b';
    return `
      <div style="background:#fff;border:1px solid ${vencida?'var(--danger)':hojeF?'var(--warn)':'var(--gray-200)'};border-left:4px solid ${tc};border-radius:8px;padding:11px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;transition:box-shadow .15s"
           onmouseenter="this.style.boxShadow='0 4px 12px rgba(0,0,0,.08)'" onmouseleave="this.style.boxShadow='none'">
        <input type="checkbox" class="task-check" ${t.status==='concluida'?'checked':''}
          onchange="toggleTaskMT('${t._pId}','${t.id}',this.checked)">
        <div style="cursor:pointer;min-width:0" onclick="abrirTarefa('${t._pId}','${t.id}')">
          <div style="font-size:13px;font-weight:600;color:var(--gray-900);${t.status==='concluida'?'text-decoration:line-through;color:var(--gray-400)':''};margin-bottom:4px;line-height:1.35">
            ${t.tarefa} ${helpIconHTML(t)}
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
            <span class="badge" style="background:${tc}18;color:${tc};font-size:10px">${t.tema}</span>
            ${t.esforco ? `<span style="font-size:11px;color:var(--gray-400)"><i class="ti ti-clock" style="font-size:11px;vertical-align:-1px"></i> ${t.esforco}</span>` : ''}
            ${t.responsavel ? `<span style="font-size:11px;color:var(--gray-400)"><i class="ti ti-user" style="font-size:11px;vertical-align:-1px"></i> ${t.responsavel}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:132px">
          ${statusBadge(t.status)}
          <div style="display:flex;align-items:center;gap:6px">
            ${t.prazo ? `<span style="font-size:11px;color:${vencida?'var(--danger)':hojeF?'var(--warn)':'var(--gray-400)'};font-weight:${vencida||hojeF?'600':'400'}">
              <i class="ti ti-calendar" style="font-size:11px;vertical-align:-1px"></i>
              ${fmt(t.prazo)}${dl!==null&&t.status!=='concluida'?(dl<0?` (${Math.abs(dl)}d atraso)`:dl===0?' (hoje)':dl===1?' (amanhã)':''):''}</span>` :
              `<span style="font-size:11px;color:var(--gray-300)">sem prazo</span>`}
            <select class="filter-select" style="border:1px solid var(--gray-200);border-radius:6px;font-size:11px;padding:3px 6px;background:#fff" onchange="mudarStatusMT('${t._pId}','${t.id}',this.value)">
              ${Object.entries(STATUS_MAP).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v.label}</option>`).join('')}
            </select>
          </div>
        </div>
      </div>`;
  }

  // ── Macro entrega dentro da fase (Minhas Tarefas) ──
  function mtMacroHTML(pId, p, fase, d) {
    const m = d.macroActivity;
    const dk = (m && m.id) || (m && m.macroKey) || (d.mapping && d.mapping.id) || d.status.key;
    const key = pId + '::' + fase + '::' + dk;
    const aberto = !!state.mtExpandMacro[key];
    const nome = (m && m.name) || (d.mapping && d.mapping.macroNameSnapshot) || '(atividade não localizada)';
    const prog = d.progress, st = d.status;
    const periodo = (m && (m.startDate || m.endDate)) ? `${fmt(m.startDate)} a ${fmt(m.endDate)}` : 'sem datas';
    const sorted = sortHierarchyTasks(d.tasks, ordemDasTarefas(p));
    return `<div style="margin-bottom:7px;border:1px solid var(--gray-200);border-radius:8px;overflow:hidden;background:#fff">
      <div onclick="mtToggleMacro('${pId}','${fase.replace(/'/g,"\\'")}','${String(dk).replace(/'/g,"\\'")}')"
           style="display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;user-select:none">
        <i class="ti ti-chevron-${aberto?'down':'right'}" style="font-size:14px;color:var(--gray-400)"></i>

// ==================== MINHAS TAREFAS — VISÃO POR VENCIMENTO ====================
// Consolida todas as microtarefas do usuário atual (todos os projetos vinculados),
// reutilizando taskPertenceAoUsuario e projetosVisiveis. Não cria nova regra de atribuição.
function getCurrentUserTasksWithProjectContext() {
  const nome = state.currentUser?.name || '';
  const out = [];
  projetosVisiveis().forEach(p => {
    (p.tasks || []).forEach(t => {
      if (!taskPertenceAoUsuario(t, nome)) return;
      let macroName = null;
      try {
        const d = resolveTaskMacroDelivery(p, t);
        macroName = d && d.hasDelivery ? d.macroName : null;
      } catch(e) { macroName = null; }
      out.push({
        task: t, taskId: t.id, project: p, projectId: p.id,
        projectName: p.nome, projectClient: p.cliente || '',
        taskName: t.tarefa || '', dueDate: t.prazo || t.plannedEndDate || null,
        status: t.status || 'pendente', phase: t.fase || null,
        tema: t.tema || null, responsavel: t.responsavel || null,
        macroDeliveryName: macroName
      });
    });
  });
  return out;
}

// Categoria de vencimento de uma tarefa (usa daysLeft, sem cálculo UTC deslocante)
function getTaskDueCategory(task) {
  if (task.status === 'concluida') return 'completed';
  if (!task.prazo) return 'no-date';
  const dl = daysLeft(task.prazo);
  if (dl == null) return 'no-date';
  if (dl < 0) return 'overdue';
  if (dl === 0) return 'today';
  if (dl === 1) return 'tomorrow';
  return 'upcoming';
}

// Texto discreto da situação de vencimento (não depende só de cor)
function dueCategoryText(item) {
  const cat = getTaskDueCategory(item.task);
  if (cat === 'completed') return { label: 'Concluída', badge: 'badge-green', icon: 'ti-check' };
  if (cat === 'no-date')   return { label: 'Sem vencimento', badge: 'badge-gray', icon: 'ti-calendar-off' };
  const dl = daysLeft(item.dueDate);
  if (cat === 'overdue')  return { label: `${Math.abs(dl)} dia${Math.abs(dl)>1?'s':''} em atraso`, badge: 'badge-red', icon: 'ti-alert-triangle' };
  if (cat === 'today')    return { label: 'Vence hoje', badge: 'badge-warn', icon: 'ti-clock' };
  if (cat === 'tomorrow') return { label: 'Vence amanhã', badge: 'badge-blue', icon: 'ti-calendar' };
  return { label: `Em ${dl} dias`, badge: 'badge-gray', icon: 'ti-calendar' };
}

// Ordenação por prioridade de vencimento (função centralizada)
function sortTasksByDueDatePriority(items) {
  const rank = { overdue:0, today:1, tomorrow:2, upcoming:3, 'no-date':4, completed:5 };
  const statusRank = { bloqueada:0, em_andamento:1, pendente:2, concluida:3 };
  return [...items].sort((a,b) => {
    const ca = getTaskDueCategory(a.task), cb = getTaskDueCategory(b.task);
    if (rank[ca] !== rank[cb]) return rank[ca] - rank[cb];
    // dentro de upcoming, ordena por data crescente
    if (ca === 'upcoming' || ca === 'overdue') {
      const ad = a.dueDate || '9999-12-31', bd = b.dueDate || '9999-12-31';
      if (ad !== bd) return ad < bd ? -1 : 1;
    }
    const sa = statusRank[a.status] ?? 9, sb = statusRank[b.status] ?? 9;
    if (sa !== sb) return sa - sb;
    if (a.projectName !== b.projectName) return a.projectName.localeCompare(b.projectName);
    return a.taskName.localeCompare(b.taskName);
  });
}

// Ordenações manuais alternativas
function sortDueItems(items, modo) {
  const semDataFim = (a,b,dir) => {
    const an = !a.dueDate, bn = !b.dueDate;
    const ac = a.status==='concluida', bc = b.status==='concluida';
    if (ac !== bc) return ac ? 1 : -1;           // concluídas ao final
    if (an !== bn) return an ? 1 : -1;           // sem data antes das concluídas, depois das com data
    if (!an && !bn && a.dueDate !== b.dueDate) return dir==='asc' ? (a.dueDate<b.dueDate?-1:1) : (a.dueDate<b.dueDate?1:-1);
    return 0;
  };
  const statusRank = { bloqueada:0, em_andamento:1, pendente:2, concluida:3 };
  switch (modo) {
    case 'date-asc': return [...items].sort((a,b)=> semDataFim(a,b,'asc') || a.projectName.localeCompare(b.projectName) || a.taskName.localeCompare(b.taskName));
    case 'date-desc': return [...items].sort((a,b)=> semDataFim(a,b,'desc') || a.projectName.localeCompare(b.projectName) || a.taskName.localeCompare(b.taskName));
    case 'project': return [...items].sort((a,b)=> a.projectName.localeCompare(b.projectName) || ((a.dueDate||'9999')<(b.dueDate||'9999')?-1:1) || a.taskName.localeCompare(b.taskName));
    case 'status': return [...items].sort((a,b)=> ((statusRank[a.status]??9)-(statusRank[b.status]??9)) || ((a.dueDate||'9999')<(b.dueDate||'9999')?-1:1) || a.projectName.localeCompare(b.projectName));
    case 'task': return [...items].sort((a,b)=> a.taskName.localeCompare(b.taskName) || a.projectName.localeCompare(b.projectName));
    default: return sortTasksByDueDatePriority(items);
  }
}

// Normaliza texto (ignora acento e caixa) para busca
function _normTxt(s) {
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

// Aplica filtros da aba por vencimento
function filterTasksByDueView(items) {
  const fProj = state.mtDueProject || '';
  const fStatus = state.mtDueStatus || '';
  const fPhase = state.mtDuePhase || '';
  const fPeriod = state.mtDuePeriod || 'todas';
  const busca = _normTxt(state.mtDueSearch || '');
  const hideCompleted = state.mtDueHideCompleted !== false; // padrão true

  return items.filter(it => {
    if (hideCompleted && it.status === 'concluida' && fPeriod !== 'concluidas') return false;
    if (fProj && it.projectId !== fProj) return false;
    if (fStatus && it.status !== fStatus) return false;
    if (fPhase && it.phase !== fPhase) return false;
    if (fPeriod && fPeriod !== 'todas') {
      const cat = getTaskDueCategory(it.task);
      const dl = it.dueDate ? daysLeft(it.dueDate) : null;
      if (fPeriod === 'vencidas' && cat !== 'overdue') return false;
      else if (fPeriod === 'hoje' && cat !== 'today') return false;
      else if (fPeriod === 'amanha' && cat !== 'tomorrow') return false;
      else if (fPeriod === 'prox7' && !(it.status!=='concluida' && dl!=null && dl>=0 && dl<=7)) return false;
      else if (fPeriod === 'prox15' && !(it.status!=='concluida' && dl!=null && dl>=0 && dl<=15)) return false;
      else if (fPeriod === 'prox30' && !(it.status!=='concluida' && dl!=null && dl>=0 && dl<=30)) return false;
      else if (fPeriod === 'sem-data' && cat !== 'no-date') return false;
      else if (fPeriod === 'concluidas' && it.status !== 'concluida') return false;
    }
    if (busca) {
      const alvo = _normTxt([it.taskName, it.projectName, it.phase, it.macroDeliveryName, it.tema].filter(Boolean).join(' '));
      if (!alvo.includes(busca)) return false;
    }
    return true;
  });
}

// Indicadores do topo (só tarefas não concluídas)
function calculateMyTasksDueIndicators(items) {
  const abertas = items.filter(i => i.status !== 'concluida');
  const vencidas = abertas.filter(i => getTaskDueCategory(i.task) === 'overdue').length;
  const hoje = abertas.filter(i => getTaskDueCategory(i.task) === 'today').length;
  const prox7 = abertas.filter(i => { const dl = i.dueDate?daysLeft(i.dueDate):null; return dl!=null && dl>=0 && dl<=7; }).length;
  const semData = abertas.filter(i => !i.dueDate).length;
  return { vencidas, hoje, prox7, semData };
}

function renderMyTasksDueFilters(todas) {
  const projetos = [...new Map(todas.map(i => [i.projectId, i.projectName])).entries()];
  const fases = [...new Set(todas.map(i => i.phase).filter(Boolean))];
  const fProj = state.mtDueProject || '', fStatus = state.mtDueStatus || '', fPhase = state.mtDuePhase || '';
  const fPeriod = state.mtDuePeriod || 'todas', fSort = state.mtDueSort || 'priority';
  const busca = state.mtDueSearch || '';
  const hide = state.mtDueHideCompleted !== false;
  const temFiltro = fProj||fStatus||fPhase||(fPeriod&&fPeriod!=='todas')||busca||fSort!=='priority';

  return `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <div style="position:relative;flex:1;min-width:200px">
        <i class="ti ti-search" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:14px"></i>
        <input class="form-input" style="padding-left:32px" placeholder="Buscar tarefa, projeto, fase, macro entrega..." value="${busca.replace(/"/g,'&quot;')}"
          oninput="state.mtDueSearch=this.value;clearTimeout(window._mtDueDeb);window._mtDueDeb=setTimeout(()=>renderMinhasTarefas(),200)">
      </div>
      <select class="filter-select" onchange="state.mtDueProject=this.value;renderMinhasTarefas()">
        <option value="">Todos os projetos</option>
        ${projetos.map(([id,nm])=>`<option value="${id}" ${fProj===id?'selected':''}>${nm}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="state.mtDueStatus=this.value;renderMinhasTarefas()">
        <option value="">Todos os status</option>
        ${Object.entries(STATUS_MAP).map(([k,v])=>`<option value="${k}" ${fStatus===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="state.mtDuePhase=this.value;renderMinhasTarefas()">
        <option value="">Todas as fases</option>
        ${fases.map(f=>`<option value="${f}" ${fPhase===f?'selected':''}>${f}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="state.mtDuePeriod=this.value;renderMinhasTarefas()">
        ${[['todas','Todas'],['vencidas','Vencidas'],['hoje','Hoje'],['amanha','Amanhã'],['prox7','Próximos 7 dias'],['prox15','Próximos 15 dias'],['prox30','Próximos 30 dias'],['sem-data','Sem vencimento'],['concluidas','Concluídas']].map(([k,l])=>`<option value="${k}" ${fPeriod===k?'selected':''}>${l}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="state.mtDueSort=this.value;renderMinhasTarefas()">
        ${[['priority','Prioridade de vencimento'],['date-asc','Data crescente'],['date-desc','Data decrescente'],['project','Projeto'],['status','Status'],['task','Nome da tarefa']].map(([k,l])=>`<option value="${k}" ${fSort===k?'selected':''}>Ordenar: ${l}</option>`).join('')}
      </select>
      <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--gray-600);cursor:pointer;white-space:nowrap">
        <input type="checkbox" ${hide?'checked':''} onchange="state.mtDueHideCompleted=this.checked;renderMinhasTarefas()"> Ocultar concluídas
      </label>
      ${temFiltro ? `<button class="btn btn-ghost btn-sm" onclick="mtDueLimparFiltros()"><i class="ti ti-x"></i> Limpar filtros</button>` : ''}
    </div>`;
}

function renderMyTasksDueTable(items) {
  if (items.length === 0) {
    return `<div class="card"><div class="empty"><i class="ti ti-search-off"></i><p>Nenhuma tarefa encontrada para os filtros selecionados.</p><small>Ajuste os filtros ou limpe-os para ver todas as suas tarefas.</small></div></div>`;
  }
  const linhas = items.map(it => {
    const t = it.task;
    const dc = dueCategoryText(it);
    const projIt = state.projetos.find(x => x.id === it.projectId);
    const macroCtx = it.macroDeliveryName || (projetoTemMacro(projIt) ? 'Sem macro entrega' : '');
    const ctx = `${it.phase ? it.phase.split(' - ')[0] : 'Sem fase'}${macroCtx ? ' · ' + macroCtx : ''}`;
    const cat = getTaskDueCategory(t);
    const dataBg = cat==='overdue' ? 'background:#fef2f2' : '';
    return `<tr style="${dataBg}">
      <td style="cursor:pointer;max-width:360px" onclick="openTaskFromDueView('${it.projectId}','${it.taskId}')">
        <div style="font-size:13px;font-weight:600;color:var(--gray-900);${t.status==='concluida'?'text-decoration:line-through;color:var(--gray-400)':''}">${it.taskName} ${helpIconHTML(t)}</div>
        <div style="font-size:11px;color:var(--gray-400);margin-top:2px"><i class="ti ti-package" style="font-size:11px;vertical-align:-1px"></i> ${ctx}</div>
      </td>
      <td style="cursor:pointer" onclick="openProjectFromDueView('${it.projectId}')">
        <div style="font-size:12px;font-weight:600;color:var(--accent)">${it.projectName}</div>
        ${it.projectClient ? `<div style="font-size:11px;color:var(--gray-400)">${it.projectClient}</div>` : ''}
      </td>
      <td style="white-space:nowrap">
        <div style="font-size:12.5px;font-weight:600;color:var(--gray-700)">${it.dueDate ? fmt(it.dueDate) : '—'}</div>
        <div style="font-size:11px;margin-top:2px"><span class="badge ${dc.badge}" style="font-size:9px"><i class="ti ${dc.icon}"></i>${dc.label}</span></div>
      </td>
      <td>
        <select class="filter-select" style="font-size:11px;padding:4px 6px" onchange="updateTaskStatusFromDueView('${it.projectId}','${it.taskId}',this.value)">
          ${Object.entries(STATUS_MAP).map(([k,v])=>`<option value="${k}" ${it.status===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </td>
    </tr>`;
  }).join('');

  return `<div class="card" style="padding:0;overflow:hidden">
    <div class="table-wrap" style="overflow-x:auto">
      <table style="width:100%;min-width:640px">
        <thead><tr>
          <th>Tarefa</th><th>Projeto</th><th>Data de vencimento</th><th style="width:150px">Status</th>
        </tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>
  </div>`;
}

// Ações da aba por vencimento (reutilizam a lógica de status existente)
function updateTaskStatusFromDueView(pId, tId, status) {
  const p = state.projetos.find(x => x.id === pId);
  const t = p?.tasks?.find(x => x.id === tId);
  if (!t) return;
  aplicarStatusTarefa(t, status);
  saveState();
  persistirTarefa(pId, t);
  renderMinhasTarefas();          // preserva state.mtView === 'vencimento' e os filtros
  renderSidebar();
  document.getElementById('nav-minhas-tarefas')?.classList.add('active');
}
function openTaskFromDueView(pId, tId) {
  abrirTarefa(pId, tId); // reutiliza o modal existente; após salvar volta para Minhas Tarefas
}
function openProjectFromDueView(pId) {
  abrirProjeto(pId);
}
function mtDueSetPeriod(period) {
  state.mtView = 'vencimento';
  state.mtDuePeriod = period;
  if (period === 'concluidas') state.mtDueHideCompleted = false;
  renderMinhasTarefas();
}
function mtDueLimparFiltros() {
  state.mtDueProject = ''; state.mtDueStatus = ''; state.mtDuePhase = '';
  state.mtDuePeriod = 'todas'; state.mtDueSearch = ''; state.mtDueSort = 'priority';
  state.mtDueHideCompleted = true;
  renderMinhasTarefas();
}

// ==================== DE-PARA PADRÃO (no template do checklist) ====================
// O template guarda vínculos macroKey → tarefas do checklist (estáveis entre projetos).
// Estrutura de cada entrada: { macroKey, macroNameLabel, checklistTaskIds:[] }
let _deParaTplDraft = null; // { tplId, entradas:[...], selKey, selTaskIds:Set, dirty }

function modalDeParaTemplate(tplId) {
  const tpl = state.checklistTemplates.find(t=>t.id===tplId);
  if (!tpl) return;
  const entradas = JSON.parse(JSON.stringify(Array.isArray(tpl.deParaTemplate)?tpl.deParaTemplate:[]));
  _deParaTplDraft = { tplId, entradas, selKey: null, selTaskIds: new Set(), dirty: false };
  renderModalDeParaTemplate();
}

function renderModalDeParaTemplate() {
  if (!_deParaTplDraft) return;
  const tpl = state.checklistTemplates.find(t=>t.id===_deParaTplDraft.tplId);
  if (!tpl) return;
  const { entradas, selKey, selTaskIds } = _deParaTplDraft;
  const filtro = _deParaTplDraft.filtro || 'todas';

  // Mapa: taskId → entrada (a qual macroKey cada tarefa está vinculada)
  const taskToEntrada = {};
  entradas.forEach(e => (e.checklistTaskIds||[]).forEach(tid => { taskToEntrada[tid] = e; }));

  const entradaSel = entradas.find(e => e.macroKey === selKey);
  const tarefasDaKeySel = entradaSel ? new Set(entradaSel.checklistTaskIds||[]) : new Set();

  // ── ESQUERDA: macroKeys cadastradas ──
  const keyCards = entradas.map((e,i) => {
    const sel = selKey === e.macroKey;
    const n = (e.checklistTaskIds||[]).length;
    return `<div onclick="deParaTplSelKey('${e.macroKey.replace(/'/g,"\\'")}')" style="border:1px solid ${sel?'var(--accent)':'var(--gray-200)'};background:${sel?'var(--accent-light)':'#fff'};border-radius:8px;padding:10px 12px;cursor:pointer;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px">
        <div style="font-size:12px;font-weight:700;color:var(--gray-800);font-family:monospace">${e.macroKey}</div>
        <div style="display:flex;gap:4px;align-items:center">
          <span class="badge ${n>0?'badge-green':'badge-gray'}" style="font-size:9px">${n} tarefa${n!==1?'s':''}</span>
          <button class="btn btn-ghost btn-sm" style="color:var(--danger);padding:2px 5px" onclick="event.stopPropagation();deParaTplRemoverKey(${i})"><i class="ti ti-trash" style="font-size:12px"></i></button>
        </div>
      </div>
      ${e.macroNameLabel?`<div style="font-size:11px;color:var(--gray-500)">${e.macroNameLabel}</div>`:''}
      ${sel && n>0?`<div style="margin-top:6px;font-size:10px;color:var(--success);display:flex;align-items:center;gap:4px"><i class="ti ti-arrow-right" style="font-size:11px"></i> ${n} tarefa(s) desta macro destacada(s) à direita</div>`:''}
    </div>`;
  }).join('') || `<div style="padding:16px;text-align:center;color:var(--gray-400);font-size:12px">Nenhuma macroKey cadastrada ainda.</div>`;

  // ── DIREITA: tarefas do checklist (com filtro) ──
  let microList = tpl.tasks;
  if (filtro === 'vinculadas') microList = microList.filter(t => taskToEntrada[t.id]);
  else if (filtro === 'sem-vinculo') microList = microList.filter(t => !taskToEntrada[t.id]);
  if (entradaSel) microList = [...microList].sort((a,b)=>(tarefasDaKeySel.has(b.id)?1:0)-(tarefasDaKeySel.has(a.id)?1:0));

  const microRows = microList.map(t => {
    const eDe = taskToEntrada[t.id];
    const checked = selTaskIds.has(t.id);
    const daKeySel = tarefasDaKeySel.has(t.id);
    const tc = TEMA_COLORS[t.tema] || '#64748b';
    const bg = daKeySel ? 'background:#f0fdf4;border-left:3px solid var(--success)' : checked ? 'background:var(--accent-light);border-left:3px solid var(--accent)' : 'border-left:3px solid transparent';
    return `<tr style="${bg}">
      <td style="text-align:center"><input type="checkbox" class="task-check" ${checked?'checked':''} onchange="deParaTplToggleTask('${t.id}',this.checked)"></td>
      <td style="font-size:12px;font-weight:500">${daKeySel?`<i class="ti ti-link" style="font-size:12px;color:var(--success);vertical-align:-1px;margin-right:3px"></i>`:''}${t.tarefa}</td>
      <td style="font-size:11px;color:var(--gray-500);white-space:nowrap">${t.fase||'—'}</td>
      <td><span class="badge" style="background:${tc}18;color:${tc};font-size:10px">${t.tema||'—'}</span></td>
      <td style="font-size:11px;font-family:monospace">${eDe ? `<span style="color:var(--success)">${eDe.macroKey}</span>` : `<span style="color:var(--gray-300)">—</span>`}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" style="padding:24px;text-align:center;color:var(--gray-400);font-size:13px">Nenhuma tarefa para este filtro.</td></tr>`;

  const totalTasks = tpl.tasks.length;
  const semVinc = tpl.tasks.filter(t=>!taskToEntrada[t.id]).length;
  const comVinc = totalTasks - semVinc;
  const btnFiltro = (val,label,n)=>`<button class="btn btn-sm ${filtro===val?'btn-primary':'btn-secondary'}" style="font-size:11px;padding:4px 10px" onclick="deParaTplSetFiltro('${val}')">${label} (${n})</button>`;

  openModal(`<div class="modal-header">
    <div class="modal-title"><i class="ti ti-arrows-exchange" style="margin-right:8px;color:var(--accent)"></i>DE-PARA padrão — ${tpl.nome}${_deParaTplDraft.dirty?' <span style="font-size:11px;color:var(--warn);font-weight:500">(não salvo)</span>':''}</div>
    <button class="btn btn-ghost" onclick="fecharDeParaTpl()"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body" style="padding:16px">
    <div class="alert alert-info" style="margin-bottom:14px"><i class="ti ti-info-circle"></i> Vínculos padrão entre <strong>tipos de atividade macro</strong> (macroKey) e as tarefas do checklist. Ao importar um cronograma num projeto, esses vínculos são aplicados automaticamente pela macroKey.</div>

    <div style="display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
      <input class="form-input" id="novaMacroKey" placeholder="Nome ou macroKey (ex: Parametrização Geral Folha)" style="flex:1;min-width:220px">
      <button class="btn btn-secondary btn-sm" onclick="deParaTplAddKey()"><i class="ti ti-plus"></i> Adicionar macroKey</button>
      <div style="flex:1"></div>
      <span style="font-size:12px;color:var(--gray-500)"><strong style="color:var(--success)">${comVinc}</strong> vinculadas · <strong>${semVinc}</strong> sem vínculo</span>
    </div>

    <div style="display:grid;grid-template-columns:minmax(300px,1fr) 2fr;gap:16px;align-items:start">
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px">Tipos de atividade macro (${entradas.length})</div>
        <div style="max-height:50vh;overflow-y:auto;padding-right:4px">${keyCards}</div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px">
          <div style="font-size:12px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.4px">Tarefas do checklist</div>
          <div style="display:flex;gap:6px">${btnFiltro('todas','Todas',totalTasks)}${btnFiltro('vinculadas','Vinculadas',comVinc)}${btnFiltro('sem-vinculo','Sem vínculo',semVinc)}</div>
        </div>
        ${entradaSel?`<div style="font-size:11px;color:var(--success);margin-bottom:6px;display:flex;align-items:center;gap:4px"><i class="ti ti-info-circle" style="font-size:12px"></i> Linhas em verde já vinculadas a <strong style="font-family:monospace">${selKey}</strong></div>`:''}
        <div style="max-height:46vh;overflow-y:auto;border:1px solid var(--gray-200);border-radius:8px">
          <table style="width:100%;table-layout:auto">
            <thead style="position:sticky;top:0;z-index:1;background:var(--gray-50)"><tr>
              <th style="width:36px;text-align:center"><i class="ti ti-check"></i></th>
              <th>Tarefa</th><th>Fase</th><th>Tema</th><th>macroKey</th>
            </tr></thead>
            <tbody>${microRows}</tbody>
          </table>
        </div>
      </div>
    </div>

    <div style="margin-top:14px;padding:12px 14px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div style="font-size:12px;color:var(--gray-600)">
        ${selKey ? `macroKey selecionada: <strong style="font-family:monospace">${selKey}</strong>` : 'Selecione uma macroKey à esquerda'} · <strong>${selTaskIds.size}</strong> tarefa(s) marcada(s)
      </div>
      <div style="flex:1"></div>
      <button class="btn btn-primary btn-sm" ${(!selKey||selTaskIds.size===0)?'disabled style="opacity:.5"':''} onclick="deParaTplVincular()"><i class="ti ti-link"></i> Vincular</button>
      <button class="btn btn-secondary btn-sm" ${selTaskIds.size===0?'disabled style="opacity:.5"':''} onclick="deParaTplRemoverVinculo()"><i class="ti ti-unlink"></i> Remover vínculo</button>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="fecharDeParaTpl()">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarDeParaTpl()"><i class="ti ti-device-floppy"></i> Salvar DE-PARA padrão</button>
  </div>`, 'xl');
}

function deParaTplSetFiltro(val) {
  if (!_deParaTplDraft) return;
  _deParaTplDraft.filtro = val;
  renderModalDeParaTemplate();
}

function deParaTplAddKey() {
  if (!_deParaTplDraft) return;
  const inp = document.getElementById('novaMacroKey');
  const raw = (inp?.value||'').trim();
  if (!raw) return;
  const key = macroKeyUnicaTpl(gerarMacroKey(raw), _deParaTplDraft.entradas);
  _deParaTplDraft.entradas.push({ macroKey: key, macroNameLabel: raw !== key ? raw : '', checklistTaskIds: [] });
  _deParaTplDraft.selKey = key;
  _deParaTplDraft.dirty = true;
  renderModalDeParaTemplate();
}
function macroKeyUnicaTpl(base, entradas) {
  let key = base || 'ATIVIDADE';
  const existe = (k)=>entradas.some(e=>e.macroKey===k);
  if (!existe(key)) return key;
  let i=2; while(existe(key+'_'+i)) i++;
  return key+'_'+i;
}
function deParaTplSelKey(key) {
  if (!_deParaTplDraft) return;
  _deParaTplDraft.selKey = _deParaTplDraft.selKey === key ? null : key;
  renderModalDeParaTemplate();
}
function deParaTplToggleTask(tid, checked) {
  if (!_deParaTplDraft) return;
  if (checked) _deParaTplDraft.selTaskIds.add(tid); else _deParaTplDraft.selTaskIds.delete(tid);
  renderModalDeParaTemplate();
}
function deParaTplRemoverKey(i) {
  if (!_deParaTplDraft) return;
  if (!confirm('Remover esta macroKey e seus vínculos padrão?')) return;
  const removida = _deParaTplDraft.entradas[i];
  _deParaTplDraft.entradas.splice(i,1);
  if (_deParaTplDraft.selKey === removida.macroKey) _deParaTplDraft.selKey = null;
  _deParaTplDraft.dirty = true;
  renderModalDeParaTemplate();
}
function deParaTplVincular() {
  if (!_deParaTplDraft || !_deParaTplDraft.selKey || _deParaTplDraft.selTaskIds.size===0) return;
  const alvo = _deParaTplDraft.entradas.find(e=>e.macroKey===_deParaTplDraft.selKey);
  if (!alvo) return;
  _deParaTplDraft.selTaskIds.forEach(tid=>{
    // impede vínculo duplo: remove de outras entradas
    _deParaTplDraft.entradas.forEach(e=>{ if(e.macroKey!==alvo.macroKey) e.checklistTaskIds=(e.checklistTaskIds||[]).filter(x=>x!==tid); });
    if (!alvo.checklistTaskIds) alvo.checklistTaskIds=[];
    if (!alvo.checklistTaskIds.includes(tid)) alvo.checklistTaskIds.push(tid);
  });
  _deParaTplDraft.selTaskIds.clear();
  _deParaTplDraft.dirty = true;
  renderModalDeParaTemplate();
}
function deParaTplRemoverVinculo() {
  if (!_deParaTplDraft || _deParaTplDraft.selTaskIds.size===0) return;
  _deParaTplDraft.selTaskIds.forEach(tid=>{
    _deParaTplDraft.entradas.forEach(e=>{ e.checklistTaskIds=(e.checklistTaskIds||[]).filter(x=>x!==tid); });
  });
  _deParaTplDraft.selTaskIds.clear();
  _deParaTplDraft.dirty = true;
  renderModalDeParaTemplate();
}
function salvarDeParaTpl() {
  if (!_deParaTplDraft) return;
  const tpl = state.checklistTemplates.find(t=>t.id===_deParaTplDraft.tplId);
  if (!tpl) return;
  // Mantém só entradas com macroKey; limpa vínculos vazios? Não — permite macroKey sem tarefa ainda.
  const novasEntradas = _deParaTplDraft.entradas.filter(e=>e.macroKey).map(e=>({
    macroKey: e.macroKey,
    macroNameLabel: e.macroNameLabel || '',
    checklistTaskIds: Array.isArray(e.checklistTaskIds)?[...e.checklistTaskIds]:[]
  }));
  // Cadeia micro → macro → fase: não salva se alguma macro ficar com tarefas em mais de uma fase (ou nome repetido)
  const problemasDePara = inconsistenciasDoTemplate({ tasks: tpl.tasks, deParaTemplate: novasEntradas });
  if (problemasDePara.length) {
    notificar('Não foi salvo. Uma macro pertence a uma única fase: ' + descreverInconsistencias(problemasDePara) + '.', 'erro');
    return;
  }
  tpl.deParaTemplate = novasEntradas;
  saveState();
  _deParaTplDraft = null;
  closeModal();
  renderChecklists();
  setTimeout(()=>alert('DE-PARA padrão salvo no template.'), 100);
}
function fecharDeParaTpl() {
  if (_deParaTplDraft && _deParaTplDraft.dirty) {
    if (!confirm('Há alterações não salvas. Descartar?')) return;
  }
  _deParaTplDraft = null;
  closeModal();
}

// ==================== CHECKLISTS ====================
function renderChecklists() {
  if (!isGestor()) { nav('dashboard'); return; }
  // Mergulha num template específico quando há um aberto
  if (state.checklistAberto) {
    const tpl = (state.checklistTemplates||[]).find(t => t.id === state.checklistAberto);
    if (tpl) { renderChecklistDetalhe(tpl); return; }
    state.checklistAberto = null;
  }
  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn btn-primary" onclick="modalNovoChecklist()"><i class="ti ti-plus"></i> Novo template</button>`;

  const tpls = state.checklistTemplates || [];
  document.getElementById('page-content').innerHTML = `
    <div class="alert alert-info"><i class="ti ti-info-circle"></i> Templates de checklist são aplicados automaticamente quando um novo projeto é criado.</div>
    ${tpls.length === 0 ? `<div class="card"><div class="empty"><i class="ti ti-checklist"></i><p>Nenhum template cadastrado</p></div></div>` :
      `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px">
      ${tpls.map(tpl => {
        const nFases = new Set(tpl.tasks.map(t => t.fase)).size;
        const nMacros = (tpl.deParaTemplate||[]).length;
        return `<div class="card" style="cursor:pointer;display:flex;flex-direction:column;gap:10px" onclick="abrirChecklist('${tpl.id}')">
          <div style="display:flex;align-items:flex-start;gap:10px">

            </div>

          </div>

          </div>
        </div>`;
      }).join('')}
      </div>`}`;
}

function abrirChecklist(tplId) { state.checklistAberto = tplId; state.clExpFase = {}; state.clExpMacro = {}; renderChecklists(); }
function voltarChecklists() { state.checklistAberto = null; renderChecklists(); }
function toggleClFase(f) { state.clExpFase = state.clExpFase || {}; state.clExpFase[f] = !state.clExpFase[f]; renderChecklists(); }
function toggleClMacro(k) { state.clExpMacro = state.clExpMacro || {}; state.clExpMacro[k] = !state.clExpMacro[k]; renderChecklists(); }
function expandirTudoChecklist(tplId, abrir) {
  const tpl = (state.checklistTemplates||[]).find(t => t.id === tplId);
  if (!tpl) return;
  state.clExpFase = {}; state.clExpMacro = {};
  if (abrir) {
    new Set(tpl.tasks.map(t => t.fase)).forEach(f => { state.clExpFase[f] = true; });
    (tpl.deParaTemplate||[]).forEach(d => { state.clExpMacro[d.macroKey] = true; });
    state.clExpMacro['__sem__'] = true;
  }
  renderChecklists();
}

// Detalhe: Fase → Macro atividade → Tarefa, cada nível expansível

function renderChecklistDetalhe(tpl) {
  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn btn-secondary btn-sm" onclick="voltarChecklists()"><i class="ti ti-arrow-left"></i> Templates</button>
    <button class="btn btn-secondary btn-sm" onclick="modalDeParaTemplate('${tpl.id}')"><i class="ti ti-arrows-exchange"></i> DE-PARA padrão</button>
    <button class="btn btn-secondary btn-sm" onclick="modalEditarChecklist('${tpl.id}')"><i class="ti ti-edit"></i> Editar template</button>
    <button class="btn btn-primary btn-sm" onclick="modalAdicionarTarefaChecklist('${tpl.id}')"><i class="ti ti-plus"></i> Nova tarefa</button>`;

  const expF = state.clExpFase || {}, expM = state.clExpMacro || {};
  const macroDaTarefa = {};
  (tpl.deParaTemplate||[]).forEach(d => (d.checklistTaskIds||[]).forEach(c => { macroDaTarefa[c] = d; }));
  const fases = _ordenarFases([...new Set(tpl.tasks.map(t => t.fase).filter(Boolean))]);

  // Template sem macro atividades (ex.: Customização): tarefas direto na fase
  const semMacroTpl = !(tpl.deParaTemplate || []).length;
  const blocos = fases.map(fase => {
    const daFase = tpl.tasks.filter(t => t.fase === fase);
    const fc = FASE_COLORS[fase] || {bg:'var(--gray-100)',color:'var(--gray-600)'};
    // agrupa por macro, preservando a ordem do checklist
    const grupos = []; const idx = {};
    daFase.forEach(t => {
      const d = macroDaTarefa[t.id];
      const chave = d ? d.macroKey : '__sem__';
      if (idx[chave] === undefined) { idx[chave] = grupos.length; grupos.push({ chave, nome: d ? d.macroNameLabel : 'Sem vínculo com macro atividade', tarefas: [] }); }
      grupos[idx[chave]].tarefas.push(t);
    });
    const aberta = expF[fase] === true;
    const corpo = !aberta ? '' : semMacroTpl
      ? `<div style="border-top:1px solid var(--gray-100);padding:6px 14px 10px">${_tabelaTarefasTemplate(tpl, daFase)}</div>`
      : grupos.map(g => {
      const abertaM = expM[g.chave] === true;
      return `<div style="border-top:1px solid var(--gray-100)">
        <div onclick="toggleClMacro('${g.chave.replace(/'/g,"\\'")}')" style="display:flex;align-items:center;gap:8px;padding:8px 14px 8px 30px;cursor:pointer;background:var(--gray-50)">
          <i class="ti ti-chevron-${abertaM?'down':'right'}" style="font-size:13px;color:var(--gray-400)"></i>
          <span style="font-size:12.5px;font-weight:600;color:${g.chave==='__sem__'?'var(--gray-400)':'var(--gray-700)'}">${g.nome}</span>
          <span style="margin-left:auto;font-size:11px;color:var(--gray-400)">${g.tarefas.length} tarefa${g.tarefas.length!==1?'s':''}</span>
        </div>
        ${!abertaM ? '' : `<div style="padding:0 14px 10px 30px">
          ${_tabelaTarefasTemplate(tpl, g.tarefas)}
        </div>`}
      </div>`;
    }).join('');

    return `<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">
      <div onclick="toggleClFase('${fase.replace(/'/g,"\\'")}')" style="display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;background:${fc.bg}">
        <i class="ti ti-chevron-${aberta?'down':'right'}" style="font-size:15px;color:${fc.color}"></i>
        <span style="font-size:13px;font-weight:700;color:${fc.color}">${fase}</span>
        <span style="margin-left:auto;font-size:11.5px;color:${fc.color};opacity:.8">${semMacroTpl ? '' : `${grupos.length} macro${grupos.length!==1?'s':''} · `}${daFase.length} tarefa${daFase.length!==1?'s':''}</span>
      </div>
      ${corpo}
    </div>`;
  }).join('');

  document.getElementById('page-content').innerHTML = `
    <div class="card" style="margin-bottom:14px;padding:13px 16px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:0">
          <div style="font-size:11px;color:var(--gray-400)"><span style="cursor:pointer" onclick="voltarChecklists()">Templates</span> › ${tpl.nome}</div>
          <div style="font-size:16px;font-weight:700;color:var(--gray-800);margin-top:2px">${tpl.nome}</div>
          <div style="font-size:12px;color:var(--gray-500);margin-top:2px">${tpl.descricao||''}</div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" onclick="expandirTudoChecklist('${tpl.id}',true)">Expandir tudo</button>
          <button class="btn btn-ghost btn-sm" onclick="expandirTudoChecklist('${tpl.id}',false)">Recolher tudo</button>
        </div>
      </div>
    </div>
    ${(() => { const pr = inconsistenciasDoTemplate(tpl); return pr.length ? `<div class="card" style="margin-bottom:14px;padding:11px 14px;background:#fffbeb;border-color:#fed7aa">
      <div style="font-size:12.5px;color:#92400e"><strong><i class="ti ti-alert-triangle" style="font-size:13px;vertical-align:-2px"></i> A cadeia tarefa → macro → fase está inconsistente neste checklist.</strong><br>
        ${pr.map(i => i.tipo === 'varias-fases' ? `"${i.macro}" tem tarefas em ${i.fases.join(' e ')}` : `o nome "${i.macro}" aparece em mais de uma macro`).join('<br>')}<br>
        Uma macro pertence a uma única fase e todas as tarefas dela ficam nessa fase.</div></div>` : ''; })()}
    ${blocos || `<div class="card"><div class="empty"><i class="ti ti-checklist"></i><p>Este template ainda não tem tarefas</p></div></div>`}`;
}

// Fases e temas de UM template. Cada checklist tem o seu conjunto — listar
// todos misturaria fases de implantação com as de customização, por exemplo.
function _fasesDoTemplate(tpl) {
  const fs = _ordenarFases([...new Set((tpl?.tasks || []).map(t => t.fase).filter(Boolean))]);
  return fs.length ? fs : Object.keys(FASE_COLORS);
}
function _temasDoTemplate(tpl) {
  const ts = [...new Set((tpl?.tasks || []).map(t => t.tema).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  return ts.length ? ts : Object.keys(TEMA_COLORS);
}

// Seletor de macro atividade do PRÓPRIO template (o DE-PARA dele).
// É o que define em qual macro a tarefa entra no cronograma dos projetos.
function _selectMacroTemplate(tpl, macroKeySel) {
  const lista = Array.isArray(tpl?.deParaTemplate) ? tpl.deParaTemplate : [];
  if (!lista.length) {
    return `<input type="hidden" id="ctMacro" value="">
      <div style="font-size:11px;color:var(--gray-400)">Este checklist ainda não tem macro atividades definidas.</div>`;
  }
  return `<select class="form-input form-select" id="ctMacro">
      <option value="">— Sem vínculo com o cronograma —</option>
      ${lista.map(d => `<option value="${d.macroKey}" ${macroKeySel===d.macroKey?'selected':''}>${d.macroNameLabel} (${(d.checklistTaskIds||[]).length} tarefa${(d.checklistTaskIds||[]).length!==1?'s':''})</option>`).join('')}
    </select>`;
}
// Em qual macro do template esta tarefa está?
function _macroDaTarefaTemplate(tpl, taskId) {
  const d = (tpl?.deParaTemplate || []).find(x => (x.checklistTaskIds||[]).includes(taskId));
  return d ? d.macroKey : '';
}

function salvarTarefaChecklist(tplId, editId) {
  const tarefa = document.getElementById('ctTarefa').value.trim();
  if (!tarefa) return alert('Descreva a tarefa');
  const tpl = state.checklistTemplates.find(t=>t.id===tplId);
  const data = {
    tarefa, fase: document.getElementById('ctFase').value,
    tema: document.getElementById('ctTema').value,
    responsavel: document.getElementById('ctResp').value,
    esforco: document.getElementById('ctEsforco').value,
    help: document.getElementById('ctHelp').value, status:'pendente'
  };
  // Cadeia micro → macro → fase: a tarefa tem de ficar na mesma fase da macro escolhida
  const macroEscolhida = document.getElementById('ctMacro')?.value || '';
  if (macroEscolhida) {
    const alvoM = (tpl.deParaTemplate || []).find(d => d.macroKey === macroEscolhida);
    const fasesDaMacroTpl = alvoM ? [...new Set((alvoM.checklistTaskIds || []).filter(c => c !== editId)
      .map(c => (tpl.tasks.find(x => x.id === c) || {}).fase).filter(Boolean))] : [];
    if (fasesDaMacroTpl.length && !fasesDaMacroTpl.includes(data.fase)) {
      notificar(`A macro "${alvoM.macroNameLabel || alvoM.macroKey}" pertence à "${fasesDaMacroTpl[0]}". A tarefa precisa estar na mesma fase da macro.`, 'erro');
      return;
    }
  }
  let taskId = editId;
  if (editId) {
    const t = tpl.tasks.find(x=>x.id===editId);
    Object.assign(t, data);
  } else {
    taskId = uid();
    tpl.tasks.push({...data, id:taskId});
  }
  // vínculo com a macro atividade do template
  const macroKey = document.getElementById('ctMacro')?.value || '';
  if (!Array.isArray(tpl.deParaTemplate)) tpl.deParaTemplate = [];
  tpl.deParaTemplate.forEach(d => {
    d.checklistTaskIds = (d.checklistTaskIds || []).filter(c => c !== taskId);
  });
  if (macroKey) {
    const alvo = tpl.deParaTemplate.find(d => d.macroKey === macroKey);
    if (alvo) {
      // mantém a ordem do checklist dentro da macro
      const ids = tpl.tasks.map(x => x.id);
      alvo.checklistTaskIds = [...alvo.checklistTaskIds, taskId]
        .sort((a,b) => ids.indexOf(a) - ids.indexOf(b));
    }
  }
  tpl.deParaTemplate = tpl.deParaTemplate.filter(d => (d.checklistTaskIds||[]).length > 0);
  saveState(); closeModal(); renderChecklists();
  notificar(editId ? 'Tarefa atualizada.' : 'Tarefa adicionada ao checklist.', 'sucesso');
}

      <div class="form-group"><label class="form-label">Responsável</label><input class="form-input" id="ctResp" value="${t.responsavel||''}"></div>
      <div class="form-group"><label class="form-label">Esforço estimado</label><input class="form-input" id="ctEsforco" value="${t.esforco||''}"></div>
    </div>
    <div class="form-group"><label class="form-label">Help / Orientação</label>
      <textarea class="form-input form-textarea" id="ctHelp">${t.help||''}</textarea></div>
    <div class="form-group"><label class="form-label">Macro atividade <span style="font-weight:400;color:var(--gray-400)">(opcional)</span></label>
      ${_selectMacroTemplate(tpl, _macroDaTarefaTemplate(tpl, taskId))}
      <div style="font-size:11px;color:var(--gray-400);margin-top:4px">Define em qual entrega do cronograma esta tarefa entra nos projetos criados com este checklist.</div></div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarTarefaChecklist('${tplId}','${taskId}')"><i class="ti ti-check"></i> Salvar</button>
  </div>`);
}

function removerTarefaChecklist(tplId, taskId) {
  const tpl = state.checklistTemplates.find(t=>t.id===tplId);
  const t = tpl?.tasks?.find(x=>x.id===taskId);
  if (!tpl || !t) return;
  // a tarefa pode estar vinculada a uma macro no DE-PARA deste template
  const emMacro = (tpl.deParaTemplate || []).find(d => (d.checklistTaskIds||[]).includes(taskId));
  const aviso = emMacro ? `\n\nEla está vinculada à macro atividade "${emMacro.macroNameLabel}" — o vínculo também será removido.` : '';
  if (!confirm(`Remover "${t.tarefa}" do template "${tpl.nome}"?${aviso}\n\nProjetos já criados não são afetados: eles têm cópia própria das tarefas.`)) return;
  tpl.tasks = tpl.tasks.filter(x => x.id !== taskId);
  // limpa a referência no DE-PARA e descarta macros que ficaram sem tarefa
  if (Array.isArray(tpl.deParaTemplate)) {
    tpl.deParaTemplate.forEach(d => {
      d.checklistTaskIds = (d.checklistTaskIds || []).filter(c => c !== taskId);
    });
    tpl.deParaTemplate = tpl.deParaTemplate.filter(d => (d.checklistTaskIds || []).length > 0);
  }
  saveState(); renderChecklists();
  notificar('Tarefa removida do template.', 'sucesso');
}
