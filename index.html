function setViewMode(mode) {
  state.viewMode = mode;
  state.cronoEdicao = false;   // o modo de edição de datas não atravessa abas
  state.listaEdicaoPrazos = false;
  const p = state.projetos.find(x=>x.id===state.currentProjetoId);
  renderProjetoDetail(p);
}

function getFilteredTasks(p) {
  const fMacro = state.filterMacro || '';
  const fMacroStatus = state.filterMacroStatus || '';
  return (p.tasks||[]).filter(t => {
    if (state.filterFase && t.fase !== state.filterFase) return false;
    if (state.filterTema && t.tema !== state.filterTema) return false;
    if (state.filterStatus && t.status !== state.filterStatus) return false;
    if (fMacro || fMacroStatus) {
      const d = resolveTaskMacroDelivery(p, t);
      if (fMacro) {
        if (fMacro === '__none') { if (d.hasDelivery) return false; }
        else if ((d.macroActivityId || d.macroKey || d.macroName) !== fMacro) return false;
      }
      if (fMacroStatus) {
        // deriva o status da macro entrega desta tarefa
        if (!d.hasDelivery) return false;
        const tarefasIrmas = (p.tasks||[]).filter(x => {
          const dx = resolveTaskMacroDelivery(p, x);
          return dx.hasDelivery && (dx.macroActivityId||dx.macroKey||dx.macroName) === (d.macroActivityId||d.macroKey||d.macroName);
        });
        const prog = calculateMacroDeliveryProgress(p, d._macro, tarefasIrmas);
        const st = determineMacroDeliveryStatus(d._macro, d._mapping, prog);
        if (st.key !== fMacroStatus) return false;
      }
    }
    return true;
  });
}

function renderTaskView(p) {
  if (state.viewMode === 'macro') { renderCronogramaMacro(p); return; }
  if (state.viewMode === 'riscos') { renderProjectRisks(p); return; }
  if (state.viewMode === 'followup') { renderFollowUp(p); return; }
  const tasks = getFilteredTasks(p);
  const container = document.getElementById('task-view');
  if (state.viewMode === 'lista') renderLista(tasks, p, container);
  else if (state.viewMode === 'kanban') renderKanban(tasks, p, container);
  else renderCalendario(tasks, p, container);
}




// ==================== GANTT DO CRONOGRAMA MACRO ====================
function setGanttEscala(e) { state.ganttEscala = e; renderProjetoDetail(state.projetos.find(x=>x.id===state.currentProjetoId)); }
function toggleGanttFase(fase) {
  if (!state.ganttFasesRecolhidas) state.ganttFasesRecolhidas = {};
  state.ganttFasesRecolhidas[fase] = !state.ganttFasesRecolhidas[fase];
  renderProjetoDetail(state.projetos.find(x=>x.id===state.currentProjetoId));
}

// Ordena fases pelo número ("Fase 2 - X" vem depois de "Fase 1 - Y"), mesmo quando
// o nome não é um dos oficiais — caso das fases vindas da importação do Planner.
function _ordenarFases(lista) {
  const oficiais = Object.keys(FASE_COLORS);
  const numero = f => { const m = String(f||'').match(/fase\s*(\d+)/i); return m ? parseInt(m[1],10) : 999; };
  return [...lista].sort((a,b) => {
    const na = numero(a), nb = numero(b);
    if (na !== nb) return na - nb;
    const ia = oficiais.indexOf(a), ib = oficiais.indexOf(b);
    if (ia !== -1 && ib !== -1 && ia !== ib) return ia - ib;
    if (ia !== -1 && ib === -1) return -1;
    if (ia === -1 && ib !== -1) return 1;
    return String(a).localeCompare(String(b));
  });
}

// Intervalo do gráfico: engloba as datas das macros e as do próprio projeto.
function _ganttIntervalo(p, macros) {
  const datas = [];
  macros.forEach(m => { const a=parseLocalDate(m.startDate), b=parseLocalDate(m.endDate); if(a)datas.push(a); if(b)datas.push(b); });
  const pi = parseLocalDate(p.dataInicio), pg = parseLocalDate(p.goLive);
  if (pi) datas.push(pi); if (pg) datas.push(pg);
  if (!datas.length) return null;
  const min = new Date(Math.min(...datas.map(d=>d.getTime())));
  const max = new Date(Math.max(...datas.map(d=>d.getTime())));
  return { ini: new Date(min.getFullYear(), min.getMonth(), 1),
           fim: new Date(max.getFullYear(), max.getMonth() + 1, 0) };
}

function _ganttColunas(intervalo, escala) {
  const MES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const cols = [];
  if (escala === 'semana') {
    let c = new Date(intervalo.ini);
    c.setDate(c.getDate() - ((c.getDay() + 6) % 7));   // segunda-feira
    while (c <= intervalo.fim) {
      cols.push({ label: `${String(c.getDate()).padStart(2,'0')}/${String(c.getMonth()+1).padStart(2,'0')}`, data: new Date(c) });
      c.setDate(c.getDate() + 7);
    }
  } else {
    let c = new Date(intervalo.ini);
    while (c <= intervalo.fim) {
      cols.push({ label: `${MES[c.getMonth()]}/${String(c.getFullYear()).slice(2)}`, data: new Date(c) });
      c.setMonth(c.getMonth() + 1);
    }
  }
  return cols;
}

function _ganttPct(data, intervalo) {
  const t0 = intervalo.ini.getTime(), t1 = intervalo.fim.getTime();
  return Math.max(0, Math.min(100, ((data.getTime() - t0) / (t1 - t0)) * 100));
}

function _ganttBarra(ini, fim, intervalo, cor, corFundo, preench) {
  const a = _ganttPct(ini, intervalo), b = _ganttPct(fim, intervalo);
  const largura = Math.max(0.8, b - a);
  const fill = preench != null ? `<div style="height:100%;width:${preench}%;background:${cor};border-radius:3px 0 0 3px"></div>` : '';
  return `<div style="position:absolute;top:8px;left:${a}%;width:${largura}%;height:13px;background:${corFundo};border-radius:3px;overflow:hidden">${fill}</div>`;
}

function renderGanttCronograma(p, macros) {
  const intervalo = _ganttIntervalo(p, macros);
  if (!intervalo) {
    return `<div class="card"><div class="empty"><i class="ti ti-calendar-off"></i>
      <p>Nenhuma data definida ainda</p>
      <small>Informe início e término das atividades macro para ver o cronograma.</small></div></div>`;
  }
  const escala = state.ganttEscala === 'semana' ? 'semana' : 'mes';
  const cols = _ganttColunas(intervalo, escala);
  const recolhidas = state.ganttFasesRecolhidas || {};
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const pctHoje = (hoje >= intervalo.ini && hoje <= intervalo.fim) ? _ganttPct(hoje, intervalo) : null;
  const linhaHoje = pctHoje != null ? `<div style="position:absolute;top:0;bottom:0;left:${pctHoje}%;width:1px;background:var(--danger);z-index:2"></div>` : '';

  // Cada macro pertence a UMA fase (micro → macro → fase) e aparece uma vez, nela; fases ordenadas pelo número
  const tarefasPorMacro = mapaMacroTarefas(p);
  const ordemTar = ordemDasTarefas(p);
  const fases = _ordenarFases([...new Set(macros.map(m => m.phase || 'Sem fase'))]);
  const statusPorMacro = resumoPorMacro(p, macros, tarefasPorMacro);   // progresso da macro inteira

  const linhas = [];
  fases.forEach(fase => {
    const doGrupo = macros.filter(m => (m.phase || 'Sem fase') === fase)
      .sort((a,b) => {
        const da = a.startDate || a.endDate || '9999-12-31';
        const db = b.startDate || b.endDate || '9999-12-31';
        if (da !== db) return da < db ? -1 : 1;
        return (posMacroNaFase(p, a, fase, tarefasPorMacro, ordemTar) - posMacroNaFase(p, b, fase, tarefasPorMacro, ordemTar)) || (a.name||'').localeCompare(b.name||'');
      });
    const datas = [];
    doGrupo.forEach(m => { const a=parseLocalDate(m.startDate), b=parseLocalDate(m.endDate); if(a)datas.push(a); if(b)datas.push(b); });
    const fc = FASE_COLORS[fase] || {bg:'#f1f5f9',color:'#475569'};
    // progresso da fase = microtarefas das macros dela
    let tot=0, conc=0;
    doGrupo.forEach(m => { const dd=statusPorMacro[m.id]; if(dd){ tot+=dd.progress.totalTasks; conc+=dd.progress.completedTasks; } });
    const pctFase = tot ? Math.round(conc/tot*100) : 0;
    const barraFase = datas.length >= 2
      ? _ganttBarra(new Date(Math.min(...datas.map(d=>d.getTime()))), new Date(Math.max(...datas.map(d=>d.getTime()))), intervalo, fc.color, fc.bg, pctFase)
      : '';
    const recolhida = recolhidas[fase] === true;
    linhas.push(`<div class="gt-row" onclick="toggleGanttFase('${fase.replace(/'/g,"\\'")}')" style="cursor:pointer">
      <div class="gt-lf"><i class="ti ti-chevron-${recolhida?'right':'down'}" style="font-size:14px;color:var(--gray-400)"></i>
        <span class="gt-nm" style="font-weight:600">${fase}</span>
        <span class="gt-dt">${pctFase}%</span></div>
      <div class="gt-tl">${barraFase}${linhaHoje}</div>
    </div>`);
    if (recolhida) return;
    doGrupo.forEach(m => {
      const a = parseLocalDate(m.startDate), b = parseLocalDate(m.endDate);
      const dd = statusPorMacro[m.id];
      const pct = dd && dd.progress.microProgress != null ? dd.progress.microProgress : 0;
      const atrasada = dd && dd.status.key === 'atrasada';
      const concluida = dd && dd.status.key === 'concluida';
      const corBarra = concluida ? 'var(--success)' : atrasada ? 'var(--danger)' : fc.color;
      let barra = '';
      if (a && b) barra = _ganttBarra(a, b, intervalo, corBarra, fc.bg, pct);
      else if (b) barra = `<div style="position:absolute;top:9px;left:${_ganttPct(b,intervalo)}%;width:11px;height:11px;transform:translateX(-50%) rotate(45deg);background:${corBarra};border-radius:1px"></div>`;
      const semData = !a && !b;
      const nTar = dd ? dd.progress.totalTasks : 0;
      linhas.push(`<div class="gt-row">
        <div class="gt-lf" style="padding-left:26px">
          <span class="gt-nm">${m.name || '—'}</span>
          ${semData ? '<span class="badge badge-gray" style="font-size:9px">sem data</span>' : ''}
          <span class="gt-dt">${nTar} tar. · ${pct}%</span>
        </div>
        <div class="gt-tl">${barra}${linhaHoje}</div>
      </div>`);
    });
  });

  const totalCols = cols.length;
  // largura mínima por coluna garante leitura; o conjunto rola na horizontal
  const larguraCol = escala === 'semana' ? 52 : 96;
  const larguraTL = Math.max(totalCols * larguraCol, 360);
  return `<div class="card" style="padding:0;overflow:hidden">
    <div class="gt-scroll" style="--gt-tl:${larguraTL}px">
      <div class="gt-head">

const PDF_COR_FASES = ['#1B4F7A', '#0F8FA3', '#1A8FC9', '#3B5BA9', '#C2416B', '#8B5CF6'];
const PDF_STATUS = {
  'concluida':    ['Concluída',    '#DDF3E6',     '#1E7B45'],
  'em-andamento': ['Em andamento', '#DCEBF7',     '#1B4F7A'],
  'atrasada':     ['Atrasada',     '#F6DCDC',     '#A94442'],
  'bloqueada':    ['Bloqueada',    '#F6DCDC',     '#A94442'],
  'nao-iniciada': ['Não iniciada', 'transparent', '#4B5563']
};
let _pdfDocAtual = null;                                   // HTML da prévia aberta (fora do state: não vai ao armazenamento local)
let _logoFormAtual = { dataUrl: '', alterada: false };     // logo escolhido no formulário do projeto

const _pdfIso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const _pdfDMA = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
const _pdfDM2 = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(2, 4) : '';
const _pdfSegunda = d => _atSomaDias(d, -((d.getDay() + 6) % 7));
const _pdfDiasUteis = (a, b) => { let n = 0; for (let d = new Date(a); d <= b; d = _atSomaDias(d, 1)) { const w = d.getDay(); if (w !== 0 && w !== 6) n++; } return n; };
// Fim da operação assistida = término da macro "Operação assistida" do cronograma (a mais tardia, se houver mais de uma).
// Sem a macro (ou sem datas nela), o marco não aparece no PDF.
function _pdfMacroOperacaoAssistida(p) {
  const cand = (p.macroActivities || []).filter(m => m && /operacao assistida/.test(_normTxt(m.name)) && (m.endDate || m.startDate));
  return cand.sort((a, b) => (b.endDate || b.startDate).localeCompare(a.endDate || a.startDate))[0] || null;
}
const _pdfLogoValido = s => typeof s === 'string' && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(s);

// Dados do cronograma, prontos para o layout. Devolve null se o projeto não tem macro atividades.
function dadosCronogramaPDF(p, opc) {
  opc = opc || {};
  const macros = (p.macroActivities || []).filter(m => m && m.name);
  if (!macros.length) return null;
  const tarefasPorMacro = mapaMacroTarefas(p);
  const ordemTar = ordemDasTarefas(p);
  const resumo = resumoPorMacro(p, macros, tarefasPorMacro);
  // Responsável da macro = classificação das micros dela (união). Texto abreviado quando não cabe na coluna.
  const ORDEM_RESP = ['Gestor', 'Consultor', 'Analista', 'Cliente'];
  const respDe = tarefas => {
    const s = new Set();
    tarefas.forEach(t => String(t.responsavel || '').split(';').forEach(x => { x = x.trim(); if (x) s.add(x); }));
    const lista = ORDEM_RESP.filter(r => s.has(r)).concat([...s].filter(r => !ORDEM_RESP.includes(r)));
    let txt = lista.join('; ');
    if (txt.length > 29) txt = lista.map(r => r === 'Consultor' ? 'Cons.' : r === 'Analista' ? 'Anal.' : r).join('; ');
    return txt;
  };
  const fasesOrd = _ordenarFases([...new Set(macros.map(m => m.phase || 'Sem fase'))]);
  const fases = fasesOrd.map((fase, i) => {
    const doGrupo = macros.filter(m => (m.phase || 'Sem fase') === fase).sort((a, b) => {   // mesma ordem do Gantt
      const da = a.startDate || a.endDate || '9999-12-31', db = b.startDate || b.endDate || '9999-12-31';
      if (da !== db) return da < db ? -1 : 1;
      return (posMacroNaFase(p, a, fase, tarefasPorMacro, ordemTar) - posMacroNaFase(p, b, fase, tarefasPorMacro, ordemTar)) || (a.name || '').localeCompare(b.name || '');
    });
    let tot = 0, conc = 0, atras = false;
    const tarefas = doGrupo.map((m, k) => {
      const dd = resumo[m.id];
      if (dd) { tot += dd.progress.totalTasks; conc += dd.progress.completedTasks; if (dd.status.key === 'atrasada') atras = true; }
      const pct = dd && dd.progress.microProgress != null ? dd.progress.microProgress / 100 : null;
      return { id: (i + 1) + '.' + (k + 1), nome: m.name, resp: respDe(tarefasPorMacro.get(m.id) || []), ini: m.startDate || null, fim: m.endDate || null, pct, st: dd ? dd.status.key : null };
    });
    const datas = doGrupo.flatMap(m => [m.startDate, m.endDate]).filter(Boolean).sort();
    const st = !tot ? null : conc === tot ? 'concluida' : atras ? 'atrasada' : conc > 0 ? 'em-andamento' : 'nao-iniciada';
    return { num: i + 1, titulo: String(fase).replace(/^Fase\s*\d+\s*-\s*/i, '').trim().toUpperCase(), cor: PDF_COR_FASES[i % PDF_COR_FASES.length],
             ini: datas[0] || null, fim: datas[datas.length - 1] || null, pct: tot ? conc / tot : null, st, tarefas };
  });
  // escala do Gantt: da segunda-feira da 1ª data até a última (macros, go-live, fim da operação assistida)
  const dts = [];
  macros.forEach(m => [m.startDate, m.endDate].forEach(s => { const d = parseLocalDate(s); if (d) dts.push(d); }));
  const dIni = parseLocalDate(p.dataInicio); if (dIni) dts.push(dIni);
  if (!dts.length) return { semDatas: true };
  const w0 = _pdfSegunda(new Date(Math.min(...dts.map(d => d.getTime()))));
  const fim = new Date(Math.max(...dts.concat([parseLocalDate(p.goLive)]).filter(Boolean).map(d => d.getTime())));
  const dias = Math.round((fim - w0) / 86400000);
  let passo = 7, n = Math.floor(dias / 7) + 1;
  if (n > 30) { passo = 14; n = Math.floor(dias / 14) + 1; }       // projeto longo: colunas quinzenais
  n = Math.max(6, Math.min(n, 60));
  const kick = macros.find(m => /^kickoff$/i.test(String(m.name).trim()));
  const nomeCli = (p.cliente && p.cliente !== '—') ? p.cliente : p.nome;
  const opMacro = _pdfMacroOperacaoAssistida(p);
  return {
    meta: { cliente: nomeCli, kickoff: kick ? (kick.startDate || kick.endDate || null) : null, inicio: p.dataInicio || null, golive: p.goLive || null,
            fimOp: opMacro ? (opMacro.endDate || opMacro.startDate) : null, ref: _pdfIso(_hojeLocal()), local: opc.local || '', progresso: calculateProjectProgress(p).percent,
            logoCliente: _pdfLogoValido(p.logoCliente) ? p.logoCliente : '' },
    fases, escala: { w0: _pdfIso(w0), n, passo }, capa: opc.capa !== false
  };
}

// Documento HTML (capa + tabela com Gantt), A4 paisagem. Serve para a prévia na tela e para a impressão.
function htmlCronogramaPDF(D, A) {
  const M = D.meta, ref = parseLocalDate(M.ref), esc = _atEsc;
  const { n: NSEM, passo } = D.escala, w0 = parseLocalDate(D.escala.w0);
  const sem = Array.from({ length: NSEM }, (_, k) => _atSomaDias(w0, passo * k));
  const semDe = s => { const d = parseLocalDate(s); return d ? sem.findIndex(w => d >= w && d < _atSomaDias(w, passo)) : -1; };
  const kGo = semDe(M.golive), kFim = semDe(M.fimOp), kHoje = semDe(M.ref);
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const grupos = []; sem.forEach(w => { const m = w.getMonth(); if (grupos.length && grupos[grupos.length - 1].m === m) grupos[grupos.length - 1].n++; else grupos.push({ m, n: 1 }); });
  const thMeses = grupos.map(g => `<th class="mes" colspan="${g.n}">${MESES[g.m]}</th>`).join('');
  const thSem = sem.map((w, k) => `<th class="sem ${k === kGo ? 'go' : k === kFim ? 'fim' : k === kHoje ? 'hoje' : ''}"><div class="vt">${String(w.getDate()).padStart(2, '0')}/${String(w.getMonth() + 1).padStart(2, '0')}</div></th>`).join('');
  const celG = (k, cor) => `<td class="g ${k === kHoje ? 'cHoje' : ''} ${k === kGo ? 'lGo' : k === kFim ? 'lFim' : ''}" ${cor ? `style="background:${cor}"` : ''}></td>`;
  const stCell = (st, fase) => { const s = PDF_STATUS[st]; return s ? (fase ? s[0] : `<span style="background:${s[1]};color:${s[2]}">${s[0]}</span>`) : ''; };
  const pcCell = pct => pct == null ? '<td class="pc"><b>—</b></td>' : `<td class="pc"><span class="pb"><i style="width:${Math.round(pct * 100)}%"></i></span><b>${Math.round(pct * 100)}%</b></td>`;
  let linhas = '';

    const ini = f.ini && parseLocalDate(f.ini), fim = f.fim && parseLocalDate(f.fim);
    let gant = ''; sem.forEach((w, k) => { gant += celG(k, ini && fim && w <= fim && _atSomaDias(w, passo - 1) >= ini ? f.cor : ''); });
    linhas += `<tr class="fase" style="--c:${f.cor}"><td class="id">${f.num}</td><td class="nm" colspan="2">FASE ${f.num} &nbsp;·&nbsp; ${esc(f.titulo)}</td><td class="dt">${ini ? _pdfDM2(f.ini) : ''}</td><td class="dt">${fim ? _pdfDM2(f.fim) : ''}</td>
      <td class="du">${ini && fim ? _pdfDiasUteis(ini, fim) : ''}</td>${pcCell(f.pct)}<td class="st">${stCell(f.st, true)}</td>${gant}</tr>`;
    f.tarefas.forEach((t, z) => {
      const a = t.ini && parseLocalDate(t.ini), b = t.fim && parseLocalDate(t.fim) || a, a2 = a || b;
      let gt = ''; sem.forEach((w, k) => {
        let cor = '';
        if (a2 && b && w <= b && _atSomaDias(w, passo - 1) >= a2) {
          const limite = _atSomaDias(a2, Math.round((b - a2) / 86400000 * (t.pct || 0)));
          cor = (t.pct > 0 && w <= limite) ? '#0F8FA3' : t.st === 'atrasada' ? '#D98C8C' : '#A9D3EE';
        }
        gt += celG(k, cor);
      });
      linhas += `<tr class="tar ${z % 2 === 0 ? 'z' : ''}"><td class="id">${esc(t.id)}</td><td class="nm">${esc(t.nome)}</td><td class="rs">${esc(t.resp)}</td><td class="dt">${t.ini ? _pdfDM2(t.ini) : ''}</td><td class="dt">${t.fim ? _pdfDM2(t.fim) : ''}</td>
        <td class="du">${a2 && b ? _pdfDiasUteis(a2, b) : ''}</td>${pcCell(t.pct)}<td class="st">${stCell(t.st, false)}</td>${gt}</tr>`;
    });
  });
  const card = (r, v, extra) => `<div class="card ${extra || ''}"><small>${r}</small><b>${v}</b></div>`;
  const NAVY = '#0B2E4F';
  const css = `

// Reduz o arquivo para caber no banco (até ~110 KB em texto). Mantém transparência (PNG); cai para JPEG só se necessário.
function _reduzirLogoCliente(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return reject(new Error('Use um arquivo PNG, JPG ou WEBP.'));
    if (file.size > 8 * 1024 * 1024) return reject(new Error('O arquivo é grande demais (máximo 8 MB).'));
    const rd = new FileReader();
    rd.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
    rd.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('O arquivo não é uma imagem válida.'));
      img.onload = () => {
        const LIM = 110000; let escala = Math.min(1, 480 / img.width, 160 / img.height);
        for (let tent = 0; tent < 6; tent++) {
          const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * escala)); c.height = Math.max(1, Math.round(img.height * escala));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          const png = c.toDataURL('image/png'); if (png.length <= LIM) return resolve(png);
          if (tent >= 3) {        // ainda grande: JPEG com fundo branco
            const c2 = document.createElement('canvas'); c2.width = c.width; c2.height = c.height; const x = c2.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(c, 0, 0);
            const jpg = c2.toDataURL('image/jpeg', 0.85); if (jpg.length <= LIM) return resolve(jpg);
          }
          escala *= 0.75;
        }
        reject(new Error('Não foi possível reduzir a imagem o bastante. Tente um arquivo menor.'));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}
async function logoClienteEscolhido(input) {
  const msg = document.getElementById('pLogoMsg'), f = input.files && input.files[0]; if (!f) return;
  try {
    const url = await _reduzirLogoCliente(f);
    _logoFormAtual = { dataUrl: url, alterada: true }; _logoAtualizarPrevia();

}

// ==================== EDIÇÃO DE DATAS DA MACRO ATIVIDADE ====================
// Com o cronograma editável no DOS, a importação deixa de ser o único caminho.
// A regra de propagação é a MESMA da importação: só mexe em tarefa não concluída
// e sem prazo definido manualmente.

// Simula o efeito de uma nova data de término, sem alterar nada.
function simularImpactoPrazo(p, macro, novoFim) {
  const res = { alteradas: [], concluidas: 0, manuais: 0, semMudanca: 0, total: 0 };
  const mp = (p.macroMappings || []).find(m => m.macroActivityId === macro.id);
  const ids = mp ? (mp.microTaskIds || []) : [];
  ids.forEach(tid => {
    const t = (p.tasks || []).find(x => x.id === tid);
    if (!t) return;
    res.total++;
    if (t.status === 'concluida') { res.concluidas++; return; }
    if (t._prazoManual) { res.manuais++; return; }
    if (t.prazo === novoFim) { res.semMudanca++; return; }
    res.alteradas.push({ tarefa: t.tarefa, de: t.prazo, para: novoFim });
  });
  return res;
}

// Edição em lote: libera todas as datas de uma vez e aplica tudo num único salvar.
function entrarModoEdicaoDatas(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode alterar o cronograma.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p) return;
  if (!projetoTemMacro(p)) { notificar('Este projeto não tem cronograma macro: não há datas de macro para editar.', 'erro'); return; }
  state.cronoEdicao = true;
  renderProjetoDetail(p);
}
function sairModoEdicaoDatas(pId) {
  state.cronoEdicao = false;
  renderProjetoDetail(state.projetos.find(x => x.id === pId));
}

// Resumo do que muda: lê os campos da tela e compara com o que está gravado
function _coletarEdicoesDatas(p) {
  const mudancas = [];
  (p.macroActivities || []).forEach(m => {
    const ini = document.getElementById('ed-ini-' + m.id);
    const fim = document.getElementById('ed-fim-' + m.id);
    if (!ini || !fim) return;
    const novoIni = ini.value || null;
    const novoFim = fim.value || null;
    if (novoIni !== (m.startDate || null) || novoFim !== (m.endDate || null)) {
      mudancas.push({ macro: m, novoIni, novoFim });
    }
  });
  return mudancas;
}

// Confirmação em modal próprio: o confirm() nativo é bloqueado em alguns
// contextos (iframes, visualizações incorporadas) e falha em silêncio.
function salvarTodasDatasMacro(pId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode alterar o cronograma.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p) return;
  sincronizarVinculosMacro(p);   // inclui tarefas ligadas à macro só pelo campo da tarefa
  const mudancas = _coletarEdicoesDatas(p);
  if (!mudancas.length) { sairModoEdicaoDatas(pId); notificar('Nenhuma data foi alterada.', 'sucesso'); return; }

  const invalida = mudancas.find(c => c.novoIni && c.novoFim && c.novoFim < c.novoIni);
  if (invalida) { notificar(`"${invalida.macro.name}": o término não pode ser anterior ao início.`, 'erro'); return; }

  let totalAlteradas = 0, totalPreservadas = 0;
  mudancas.forEach(c => {
    if (!c.novoFim) return;
    const s = simularImpactoPrazo(p, c.macro, c.novoFim);
    totalAlteradas += s.alteradas.length;
    totalPreservadas += s.concluidas + s.manuais;
  });
  // Tarefas com prazo MANUAL que ficariam depois do novo fim da macro (as automáticas acompanham a macro)
  const alem = [];
  mudancas.forEach(c => {
    if ((c.novoFim || null) === (c.macro.endDate || null)) return;   // só quando o FIM da macro muda
    const lim = c.novoFim || c.novoIni;
    if (!lim) return;
    const mpA = (p.macroMappings || []).find(x => x.macroActivityId === c.macro.id);
    ((mpA && mpA.microTaskIds) || []).forEach(tid => {
      const tk = (p.tasks || []).find(x => x.id === tid);
      if (tk && tk.status !== 'concluida' && tk._prazoManual && tk.prazo && tk.prazo > lim) alem.push({ t: tk, macro: c.macro, lim });
    });
  });
  const avisoAlem = alem.length ? `<div style="margin-top:12px;background:#fffbeb;border:1px solid #fed7aa;border-radius:8px;padding:10px 12px;font-size:12px;color:#92400e">
      <strong><i class="ti ti-alert-triangle" style="font-size:13px;vertical-align:-2px"></i> ${alem.length} tarefa(s) com prazo manual ficarão depois do novo fim da macro.</strong>
      <div style="margin:6px 0">${alem.slice(0, 5).map(a => `<div style="font-size:11.5px">${String(a.t.tarefa || '').replace(/</g,'&lt;')} — prazo ${fmt(a.t.prazo)}, macro "${String(a.macro.name || '').replace(/</g,'&lt;')}" termina em ${fmt(a.lim)}</div>`).join('')}${alem.length > 5 ? `<div style="font-size:11.5px">e mais ${alem.length - 5}...</div>` : ''}</div>
      Prazos manuais não mudam sozinhos. Para manter assim, use <strong>Aplicar mesmo assim</strong>; depois, ajuste-os na Lista, em <strong>Editar prazos</strong>.
    </div>` : '';
  // guarda o que foi digitado: o modal substitui o conteúdo da tela
  _edicoesPendentes = mudancas.map(c => ({ macroId: c.macro.id, novoIni: c.novoIni, novoFim: c.novoFim }));

  const lista = mudancas.slice(0, 8).map(c =>
    `<div style="display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:3px 0;border-top:1px solid var(--gray-100)">
      <span style="color:var(--gray-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.macro.name}</span>
      <span style="color:var(--gray-500);white-space:nowrap">${c.novoIni?fmt(c.novoIni):'—'} a <strong style="color:var(--accent)">${c.novoFim?fmt(c.novoFim):'—'}</strong></span>
    </div>`).join('');

  openModal(`<div class="modal-header">
    <div class="modal-title"><i class="ti ti-calendar-event" style="margin-right:8px;color:var(--accent)"></i>Confirmar replanejamento</div>
    <button class="btn btn-ghost" onclick="closeModal()"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body">
    <div style="font-size:13px;color:var(--gray-700);line-height:1.7;margin-bottom:12px">
      <strong>${mudancas.length}</strong> atividade(s) macro terão as datas alteradas.<br>
      <strong style="color:var(--accent)">${totalAlteradas}</strong> prazo(s) de tarefa serão replanejados.<br>
      ${totalPreservadas} preservado(s) — já concluídas ou com prazo manual.
    </div>
    <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px">
      ${lista}${mudancas.length>8?`<div style="font-size:11px;color:var(--gray-400);padding-top:5px">e mais ${mudancas.length-8}...</div>`:''}
    </div>
    ${avisoAlem}
    <div style="font-size:11.5px;color:var(--gray-400);margin-top:10px">Esta ação não pode ser desfeita.</div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" id="cdBtn" onclick="aplicarDatasEmLote('${pId}')"><i class="ti ti-check"></i> ${alem.length ? 'Aplicar mesmo assim' : 'Aplicar e replanejar'}</button>
  </div>`);
}

let _edicoesPendentes = null;

async function aplicarDatasEmLote(pId) {
  const p = state.projetos.find(x => x.id === pId);
  if (!p || !_edicoesPendentes) return;
  const btn = document.getElementById('cdBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Aplicando...'; }
  const mudancas = _edicoesPendentes.map(e => ({
    macro: (p.macroActivities || []).find(m => m.id === e.macroId),
    novoIni: e.novoIni, novoFim: e.novoFim
  })).filter(c => c.macro);

  const antes = (p.macroActivities || []).map(m => ({ id:m.id, startDate:m.startDate, endDate:m.endDate }));
  const agora = new Date().toISOString();
  mudancas.forEach(c => {
    c.macro.startDate = c.novoIni;
    c.macro.endDate = c.novoFim;
    c.macro.lastUpdatedAt = agora;
  });
  sincronizarVinculosMacro(p);
  const atualizadas = propagarPrazosMacro(p);

  const res = await persistirCronograma(p);
  if (!res.ok) {
    antes.forEach(a => { const m = p.macroActivities.find(x => x.id === a.id); if (m) { m.startDate = a.startDate; m.endDate = a.endDate; } });
    propagarPrazosMacro(p);
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i> Aplicar e replanejar'; }
    notificar('Não foi possível salvar: ' + res.error + ' Recarregue a página para conferir.', 'erro');
    return;
  }
  _edicoesPendentes = null;
  state.cronoEdicao = false;
  saveState();
  closeModal();
  renderProjetoDetail(p);
  notificar(`${mudancas.length} atividade(s) atualizada(s). ${atualizadas} prazo(s) de tarefa replanejado(s).`, 'sucesso');
}

async function salvarDatasMacro(pId, macroId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode alterar o cronograma.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  const m = (p?.macroActivities || []).find(x => x.id === macroId);
  if (!p || !m) return;
  const el = id => document.getElementById(id);
  const erro = msg => { const a=el('emAlert'), b=el('emAlertMsg'); if(a&&b){ b.textContent=msg; a.style.display='flex'; } };
  if (el('emAlert')) el('emAlert').style.display = 'none';

  const ini = el('emInicio')?.value || null;
  const fim = el('emFim')?.value || null;
  if (ini && fim && fim < ini) { erro('O término não pode ser anterior ao início.'); return; }

  const btn = el('emBtnSalvar');
  const lbl = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Salvando...'; }

  const antes = { startDate: m.startDate, endDate: m.endDate };
  m.startDate = ini;
  m.endDate = fim;
  m.source = m.source === 'planner-import' ? 'planner-import' : 'dos';
  m.lastUpdatedAt = new Date().toISOString();
  const atualizadas = propagarPrazosMacro(p);

  const res = await persistirCronograma(p);
  if (!res.ok) {
    m.startDate = antes.startDate; m.endDate = antes.endDate;   // desfaz na tela
    propagarPrazosMacro(p);
    if (btn) { btn.disabled = false; btn.innerHTML = lbl; }
    erro('Não foi possível salvar: ' + res.error);
    return;
  }
  saveState();
  closeModal();
  renderProjetoDetail(p);
  notificar(atualizadas
    ? `Datas atualizadas. ${atualizadas} prazo(s) de tarefa replanejado(s).`
    : 'Datas atualizadas.', 'sucesso');
}

// Instancia as macro atividades a partir do DE-PARA do template, na criação do
// projeto. É o que substitui a importação: a estrutura nasce do próprio checklist.
function instanciarMacrosDoTemplate(projeto, tpl) {
  if (!tpl || !Array.isArray(tpl.deParaTemplate)) return;
  if (!tpl.deParaTemplate.length) {
    // Template sem macros (ex.: Customização): o projeto também fica sem cronograma macro.
    // Importa na troca de checklist, para não sobrarem macros de um checklist que não existe mais.
    projeto.macroActivities = [];
    projeto.macroMappings = [];
    (projeto.tasks || []).forEach(t => { t.macroActivityId = null; });
    return;
  }
  const agora = new Date().toISOString();
  const porTemplateTask = {};
  (projeto.tasks || []).forEach(t => { if (t.templateTaskId) porTemplateTask[t.templateTaskId] = t; });

  projeto.macroActivities = [];
  projeto.macroMappings = [];
  tpl.deParaTemplate.forEach(entrada => {
    const tarefas = (entrada.checklistTaskIds || []).map(ct => porTemplateTask[ct]).filter(Boolean);
    if (!tarefas.length) return;
    // a fase da macro vem das tarefas que ela agrupa
    const fase = tarefas[0].fase || null;
    const macroId = uid();
    projeto.macroActivities.push({
      id: macroId, externalId: null, hierarchyCode: null,
      macroKey: entrada.macroKey, name: entrada.macroNameLabel,
      phase: fase, startDate: null, endDate: null,
      progress: null, responsible: null, bucket: null,
      source: 'template', importStatus: 'ok',
      importedAt: agora, lastUpdatedAt: agora
    });
    projeto.macroMappings.push({
      id: uid(), macroKey: entrada.macroKey, macroActivityId: macroId,
      macroExternalId: null, macroNameSnapshot: entrada.macroNameLabel,
      microTaskIds: tarefas.map(t => t.id),
      origem: 'template', createdAt: agora, updatedAt: agora
    });
    tarefas.forEach(t => { t.macroActivityId = macroId; });
  });
}


// ==================== TROCA DE CHECKLIST DO PROJETO ====================
// Substitui o checklist de um projeto em andamento. Como os nomes das tarefas
// mudam entre templates, não há casamento automático: a lista é substituída.
// Por isso oferecemos preservar o que já foi concluído.
function _trocaSimular(p, tplId, preservar) {
  const tpl = (state.checklistTemplates || []).find(t => t.id === tplId);
  if (!tpl) return null;
  const atuais = Array.isArray(p.tasks) ? p.tasks : [];
  const concluidas = atuais.filter(t => t.status === 'concluida');
  const removidas = preservar ? atuais.filter(t => t.status !== 'concluida') : atuais;
  return {
    tpl,
    novas: (tpl.tasks || []).length,
    removidas: removidas.length,
    removidasConcluidas: removidas.filter(t => t.status === 'concluida').length,
    preservadas: preservar ? concluidas.length : 0,
    macrosNovas: (tpl.deParaTemplate || []).length,
    macrosAtuais: (p.macroActivities || []).length
  };
}

  const p = state.projetos.find(x => x.id === pId);

    <div style="font-size:12px;font-weight:700;color:${perde?'#991b1b':'var(--gray-700)'};margin-bottom:6px">
      <i class="ti ti-arrow-bounce" style="font-size:13px;vertical-align:-2px"></i> O que vai acontecer
    </div>
