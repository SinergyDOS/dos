// ==================== MATRIZ DE ALOCAÇÃO — MOTOR ====================
// Reutiliza consultor/analista dos projetos como vínculos, sem criar estrutura persistida.

// Datas YYYY-MM-DD interpretadas como locais (evita deslocamento por fuso)
function parseLocalDate(dateString) {
  if (!dateString || typeof dateString !== 'string') return null;
  const parts = dateString.split('-').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) return null;
  const [y, m, d] = parts;
  return new Date(y, m - 1, d);
}
function _hojeLocal() { const d = new Date(); d.setHours(0,0,0,0); return d; }

function dateRangesOverlap(startA, endA, startB, endB) {
  if (!startA || !endA || !startB || !endB) return false;
  return startA <= endB && startB <= endA;
}
function projectOverlapsMonth(project, year, month) {
  const start = parseLocalDate(project.dataInicio);
  const end = parseLocalDate(project.goLive);
  if (!start || !end) return false;
  const mStart = new Date(year, month, 1);
  const mEnd = new Date(year, month + 1, 0);
  return dateRangesOverlap(start, end, mStart, mEnd);
}
function isProjectActiveOnDate(project, referenceDate) {
  const start = parseLocalDate(project.dataInicio);
  const end = parseLocalDate(project.goLive);
  if (!start || !end) return false;
  return start <= referenceDate && referenceDate <= end;
}

// Normaliza nome para relacionar consultor/analista/usuário
function normalizePersonName(value) {
  return String(value || '').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ');
}

// Junta os vínculos consultor+analista de UM projeto (mesma pessoa nos 2 campos = 1 vínculo)
function mergeProjectPersonLinks(project) {
  // Cada papel pode ter várias pessoas; quem acumula os dois vira 'consultor-analista'
  const porPessoa = new Map();
  const add = (nome, papel) => {
    const k = normalizePersonName(nome);
    if (!k) return;
    const atual = porPessoa.get(k);
    if (!atual) { porPessoa.set(k, { personKey:k, personNameRaw:nome, roleInProject:papel }); return; }
    if (atual.roleInProject !== papel) atual.roleInProject = 'consultor-analista';
  };
  listaPessoas(project.consultor).forEach(n => add(n, 'consultor'));
  listaPessoas(project.analista).forEach(n => add(n, 'analista'));
  return [...porPessoa.values()];
}

// Consolida todos os vínculos de todos os projetos (calculado em memória)
function getProjectAllocationLinks() {
  const links = [];
  (state.projetos || []).forEach(project => {
    const phase = getProjectCurrentPhase(project);
    const progress = calculateProjectProgress(project);
    const status = getProjectExecutiveStatus(project);
    const riskSummary = calculateProjectRiskSummary(project);
    const blockers = getActiveGoLiveBlockers(project).length;
    mergeProjectPersonLinks(project).forEach(pl => {
      const user = (state.users || []).find(u => normalizePersonName(u.name) === pl.personKey);
      links.push({
        id: uid(),
        personKey: pl.personKey,
        userId: user ? user.id : null,
        personName: user ? user.name : pl.personNameRaw,
        userType: user ? (user.tipo || '') : '',
        projectId: project.id,
        projectName: project.nome,
        clientName: project.cliente || '',
        roleInProject: pl.roleInProject,
        startDate: project.dataInicio || null,
        endDate: project.goLive || null,
        modules: Array.isArray(project.modulos) ? project.modulos : [],
        currentPhase: phase,
        projectProgress: progress,
        projectStatus: status,
        riskSummary: riskSummary,
        activeBlockers: blockers,
        _project: project
      });
    });
  });
  return links;
}

// Status de um vínculo (prioridade: vencido→terminando→ativo→futuro→concluído→sem datas)
function getAllocationLinkStatus(link, referenceDate) {
  const hoje = referenceDate || _hojeLocal();
  const start = parseLocalDate(link.startDate);
  const end = parseLocalDate(link.endDate);
  const concluido = link.projectProgress && link.projectProgress.percent === 100;

  if (concluido) return { key:'completed', label:'Projeto concluído', badgeClass:'badge-gray' };
  if (!start || !end) return { key:'undated', label:'Período não informado', badgeClass:'badge-gray' };
  if (start > hoje) return { key:'future', label:'Planejado', badgeClass:'badge-blue' };
  if (end < hoje) return { key:'expired', label:'Go-live vencido', badgeClass:'badge-red' };
  // ativo: verifica se termina em breve (30 dias)
  const dl = Math.round((end - hoje) / 86400000);
  if (dl >= 0 && dl <= 30) return { key:'ending-soon', label:'Termina em breve', badgeClass:'badge-warn' };
  return { key:'active', label:'Ativo', badgeClass:'badge-green' };
}

// Conta projetos distintos ativos numa data (não conta 2x a mesma pessoa/projeto)
function countSimultaneousProjects(personLinks, referenceDate) {
  const ativos = new Set();
  personLinks.forEach(l => {
    if (isProjectActiveOnDate(l._project, referenceDate)) ativos.add(l.projectId);
  });
  return ativos.size;
}

// Concorrência mensal (quantos projetos se sobrepõem em cada mês do intervalo)
function calculatePersonProjectConcurrency(personLinks, startDate, endDate) {
  const monthlyCounts = [];
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  let cur = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
  const fim = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
  while (cur <= fim) {
    const y = cur.getFullYear(), m = cur.getMonth();
    const ids = [];
    personLinks.forEach(l => { if (projectOverlapsMonth(l._project, y, m) && !ids.includes(l.projectId)) ids.push(l.projectId); });
    monthlyCounts.push({ periodKey: `${y}-${String(m+1).padStart(2,'0')}`, label: `${meses[m]}/${y}`, projectCount: ids.length, projectIds: ids });
    cur.setMonth(cur.getMonth() + 1);
  }
  const peakCount = monthlyCounts.reduce((mx, mc) => Math.max(mx, mc.projectCount), 0);
  const peakPeriods = monthlyCounts.filter(mc => mc.projectCount === peakCount && peakCount > 0);
  const hoje = _hojeLocal();
  const currentCount = countSimultaneousProjects(personLinks, hoje);
  return { currentCount, peakCount, peakPeriods, monthlyCounts };
}

// Resumo de alocação de uma pessoa
function calculatePersonAllocationSummary(person, links) {
  const hoje = _hojeLocal();
  const personLinks = links.filter(l => l.personKey === person.personKey);
  let activeProjects = 0, futureProjects = 0, completedProjects = 0, projectsEndingSoon = 0, projectsWithoutDates = 0, ongoingOverdueProjects = 0;
  const endDatesEmAberto = []; // para lastExpectedEndDate
  const nextEnds = []; // próximos términos (ativos)
  const projetosVistos = new Set();

  personLinks.forEach(l => {
    if (projetosVistos.has(l.projectId)) return; // não conta 2x mesmo projeto
    projetosVistos.add(l.projectId);
    const st = getAllocationLinkStatus(l, hoje);
    const start = parseLocalDate(l.startDate);
    const end = parseLocalDate(l.endDate);
    const concluido = l.projectProgress && l.projectProgress.percent === 100;
    if (concluido) { completedProjects++; return; }
    if (!start || !end) { projectsWithoutDates++; return; }
    if (st.key === 'future') { futureProjects++; endDatesEmAberto.push(end); }
    else if (st.key === 'expired') { ongoingOverdueProjects++; endDatesEmAberto.push(end); }
    else { // active ou ending-soon
      activeProjects++;
      endDatesEmAberto.push(end);
      nextEnds.push(end);
      if (st.key === 'ending-soon') projectsEndingSoon++;
    }
  });

  const firstStarts = personLinks.map(l => parseLocalDate(l.startDate)).filter(Boolean);
  const firstStartDate = firstStarts.length ? new Date(Math.min(...firstStarts.map(d=>d.getTime()))) : null;
  const lastExpectedEndDate = endDatesEmAberto.length ? new Date(Math.max(...endDatesEmAberto.map(d=>d.getTime()))) : null;
  const nextProjectEndDate = nextEnds.length ? new Date(Math.min(...nextEnds.map(d=>d.getTime()))) : null;
  const simultaneousProjectsToday = countSimultaneousProjects(personLinks, hoje);

  // papel consolidado
  const papeis = new Set(personLinks.map(l => l.roleInProject));
  let role = '—';
  if (papeis.has('consultor-analista') || (papeis.has('consultor') && papeis.has('analista'))) role = 'Consultor e Analista';
  else if (papeis.has('consultor')) role = 'Consultor';
  else if (papeis.has('analista')) role = 'Analista';
  else if (person.userType) role = person.userType.charAt(0).toUpperCase() + person.userType.slice(1);

  return {
    personKey: person.personKey, userId: person.userId, personName: person.personName,
    userType: person.userType, role,
    totalProjects: projetosVistos.size,
    activeProjects, futureProjects, completedProjects, projectsEndingSoon, projectsWithoutDates,
    firstStartDate, lastExpectedEndDate, nextProjectEndDate,
    ongoingOverdueProjects, simultaneousProjectsToday,
    openProjects: activeProjects + futureProjects + ongoingOverdueProjects,
    links: personLinks
  };
}

// Lista de pessoas da matriz: usuários consultor/analista + quem aparecer nos projetos
function getAllocationMatrixPeople() {
  const map = new Map();
  // usuários consultor/analista (mesmo sem projeto)
  (state.users || []).forEach(u => {
    const tipo = (u.tipo || '').toLowerCase();
    if (tipo === 'consultor' || tipo === 'analista') {
      const key = normalizePersonName(u.name);
      map.set(key, { personKey: key, userId: u.id, personName: u.name, userType: tipo });
    }
  });
  // pessoas que aparecem nos projetos mas não estão em users (ou são de outro tipo)
  getProjectAllocationLinks().forEach(l => {
    if (!map.has(l.personKey)) {
      map.set(l.personKey, { personKey: l.personKey, userId: l.userId, personName: l.personName, userType: l.userType || 'outros' });
    }
  });
  return [...map.values()];
}

// ==================== MATRIZ DE ALOCAÇÃO — FILTROS ====================
function normalizeAllocationMatrixFilters() {
  if (!state.allocationMatrixFilters || typeof state.allocationMatrixFilters !== 'object') state.allocationMatrixFilters = {};
  const f = state.allocationMatrixFilters;
  ['search','personType','module','projectStatus','periodStart','periodEnd'].forEach(k => { if (typeof f[k] !== 'string') f[k] = ''; });
  if (typeof f.onlyActive !== 'boolean') f.onlyActive = false;
  if (typeof f.onlyEndingSoon !== 'boolean') f.onlyEndingSoon = false;
  if (typeof f.onlyWithoutDates !== 'boolean') f.onlyWithoutDates = false;
  return f;
}
function allocationMatrixSetFilter(key, value) {
  normalizeAllocationMatrixFilters();
  state.allocationMatrixFilters[key] = value;
  renderAllocationMatrix();
}
function clearAllocationMatrixFilters() {
  state.allocationMatrixFilters = { search:'', personType:'', module:'', projectStatus:'', periodStart:'', periodEnd:'', onlyActive:false, onlyEndingSoon:false, onlyWithoutDates:false };
  renderAllocationMatrix();
}
function setAllocationMatrixView(view) {
  state.allocationMatrixView = view;
  renderAllocationMatrix();
}

// Aplica os filtros e devolve pessoas + resumos + links filtrados
function getFilteredAllocationMatrixData() {
  const f = normalizeAllocationMatrixFilters();
  const busca = _normTxt(f.search || '');
  const allLinks = getProjectAllocationLinks();
  let people = getAllocationMatrixPeople();

  // filtro por tipo de pessoa
  if (f.personType) {
    people = people.filter(p => {
      const t = (p.userType || 'outros').toLowerCase();
      if (f.personType === 'outros') return t !== 'consultor' && t !== 'analista' && t !== 'gestor';
      return t === f.personType;
    });
  } else {
    // visão padrão: consultores e analistas (mais quem aparecer nos projetos)
    // (não filtra gestores explicitamente aqui pois getAllocationMatrixPeople já limita usuários a consultor/analista)
  }

  const hoje = _hojeLocal();
  const summaries = people.map(person => {
    // aplica filtros de vínculo/projeto sobre os links da pessoa
    let personLinks = allLinks.filter(l => l.personKey === person.personKey);
    if (f.module) personLinks = personLinks.filter(l => moduleListHasModule(l.modules, f.module));
    if (f.projectStatus) personLinks = personLinks.filter(l => l.projectStatus.key === f.projectStatus);
    if (f.periodStart || f.periodEnd) {
      const ps = f.periodStart ? parseLocalDate(f.periodStart) : new Date(1900,0,1);
      const pe = f.periodEnd ? parseLocalDate(f.periodEnd) : new Date(2999,11,31);
      personLinks = personLinks.filter(l => { const s=parseLocalDate(l.startDate), e=parseLocalDate(l.endDate); return s&&e&&dateRangesOverlap(s,e,ps,pe); });
    }
    if (f.onlyActive) personLinks = personLinks.filter(l => { const k=getAllocationLinkStatus(l,hoje).key; return k==='active'||k==='ending-soon'; });
    if (f.onlyEndingSoon) personLinks = personLinks.filter(l => getAllocationLinkStatus(l,hoje).key==='ending-soon');
    if (f.onlyWithoutDates) personLinks = personLinks.filter(l => !parseLocalDate(l.startDate) || !parseLocalDate(l.endDate));
    const summary = calculatePersonAllocationSummary(person, personLinks.length||f.module||f.projectStatus||f.periodStart||f.periodEnd||f.onlyActive||f.onlyEndingSoon||f.onlyWithoutDates ? personLinks : allLinks.filter(l=>l.personKey===person.personKey));
    return { person, summary, _filteredLinks: personLinks };
  });

  // busca textual (pessoa, projeto, cliente)
  let resultado = summaries;
  if (busca) {
    resultado = summaries.filter(({person, summary}) => {
      if (_normTxt(person.personName).includes(busca)) return true;
      return summary.links.some(l => _normTxt(l.projectName).includes(busca) || _normTxt(l.clientName).includes(busca));
    });
  }
  // se há filtros de vínculo, oculta pessoas sem nenhum link após filtro (exceto quando busca vazia e sem filtros)
  const temFiltroVinculo = f.module||f.projectStatus||f.periodStart||f.periodEnd||f.onlyActive||f.onlyEndingSoon||f.onlyWithoutDates;
  if (temFiltroVinculo) resultado = resultado.filter(({_filteredLinks}) => _filteredLinks.length > 0);

  return { data: resultado, allLinks, filters: f };
}

// ==================== INDICADORES ====================
function renderAllocationMatrixIndicators(data, allLinks) {
  const hoje = _hojeLocal();
  const pessoasVinculadas = data.filter(({summary}) => summary.links.length > 0).length;
  const semProjetoAtivo = data.filter(({summary}) => summary.activeProjects === 0 && (summary.person?.userType==='consultor'||summary.person?.userType==='analista'||summary.summary)).length;
  // recomputa sem-projeto-ativo corretamente
  const semAtivoHoje = data.filter(({summary}) => summary.simultaneousProjectsToday === 0).length;
  const vinculosAtivos = allLinks.filter(l => { const k=getAllocationLinkStatus(l,hoje).key; return k==='active'||k==='ending-soon'; }).length;
  const terminando = allLinks.filter(l => getAllocationLinkStatus(l,hoje).key==='ending-soon').length;
  const semPeriodo = allLinks.filter(l => !parseLocalDate(l.startDate) || !parseLocalDate(l.endDate)).length;
  const maiorSimultaneo = data.reduce((mx,{summary}) => Math.max(mx, summary.simultaneousProjectsToday), 0);

  const card = (icon,bg,color,label,value,sub) => `<div class="stat-card"><div class="stat-icon" style="background:${bg}"><i class="ti ${icon}" style="color:${color}"></i></div><div><div class="stat-label">${label}</div><div class="stat-value">${value}</div>${sub?`<div class="stat-sub">${sub}</div>`:''}</div></div>`;
  return `<div class="stats-grid" style="margin-bottom:16px">
    ${card('ti-users','#e8f0fe','var(--accent)','Pessoas vinculadas',pessoasVinculadas)}
    ${card('ti-user-off','#f1f5f9','var(--gray-500)','Sem projeto ativo hoje',semAtivoHoje)}
    ${card('ti-plug-connected','#dcfce7','var(--success)','Vínculos ativos',vinculosAtivos)}
    ${card('ti-clock-exclamation','#fef3c7','var(--warn)','Terminando em 30 dias',terminando)}
    ${card('ti-calendar-off','#f1f5f9','var(--gray-500)','Vínculos sem período',semPeriodo)}
    ${card('ti-layers-intersect','#e8f0fe','var(--accent)','Maior nº simultâneo',maiorSimultaneo,'Concentração atual entre as pessoas')}
  </div>`;
}

// ==================== ROTEADOR PRINCIPAL ====================
function renderAllocationMatrix() {
  if (!isGestor()) { nav('dashboard'); return; }
  normalizeAllocationMatrixFilters();
  if (!state.allocationMatrixView) state.allocationMatrixView = 'timeline';
  document.getElementById('topbar-actions').innerHTML = '';
  const page = document.getElementById('page-content');

  const users = state.users || [];
  const temCA = users.some(u => ['consultor','analista'].includes((u.tipo||'').toLowerCase()));
  if (!temCA && (!state.projetos || !state.projetos.length)) {
    page.innerHTML = `<div class="card"><div class="empty"><i class="ti ti-calendar-user"></i><p>Nenhum consultor ou analista cadastrado.</p><small>Cadastre usuários e vincule-os a projetos para acompanhar a alocação.</small></div></div>`;
    return;
  }

  const tabs = `<div class="tabs" style="margin-bottom:16px">
    <button class="tab ${state.allocationMatrixView==='timeline'?'active':''}" onclick="setAllocationMatrixView('timeline')"><i class="ti ti-timeline"></i> Linha do tempo</button>
    <button class="tab ${state.allocationMatrixView==='people'?'active':''}" onclick="setAllocationMatrixView('people')"><i class="ti ti-users"></i> Visão por pessoa</button>
    <button class="tab ${state.allocationMatrixView==='projects'?'active':''}" onclick="setAllocationMatrixView('projects')"><i class="ti ti-folder"></i> Visão por projeto</button>
  </div>`;

  // A linha do tempo tem a própria barra de ferramentas (escala, período, busca) e não usa os cartões nem os filtros das outras visões
  if (state.allocationMatrixView === 'timeline') { page.innerHTML = tabs + renderAllocationRoleTimeline(); return; }
  const { data, allLinks } = getFilteredAllocationMatrixData();
  const indicadores = renderAllocationMatrixIndicators(data, allLinks);
  const filtros = renderAllocationMatrixFilters();

  let corpo;
  if (data.length === 0 && state.allocationMatrixView !== 'projects') {
    corpo = `<div class="card"><div class="empty"><i class="ti ti-search-off"></i><p>Nenhuma pessoa ou projeto corresponde aos filtros selecionados.</p><small><button class="btn btn-secondary btn-sm" onclick="clearAllocationMatrixFilters()"><i class="ti ti-x"></i> Limpar filtros</button></small></div></div>`;
  } else if (state.allocationMatrixView === 'people') {
    corpo = renderAllocationPeopleView(data);
  } else {
    corpo = renderAllocationProjectsView();
  }

  page.innerHTML = tabs + indicadores + filtros + corpo;
}

// ==================== VISÃO POR PESSOA ====================
function _allocSituacaoInformativa(summary) {

  if (summary.activeProjects > 0) return { label:'Com projetos ativos', badge:'badge-green' };
  return { label:'Sem projeto ativo', badge:'badge-gray' };
}

      <td style="text-align:center">${summary.projectsWithoutDates>0?`<span class="badge badge-gray" style="font-size:10px"><i class="ti ti-calendar-off" style="font-size:10px"></i> ${summary.projectsWithoutDates}</span>`:'<span style="color:var(--gray-300)">—</span>'}</td>
      <td><span class="badge ${sit.badge}" style="font-size:10px">${sit.label}</span></td>
      <td><button class="btn btn-ghost btn-sm" style="padding:3px 6px" onclick="event.stopPropagation();showPersonAllocationMatrixDetails('${person.personKey}')" title="Detalhes"><i class="ti ti-eye"></i></button></td>
    </tr>`;
  }).join('');
  return `<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table style="width:100%;min-width:960px">
    <thead><tr><th>Pessoa</th><th>Função</th><th style="text-align:center">Ativos hoje</th><th style="text-align:center">Em aberto</th><th>Próximo término</th><th>Última prevista</th><th style="text-align:center">Term. breve</th><th style="text-align:center">Sem período</th><th>Situação</th><th></th></tr></thead>
    <tbody>${linhas}</tbody>
  </table></div></div>`;
}

// ==================== LINHA DO TEMPO POR PAPEL ====================
// Quando cada consultor e cada analista ENTRA e SAI de cada projeto. A janela é POR PAPEL: o consultor acompanha o
// projeto do início ao fim; o analista entra quando as tarefas dele começam (na Folha, na configuração).
// v1: a cor da carga é provisória (nº de projetos simultâneos). A complexidade do projeto entra depois, em pesoDoProjeto().

const ALLOC_MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const ALLOC_PX_DIA = { mes: 6.6, semana: 11 };            // largura de 1 dia na tela, em cada escala
const ALLOC_LARGURA_NOME = 200;
const ALLOC_COR_CARGA = { livre: '#bae6fd', parcial: '#fef08a', cheio: '#fdba74' };
const ALLOC_COR_BARRA = {
  consultor: { bg: '#e0e7ff', borda: '#818cf8', texto: '#312e81' },
  analista:  { bg: '#ccfbf1', borda: '#2dd4bf', texto: '#134e4a' }
};
const _atDiasEntre = (a, b) => Math.round((b - a) / 86400000);
const _atSomaDias = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const _atDM = d => String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
const _atDMA = d => _atDM(d) + '/' + d.getFullYear();
const _atEsc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

// Peso do projeto na carga de quem trabalha nele. Hoje todos pesam 1 (conta projetos); a complexidade
// (pequeno / médio / grande) entra aqui na próxima versão, sem mexer no resto da tela.
function pesoDoProjeto(p) { return 1; }

function responsaveisDaTarefa(t) {
  return String(t.responsavel || '').split(';').map(s => s.trim().toLowerCase()).filter(Boolean);
}

// Projetos de módulo pequeno (Ponto, RH, Customização, sem Folha) não dividem papéis: quem está alocado executa o projeto completo.
// Sem módulo informado, vale o checklist (RH, Customização, Ponto).
function projetoSemDivisaoDePapeis(p) {
  if (projectHasModule(p, 'Folha')) return false;
  if (['Ponto', 'RH', 'Customização'].some(m => projectHasModule(p, m))) return true;
  return !(p.modulos || []).length && ['tpl3', 'tpl4', 'tpl5', 'tpl6', 'tpl8', 'tpl9'].includes(p.templateId);
}

// Quando o PAPEL (consultor ou analista) entra e sai de um projeto.
//  · quem executa o projeto COMPLETO (só há consultor ou só há analista; ou módulo sem divisão de papéis): do início ao fim;
//  · consultor: do início do projeto ao fim;
//  · analista: da primeira macro que tem tarefa dele (na Folha, a configuração), ou do primeiro prazo; se o projeto ainda
//    não tem datas nas macros, estima pela fração do checklist que vem antes da fase de entrada dele (barra "estimada");
//  · saída: o go-live, ou a última data de tarefa do papel se for depois.
// Devolve null quando não há como situar o papel no tempo.
function janelaDoPapel(p, papel) {
  const dIni = parseLocalDate(p.dataInicio), dGo = parseLocalDate(p.goLive);
  // Executa o projeto completo quando só há um dos papéis, ou quando o módulo não divide consultor e analista
  const soUmPapel = (listaPessoas(p.consultor).length > 0) !== (listaPessoas(p.analista).length > 0);
  const semDivisao = projetoSemDivisaoDePapeis(p);
  const executaTudo = soUmPapel || semDivisao;
  const motivo = !executaTudo ? null : (semDivisao ? 'módulo sem divisão entre consultor e analista' : 'só há ' + papel + ' neste projeto');
  const tarefas = (p.tasks || []).filter(t => executaTudo || responsaveisDaTarefa(t).includes(papel));
  const iniMacros = [], prazos = [], fins = [];
  tarefas.forEach(t => {
    const d = resolveTaskMacroDelivery(p, t), m = d && d._macro;
    const ms = m ? parseLocalDate(m.startDate) : null, me = m ? parseLocalDate(m.endDate) : null;
    if (ms) iniMacros.push(ms);
    if (me) fins.push(me);
    const pz = parseLocalDate(t.prazo);
    if (pz) { prazos.push(pz); fins.push(pz); }
  });
  const menor = l => l.length ? new Date(Math.min(...l.map(x => x.getTime()))) : null;
  const maior = l => l.length ? new Date(Math.max(...l.map(x => x.getTime()))) : null;
  const iniMacro = menor(iniMacros), iniPrazo = menor(prazos), fimTarefas = maior(fins);
  const todasFases = _ordenarFases([...new Set((p.tasks || []).map(t => t.fase).filter(Boolean))]);
  const faseEntrada = _ordenarFases([...new Set(tarefas.map(t => t.fase).filter(Boolean))])[0] || null;

  let inicio = null, fonte = null, estimado = false;
  if ((papel === 'consultor' || executaTudo) && dIni) { inicio = (iniMacro && iniMacro < dIni) ? iniMacro : dIni; fonte = 'projeto'; }
  else if (iniMacro) { inicio = iniMacro; fonte = 'macros'; }
  else if (iniPrazo) { inicio = iniPrazo; fonte = 'prazos'; }
  else if (dIni && dGo && tarefas.length && faseEntrada) {
    const antes = (p.tasks || []).filter(t => todasFases.indexOf(t.fase) < todasFases.indexOf(faseEntrada)).length;
    const frac = p.tasks.length ? antes / p.tasks.length : 0;
    inicio = _atSomaDias(dIni, Math.round(_atDiasEntre(dIni, dGo) * frac)); fonte = 'checklist'; estimado = true;
  } else if (dIni) { inicio = dIni; fonte = tarefas.length ? 'projeto' : 'sem-tarefas'; estimado = !tarefas.length; }

  let fim = null, fimFonte = null;
  if (dGo && fimTarefas && fimTarefas > dGo) { fim = fimTarefas; fimFonte = 'última tarefa do papel'; }
  else if (dGo) { fim = dGo; fimFonte = 'go-live'; }
  else if (fimTarefas) { fim = fimTarefas; fimFonte = 'última tarefa do papel'; }
  if (!inicio || !fim || fim < inicio) return null;
  return { inicio, fim, fonte, estimado, faseEntrada, fimFonte, motivo };
}

// Janela do PROJETO inteiro (para projeto em que ninguém foi alocado): do início ao fim, sem separar papéis
function janelaDoProjeto(p) {
  const dIni = parseLocalDate(p.dataInicio), dGo = parseLocalDate(p.goLive);
  const inicios = [], fins = [];
  (p.macroActivities || []).forEach(m => { const a = parseLocalDate(m.startDate), b = parseLocalDate(m.endDate); if (a) inicios.push(a); if (b) fins.push(b); });
  (p.tasks || []).forEach(t => { const z = parseLocalDate(t.prazo); if (z) { inicios.push(z); fins.push(z); } });
  const menor = l => l.length ? new Date(Math.min(...l.map(x => x.getTime()))) : null;
  const maior = l => l.length ? new Date(Math.max(...l.map(x => x.getTime()))) : null;
  const inicio = dIni || menor(inicios);
  const fimTarefas = maior(fins);
  const fim = (dGo && fimTarefas) ? (fimTarefas > dGo ? fimTarefas : dGo) : (dGo || fimTarefas);
  if (!inicio || !fim || fim < inicio) return null;
  return { inicio, fim, fonte: 'projeto', estimado: false, faseEntrada: null, fimFonte: (dGo && fimTarefas && fimTarefas > dGo) || !dGo ? 'última tarefa' : 'go-live', motivo: null };
}

// Projetos em que ninguém foi alocado (nem consultor nem analista): a demanda que ainda não tem dono
function projetosSemAlocacao() {
  return (state.projetos || []).filter(p => !listaPessoas(p.consultor).length && !listaPessoas(p.analista).length).map(p => {
    const prog = calculateProjectProgress(p);
    return { projectId: p.id, rotulo: p.cliente ? nomeCurtoDoCliente(p.cliente) : p.nome, rotuloCompleto: p.cliente || p.nome, projeto: p.nome, modulos: p.modulos, pct: prog.percent,
             concluido: prog.totalTasks > 0 && prog.percent === 100, janela: janelaDoProjeto(p) };
  });
}

// Quando a pessoa deixa de estar 100% alocada e quando fica livre. Olha TODAS as entradas dela na faixa (não só o período mostrado).
function liberacaoDaPessoa(ents, cap) {
  const hoje = _hojeLocal();
  const vigentes = ents.filter(e => e.janela.fim >= hoje);
  if (!vigentes.length) return { tipo: 'livre' };
  const proj = new Map((state.projetos || []).map(p => [p.id, p]));
  const cargaEm = d => {
    const vistos = new Set(); let soma = 0;
    ents.forEach(e => { if (e.janela.inicio <= d && e.janela.fim >= d && !vistos.has(e.projectId)) { vistos.add(e.projectId); soma += pesoDoProjeto(proj.get(e.projectId)); } });
    return soma;
  };
  const ultimoFim = new Date(Math.max(...vigentes.map(e => e.janela.fim.getTime())));
  const agora = cargaEm(hoje);
  if (agora >= cap) {
    // primeiro dia, depois de hoje, em que a carga cai abaixo de 100%
    const dia = vigentes.map(e => _atSomaDias(e.janela.fim, 1)).sort((a, b) => a - b).find(d => cargaEm(d) < cap);
    return { tipo: 'cheio', ate: dia ? _atSomaDias(dia, -1) : ultimoFim, livreEm: _atSomaDias(ultimoFim, 1) };
  }
  if (agora > 0) return { tipo: 'parcial', livreEm: _atSomaDias(ultimoFim, 1) };
  return { tipo: 'livre-ate', proximo: new Date(Math.min(...vigentes.map(e => e.janela.inicio.getTime()))) };   // livre hoje, projeto ainda vai começar
}
function textoLiberacao(lib) {
  if (lib.tipo === 'cheio') return { txt: `100% até ${_atDMA(lib.ate)}`, cor: '#c2410c', tip: `Alocado 100% até ${_atDMA(lib.ate)}. Livre a partir de ${_atDMA(lib.livreEm)}.` };
  if (lib.tipo === 'parcial') return { txt: `Livre a partir de ${_atDMA(lib.livreEm)}`, cor: '#92400e', tip: `Tem projeto em andamento; fica livre a partir de ${_atDMA(lib.livreEm)}.` };
  if (lib.tipo === 'livre-ate') return { txt: `Livre · próximo projeto em ${_atDMA(lib.proximo)}`, cor: '#0369a1', tip: `Livre hoje; o próximo projeto começa em ${_atDMA(lib.proximo)}.` };
  return { txt: 'Livre', cor: '#0369a1', tip: 'Sem projeto em andamento nem previsto.' };
}

// Todas as entradas "pessoa × papel × projeto", e os vínculos que não têm como ser situados no tempo
function entradasDeAlocacao() {
  const entradas = [], semPeriodo = [];
  (state.projetos || []).forEach(p => {
    const prog = calculateProjectProgress(p);
    const concluido = prog.totalTasks > 0 && prog.percent === 100;
    ['consultor', 'analista'].forEach(papel => {
      const nomes = listaPessoas(p[papel]);
      if (!nomes.length) return;
      const janela = janelaDoPapel(p, papel);
      nomes.forEach(nome => {
        const e = { papel, personKey: normalizePersonName(nome), nome, projectId: p.id, rotulo: p.cliente ? nomeCurtoDoCliente(p.cliente) : p.nome, rotuloCompleto: p.cliente || p.nome, projeto: p.nome, concluido, janela, modulos: p.modulos };
        (janela ? entradas : semPeriodo).push(e);
      });
    });
  });
  return { entradas, semPeriodo };
}

function pessoasDaBanda(papel, entradas, semPeriodo) {
  const mapa = new Map();
  (state.users || []).forEach(u => {
    if ((u.tipo || '').toLowerCase() === papel && u.active !== false) mapa.set(normalizePersonName(u.name), { personKey: normalizePersonName(u.name), nome: u.name });
  });
  [...entradas, ...semPeriodo].filter(e => e.papel === papel).forEach(e => {
    if (!mapa.has(e.personKey)) mapa.set(e.personKey, { personKey: e.personKey, nome: e.nome });
  });
  return [...mapa.values()].sort((a, b) => a.nome.localeCompare(b.nome));
}

// ── Fase do projeto ao longo do tempo ──
// A cor da barra fica mais forte conforme o projeto avança de fase (Diagnóstico mais claro, Go-live mais forte), para
// ver em que fase cada projeto de uma pessoa está em cada semana ou mês, e daí a noção de esforço do período.
const ALLOC_RAMPA = {
  consultor: ['#eef2ff', '#dbe2ff', '#bcc8ff', '#97a6fb', '#7081f0'],
  analista:  ['#ecfdf9', '#c7f7ee', '#93ebdc', '#5cd9c5', '#2fbfaa'],
  sem:       ['#fff1f2', '#ffe0e4', '#ffc2cb', '#ff9eae', '#fb7185']
};
function rotuloCurtoFase(f) {
  const s = String(f || '').replace(/^Fase\s*\d+\s*-\s*/i, '').trim();
  const mapa = { 'Configuração do Sistema': 'Configuração', 'Pré Paralelo': 'Pré-paralelo', 'Paralelo Oficial': 'Paralelo', 'Treinamentos': 'Treinamento',
    'Go-Live': 'Go-live', 'Go live': 'Go-live', 'Operação assistida': 'Op. assistida', 'Mobilização e especificação': 'Mobilização', 'Testes e homologação': 'Testes', 'Desenvolvimento': 'Desenv.' };
  return mapa[s] || (s.length > 14 ? s.slice(0, 13) + '…' : s);
}

// Em que fase o projeto está em cada período: devolve faixas contínuas [{fase, rotulo, ini, fim, nivel, estimado}].
// O início de cada fase é a primeira macro com tarefa dela (sem macro datada, o primeiro prazo). Sem data nenhuma, o período
// do projeto é repartido pela quantidade de tarefas de cada fase (estimado). A 1ª faixa vale desde sempre e a última, para sempre.
function fasesNoTempo(p) {
  const tasks = (p && p.tasks) || [];
  const fases = _ordenarFases([...new Set(tasks.map(t => t.fase).filter(Boolean))]);
  if (!fases.length) return [];
  const dIni = parseLocalDate(p.dataInicio), dGo = parseLocalDate(p.goLive);
  const menor = l => l.length ? new Date(Math.min(...l.map(x => x.getTime()))) : null;
  const inicios = fases.map(f => {
    const ms = [], pz = [];
    tasks.filter(t => t.fase === f).forEach(t => {
      const d = resolveTaskMacroDelivery(p, t), m = d && d._macro;
      const a = m ? parseLocalDate(m.startDate) : null; if (a) ms.push(a);
      const z = parseLocalDate(t.prazo); if (z) pz.push(z);
    });
    return menor(ms) || menor(pz);
  });
  let estimado = false;
  if (inicios.every(i => !i)) {
    if (!dIni || !dGo) return [];
    estimado = true;
    let acum = 0;
    fases.forEach((f, k) => { inicios[k] = _atSomaDias(dIni, Math.round(_atDiasEntre(dIni, dGo) * acum / (tasks.length || 1))); acum += tasks.filter(t => t.fase === f).length; });
  }
  // as fronteiras nunca andam para trás; fase sem data herda a anterior; fase que começa junto com a seguinte não tem duração
  const lim = []; let anterior = null;
  inicios.forEach((i, k) => { let b = i || anterior; if (b && anterior && b < anterior) b = anterior; lim[k] = b; if (b) anterior = b; });
  const mantidas = [];
  fases.forEach((f, k) => { if (lim[k] && !lim.slice(k + 1).some(v => v && v.getTime() === lim[k].getTime())) mantidas.push(k); });
  return mantidas.map((k, j) => ({
    fase: fases[k], rotulo: rotuloCurtoFase(fases[k]), estimado,
    nivel: fases.length > 1 ? Math.round(k / (fases.length - 1) * 4) : 2,
    ini: j === 0 ? new Date(1900, 0, 1) : lim[k],
    fim: j === mantidas.length - 1 ? new Date(2200, 0, 1) : _atSomaDias(lim[mantidas[j + 1]], -1)
  }));
}
function faseEmData(segs, d) { return (segs || []).find(s => s.ini <= d && s.fim >= d) || null; }

// Nome do cliente nas barras: no máximo 2 nomes ("AAK do Brasil Indústria e Comércio..." vira "AAK do Brasil").
// Ligações (de, do, da, dos, das, e) não contam como nome, mas ficam quando estão entre dois nomes.
function nomeCurtoDoCliente(nome, max = 2) {
  const palavras = String(nome || '').trim().split(/\s+/).filter(Boolean);
  const ligacao = new Set(['de', 'do', 'da', 'dos', 'das', 'e']);
  const saida = []; let nomes = 0;
  for (const w of palavras) {
    const lig = ligacao.has(w.toLowerCase()) && saida.length > 0;
    if (!lig && nomes >= max) break;
    saida.push(w); if (!lig) nomes++;
  }
  while (saida.length > 1 && ligacao.has(saida[saida.length - 1].toLowerCase())) saida.pop();   // não termina em "de" ou "e"
  return saida.join(' ').replace(/[\s,;:(\-–]+$/, '');
}

// ── configuração da tela (escala, período, regra de cor), lembrada entre as sessões ──
function allocTLCfg() {
  if (!state.allocTL || typeof state.allocTL !== 'object') {
    let salvo = {};
    try { salvo = JSON.parse(localStorage.getItem('dos_alloc_tl') || '{}') || {}; } catch (e) { salvo = {}; }
    state.allocTL = Object.assign({ escala: 'mes', meses: 6, inicio: null, capConsultor: 3, capAnalista: 3, concluidos: false, busca: '', modulo: '' }, salvo);
  }
  const c = state.allocTL;
  if (c.escala !== 'semana') c.escala = 'mes';
  c.meses = [3, 6, 12].includes(Number(c.meses)) ? Number(c.meses) : 6;
  ['capConsultor', 'capAnalista'].forEach(k => { const v = parseInt(c[k], 10); c[k] = (v >= 1 && v <= 20) ? v : 3; });
  if (typeof c.busca !== 'string') c.busca = '';
  if (typeof c.modulo !== 'string') c.modulo = '';
  c.concluidos = !!c.concluidos;
  return c;
}
function allocTLSalvar() {
  try {
    const { escala, meses, capConsultor, capAnalista, concluidos } = state.allocTL;
    localStorage.setItem('dos_alloc_tl', JSON.stringify({ escala, meses, capConsultor, capAnalista, concluidos }));
  } catch (e) { /* sem armazenamento local: a tela funciona igual */ }
}
function allocTLBase(c) {
  if (c.inicio) { const [y, m] = c.inicio.split('-').map(Number); return new Date(y, m - 1, 1); }
  const h = _hojeLocal(); return new Date(h.getFullYear(), h.getMonth(), 1);
}
function allocTLSet(chave, valor) {
  const c = allocTLCfg();
  c[chave] = valor;
  if (chave === 'escala' && valor === 'semana' && c.meses > 3) c.meses = 3;   // na semana, 3 meses já são 13 colunas
  allocTLCfg();      // normaliza (números como números) ANTES de guardar
  allocTLSalvar();
  renderAllocationMatrix();
}
function allocTLShift(delta) {
  const c = allocTLCfg(), b = allocTLBase(c);
  b.setMonth(b.getMonth() + delta);
  c.inicio = `${b.getFullYear()}-${String(b.getMonth() + 1).padStart(2, '0')}`;
  renderAllocationMatrix();
}
function allocTLReset() { allocTLCfg().inicio = null; renderAllocationMatrix(); }

function renderAllocationRoleTimeline() {
  const c = allocTLCfg();
  const pxDia = ALLOC_PX_DIA[c.escala];
  const base = allocTLBase(c);
  const baseIni = new Date(base.getFullYear(), base.getMonth(), 1);
  const baseFim = new Date(base.getFullYear(), base.getMonth() + c.meses, 0);
  // Na escala Semana a tela vai de segunda a domingo, para não sobrar uma semana cortada de 1 dia nas pontas
  let rIni = baseIni, rFim = baseFim;
  if (c.escala === 'semana') { rIni = _atSomaDias(baseIni, -((baseIni.getDay() + 6) % 7)); rFim = _atSomaDias(baseFim, (7 - baseFim.getDay()) % 7); }
  const largura = Math.round((_atDiasEntre(rIni, rFim) + 1) * pxDia);
  const x = d => Math.round(_atDiasEntre(rIni, d) * pxDia);
  const hoje = _hojeLocal();
  const hojeNoPeriodo = hoje >= rIni && hoje <= rFim;

  // colunas: meses, ou semanas (segunda a domingo) quando a escala é Semana
  const meses = [];
  for (let d = new Date(rIni.getFullYear(), rIni.getMonth(), 1); d <= rFim; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    const fimMes = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    meses.push({ ini: d < rIni ? rIni : d, fim: fimMes > rFim ? rFim : fimMes, label: `${ALLOC_MESES[d.getMonth()]}/${String(d.getFullYear()).slice(2)}` });
  }
  let colunas = meses;
  if (c.escala === 'semana') {
    colunas = [];
    for (let d = new Date(rIni); d <= rFim; d = _atSomaDias(d, 7)) colunas.push({ ini: new Date(d), fim: _atSomaDias(d, 6), label: _atDM(d) });
  }
  const rotuloPeriodo = `${ALLOC_MESES[baseIni.getMonth()]}/${String(baseIni.getFullYear()).slice(2)} — ${ALLOC_MESES[baseFim.getMonth()]}/${String(baseFim.getFullYear()).slice(2)}`;
  const larg = col => Math.round((_atDiasEntre(col.ini, col.fim) + 1) * pxDia);

  // dados, já com busca, módulo e concluídos
  const { entradas: todas, semPeriodo: todasSem } = entradasDeAlocacao();
  const busca = _normTxt(c.busca || '');
  const projetoPorId = new Map((state.projetos || []).map(p => [p.id, p]));
  const cacheFases = new Map();
  const fasesDoProjeto = pid => { if (!cacheFases.has(pid)) cacheFases.set(pid, fasesNoTempo(projetoPorId.get(pid))); return cacheFases.get(pid); };
  const filtrando = !!(busca || c.modulo);
  const passa = (e, pessoaCasa) => {
    if (!c.concluidos && e.concluido) return false;
    if (c.modulo && !moduleListHasModule(e.modulos, c.modulo)) return false;
    if (busca && !pessoaCasa && !_normTxt(e.rotuloCompleto).includes(busca) && !_normTxt(e.projeto).includes(busca)) return false;
    return true;
  };
  const casaPessoa = nome => !!busca && _normTxt(nome).includes(busca);
  const entradasFiltradas = todas.filter(e => passa(e, casaPessoa(e.nome)));
  const semPeriodoFiltradas = todasSem.filter(e => passa(e, casaPessoa(e.nome)));

  const cabecalho = `<div style="display:flex">
      <div style="flex:0 0 ${ALLOC_LARGURA_NOME}px;width:${ALLOC_LARGURA_NOME}px;min-width:${ALLOC_LARGURA_NOME}px;max-width:${ALLOC_LARGURA_NOME}px;position:sticky;left:0;z-index:5;background:#fff;border-right:1px solid var(--gray-200)"></div>
      <div style="position:relative;flex:0 0 ${largura}px;width:${largura}px;height:${c.escala === 'semana' ? 50 : 28}px">
        ${meses.map(m => `<div style="position:absolute;left:${x(m.ini)}px;top:0;width:${larg(m)}px;height:26px;box-sizing:border-box;border-left:1px solid var(--gray-200);padding:5px 8px;font-size:12px;font-weight:700;color:var(--gray-700);background:var(--gray-50);overflow:hidden;white-space:nowrap">${m.label}</div>`).join('')}
        ${c.escala === 'semana' ? colunas.map(w => `<div style="position:absolute;left:${x(w.ini)}px;top:26px;width:${larg(w)}px;height:22px;box-sizing:border-box;border-left:1px solid var(--gray-200);padding:4px 5px;font-size:10.5px;color:var(--gray-500)">${w.label}</div>`).join('') : ''}
        ${hojeNoPeriodo ? `<div title="Hoje" style="position:absolute;left:${x(hoje)}px;top:0;bottom:0;width:2px;background:#ef4444;opacity:.6"></div>` : ''}
      </div>
    </div>`;

  // Barra do projeto, dividida por fase: a cor fica mais forte conforme a fase avança
  const desenharBarra = ({ janela, projectId, atributo, rampa, borda, texto, topPx, rotulo, concluido, tip }) => {
    const a = janela.inicio < rIni ? rIni : janela.inicio, b = janela.fim > rFim ? rFim : janela.fim;
    const left = x(a), w = Math.max(x(_atSomaDias(b, 1)) - left, 8);
    const cortaE = janela.inicio < rIni, cortaD = janela.fim > rFim;
    const raio = `${cortaE ? 0 : 6}px ${cortaD ? 0 : 6}px ${cortaD ? 0 : 6}px ${cortaE ? 0 : 6}px`;
    const partes = fasesDoProjeto(projectId).map(s => {
      const sa = s.ini > a ? s.ini : a, sb = s.fim < b ? s.fim : b;
      return sa <= sb ? { s, l: x(sa) - left, w: Math.max(x(_atSomaDias(sb, 1)) - x(sa), 1) } : null;
    }).filter(Boolean);
    const fundo = partes.length
      ? partes.map((pt, i) => `<div data-alloc-fase-nivel="${pt.s.nivel}" title="${_atEsc(pt.s.rotulo)}" style="position:absolute;left:${pt.l}px;top:0;bottom:0;width:${pt.w}px;box-sizing:border-box;background:${rampa[pt.s.nivel]};${i ? 'border-left:1px solid rgba(255,255,255,.95);' : ''}"></div>`).join('')
      : `<div style="position:absolute;left:0;top:0;right:0;bottom:0;background:${rampa[2]}"></div>`;
    const estimado = !!janela.estimado;                         // listra e tracejado: só quando o PERÍODO da pessoa é estimado
    const fasesEstimadas = partes.some(pt => pt.s.estimado);    // a divisão em fases é estimada (projeto sem datas nas macros e tarefas)
    const hachura = estimado ? `<div style="position:absolute;left:0;top:0;right:0;bottom:0;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.7) 0 5px,transparent 5px 10px);pointer-events:none"></div>` : '';
    const rotuloHTML = w >= 46 ? `<div style="position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;max-width:100%;margin:3px 0 0 5px;height:16px;padding:0 6px;border-radius:4px;background:rgba(255,255,255,.78);color:${texto};font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;box-sizing:border-box">
        <span style="overflow:hidden;text-overflow:ellipsis">${_atEsc(rotulo)}</span>${w >= 190 ? `<span style="font-weight:500;font-size:10px;opacity:.75;flex-shrink:0">${_atDM(janela.inicio)}–${_atDM(janela.fim)}</span>` : ''}</div>` : '';
    return `<div ${atributo}="${projectId}" data-alloc-estimada="${estimado ? 1 : 0}" data-alloc-fases-estimadas="${fasesEstimadas ? 1 : 0}" title="${_atEsc(tip + (fasesEstimadas ? '\n(as fases são estimadas pela quantidade de tarefas de cada uma: o projeto ainda não tem datas nas macros nem nas tarefas)' : ''))}" onclick="abrirProjeto('${projectId}')" style="position:absolute;left:${left}px;top:${topPx}px;width:${w}px;height:24px;box-sizing:border-box;border:1px ${estimado ? 'dashed' : 'solid'} ${borda};border-radius:${raio};overflow:hidden;cursor:pointer;${concluido ? 'opacity:.55;' : ''}z-index:1">${fundo}${hachura}${rotuloHTML}</div>`;
  };

  const trilhaHTML = (papel, entsPessoa, cap) => {
    const vis = entsPessoa.filter(e => e.janela.inicio <= rFim && e.janela.fim >= rIni)
      .sort((a, b) => a.janela.inicio - b.janela.inicio || a.janela.fim - b.janela.fim);
    const faixas = [];
    vis.forEach(e => { let k = faixas.findIndex(fim => fim < e.janela.inicio); if (k < 0) { k = faixas.length; faixas.push(null); } faixas[k] = e.janela.fim; e._faixa = k; });
    const nFaixas = Math.max(faixas.length, 1);
    const altHeat = 24, altFases = 16, altFaixa = 24;
    const altura = altHeat + altFases + 6 + nFaixas * (altFaixa + 3) + 3;
    const cor = ALLOC_COR_BARRA[papel];

    let fasesLinha = '';
    const heat = colunas.map(col => {
      const naCol = vis.filter(e => e.janela.inicio <= col.fim && e.janela.fim >= col.ini);
      // em que fase está cada projeto no meio do período (da semana ou do mês)
      const compo = new Map();
      naCol.forEach(e => {
        const a0 = e.janela.inicio > col.ini ? e.janela.inicio : col.ini, b0 = e.janela.fim < col.fim ? e.janela.fim : col.fim;
        const s = faseEmData(fasesDoProjeto(e.projectId), _atSomaDias(a0, Math.floor(_atDiasEntre(a0, b0) / 2)));
        const k = s ? s.rotulo : 'sem fase';
        const it = compo.get(k) || { n: 0, nivel: s ? s.nivel : -1, projetos: [] }; it.n++; it.projetos.push(e.rotulo); compo.set(k, it);
      });
      const ordemFases = [...compo.entries()].sort((p1, q1) => q1[1].n - p1[1].n || q1[1].nivel - p1[1].nivel);
      const textoFases = ordemFases.map(([k, v]) => `${v.n} ${k}`).join(' · ');
      const tipFases = ordemFases.map(([k, v]) => `${k}: ${v.projetos.join(', ')}`).join('\n');
      fasesLinha += `<div data-alloc-fases="${_atEsc(textoFases)}" title="${_atEsc(col.label + (tipFases ? ' — fase de cada projeto\n' + tipFases : ''))}" style="position:absolute;left:${x(col.ini)}px;top:${altHeat}px;width:${larg(col)}px;height:${altFases}px;box-sizing:border-box;padding:0 4px;background:#f8fafc;border-right:1px solid #fff;font-size:10px;line-height:${altFases}px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${_atEsc(textoFases)}</div>`;
      const ids = [...new Set(naCol.map(e => e.projectId))];
      const carga = ids.reduce((s, id) => s + pesoDoProjeto(projetoPorId.get(id)), 0);
      const nivel = carga === 0 ? 'livre' : (carga >= cap ? 'cheio' : 'parcial');
      const rotuloNivel = nivel === 'livre' ? 'Disponível para alocação' : (nivel === 'cheio' ? 'Alocado 100%' : 'Possível conciliar projeto de porte pequeno');
      const tip = `${col.label}: ${rotuloNivel}${ids.length ? '\n' + [...new Set(naCol.map(e => e.rotulo))].join('\n') : ''}`;
      return `<div data-alloc-calor="${nivel}" data-alloc-n="${ids.length}" title="${_atEsc(tip)}" style="position:absolute;left:${x(col.ini)}px;top:0;width:${larg(col)}px;height:${altHeat}px;box-sizing:border-box;background:${ALLOC_COR_CARGA[nivel]};border-right:1px solid #fff;text-align:center;font-size:11px;font-weight:700;line-height:${altHeat}px;color:#475569">${ids.length ? ids.length : '<span style="font-weight:500;font-size:10px;opacity:.7">livre</span>'}</div>`;
    }).join('');

    const linhasColuna = colunas.map(col => `<div style="position:absolute;left:${x(col.ini)}px;top:${altHeat + altFases}px;bottom:0;border-left:1px solid #eef2f7"></div>`).join('');

    const barras = vis.map(e => {
      const fonteTxt = { projeto: 'início do projeto', macros: 'início da primeira macro com tarefa do ' + papel, prazos: 'primeiro prazo de uma tarefa do ' + papel + ' (aproximado)',
        checklist: 'ESTIMADO: o projeto ainda não tem datas nas macros; o ' + papel + ' só entra na fase ' + (e.janela.faseEntrada || '') + ', depois de parte do checklist',
        'sem-tarefas': 'ESTIMADO: o checklist não tem tarefas para o ' + papel + '; usado o período do projeto' }[e.janela.fonte];
      const tip = `${e.rotuloCompleto}${e.projeto !== e.rotuloCompleto ? ' — ' + e.projeto : ''}\n${e.nome} (${papel})${e.janela.motivo ? '\nExecuta o projeto completo: ' + e.janela.motivo : ''}\nEntra: ${_atDMA(e.janela.inicio)} (${fonteTxt})${e.janela.faseEntrada && papel === 'analista' ? '\nFase de entrada: ' + e.janela.faseEntrada : ''}\nSai: ${_atDMA(e.janela.fim)} (${e.janela.fimFonte})${e.concluido ? '\nProjeto concluído' : ''}`;
      const segsP = fasesDoProjeto(e.projectId);
      const emJanela = segsP.filter(s => s.ini <= e.janela.fim && s.fim >= e.janela.inicio);
      const faseHoje = (hoje >= e.janela.inicio && hoje <= e.janela.fim) ? faseEmData(segsP, hoje) : null;
      const tipFases = (emJanela.length ? '\nFases: ' + emJanela.map(s => `${s.rotulo} (${_atDM(s.ini > e.janela.inicio ? s.ini : e.janela.inicio)}–${_atDM(s.fim < e.janela.fim ? s.fim : e.janela.fim)})`).join(' → ') + (emJanela.some(s => s.estimado) ? ' [fases estimadas]' : '') : '')
        + (faseHoje ? '\nHoje: ' + faseHoje.rotulo : '');
      return desenharBarra({ janela: e.janela, projectId: e.projectId, atributo: 'data-alloc-barra', rampa: ALLOC_RAMPA[papel], borda: cor.borda, texto: cor.texto,
        topPx: altHeat + altFases + 6 + e._faixa * (altFaixa + 3), rotulo: e.rotulo, concluido: e.concluido, tip: tip + tipFases });
    }).join('');

    const linhaHoje = hojeNoPeriodo ? `<div style="position:absolute;left:${x(hoje)}px;top:0;bottom:0;width:2px;background:#ef4444;opacity:.45;z-index:2;pointer-events:none"></div>` : '';
    return { altura, nVis: [...new Set(vis.map(e => e.projectId))].length,
      html: `<div style="position:relative;flex:0 0 ${largura}px;width:${largura}px;height:${altura}px">${heat}${fasesLinha}${linhasColuna}${barras}${linhaHoje}</div>` };
  };

  const banda = (papel, titulo, cap) => {
    const pessoas = pessoasDaBanda(papel, entradasFiltradas, semPeriodoFiltradas);
    const linhas = pessoas.map(pe => {
      const ents = entradasFiltradas.filter(e => e.papel === papel && e.personKey === pe.personKey);
      const sem = semPeriodoFiltradas.filter(e => e.papel === papel && e.personKey === pe.personKey);
      if (filtrando && !ents.length && !sem.length) return '';
      const t = trilhaHTML(papel, ents, cap);
      const lib = textoLiberacao(liberacaoDaPessoa(todas.filter(e => e.papel === papel && e.personKey === pe.personKey && (c.concluidos || !e.concluido)), cap));
      const usr = (state.users || []).find(u => normalizePersonName(u.name) === pe.personKey);
      const corAv = usr && usr.color ? usr.color : '#64748b';
      return `<div data-alloc-pessoa="${pe.personKey}" data-alloc-papel="${papel}" style="display:flex;border-top:1px solid var(--gray-100)">
        <div style="flex:0 0 ${ALLOC_LARGURA_NOME}px;width:${ALLOC_LARGURA_NOME}px;min-width:${ALLOC_LARGURA_NOME}px;max-width:${ALLOC_LARGURA_NOME}px;overflow:hidden;box-sizing:border-box;position:sticky;left:0;z-index:4;background:#fff;border-right:1px solid var(--gray-200);padding:8px 10px;display:flex;gap:8px;align-items:flex-start">
          <div class="user-avatar" style="width:28px;height:28px;font-size:10px;flex-shrink:0;background:${corAv}">${_iniciais(pe.nome)}</div>
          <div style="min-width:0;flex:1;overflow:hidden"><div style="font-size:13px;font-weight:700;line-height:1.25;color:var(--gray-800);cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word" title="${_atEsc(pe.nome)}" onclick="showPersonAllocationMatrixDetails('${pe.personKey}')">${_atEsc(pe.nome)}</div>
            <div style="font-size:11px;color:var(--gray-400);margin-top:2px">${t.nVis ? t.nVis + ' projeto' + (t.nVis > 1 ? 's' : '') + ' no período' : 'sem projeto no período'}${sem.length ? ` · <span title="Sem datas: ${_atEsc(sem.map(s => s.rotulo).join(', '))}" style="color:#b45309">${sem.length} sem datas</span>` : ''}</div>
            <div data-alloc-liberacao title="${_atEsc(lib.tip)}" style="font-size:11px;font-weight:600;margin-top:2px;color:${lib.cor}">${_atEsc(lib.txt)}</div></div>
        </div>${t.html}</div>`;
    }).join('');
    const nPessoas = pessoas.filter(pe => !filtrando || entradasFiltradas.some(e => e.papel === papel && e.personKey === pe.personKey) || semPeriodoFiltradas.some(e => e.papel === papel && e.personKey === pe.personKey)).length;
    const cor = ALLOC_COR_BARRA[papel];
    return `<div style="display:flex;background:#f1f5f9;border-top:2px solid ${cor.borda}">
        <div style="position:sticky;left:0;z-index:4;padding:7px 10px;font-size:12px;font-weight:800;letter-spacing:.5px;color:#334155;text-transform:uppercase;white-space:nowrap">${titulo} <span style="font-weight:500;color:var(--gray-500);text-transform:none;letter-spacing:0">· ${nPessoas} pessoa${nPessoas !== 1 ? 's' : ''}</span></div>
      </div>${linhas || `<div style="padding:14px 12px;font-size:12px;color:var(--gray-400);position:sticky;left:0">Nenhuma pessoa nesta faixa${filtrando ? ' com os filtros atuais' : ''}.</div>`}`;
  };

  // Terceira faixa: projetos abertos em que ninguém foi alocado. É a demanda que ainda não tem dono.
  const bandaSemAlocacao = () => {
    const todos = projetosSemAlocacao().filter(e => (c.concluidos || !e.concluido)
      && (!c.modulo || moduleListHasModule(e.modulos, c.modulo))
      && (!busca || _normTxt(e.rotuloCompleto).includes(busca) || _normTxt(e.projeto).includes(busca)));
    const comJanela = todos.filter(e => e.janela), semDatas = todos.filter(e => !e.janela);
    const visiveis = comJanela.filter(e => e.janela.inicio <= rFim && e.janela.fim >= rIni).sort((a, b) => a.janela.inicio - b.janela.inicio);
    const fora = comJanela.length - visiveis.length;
    const cor = { bg: '#ffe4e6', borda: '#fb7185', texto: '#881337' };
    const resumo = colunas.map(col => {
      const n = visiveis.filter(e => e.janela.inicio <= col.fim && e.janela.fim >= col.ini).length;
      return `<div data-alloc-sem-n="${n}" title="${_atEsc(col.label + ': ' + (n ? n + ' projeto(s) sem ninguém alocado' : 'nenhum projeto sem alocação'))}" style="position:absolute;left:${x(col.ini)}px;top:0;width:${larg(col)}px;height:24px;box-sizing:border-box;background:${n ? '#fecdd3' : '#f8fafc'};border-right:1px solid #fff;text-align:center;font-size:11px;font-weight:700;line-height:24px;color:${n ? '#9f1239' : '#cbd5e1'}">${n || '—'}</div>`;
    }).join('');
    const linhas = visiveis.map(e => {
      const segsS = fasesDoProjeto(e.projectId).filter(s => s.ini <= e.janela.fim && s.fim >= e.janela.inicio);
      const tip = `${e.rotuloCompleto}${e.projeto !== e.rotuloCompleto ? ' — ' + e.projeto : ''}\nSem consultor nem analista alocado\nPeríodo: ${_atDMA(e.janela.inicio)} a ${_atDMA(e.janela.fim)}\n${e.pct}% concluído`
        + (segsS.length ? '\nFases: ' + segsS.map(s => `${s.rotulo} (${_atDM(s.ini > e.janela.inicio ? s.ini : e.janela.inicio)}–${_atDM(s.fim < e.janela.fim ? s.fim : e.janela.fim)})`).join(' → ') : '');
      const colunasLin = colunas.map(col => `<div style="position:absolute;left:${x(col.ini)}px;top:0;bottom:0;border-left:1px solid #eef2f7"></div>`).join('');
      const modulosTxt = [...new Set((e.modulos || []).map(m => String(m).split(':')[0]))].join(' + ');
      return `<div data-alloc-sem="${e.projectId}" style="display:flex;border-top:1px solid var(--gray-100)">
        <div style="flex:0 0 ${ALLOC_LARGURA_NOME}px;width:${ALLOC_LARGURA_NOME}px;min-width:${ALLOC_LARGURA_NOME}px;max-width:${ALLOC_LARGURA_NOME}px;overflow:hidden;box-sizing:border-box;position:sticky;left:0;z-index:4;background:#fff;border-right:1px solid var(--gray-200);padding:7px 10px">
          <div style="font-size:13px;font-weight:700;line-height:1.25;color:var(--gray-800);cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word" title="${_atEsc(e.rotuloCompleto + (e.projeto !== e.rotuloCompleto ? ' — ' + e.projeto : ''))}" onclick="abrirProjeto('${e.projectId}')">${_atEsc(e.rotulo)}</div>
          <div style="font-size:11px;color:var(--gray-400);margin-top:2px">${_atEsc(modulosTxt || 'sem módulo')} · ${e.pct}% concluído</div>
        </div>
        <div style="position:relative;flex:0 0 ${largura}px;width:${largura}px;height:40px">${colunasLin}
          ${desenharBarra({ janela: e.janela, projectId: e.projectId, atributo: 'data-alloc-sem-barra', rampa: ALLOC_RAMPA.sem, borda: cor.borda, texto: cor.texto, topPx: 8, rotulo: e.rotulo, concluido: e.concluido, tip })}
          ${hojeNoPeriodo ? `<div style="position:absolute;left:${x(hoje)}px;top:0;bottom:0;width:2px;background:#ef4444;opacity:.45;z-index:2;pointer-events:none"></div>` : ''}
        </div>
      </div>`;
    }).join('');
    const rodape = [
      fora ? `${fora} projeto${fora > 1 ? 's' : ''} sem alocação fora do período mostrado` : '',
      semDatas.length ? `${semDatas.length} sem alocação e sem datas: ${semDatas.map(e => `<a style="cursor:pointer;text-decoration:underline" onclick="abrirProjeto('${e.projectId}')">${_atEsc(e.rotulo)}</a>`).join(', ')}` : ''
    ].filter(Boolean).join(' · ');
    return `<div data-alloc-banda-sem style="display:flex;background:#fff1f2;border-top:2px solid #fb7185">
        <div style="position:sticky;left:0;z-index:4;padding:7px 10px;font-size:12px;font-weight:800;letter-spacing:.5px;color:#9f1239;text-transform:uppercase;white-space:nowrap">Sem alocação <span style="font-weight:500;color:var(--gray-500);text-transform:none;letter-spacing:0">· ${todos.length} projeto${todos.length !== 1 ? 's' : ''} aberto${todos.length !== 1 ? 's' : ''} sem consultor nem analista</span></div>
      </div>
      ${todos.length ? `<div style="display:flex;border-top:1px solid var(--gray-100)">
        <div style="flex:0 0 ${ALLOC_LARGURA_NOME}px;width:${ALLOC_LARGURA_NOME}px;min-width:${ALLOC_LARGURA_NOME}px;max-width:${ALLOC_LARGURA_NOME}px;box-sizing:border-box;position:sticky;left:0;z-index:4;background:#fff;border-right:1px solid var(--gray-200);padding:5px 10px;font-size:11px;color:var(--gray-500)">Projetos sem ninguém, por período</div>
        <div style="position:relative;flex:0 0 ${largura}px;width:${largura}px;height:24px">${resumo}</div></div>` : ''}
      ${linhas}
      ${todos.length ? '' : `<div style="padding:14px 12px;font-size:12px;color:#15803d;position:sticky;left:0">Nenhum projeto aberto está sem alocação${filtrando ? ' com os filtros atuais' : ''}.</div>`}

// ==================== VISÃO POR PROJETO ====================
function renderAllocationProjectsView() {
  const f = state.allocationMatrixFilters;
  let projetos = (state.projetos || []);
  // aplica filtros compatíveis
  const busca = _normTxt(f.search||'');
  if (busca) projetos = projetos.filter(p => _normTxt(p.nome).includes(busca)||_normTxt(p.cliente||'').includes(busca)||_normTxt(p.consultor||'').includes(busca)||_normTxt(p.analista||'').includes(busca));
  if (f.module) projetos = projetos.filter(p => projectHasModule(p, f.module));
  if (f.projectStatus) projetos = projetos.filter(p => getProjectExecutiveStatus(p).key===f.projectStatus);

  if (!projetos.length) {
    return `<div class="card"><div class="empty"><i class="ti ti-folder-off"></i><p>${state.projetos&&state.projetos.length?'Nenhuma pessoa ou projeto corresponde aos filtros selecionados.':'Nenhum projeto cadastrado.'}</p>${state.projetos&&state.projetos.length?`<small><button class="btn btn-secondary btn-sm" onclick="clearAllocationMatrixFilters()"><i class="ti ti-x"></i> Limpar filtros</button></small>`:''}</div></div>`;
  }

  const linhas = projetos.map(p => {
    const fase = getProjectCurrentPhase(p);
    const prog = calculateProjectProgress(p);
    const st = getProjectExecutiveStatus(p);
    const dl = p.goLive ? daysLeft(p.goLive) : null;
    const mesmaPessoa = p.consultor && p.analista && normalizePersonName(p.consultor)===normalizePersonName(p.analista);
    const profissionais = mesmaPessoa
      ? `<div style="font-size:12px"><span style="color:var(--gray-400)">Consultor e Analista:</span> ${exibirPessoas(p.consultor)}</div>`
      : `<div style="font-size:12px"><span style="color:var(--gray-400)">Consultor:</span> ${p.consultor||'—'}</div><div style="font-size:12px"><span style="color:var(--gray-400)">Analista:</span> ${p.analista||'—'}</div>`;
    const semInicio = !p.dataInicio, semGoLive = !p.goLive;
    return `<tr>
      <td style="cursor:pointer" onclick="abrirProjeto('${p.id}')"><div style="font-size:13px;font-weight:600;color:var(--accent)">${p.nome}</div><div style="font-size:11px;color:var(--gray-400)">${p.cliente||'—'}</div></td>
      <td>${fase.notStarted?`<span class="badge badge-gray" style="font-size:10px">Não iniciada</span>`:faseBadge(fase.name)}</td>
      <td><div style="font-size:13px;font-weight:700;color:${prog.percent===100?'var(--success)':'var(--accent)'}">${prog.percent}%</div></td>
      <td>${profissionais}</td>
      <td><div style="font-size:12px">${semInicio?'<span style="color:var(--warn)" title="Projeto sem início">Sem início</span>':fmt(p.dataInicio)}</div><div style="font-size:12px;color:${dl!=null&&dl<0?'var(--danger)':dl!=null&&dl<=30?'var(--warn)':'var(--gray-500)'}">${semGoLive?'<span style="color:var(--warn)" title="Projeto sem Go-live">Sem Go-live</span>':fmt(p.goLive)}${dl!=null?` <span style="font-size:10px">(${dl<0?Math.abs(dl)+'d venc.':dl+'d'})</span>`:''}</div></td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap;max-width:130px">${renderProjectModules(p,{compact:true,hideWhenEmpty:true})||'<span style="font-size:11px;color:var(--gray-300)">—</span>'}</div></td>
      <td><span class="badge ${st.badgeClass}" style="font-size:10px">${st.label}</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-sm" style="padding:3px 5px" title="Abrir projeto" onclick="abrirProjeto('${p.id}')"><i class="ti ti-folder"></i></button>
        <button class="btn btn-ghost btn-sm" style="padding:3px 5px" title="Editar projeto" onclick="editarProjeto('${p.id}')"><i class="ti ti-edit"></i></button>
        <button class="btn btn-ghost btn-sm" style="padding:3px 5px" title="Resumo executivo" onclick="showProjectExecutiveSummary('${p.id}')"><i class="ti ti-briefcase"></i></button>
      </td>
    </tr>`;
  }).join('');
  return `<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table style="width:100%;min-width:900px">
    <thead><tr><th>Projeto</th><th>Fase atual</th><th>Progr.</th><th>Profissionais</th><th>Início / Go-live</th><th>Módulos</th><th>Situação</th><th>Ações</th></tr></thead>
    <tbody>${linhas}</tbody>
  </table></div></div>`;
}

function showPersonAllocationMatrixDetails(personKey) {
  const people = getAllocationMatrixPeople();
  const person = people.find(p => p.personKey === personKey);
  if (!person) return;
  const allLinks = getProjectAllocationLinks().filter(l => l.personKey === personKey);
  const summary = calculatePersonAllocationSummary(person, allLinks);
  const hoje = _hojeLocal();

  // ordena vínculos: vencido → termina em 30d → ativo → futuro → concluído
  const rank = { expired:0, 'ending-soon':1, active:2, future:3, undated:4, completed:5 };
  const linksSorted = [...allLinks].sort((a,b) => rank[getAllocationLinkStatus(a,hoje).key] - rank[getAllocationLinkStatus(b,hoje).key]);

  // concorrência: do primeiro início ao último término
  let concorrencia = null;
  const starts = allLinks.map(l=>parseLocalDate(l.startDate)).filter(Boolean);
  const ends = allLinks.map(l=>parseLocalDate(l.endDate)).filter(Boolean);
  if (starts.length && ends.length) {
    const minS = new Date(Math.min(...starts.map(d=>d.getTime())));
    const maxE = new Date(Math.max(...ends.map(d=>d.getTime())));
    concorrencia = calculatePersonProjectConcurrency(allLinks, minS, maxE);
  }
  const sobreposicoes = concorrencia ? concorrencia.monthlyCounts.filter(mc => mc.projectCount > 1) : [];

  const projetosHTML = linksSorted.map(l => {
    const stv = getAllocationLinkStatus(l, hoje);
    const fase = l.currentPhase;
    return `<tr style="cursor:pointer" onclick="closeModal();abrirProjeto('${l.projectId}')">
      <td><div style="font-size:12px;font-weight:600;color:var(--accent)">${l.projectName}</div><div style="font-size:11px;color:var(--gray-400)">${l.clientName}</div></td>
      <td style="font-size:11px;color:var(--gray-600)">${l.roleInProject==='consultor-analista'?'Consultor e Analista':l.roleInProject.charAt(0).toUpperCase()+l.roleInProject.slice(1)}</td>
      <td style="font-size:11px">${l.startDate?fmt(l.startDate):'—'}<br>${l.endDate?fmt(l.endDate):'—'}</td>
      <td>${fase.notStarted?`<span class="badge badge-gray" style="font-size:9px">Não iniciada</span>`:faseBadge(fase.name)}<div style="font-size:11px;font-weight:700;color:var(--accent);margin-top:2px">${l.projectProgress.percent}%</div></td>
      <td style="font-size:11px;text-align:center">${l.riskSummary.open+l.riskSummary.monitoring}${l.activeBlockers>0?`<div style="color:var(--danger)"><i class="ti ti-ban" style="font-size:11px"></i> ${l.activeBlockers}</div>`:''}</td>
      <td><span class="badge ${stv.badgeClass}" style="font-size:9px">${stv.label}</span></td>
    </tr>`;
  }).join('');

  const fmtD = d => d ? fmt(d.toISOString().slice(0,10)) : '—';

  openModal(`<div class="modal-header">
    <div class="modal-title"><i class="ti ti-calendar-user" style="margin-right:8px;color:var(--accent)"></i>Alocação — ${person.personName}</div>
    <button class="btn btn-ghost" onclick="closeModal()"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <span class="badge badge-blue">${summary.role}</span>
      <span style="font-size:12px;color:var(--gray-500)">${person.userType?person.userType.charAt(0).toUpperCase()+person.userType.slice(1):'—'}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px">
      <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px"><div style="font-size:11px;color:var(--gray-500)">Ativos hoje</div><div style="font-size:20px;font-weight:800;color:var(--accent)">${summary.simultaneousProjectsToday}</div></div>
      <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px"><div style="font-size:11px;color:var(--gray-500)">Futuros</div><div style="font-size:20px;font-weight:800;color:var(--gray-700)">${summary.futureProjects}</div></div>
      <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px"><div style="font-size:11px;color:var(--gray-500)">Encerrados</div><div style="font-size:20px;font-weight:800;color:var(--gray-700)">${summary.completedProjects}</div></div>
      <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px"><div style="font-size:11px;color:var(--gray-500)">Primeiro início</div><div style="font-size:14px;font-weight:700;color:var(--gray-700)">${fmtD(summary.firstStartDate)}</div></div>
      <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px"><div style="font-size:11px;color:var(--gray-500)">Próximo término</div><div style="font-size:14px;font-weight:700;color:var(--gray-700)">${fmtD(summary.nextProjectEndDate)}</div></div>
      <div style="background:var(--gray-50);border-radius:8px;padding:10px 12px"><div style="font-size:11px;color:var(--gray-500)">Última prevista</div><div style="font-size:14px;font-weight:700;color:var(--gray-700)">${fmtD(summary.lastExpectedEndDate)}${summary.ongoingOverdueProjects>0?'<span style="color:var(--danger)">*</span>':''}</div></div>
    </div>
    ${summary.ongoingOverdueProjects>0?`<div class="alert alert-warn" style="margin-bottom:14px;font-size:12px"><i class="ti ti-alert-triangle"></i> Previsão sujeita a revisão: existe projeto com Go-live vencido e ainda não concluído.</div>`:''}
    <div style="font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:8px">Projetos vinculados</div>
    <div style="max-height:30vh;overflow-y:auto;border:1px solid var(--gray-200);border-radius:8px;margin-bottom:16px">
      <table style="width:100%"><thead><tr><th>Projeto</th><th>Papel</th><th>Início/Go-live</th><th>Fase</th><th style="text-align:center">Riscos</th><th>Vínculo</th></tr></thead><tbody>${projetosHTML||'<tr><td colspan="6" style="text-align:center;color:var(--gray-400);padding:16px">Nenhum vínculo</td></tr>'}</tbody></table>
    </div>
    ${sobreposicoes.length?`<div style="font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:8px">Meses com projetos simultâneos</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${sobreposicoes.map(mc=>`<span class="badge ${mc.projectCount>=4?'badge-warn':'badge-blue'}" style="font-size:11px">${mc.label} — ${mc.projectCount} projetos</span>`).join('')}</div>`:''}
    <div style="font-size:11px;color:var(--gray-400);background:var(--gray-50);border-radius:8px;padding:10px 12px"><i class="ti ti-info-circle" style="font-size:12px"></i> A quantidade de projetos é informativa. A capacidade deve ser avaliada pelo gestor considerando fase, complexidade e esforço de cada projeto.</div>
  </div>`, true);
}

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${colors.map((c,i)=>`<div onclick="selectColor('${c}')" id="col-${i}" style="width:32px;height:32px;border-radius:50%;background:${c};cursor:pointer;border:3px solid transparent;transition:border .15s" class="color-opt"></div>`).join('')}
      </div>
      <input type="hidden" id="uColor" value="${colors[0]}">
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarUsuario()"><i class="ti ti-check"></i> Criar usuário</button>
  </div>`);
  setTimeout(()=>{ document.querySelectorAll('.color-opt')[0]?.style.setProperty('border-color','#000'); }, 50);
}

function selectColor(c) {
  document.getElementById('uColor').value = c;
  document.querySelectorAll('.color-opt').forEach(el => el.style.borderColor = 'transparent');
  event.target.style.borderColor = '#000';
}

function salvarUsuario() {
  const nome = document.getElementById('uNome').value.trim();
  if (!nome) return alert('Nome é obrigatório');
  const initials = nome.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  const tipo = document.getElementById('uTipo').value;
  state.users.push({id:uid(), name:nome, role:document.getElementById('uRole').value, tipo, color:document.getElementById('uColor').value, initials});
  saveState(); closeModal(); renderUsuarios();
}

function removerUsuario(id) {
  if (state.currentUser?.id === id) return alert('Não é possível remover o usuário logado.');
  if (!confirm('Remover este usuário?')) return;
  state.users = state.users.filter(u=>u.id!==id);
  saveState(); renderUsuarios();
}

// ==================== MODAL UTILS ====================
function openModal(html, large) {
  const box = document.getElementById('modal-box');
  box.className = 'modal' + (large === 'xl' ? ' modal-xl' : large ? ' modal-lg' : '');
  box.innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
function closeModalOnOverlay(e) { if (e.target === document.getElementById('modal-overlay')) closeModal(); }

// ==================== INIT ====================
loadState();
renderUserSelect();

// Restaura sessão ativa (se o usuário já entrou antes e o token ainda é válido).
(async function initAuth() {
  if (!sbClient) return;
  try {
    const { data } = await sbClient.auth.getSession();
    if (data && data.session && data.session.user) {
      await onAuthenticated(data.session.user);
    }
  } catch (e) { /* mantém tela de login */ }
})();
</script>
</body>
