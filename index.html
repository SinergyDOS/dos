  if (!_importPreview) return;
  const { linhas, nomeArquivo } = _importPreview;
  const importaveis = linhas.filter(l => l.importavel).length;
  const agrupadores = linhas.filter(l => l.agrupador && !l.raiz).length;

  const situacaoBadge = (s) => {
    if (s==='nova') return '<span class="badge badge-blue" style="font-size:10px">Nova</span>';
    if (s==='alterada') return '<span class="badge badge-warn" style="font-size:10px">Alterada</span>';
    return '<span class="badge badge-gray" style="font-size:10px">Já existente</span>';
  };

  const linhaHTML = (l, i) => {
    const desab = !l.importavel && !l._incluirManual;
    return `<tr style="${desab?'opacity:.5':''}">
      <td style="text-align:center"><input type="checkbox" class="task-check" ${l.selecionado?'checked':''} onchange="togglePreviewLinha(${i},this.checked)"></td>
      <td style="font-size:12px;color:var(--gray-500)">${l.numero}</td>
      <td style="font-size:12px;color:var(--gray-500);font-family:monospace">${l.hierarquia||'—'}</td>
      <td style="font-size:12px;font-weight:500;color:var(--gray-800)">${l.nome}
        ${l.agrupador && !l.raiz ? `<span class="badge badge-gray" style="font-size:9px;margin-left:4px" title="Linha agrupadora">agrupador</span>` : ''}
        ${l.raiz ? `<span class="badge badge-gray" style="font-size:9px;margin-left:4px">raiz</span>` : ''}
      </td>
      <td style="font-size:12px;color:var(--gray-600)">${l.fase||'—'}</td>
      <td style="font-size:12px;color:var(--gray-500)">${fmt(l.inicio)}</td>
      <td style="font-size:12px;color:var(--gray-500)">${fmt(l.concluir)}</td>
      <td style="font-size:12px;color:var(--gray-500)">${l.progresso}%</td>
      <td style="font-size:12px;color:var(--gray-600)">${l.responsavel||'—'}</td>
      <td>${situacaoBadge(l.situacao)}
        ${(l.agrupador && !l.raiz && !l.importavel) ? `<button class="btn btn-ghost btn-sm" style="font-size:10px;padding:2px 6px" onclick="incluirAgrupador(${i})" title="Incluir esta linha agrupadora como atividade">+ incluir</button>` : ''}
      </td>
    </tr>`;
  };

  openModal(`<div class="modal-header">
    <div class="modal-title"><i class="ti ti-eye" style="margin-right:8px;color:var(--accent)"></i>Prévia da importação</div>
    <button class="btn btn-ghost" onclick="closeModal()"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body">
    <div class="alert alert-info" style="margin-bottom:12px"><i class="ti ti-file-spreadsheet"></i>
      <strong>${nomeArquivo}</strong> · ${linhas.length} linhas lidas · ${importaveis} atividade(s) importável(is) · ${agrupadores} agrupador(es)</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn btn-secondary btn-sm" onclick="selecionarTodasPrevia(true)"><i class="ti ti-checkbox"></i> Selecionar todas</button>
      <button class="btn btn-secondary btn-sm" onclick="selecionarTodasPrevia(false)"><i class="ti ti-square"></i> Desmarcar todas</button>
      <div style="flex:1"></div>
      <span style="font-size:12px;color:var(--gray-400);align-self:center" id="previewCount"></span>
    </div>
    <div class="table-wrap" style="max-height:52vh;overflow-y:auto;border:1px solid var(--gray-200);border-radius:8px">
      <table style="width:100%">
        <thead style="position:sticky;top:0;z-index:1"><tr>
          <th style="width:36px;text-align:center"><i class="ti ti-check"></i></th>
          <th>Nº</th><th>Hierarquia</th><th>Nome</th><th>Fase</th>
          <th>Início</th><th>Término</th><th>Progresso</th><th>Responsável</th><th>Situação</th>
        </tr></thead>
        <tbody id="previewBody">${linhas.map((l,i)=>linhaHTML(l,i)).join('')}</tbody>
      </table>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="confirmarImportacao()"><i class="ti ti-download"></i> Importar selecionadas</button>
  </div>`, true);
  atualizarContadorPrevia();
}

function togglePreviewLinha(i, checked) {
  if (_importPreview && _importPreview.linhas[i]) {
    _importPreview.linhas[i].selecionado = checked;
    atualizarContadorPrevia();
  }
}
function selecionarTodasPrevia(marcar) {
  if (!_importPreview) return;
  _importPreview.linhas.forEach(l => {
    // Só marca linhas elegíveis (importáveis ou agrupadores incluídos manualmente)
    if (marcar) { if (l.importavel || l._incluirManual) l.selecionado = true; }
    else l.selecionado = false;
  });
  abrirModalPrevia();
}
// Regra 7: incluir manualmente uma linha agrupadora na prévia
function incluirAgrupador(i) {
  if (!_importPreview || !_importPreview.linhas[i]) return;
  const l = _importPreview.linhas[i];
  l._incluirManual = true;
  l.importavel = true;
  l.selecionado = true;
  abrirModalPrevia();
}
function atualizarContadorPrevia() {
  const el = document.getElementById('previewCount');
  if (el && _importPreview) {
    const n = _importPreview.linhas.filter(l => l.selecionado).length;
    el.textContent = `${n} selecionada(s) para importar`;
  }
}

// Confirma a importação: cria/atualiza atividades macro conforme externalId
function confirmarImportacao() {
  // Envolve TODA a função para garantir feedback em qualquer cenário de erro.
  try {
    if (!_importPreview) { notificar('Nada para importar (a prévia foi perdida). Selecione o arquivo novamente.', 'erro'); return; }
    const { pId, linhas } = _importPreview;
    const p = state.projetos.find(x=>x.id===pId);
    if (!p) { notificar('Projeto não encontrado.', 'erro'); closeModal(); return; }
    if (!Array.isArray(p.macroActivities)) p.macroActivities = [];

    const selecionadas = linhas.filter(l => l.selecionado && (l.importavel || l._incluirManual));
    if (!selecionadas.length) { notificar('Selecione ao menos uma atividade para importar.', 'aviso'); return; }

    const agora = new Date().toISOString();
    let novas = 0, atualizadas = 0;

    selecionadas.forEach(l => {
      const existente = p.macroActivities.find(m => m.externalId === l.externalId);
      if (existente) {
        const mudou = existente.name !== l.nome || existente.hierarchyCode !== l.hierarquia
          || existente.phase !== l.fase || existente.startDate !== l.inicio
          || existente.endDate !== l.concluir || existente.progress !== l.progresso
          || existente.responsible !== l.responsavel || existente.bucket !== l.bucket;
        existente.name = l.nome;
        existente.hierarchyCode = l.hierarquia;
        existente.phase = l.fase;
        existente.startDate = l.inicio;
        existente.endDate = l.concluir;
        existente.progress = l.progresso;
        existente.responsible = l.responsavel;
        existente.bucket = l.bucket;
        if (existente.importStatus === 'not-found') existente.importStatus = 'ok';
        if (mudou) { existente.lastUpdatedAt = agora; atualizadas++; }
      } else {
        p.macroActivities.push({
          id: uid(),
          externalId: l.externalId,
          hierarchyCode: l.hierarquia,
          macroKey: null,
          name: l.nome,
          phase: l.fase,
          startDate: l.inicio,
          endDate: l.concluir,
          progress: l.progresso,
          responsible: l.responsavel,
          bucket: l.bucket,
          source: 'planner-import',
          importStatus: 'ok',
          importedAt: agora,
          lastUpdatedAt: agora
        });
        novas++;
      }
    });

    // Marca como not-found as que existiam e não vieram neste arquivo.
    const idsNoArquivo = new Set(linhas.map(l => l.externalId));
    let naoEncontradas = 0;
    p.macroActivities.forEach(m => {
      if (m.source === 'planner-import' && !idsNoArquivo.has(m.externalId)) {
        if (m.importStatus !== 'not-found') { m.importStatus = 'not-found'; naoEncontradas++; }
      }
    });

    // DE-PARA + prazos (com proteção própria para não abortar a importação toda)
    let herdados = 0, prazosAtualizados = 0;
    try {
      reconciliarMapeamentos(p);
      herdados = aplicarDeParaTemplate(p);
      prazosAtualizados = propagarPrazosMacro(p);
    } catch (err) {
      console.error('Erro ao aplicar DE-PARA/prazos:', err);
      notificar('Atividades importadas, mas houve um erro ao aplicar o DE-PARA/prazos: ' + err.message, 'aviso');
    }

    const ignoradas = linhas.length - selecionadas.length;

    // Salva ANTES de renderizar, para não perder a importação se a tela falhar.
    const salvou = saveState();
    _importPreview = null;
    closeModal();
    // Persiste no banco: atividades macro, mapeamentos e prazos de tarefas atualizados.
    persistirCronograma(p).then(res => {
      if (!res.ok) notificar('Importação salva localmente, mas houve falha ao gravar no servidor: ' + res.error + '. Recarregue a página para conferir.', 'erro');
      else notificar('Cronograma sincronizado com o servidor.', 'sucesso');
    });

    const msg = `Importação concluída.\n\n`
      + `• ${novas} nova(s) atividade(s)\n`
      + `• ${atualizadas} atualizada(s)\n`
      + `• ${ignoradas} ignorada(s)/não selecionada(s)`
      + (herdados ? `\n• ${herdados} vínculo(s) herdado(s) do DE-PARA padrão` : '')
      + (prazosAtualizados ? `\n• ${prazosAtualizados} prazo(s) de tarefa atualizado(s) pelas datas do cronograma` : '')
      + (naoEncontradas ? `\n• ${naoEncontradas} não encontrada(s) no novo arquivo` : '')
      + (salvou === false ? `\n\n⚠ Atenção: não foi possível salvar no navegador (armazenamento cheio).` : '');

    try {
      renderProjetoDetail(p);
    } catch (err) {
      console.error('Erro ao renderizar projeto após importação:', err);
    }

    // Feedback garantido: toast visual na tela + alert (o toast funciona mesmo se o alert estiver suprimido)
    notificar(`Importação concluída: ${novas} nova(s), ${atualizadas} atualizada(s), ${prazosAtualizados} prazo(s) definido(s).`, 'sucesso');
    setTimeout(() => { try { alert(msg); } catch(e){} }, 120);

  } catch (err) {
    console.error('Erro fatal na importação:', err);
    notificar('Erro ao importar o cronograma: ' + (err && err.message ? err.message : err), 'erro');
    try { alert('Ocorreu um erro ao importar o cronograma:\n\n' + (err && err.message ? err.message : err) + '\n\nNenhuma alteração foi aplicada.'); } catch(e){}
  }
}

// Notificação visual (toast) — feedback que NÃO depende de alert(), que pode ser suprimido pelo navegador.
function notificar(mensagem, tipo) {
  try {
    let host = document.getElementById('toast-host');
    if (!host) {
      host = document.createElement('div');
      host.id = 'toast-host';
      host.style.cssText = 'position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:380px';
      document.body.appendChild(host);
    }
    const cores = {
      sucesso: {bg:'#f0fdf4', border:'#86efac', color:'#166534', icon:'ti-circle-check'},
      erro:    {bg:'#fef2f2', border:'#fca5a5', color:'#991b1b', icon:'ti-alert-circle'},
      aviso:   {bg:'#fffbeb', border:'#fcd34d', color:'#92400e', icon:'ti-alert-triangle'},
      info:    {bg:'#eff6ff', border:'#93c5fd', color:'#1e40af', icon:'ti-info-circle'},
    };
    const c = cores[tipo] || cores.info;
    const el = document.createElement('div');
    el.style.cssText = `background:${c.bg};border:1px solid ${c.border};color:${c.color};border-radius:10px;padding:12px 14px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;align-items:flex-start;gap:8px;animation:toastIn .2s ease-out`;
    el.innerHTML = `<i class="ti ${c.icon}" style="font-size:16px;flex-shrink:0;margin-top:1px"></i><div style="flex:1">${mensagem}</div><i class="ti ti-x" style="cursor:pointer;opacity:.6" onclick="this.parentElement.remove()"></i>`;
    host.appendChild(el);
    setTimeout(() => { if (el.parentElement) el.style.opacity = '0'; }, tipo === 'erro' ? 8000 : 5000);
    setTimeout(() => { if (el.parentElement) el.remove(); }, tipo === 'erro' ? 8400 : 5400);
  } catch (e) {
    console.error('Falha ao notificar:', e, '| mensagem original:', mensagem);
  }
}


// ==================== DE-PARA (macro ↔ micro) ====================
// Estado temporário da edição do DE-PARA (não persiste até salvar)
let _deParaDraft = null; // { pId, mappings:[...], selMacroId, selMicroIds:Set, dirty }

// Gera macroKey a partir do nome: maiúsculas, sem acento, pontuação→_, sem _ duplicado
function gerarMacroKey(nome) {
  return String(nome||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')  // remove acentos
    .toUpperCase()
    .replace(/[^A-Z0-9]+/g,'_')                        // pontuação/espaços → _
    .replace(/_+/g,'_')                                // _ duplicados
    .replace(/^_|_$/g,'');                             // _ nas pontas
}

// Garante macroKey única no projeto (acrescenta sufixo numérico se colidir)
function macroKeyUnica(base, mappings, ignoreId) {
  let key = base || 'ATIVIDADE';
  const existe = (k) => mappings.some(mp => mp.macroKey === k && mp.id !== ignoreId);
  if (!existe(key)) return key;
  let i = 2;
  while (existe(key + '_' + i)) i++;
  return key + '_' + i;
}

// Reconcilia mapeamentos com as atividades macro atualmente importadas.
// Regras: 1) reencontrar por externalId; 2) senão por macroKey; 3) senão marcar não localizada.
// Nunca desvincula tarefas nem refaz análise textual.
function reconciliarMapeamentos(p) {
  if (!Array.isArray(p.macroMappings)) p.macroMappings = [];
  const macros = Array.isArray(p.macroActivities) ? p.macroActivities : [];
  p.macroMappings.forEach(mp => {
    let macro = null;
    // 1) por externalId
    if (mp.macroExternalId) macro = macros.find(m => m.externalId === mp.macroExternalId && m.importStatus !== 'not-found');
    // 2) por macroKey (quando a atividade tiver a mesma macroKey)
    if (!macro && mp.macroKey) macro = macros.find(m => m.macroKey === mp.macroKey && m.importStatus !== 'not-found');
    if (macro) {
      mp.macroActivityId = macro.id;
      mp.macroExternalId = macro.externalId || mp.macroExternalId;
      if (!macro.macroKey) macro.macroKey = mp.macroKey; // grava a macroKey na atividade
      if (mp._status === 'nao-localizada') mp._status = null;
    } else {
      // não encontrada nem por externalId nem por macroKey
      mp.macroActivityId = null;
      mp._status = 'nao-localizada';
    }
  });
}

// Calcula o status de exibição de um mapeamento
function statusMapeamento(mp) {
  if (mp._status === 'nao-localizada') return { key:'nao-localizada', label:'Atividade macro não localizada', badge:'badge-red', icon:'ti-alert-triangle' };
  if (!mp.macroActivityId) return { key:'sem-depara', label:'Nova atividade sem DE-PARA', badge:'badge-warn', icon:'ti-help-circle' };
  if (!mp.microTaskIds || mp.microTaskIds.length === 0) return { key:'sem-micro', label:'Sem tarefas micro', badge:'badge-gray', icon:'ti-unlink' };
  return { key:'configurado', label:'Configurado', badge:'badge-green', icon:'ti-check' };
}

// Aplica o DE-PARA padrão do template ao projeto (herança via macroKey).
// Roda após a importação. Para cada atividade macro importada:
//   1. gera/atribui a macroKey a partir do nome (se ainda não tiver);
//   2. busca no template uma entrada com a mesma macroKey;
//   3. cria o mapeamento do projeto herdando as tarefas, traduzindo templateTaskId → id local;
//   4. NÃO sobrescreve mapeamentos que o usuário já ajustou manualmente (exceção local).
// Retorna a quantidade de vínculos herdados.
function aplicarDeParaTemplate(p) {
  const tpl = (state.checklistTemplates||[]).find(t => t.id === p.templateId);
  if (!tpl || !Array.isArray(tpl.deParaTemplate) || tpl.deParaTemplate.length === 0) return 0;
  if (!Array.isArray(p.macroMappings)) p.macroMappings = [];
  const macros = (p.macroActivities||[]).filter(m => m.importStatus !== 'not-found');

  // Índice: templateTaskId → id da tarefa no projeto
  const tplTaskToLocal = {};
  (p.tasks||[]).forEach(t => { if (t.templateTaskId) tplTaskToLocal[t.templateTaskId] = t.id; });

  let herdados = 0;
  macros.forEach(macro => {
    // 1) garante macroKey na atividade (gera do nome se ainda não tiver)
    if (!macro.macroKey) macro.macroKey = gerarMacroKey(macro.name);
    // 2) entrada do template com essa macroKey
    const entrada = tpl.deParaTemplate.find(e => e.macroKey === macro.macroKey);
    if (!entrada) return; // sem correspondência no template → fica "sem DE-PARA"

    // 3) mapeamento existente para esta macro (por macroKey)?
    let mp = p.macroMappings.find(m => m.macroKey === macro.macroKey);
    const tarefasLocais = (entrada.checklistTaskIds||[])
      .map(ctid => tplTaskToLocal[ctid])
      .filter(Boolean);

    if (!mp) {
      // cria novo mapeamento herdado do template
      const agora = new Date().toISOString();
      mp = {
        id: uid(),
        macroKey: macro.macroKey,
        macroActivityId: macro.id,
        macroExternalId: macro.externalId || null,
        macroNameSnapshot: macro.name || '',
        microTaskIds: tarefasLocais,
        origem: 'template',            // marca que veio do padrão (permite distinguir exceções)
        createdAt: agora,
        updatedAt: agora
      };
      p.macroMappings.push(mp);
      herdados += tarefasLocais.length;
    } else if (mp.origem === 'template' && !mp._ajustadoManualmente) {
      // atualiza apontamento da atividade, preservando ajustes manuais quando houver
      mp.macroActivityId = macro.id;
      mp.macroExternalId = macro.externalId || mp.macroExternalId;
      mp.macroNameSnapshot = macro.name || mp.macroNameSnapshot;
      // reaplica as tarefas do template (herança), pois não foi ajustado manualmente
      mp.microTaskIds = tarefasLocais;
      mp.updatedAt = new Date().toISOString();
    }
    // se o usuário ajustou manualmente (mp._ajustadoManualmente), preserva como está (exceção local)
  });

  // Preenche macroActivityId nas tarefas herdadas
  p.macroMappings.forEach(mp => (mp.microTaskIds||[]).forEach(tid => {
    const t = (p.tasks||[]).find(x=>x.id===tid);
    if (t) t.macroActivityId = mp.macroActivityId;
  }));

  return herdados;
}

// Propaga as datas das atividades macro para o prazo das tarefas micro vinculadas.
// Regra: cada tarefa micro recebe como prazo a data de TÉRMINO (endDate) da atividade
// macro à qual está vinculada — assim todos que veem o projeto enxergam o mesmo prazo.
// Não altera tarefas concluídas (preserva o histórico) nem prazos ajustados manualmente
// depois da última importação (marcados com _prazoManual).
// Retorna quantas tarefas tiveram o prazo atualizado.
function propagarPrazosMacro(p) {
  if (!Array.isArray(p.macroMappings)) return 0;
  const macros = Array.isArray(p.macroActivities) ? p.macroActivities : [];
  let atualizadas = 0;
  p.macroMappings.forEach(mp => {
    const macro = macros.find(m => m.id === mp.macroActivityId && m.importStatus !== 'not-found');
    if (!macro) return;
    // usa término; se não houver, usa início como fallback
    const novoPrazo = macro.endDate || macro.startDate || null;
    if (!novoPrazo) return;
    (mp.microTaskIds||[]).forEach(tid => {
      const t = (p.tasks||[]).find(x=>x.id===tid);
      if (!t) return;
      if (t.status === 'concluida') return;   // não mexe em tarefa concluída
      if (t._prazoManual) return;              // respeita prazo definido manualmente
      if (t.prazo !== novoPrazo) { t.prazo = novoPrazo; t.prazoOrigem = 'macro'; atualizadas++; }
    });
  });
  return atualizadas;
}

// Abre o modal de configuração do DE-PARA
function modalConfigurarDePara(pId) {
  const p = state.projetos.find(x=>x.id===pId);
  if (!p) return;
  if (!Array.isArray(p.macroActivities) || p.macroActivities.length === 0) {
    alert('Importe o cronograma macro antes de configurar o DE-PARA.');
    return;
  }
  // Monta o rascunho a partir dos mapeamentos salvos (cópia profunda)
  reconciliarMapeamentos(p);
  const mappings = JSON.parse(JSON.stringify(p.macroMappings || []));
  // Cria mapeamentos "Sem DE-PARA" para atividades macro importadas que ainda não têm mapping
  p.macroActivities.forEach(m => {
    if (m.importStatus === 'not-found') return;
    const jaTem = mappings.some(mp => mp.macroActivityId === m.id || (mp.macroExternalId && mp.macroExternalId === m.externalId));
    if (!jaTem) {
      mappings.push({
        id: uid(),
        macroKey: m.macroKey || null,          // pode ser null até o usuário confirmar
        macroActivityId: m.id,
        macroExternalId: m.externalId || null,
        macroNameSnapshot: m.name || '',
        microTaskIds: [],
        createdAt: null,                        // null = ainda não salvo
        updatedAt: null,
        _novo: true
      });
    }
  });
  _deParaDraft = { pId, mappings, selMacroId: null, selMicroIds: new Set(), dirty: false };
  renderModalDePara();
}

// Renderiza o modal de DE-PARA (duas áreas)
function renderModalDePara() {
  if (!_deParaDraft) return;
  const p = state.projetos.find(x=>x.id===_deParaDraft.pId);
  if (!p) return;
  const { mappings, selMacroId, selMicroIds } = _deParaDraft;
  const macros = p.macroActivities.filter(m => m.importStatus !== 'not-found');
  const filtroMicro = _deParaDraft.filtroMicro || 'todas'; // todas | vinculadas | sem-vinculo

  // Mapa: taskId → mappingId (a qual macro cada micro está vinculada no rascunho)
  const taskToMapping = {};
  mappings.forEach(mp => (mp.microTaskIds||[]).forEach(tid => { taskToMapping[tid] = mp; }));

  const macroSelObj = mappings.find(mp => mp.id === selMacroId);
  const tarefasDaMacroSel = macroSelObj ? new Set(macroSelObj.microTaskIds||[]) : new Set();

  // ── LADO ESQUERDO: atividades macro ──
  const macroCards = mappings.map(mp => {
    const macro = macros.find(m => m.id === mp.macroActivityId);
    const st = statusMapeamento(mp);
    const sel = selMacroId === mp.id;
    const nome = macro ? macro.name : (mp.macroNameSnapshot || '(atividade não localizada)');
    const fase = macro ? (macro.phase||'—') : '—';
    const nVinc = (mp.microTaskIds||[]).length;
    return `<div onclick="deParaSelMacro('${mp.id}')" style="border:1px solid ${sel?'var(--accent)':'var(--gray-200)'};background:${sel?'var(--accent-light)':'#fff'};border-radius:8px;padding:10px 12px;cursor:pointer;margin-bottom:8px;transition:all .12s">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px">
        <div style="font-size:13px;font-weight:600;color:var(--gray-800);flex:1">${nome}</div>
        <span class="badge ${st.badge}" style="font-size:9px"><i class="ti ${st.icon}"></i>${st.label}</span>
      </div>
      <div style="display:flex;gap:10px;font-size:11px;color:var(--gray-500);flex-wrap:wrap;align-items:center">
        <span><i class="ti ti-flag" style="font-size:11px"></i> ${fase}</span>
        <span style="font-weight:600;color:${nVinc>0?'var(--success)':'var(--gray-400)'}"><i class="ti ti-link" style="font-size:11px"></i> ${nVinc} tarefa${nVinc!==1?'s':''}</span>
      </div>
      ${sel ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-200);display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <label style="font-size:10px;color:var(--gray-500);font-weight:600">macroKey:</label>
        <input class="form-input" style="font-size:11px;padding:3px 6px;width:auto;flex:1;font-family:monospace" value="${mp.macroKey||''}" placeholder="(gerar do nome)" onclick="event.stopPropagation()" onchange="deParaEditKey('${mp.id}',this.value)">
        ${!mp.macroKey ? `<button class="btn btn-ghost btn-sm" style="font-size:10px;padding:2px 6px" onclick="event.stopPropagation();deParaGerarKey('${mp.id}')"><i class="ti ti-wand"></i> gerar</button>` : ''}
      </div>
      ${nVinc>0?`<div style="margin-top:6px;font-size:10px;color:var(--success);display:flex;align-items:center;gap:4px"><i class="ti ti-arrow-right" style="font-size:11px"></i> ${nVinc} tarefa(s) desta macro destacada(s) à direita</div>`:''}` : ''}
    </div>`;
  }).join('') || `<div style="padding:20px;text-align:center;color:var(--gray-400);font-size:13px">Nenhuma atividade macro.</div>`;

  // ── LADO DIREITO: tarefas micro (com filtro) ──
  let microList = (p.tasks||[]);
  if (filtroMicro === 'vinculadas') microList = microList.filter(t => taskToMapping[t.id]);
  else if (filtroMicro === 'sem-vinculo') microList = microList.filter(t => !taskToMapping[t.id]);
  // quando há macro selecionada, ordena as tarefas dela primeiro
  if (macroSelObj) {
    microList = [...microList].sort((a,b) => (tarefasDaMacroSel.has(b.id)?1:0) - (tarefasDaMacroSel.has(a.id)?1:0));
  }

  const microRows = microList.map(t => {
    const mpDe = taskToMapping[t.id];
    const macroVinc = mpDe ? (macros.find(m=>m.id===mpDe.macroActivityId)?.name || mpDe.macroNameSnapshot) : null;
    const checked = selMicroIds.has(t.id);
    const daMacroSel = tarefasDaMacroSel.has(t.id);
    const tc = TEMA_COLORS[t.tema] || '#64748b';
    // destaque: verde se pertence à macro selecionada, azul se apenas marcada
    const bg = daMacroSel ? 'background:#f0fdf4;border-left:3px solid var(--success)' : checked ? 'background:var(--accent-light);border-left:3px solid var(--accent)' : 'border-left:3px solid transparent';
    return `<tr style="${bg}">
      <td style="text-align:center"><input type="checkbox" class="task-check" ${checked?'checked':''} onchange="deParaToggleMicro('${t.id}',this.checked)"></td>
      <td style="font-size:12px;font-weight:500;color:var(--gray-800)">
        ${daMacroSel?`<i class="ti ti-link" style="font-size:12px;color:var(--success);vertical-align:-1px;margin-right:3px" title="Vinculada à macro selecionada"></i>`:''}${t.tarefa}
      </td>
      <td style="font-size:11px;color:var(--gray-500);white-space:nowrap">${t.fase||'—'}</td>
      <td><span class="badge" style="background:${tc}18;color:${tc};font-size:10px">${t.tema||'—'}</span></td>
      <td style="font-size:11px">${macroVinc ? `<span style="color:var(--success);display:inline-flex;align-items:center;gap:3px"><i class="ti ti-link" style="font-size:11px"></i> ${macroVinc}</span>` : `<span style="color:var(--gray-300)">—</span>`}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" style="padding:24px;text-align:center;color:var(--gray-400);font-size:13px">Nenhuma tarefa para este filtro.</td></tr>`;

  const totalMicro = (p.tasks||[]).length;
  const semVinc = (p.tasks||[]).filter(t => !taskToMapping[t.id]).length;
  const comVinc = totalMicro - semVinc;

  const btnFiltro = (val, label, n) => `<button class="btn btn-sm ${filtroMicro===val?'btn-primary':'btn-secondary'}" style="font-size:11px;padding:4px 10px" onclick="deParaSetFiltro('${val}')">${label}${n!==undefined?` (${n})`:''}</button>`;

  openModal(`<div class="modal-header">
    <div class="modal-title"><i class="ti ti-arrows-exchange" style="margin-right:8px;color:var(--accent)"></i>Configurar DE-PARA${_deParaDraft.dirty?' <span style="font-size:11px;color:var(--warn);font-weight:500">(alterações não salvas)</span>':''}</div>
    <button class="btn btn-ghost" onclick="fecharDePara()"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body" style="padding:16px">
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <button class="btn btn-secondary btn-sm" onclick="deParaSugerir()"><i class="ti ti-bulb"></i> Sugerir vínculos</button>
      <div style="flex:1"></div>
      <span style="font-size:12px;color:var(--gray-500)"><strong style="color:var(--success)">${comVinc}</strong> vinculadas · <strong>${semVinc}</strong> sem vínculo · ${totalMicro} no total</span>
    </div>

    <div style="display:grid;grid-template-columns:minmax(300px,1fr) 2fr;gap:16px;align-items:start">
      <!-- ESQUERDA: macro -->
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--gray-600);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px">Atividades macro (${mappings.length})</div>
        <div style="max-height:52vh;overflow-y:auto;padding-right:4px">${macroCards}</div>
      </div>
      <!-- DIREITA: micro -->
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px">
          <div style="font-size:12px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.4px">Tarefas micro</div>
          <div style="display:flex;gap:6px">${btnFiltro('todas','Todas',totalMicro)}${btnFiltro('vinculadas','Vinculadas',comVinc)}${btnFiltro('sem-vinculo','Sem vínculo',semVinc)}</div>
        </div>
        ${macroSelObj ? `<div style="font-size:11px;color:var(--success);margin-bottom:6px;display:flex;align-items:center;gap:4px"><i class="ti ti-info-circle" style="font-size:12px"></i> As linhas em verde já estão vinculadas a <strong>${macros.find(m=>m.id===macroSelObj.macroActivityId)?.name || macroSelObj.macroNameSnapshot}</strong></div>` : ''}
        <div style="max-height:48vh;overflow-y:auto;border:1px solid var(--gray-200);border-radius:8px">
          <table style="width:100%;table-layout:auto">
            <thead style="position:sticky;top:0;z-index:1;background:var(--gray-50)"><tr>
              <th style="width:36px;text-align:center"><i class="ti ti-check"></i></th>
              <th>Tarefa</th><th>Fase</th><th>Tema</th><th>Macro vinculada</th>
            </tr></thead>
            <tbody>${microRows}</tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Barra de ações -->
    <div style="margin-top:14px;padding:12px 14px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div style="font-size:12px;color:var(--gray-600)">
        ${macroSelObj ? `Macro selecionada: <strong>${macros.find(m=>m.id===macroSelObj.macroActivityId)?.name || macroSelObj.macroNameSnapshot}</strong>` : 'Selecione uma atividade macro à esquerda'}
        · <strong>${selMicroIds.size}</strong> tarefa(s) marcada(s)
      </div>
      <div style="flex:1"></div>
      <button class="btn btn-primary btn-sm" ${(!macroSelObj||selMicroIds.size===0)?'disabled style="opacity:.5"':''} onclick="deParaVincular()"><i class="ti ti-link"></i> Vincular selecionadas</button>
      <button class="btn btn-secondary btn-sm" ${selMicroIds.size===0?'disabled style="opacity:.5"':''} onclick="deParaRemoverVinculo()"><i class="ti ti-unlink"></i> Remover vínculo</button>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="fecharDePara()">Cancelar</button>
    <button class="btn btn-primary" onclick="salvarDePara()"><i class="ti ti-device-floppy"></i> Salvar DE-PARA</button>
  </div>`, 'xl');
}

function deParaSetFiltro(val) {
  if (!_deParaDraft) return;
  _deParaDraft.filtroMicro = val;
  renderModalDePara();
}

function deParaSelMacro(mappingId) {
  if (!_deParaDraft) return;
  _deParaDraft.selMacroId = _deParaDraft.selMacroId === mappingId ? null : mappingId;
  renderModalDePara();
}
function deParaToggleMicro(taskId, checked) {
  if (!_deParaDraft) return;
  if (checked) _deParaDraft.selMicroIds.add(taskId);
  else _deParaDraft.selMicroIds.delete(taskId);
  renderModalDePara();
}
function deParaEditKey(mappingId, val) {
  if (!_deParaDraft) return;
  const mp = _deParaDraft.mappings.find(m=>m.id===mappingId);
  if (!mp) return;
  const nova = gerarMacroKey(val);
  mp.macroKey = macroKeyUnica(nova, _deParaDraft.mappings, mp.id);
  _deParaDraft.dirty = true;
  renderModalDePara();
}
function deParaGerarKey(mappingId) {
  if (!_deParaDraft) return;
  const p = state.projetos.find(x=>x.id===_deParaDraft.pId);
  const mp = _deParaDraft.mappings.find(m=>m.id===mappingId);
  if (!mp) return;
  const macro = p.macroActivities.find(m=>m.id===mp.macroActivityId);
  const base = gerarMacroKey(macro ? macro.name : mp.macroNameSnapshot);
  mp.macroKey = macroKeyUnica(base, _deParaDraft.mappings, mp.id);
  _deParaDraft.dirty = true;
  renderModalDePara();
}

// Vincular tarefas selecionadas à macro selecionada (impede vínculo duplo)
function deParaVincular() {
  if (!_deParaDraft || !_deParaDraft.selMacroId || _deParaDraft.selMicroIds.size===0) return;
  const mpAlvo = _deParaDraft.mappings.find(m=>m.id===_deParaDraft.selMacroId);
  if (!mpAlvo) return;
  const p = state.projetos.find(x=>x.id===_deParaDraft.pId);
  // Se a macro ainda não tem macroKey, gera uma inicial a partir do nome
  if (!mpAlvo.macroKey) {
    const macro = p.macroActivities.find(m=>m.id===mpAlvo.macroActivityId);
    mpAlvo.macroKey = macroKeyUnica(gerarMacroKey(macro ? macro.name : mpAlvo.macroNameSnapshot), _deParaDraft.mappings, mpAlvo.id);
  }
  _deParaDraft.selMicroIds.forEach(tid => {
    // Remove o vínculo anterior desta tarefa em qualquer outro mapeamento (impede vínculo duplo)
    _deParaDraft.mappings.forEach(mp => {
      if (mp.id !== mpAlvo.id) mp.microTaskIds = (mp.microTaskIds||[]).filter(x=>x!==tid);
    });
    if (!mpAlvo.microTaskIds) mpAlvo.microTaskIds = [];
    if (!mpAlvo.microTaskIds.includes(tid)) mpAlvo.microTaskIds.push(tid);
  });
  _deParaDraft.selMicroIds.clear();
  _deParaDraft.dirty = true;
  renderModalDePara();
}

// Remover vínculo das tarefas selecionadas (de qualquer macro)
function deParaRemoverVinculo() {
  if (!_deParaDraft || _deParaDraft.selMicroIds.size===0) return;
  _deParaDraft.selMicroIds.forEach(tid => {
    _deParaDraft.mappings.forEach(mp => { mp.microTaskIds = (mp.microTaskIds||[]).filter(x=>x!==tid); });
  });
  _deParaDraft.selMicroIds.clear();
  _deParaDraft.dirty = true;
  renderModalDePara();
}

// Sugestão textual (nunca salva automaticamente)
function deParaSugerir() {
  if (!_deParaDraft) return;
  const p = state.projetos.find(x=>x.id===_deParaDraft.pId);
  const macros = p.macroActivities.filter(m=>m.importStatus!=='not-found');
  const mappings = _deParaDraft.mappings;
  // tarefas ainda sem vínculo no rascunho
  const jaVinc = new Set(); mappings.forEach(mp=>(mp.microTaskIds||[]).forEach(t=>jaVinc.add(t)));
  const semVinc = (p.tasks||[]).filter(t=>!jaVinc.has(t.id));

  const tokenize = (s) => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>2);
  const score = (macro, task) => {
    const setM = new Set([...tokenize(macro.name), ...tokenize(macro.phase)]);
    const setT = new Set([...tokenize(task.tarefa), ...tokenize(task.fase), ...tokenize(task.tema)]);
    let comuns = 0; const palavras=[];
    setT.forEach(w=>{ if(setM.has(w)){ comuns++; palavras.push(w);} });
    let pts = comuns * 10;
    // bônus se a fase da macro bate com a fase da tarefa
    if (macro.phase && task.fase && gerarMacroKey(macro.phase)===gerarMacroKey(task.fase)) pts += 15;
    return { pts, palavras };
  };

  const sugestoes = [];
  semVinc.forEach(task => {
    let melhor = null;
    mappings.forEach(mp => {
      const macro = macros.find(m=>m.id===mp.macroActivityId);
      if (!macro) return;
      const s = score(macro, task);
      if (s.pts > 0 && (!melhor || s.pts > melhor.pts)) melhor = { mp, macro, pts:s.pts, palavras:s.palavras };
    });
    if (melhor) sugestoes.push({ task, ...melhor });
  });
  sugestoes.sort((a,b)=>b.pts-a.pts);

  _deParaSugestoes = sugestoes;
  renderModalSugestoes();
}

let _deParaSugestoes = [];
function renderModalSugestoes() {
  const sugestoes = _deParaSugestoes || [];
  const linhas = sugestoes.map((s,i) => `<tr>
    <td style="text-align:center"><input type="checkbox" class="task-check" id="sug-${i}" ${s.pts>=20?'checked':''}></td>
    <td style="font-size:12px;font-weight:500;max-width:200px">${s.task.tarefa}</td>
    <td style="font-size:12px;color:var(--gray-600)">${s.macro.name}</td>
    <td style="text-align:center"><span class="badge ${s.pts>=30?'badge-green':s.pts>=15?'badge-warn':'badge-gray'}" style="font-size:10px">${s.pts}</span></td>
    <td style="font-size:11px;color:var(--gray-500)">${s.palavras.length?('palavras: '+s.palavras.slice(0,4).join(', ')):'fase compatível'}</td>
  </tr>`).join('');

  openModal(`<div class="modal-header">
    <div class="modal-title"><i class="ti ti-bulb" style="margin-right:8px;color:var(--accent)"></i>Sugestão de vínculos</div>
    <button class="btn btn-ghost" onclick="renderModalDePara()"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body">
    <div class="alert alert-info"><i class="ti ti-info-circle"></i> Sugestões baseadas em comparação textual. <strong>Nada é salvo automaticamente</strong> — revise e aceite o que fizer sentido.</div>
    ${sugestoes.length===0 ? `<div class="empty" style="padding:24px"><i class="ti ti-search-off"></i><p>Nenhuma sugestão encontrada</p><small>As tarefas sem vínculo não tiveram correspondência textual com as atividades macro.</small></div>` : `
    <div class="table-wrap" style="max-height:52vh;overflow-y:auto;border:1px solid var(--gray-200);border-radius:8px">
      <table style="width:100%">
        <thead style="position:sticky;top:0"><tr><th style="width:32px;text-align:center">Aceitar</th><th>Tarefa micro</th><th>Atividade macro sugerida</th><th style="text-align:center">Pontos</th><th>Justificativa</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>`}
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" onclick="renderModalDePara()">Voltar</button>
    ${sugestoes.length>0 ? `<button class="btn btn-primary" onclick="aplicarSugestoes()"><i class="ti ti-check"></i> Aceitar selecionadas</button>` : ''}
  </div>`, true);
}

function aplicarSugestoes() {
  if (!_deParaDraft || !_deParaSugestoes) return;
  const p = state.projetos.find(x=>x.id===_deParaDraft.pId);
  _deParaSugestoes.forEach((s,i) => {
    const cb = document.getElementById('sug-'+i);
    if (cb && cb.checked) {
      const mp = _deParaDraft.mappings.find(m=>m.id===s.mp.id);
      if (!mp) return;
      if (!mp.macroKey) {
        const macro = p.macroActivities.find(m=>m.id===mp.macroActivityId);
        mp.macroKey = macroKeyUnica(gerarMacroKey(macro?macro.name:mp.macroNameSnapshot), _deParaDraft.mappings, mp.id);
      }
      // remove vínculo anterior e adiciona
      _deParaDraft.mappings.forEach(m => { if(m.id!==mp.id) m.microTaskIds=(m.microTaskIds||[]).filter(x=>x!==s.task.id); });
      if (!mp.microTaskIds) mp.microTaskIds = [];
      if (!mp.microTaskIds.includes(s.task.id)) mp.microTaskIds.push(s.task.id);
    }
  });
  _deParaDraft.dirty = true;
  renderModalDePara();
}

// Salvar o DE-PARA no projeto (persiste no localStorage)
function salvarDePara() {
  if (!_deParaDraft) return;
  const p = state.projetos.find(x=>x.id===_deParaDraft.pId);
  if (!p) return;
  const agora = new Date().toISOString();

  // Mantém apenas mapeamentos que têm macroKey OU tarefas vinculadas OU já existiam salvos
  const finais = _deParaDraft.mappings.filter(mp =>
    mp.macroKey || (mp.microTaskIds && mp.microTaskIds.length) || !mp._novo
  ).map(mp => {
    // Se ainda não tem macroKey mas tem vínculo, gera uma
    let macroKey = mp.macroKey;
    if (!macroKey && mp.microTaskIds && mp.microTaskIds.length) {
      const macro = p.macroActivities.find(m=>m.id===mp.macroActivityId);
      macroKey = macroKeyUnica(gerarMacroKey(macro?macro.name:mp.macroNameSnapshot), _deParaDraft.mappings, mp.id);
    }
    const macro = p.macroActivities.find(m=>m.id===mp.macroActivityId);
    return {
      id: mp.id,
      macroKey: macroKey || null,
      macroActivityId: mp.macroActivityId || null,
      macroExternalId: mp.macroExternalId || (macro?macro.externalId:null) || null,
      macroNameSnapshot: macro ? macro.name : (mp.macroNameSnapshot||''),
      microTaskIds: Array.isArray(mp.microTaskIds) ? [...mp.microTaskIds] : [],
      origem: mp.origem || 'projeto',
      // Salvar pela tela do projeto marca como ajuste manual → vira exceção local
      // e não será sobrescrito pela herança do template em futuras importações.
      _ajustadoManualmente: true,
      createdAt: mp.createdAt || agora,
      updatedAt: agora
    };
  });

  p.macroMappings = finais;

  // Sincroniza macroKey nas atividades macro correspondentes
  finais.forEach(mp => {
    const macro = p.macroActivities.find(m=>m.id===mp.macroActivityId);
    if (macro && mp.macroKey) macro.macroKey = mp.macroKey;
  });

  // Atualiza macroActivityId nas tarefas micro conforme o DE-PARA (mantém o campo já existente).
  // Não altera tarefas concluídas? -> apenas o vínculo lógico; status não é tocado.
  const taskToMacro = {};
  finais.forEach(mp => (mp.microTaskIds||[]).forEach(tid => { taskToMacro[tid] = mp.macroActivityId; }));
  (p.tasks||[]).forEach(t => {
    if (taskToMacro[t.id] !== undefined) t.macroActivityId = taskToMacro[t.id];
    else if (t.macroActivityId && !Object.values(taskToMacro).includes(t.macroActivityId)) {
      // tarefa que perdeu o vínculo no DE-PARA
      const aindaVinculada = finais.some(mp => (mp.microTaskIds||[]).includes(t.id));
      if (!aindaVinculada) {
        t.macroActivityId = null;
        // se o prazo tinha vindo da macro, limpa (não é mais governado por atividade macro)
        if (t.prazoOrigem === 'macro' && !t._prazoManual) { t.prazo = null; t.prazoOrigem = null; }
      }
    }
  });

  // Propaga as datas das atividades macro para os prazos das tarefas recém-vinculadas
  const prazosAtualizados = propagarPrazosMacro(p);

  saveState();
  _deParaDraft = null;
  _deParaSugestoes = [];
  closeModal();
  renderProjetoDetail(p);
  // Persiste no banco: mapeamentos DE-PARA do projeto + prazos de tarefas atualizados.
  persistirCronograma(p).then(res => {
    if (!res.ok) notificar('DE-PARA salvo localmente, mas houve falha ao gravar no servidor: ' + res.error + '. Recarregue a página.', 'erro');
  });
  setTimeout(()=>alert('DE-PARA salvo com sucesso.' + (prazosAtualizados?`\n${prazosAtualizados} prazo(s) de tarefa atualizado(s) pelas datas do cronograma.`:'')), 100);
}

// Cancelar edição (descarta alterações não salvas)
function fecharDePara() {
  if (_deParaDraft && _deParaDraft.dirty) {
    if (!confirm('Há alterações não salvas no DE-PARA. Deseja descartá-las?')) return;
  }
  _deParaDraft = null;
  _deParaSugestoes = [];
  closeModal();
}

// Estado de expansão das fases na visão Lista do projeto (por projeto::fase)
if (!state.projFaseExpand) state.projFaseExpand = {};

// ==================== MACRO ENTREGA — núcleo de resolução e agrupamento ====================
// "Macro entrega" é a representação visual/operacional da atividade macro já existente
// (macroActivities + macroMappings). NÃO é uma entidade nova — apenas uma leitura das
// estruturas atuais. Estado de UI fica em uiState (separado dos dados de negócio).
const uiState = {
  expandedPhases: {},          // chave: pId::fase → bool
  expandedMacroDeliveries: {}, // chave: pId::fase::macroKeyOrId → bool
  _initedProjects: {},         // marca projetos já auto-expandidos
};

// Resolve a macro entrega de uma tarefa seguindo a ordem de prioridade definida:
// 1) macroActivityId da tarefa; 2) presença em macroMappings.microTaskIds;
// 3) localizar mapping; 4) localizar atividade por id/externalId/macroKey.
// Retorna sempre um objeto; quando não há vínculo, hasDelivery=false.
function resolveTaskMacroDelivery(project, task) {
  const semEntrega = {
    hasDelivery: false, macroActivityId: null, macroKey: null, macroName: null,
    macroPhase: null, startDate: null, endDate: null, progress: null, mappingStatus: 'sem-vinculo'
  };
  if (!project || !task) return semEntrega;
  const macros = Array.isArray(project.macroActivities) ? project.macroActivities : [];
  const mappings = Array.isArray(project.macroMappings) ? project.macroMappings : [];

  // 1) macroActivityId direto na tarefa
  let macro = null, mapping = null;
  if (task.macroActivityId) macro = macros.find(m => m.id === task.macroActivityId) || null;

  // 2/3) via macroMappings.microTaskIds → localizar o mapping que contém a tarefa
  if (!mapping) mapping = mappings.find(mp => Array.isArray(mp.microTaskIds) && mp.microTaskIds.includes(task.id)) || null;

  // 4) localizar a atividade macro pelo mapping (id, externalId ou macroKey)
  if (!macro && mapping) {
    macro = macros.find(m => m.id === mapping.macroActivityId)
         || (mapping.macroExternalId ? macros.find(m => m.externalId === mapping.macroExternalId) : null)
         || (mapping.macroKey ? macros.find(m => m.macroKey === mapping.macroKey) : null)
         || null;
  }
  // se achou macro mas não o mapping, tenta localizar o mapping correspondente
  if (macro && !mapping) {
    mapping = mappings.find(mp => mp.macroActivityId === macro.id
              || (mp.macroExternalId && mp.macroExternalId === macro.externalId)
              || (mp.macroKey && mp.macroKey === macro.macroKey)) || null;
  }

  if (!macro && !mapping) return semEntrega;

  // Mapping existe mas atividade não localizada → requer revisão
  const mappingStatus = mapping ? (statusMapeamento(mapping).key) : (macro ? 'configurado' : 'sem-vinculo');

  return {
    hasDelivery: !!(macro || mapping),
    macroActivityId: macro ? macro.id : (mapping ? mapping.macroActivityId : null),
    macroKey: (macro && macro.macroKey) || (mapping && mapping.macroKey) || null,
    macroName: (macro && macro.name) || (mapping && mapping.macroNameSnapshot) || '(atividade não localizada)',
    macroPhase: (macro && macro.phase) || null,
    startDate: (macro && macro.startDate) || null,
    endDate: (macro && macro.endDate) || null,
    progress: (macro && typeof macro.progress === 'number') ? macro.progress : null,
    mappingStatus,
    _macro: macro || null,
    _mapping: mapping || null
  };
}

// Progresso da macro entrega: prioriza tarefas micro; percentual do Planner é secundário.
function calculateMacroDeliveryProgress(project, macroActivity, tasksVinculadas) {
  const tasks = tasksVinculadas || [];
  const total = tasks.length;
  const completed = tasks.filter(t => t.status === 'concluida').length;
  const overdue = tasks.filter(t => t.prazo && t.status !== 'concluida' && daysLeft(t.prazo) < 0).length;
  const blocked = tasks.filter(t => t.status === 'bloqueada').length;
  const microProgress = total ? Math.round(completed / total * 100) : null;
  const importedProgress = (macroActivity && typeof macroActivity.progress === 'number') ? macroActivity.progress : null;
  return { microProgress, importedProgress, totalTasks: total, completedTasks: completed, overdueTasks: overdue, blockedTasks: blocked };
}

// Determina a situação visual da macro entrega, com prioridade quando há mais de uma condição.
function determineMacroDeliveryStatus(macroActivity, mapping, prog) {
  // 1) Requer revisão — mapping inconsistente ou atividade não localizada
  if (mapping && statusMapeamento(mapping).key === 'nao-localizada') return { key:'requer-revisao', label:'Requer revisão', badge:'badge-red', icon:'ti-alert-triangle' };
  if (mapping && !macroActivity) return { key:'requer-revisao', label:'Requer revisão', badge:'badge-red', icon:'ti-alert-triangle' };
  const total = prog.totalTasks;
  // 7) Sem tarefas
  if (total === 0) return { key:'sem-tarefas', label:'Sem tarefas', badge:'badge-gray', icon:'ti-unlink' };
  // 2) Bloqueada
  if (prog.blockedTasks > 0) return { key:'bloqueada', label:'Bloqueada', badge:'badge-red', icon:'ti-lock' };
  const iniciadas = prog.completedTasks + macroActivityIniciadasCount(macroActivity, prog);
  const fim = macroActivity && macroActivity.endDate ? macroActivity.endDate : null;
  const atrasadaPorData = fim && daysLeft(fim) < 0 && prog.completedTasks < total;
  // 3) Atrasada
  if (atrasadaPorData || prog.overdueTasks > 0) return { key:'atrasada', label:'Atrasada', badge:'badge-red', icon:'ti-alert-triangle' };
  // 4) Concluída
  if (prog.completedTasks === total) return { key:'concluida', label:'Concluída', badge:'badge-green', icon:'ti-circle-check' };
  // 8) Sem datas
  if (macroActivity && !macroActivity.startDate && !macroActivity.endDate) {
    // ainda assim pode estar em andamento; sem datas é informativo de menor prioridade
    if (prog.completedTasks === 0) return { key:'sem-datas', label:'Sem datas', badge:'badge-gray', icon:'ti-calendar-off' };
  }
  // 5) Em andamento
  if (prog.completedTasks > 0) return { key:'em-andamento', label:'Em andamento', badge:'badge-warn', icon:'ti-player-play' };
  // 6) Não iniciada
  return { key:'nao-iniciada', label:'Não iniciada', badge:'badge-gray', icon:'ti-clock' };
}
// helper: considera "iniciada" qualquer tarefa em_andamento/concluida/bloqueada (não altera dados)
function macroActivityIniciadasCount(_macro, prog) { return 0; } // reservado; prog já traz completed

// Ordena macro entregas: 1) data de início; 2) ordem do cronograma (hierarchyCode); 3) nome.
function sortMacroDeliveries(list) {
  const modo = state.ordenacaoLista || 'padrao';
  if (modo === 'vencimento') {
    // ordena pela data de TÉRMINO da macro entrega (mais próxima primeiro); sem data ao final
    return [...list].sort((a,b) => {
      const af = a.macroActivity && a.macroActivity.endDate ? a.macroActivity.endDate : null;
      const bf = b.macroActivity && b.macroActivity.endDate ? b.macroActivity.endDate : null;
      if (af && bf && af !== bf) return af < bf ? -1 : 1;
      if (af && !bf) return -1;
      if (!af && bf) return 1;
      const an = (a.macroActivity && a.macroActivity.name) || (a.mapping && a.mapping.macroNameSnapshot) || '';
      const bn = (b.macroActivity && b.macroActivity.name) || (b.mapping && b.mapping.macroNameSnapshot) || '';
      return an.localeCompare(bn);
    });
  }
  return [...list].sort((a,b) => {
    const am = a.macroActivity, bm = b.macroActivity;
    const ad = am && am.startDate ? am.startDate : null;
    const bd = bm && bm.startDate ? bm.startDate : null;
    if (ad && bd && ad !== bd) return ad < bd ? -1 : 1;
    if (ad && !bd) return -1;
    if (!ad && bd) return 1;
    const ah = am && am.hierarchyCode ? am.hierarchyCode : '';
    const bh = bm && bm.hierarchyCode ? bm.hierarchyCode : '';
    if (ah && bh && ah !== bh) return ah.localeCompare(bh, undefined, {numeric:true});
    // sem data (ou com a mesma data): sequência do checklist, e não ordem alfabética
    if (a.posChecklist != null && b.posChecklist != null && a.posChecklist !== b.posChecklist) return a.posChecklist - b.posChecklist;
    const an = (am && am.name) || (a.mapping && a.mapping.macroNameSnapshot) || '';
    const bn = (bm && bm.name) || (b.mapping && b.mapping.macroNameSnapshot) || '';
    return an.localeCompare(bn);
  });
}

// Posição de cada tarefa na sequência do checklist. A ordem do array de tarefas do projeto é a ordem em que
// o checklist as definiu (gravada em tasks.ordem e relida na carga), então o índice no array é a referência.
function ordemDasTarefas(p) {
  const m = new Map();
  ((p && p.tasks) || []).forEach((t, i) => m.set(t.id, i));
  return m;
}

// Ordena tarefas: 1) macroOrder; 2) sequência do checklist; 3) prazo; 4) nome.
// (O item 2 constava no comentário mas não estava implementado: sem ele, as tarefas de uma macro, que
// herdam o mesmo prazo, caíam em ordem alfabética.)
function sortHierarchyTasks(tasks, ordem, porPrazo) {
  const modo = state.ordenacaoLista || 'padrao';
  if (modo === 'vencimento') {
    // Ordena por prazo (mais próximo primeiro); tarefas sem prazo ao final; concluídas ao fim.
    return [...tasks].sort((a,b) => {
      const ac = a.status === 'concluida' ? 1 : 0, bc = b.status === 'concluida' ? 1 : 0;
      if (ac !== bc) return ac - bc;
      const ap = a.prazo || '9999-12-31', bp = b.prazo || '9999-12-31';
      if (ap !== bp) return ap < bp ? -1 : 1;
      return (a.tarefa||'').localeCompare(b.tarefa||'');
    });
  }
  // padrão: macroOrder → ordem do projeto → prazo → nome
  return [...tasks].sort((a,b) => {
    if (a.macroOrder != null && b.macroOrder != null && a.macroOrder !== b.macroOrder) return a.macroOrder - b.macroOrder;
    // Projeto sem cronograma macro (ex.: Customização): não há macros que deem ordem às tarefas incluídas depois.
    // Vale o prazo (mais próximo primeiro); as sem prazo seguem a sequência do checklist, depois das datadas.
    if (porPrazo) {
      const pa = a.prazo || '', pb = b.prazo || '';
      if (pa !== pb) { if (!pa) return 1; if (!pb) return -1; return pa < pb ? -1 : 1; }
    }
    if (ordem) {
      const ia = ordem.get(a.id), ib = ordem.get(b.id);
      if (ia != null && ib != null && ia !== ib) return ia - ib;
    }
    const ap = a.prazo || '9999-12-31', bp = b.prazo || '9999-12-31';
    if (ap !== bp) return ap < bp ? -1 : 1;
    return (a.tarefa||'').localeCompare(b.tarefa||'');
  });
}

// Agrupamento central: Projeto → Fase → Macro entrega → Tarefas (+ tarefas sem vínculo).
// Recebe a lista de tarefas JÁ filtrada. NÃO altera o estado principal.
function groupProjectTasksHierarchy(project, tasks) {
  const ordemFases = Object.keys(FASE_COLORS);
  const fasesPresentes = ordemFases.filter(f => tasks.some(t => t.fase === f));
  [...new Set(tasks.map(t => t.fase))].forEach(f => { if (!fasesPresentes.includes(f)) fasesPresentes.push(f); });

  const ordem = ordemDasTarefas(project);
  return fasesPresentes.map(fase => {
    const tsFase = tasks.filter(t => t.fase === fase);
    // Posição de cada macro na sequência do checklist: a 1ª tarefa dela NESTA fase, olhando o projeto inteiro
    // (assim a ordem das macros não muda quando há filtro ativo na Lista)
    const posMacro = new Map();
    (project.tasks || []).forEach(t => {
      if (t.fase !== fase) return;
      const dd = resolveTaskMacroDelivery(project, t);
      if (!dd.hasDelivery) return;
      const ch = dd.macroActivityId || dd.macroKey || dd.macroName;
      const i = ordem.get(t.id);
      if (!posMacro.has(ch) || i < posMacro.get(ch)) posMacro.set(ch, i);
    });
    // agrupa por macro entrega dentro da fase
    const byDelivery = new Map(); // chave estável → {macroActivity, mapping, tasks}
    const unmapped = [];
    tsFase.forEach(t => {
      const d = resolveTaskMacroDelivery(project, t);
      if (!d.hasDelivery) { unmapped.push(t); return; }
      const chave = d.macroActivityId || d.macroKey || d.macroName;
      if (!byDelivery.has(chave)) byDelivery.set(chave, { chave, macroActivity: d._macro, mapping: d._mapping, tasks: [] });
      byDelivery.get(chave).tasks.push(t);
    });

    let macroDeliveries = [...byDelivery.values()].map(entry => {
      const prog = calculateMacroDeliveryProgress(project, entry.macroActivity, entry.tasks);
      const status = determineMacroDeliveryStatus(entry.macroActivity, entry.mapping, prog);
      return { macroActivity: entry.macroActivity, mapping: entry.mapping, status, progress: prog, posChecklist: posMacro.get(entry.chave), tasks: sortHierarchyTasks(entry.tasks, ordem) };
    });
    macroDeliveries = sortMacroDeliveries(macroDeliveries);

    // totais da fase (baseados nas tarefas micro)
    const allFaseTasks = tsFase;
    const completed = allFaseTasks.filter(t => t.status === 'concluida').length;
    const overdue = allFaseTasks.filter(t => t.prazo && t.status !== 'concluida' && daysLeft(t.prazo) < 0).length;
    const blocked = allFaseTasks.filter(t => t.status === 'bloqueada').length;
    const progress = allFaseTasks.length ? Math.round(completed / allFaseTasks.length * 100) : 0;

    return {
      phaseKey: fase, phaseName: fase,
      totals: { macroDeliveries: macroDeliveries.length, tasks: allFaseTasks.length, completed, overdue, blocked, progress },
      macroDeliveries,
      unmappedTasks: sortHierarchyTasks(unmapped, ordem, !projetoTemMacro(project))
    };
  });
}

// Tarefas sem macro entrega, agrupadas por fase (utilitário)
function getUnmappedTasksByPhase(project, tasks) {
  const out = {};
  (tasks||[]).forEach(t => {
    const d = resolveTaskMacroDelivery(project, t);
    if (!d.hasDelivery) { (out[t.fase] = out[t.fase] || []).push(t); }
  });
  return out;
}

// Lista as macro entregas únicas do projeto (para os selects de filtro)
function macroEntregasDoProjeto(project) {
  const seen = new Map();
  (project.tasks||[]).forEach(t => {
    const d = resolveTaskMacroDelivery(project, t);
    if (!d.hasDelivery) return;
    const key = d.macroActivityId || d.macroKey || d.macroName;
    if (!seen.has(key)) seen.set(key, { key, nome: d.macroName });
  });
  return [...seen.values()].sort((a,b)=>a.nome.localeCompare(b.nome));
}

// ── Estado de expansão (UI) ──
function togglePhaseExpansion(pId, fase) {
  const key = pId + '::' + fase;
  uiState.expandedPhases[key] = !uiState.expandedPhases[key];
  const p = state.projetos.find(x=>x.id===pId);
  if (p) renderTaskView(p);
}
function toggleMacroDeliveryExpansion(pId, fase, deliveryKey) {
  const key = pId + '::' + fase + '::' + deliveryKey;
  uiState.expandedMacroDeliveries[key] = !uiState.expandedMacroDeliveries[key];
  const p = state.projetos.find(x=>x.id===pId);
  if (p) renderTaskView(p);
}
function expandAllHierarchy(pId) {
  const p = state.projetos.find(x=>x.id===pId);
  if (!p) return;
  const grupos = groupProjectTasksHierarchy(p, getFilteredTasks(p));
  grupos.forEach(g => {
    uiState.expandedPhases[pId+'::'+g.phaseName] = true;
    g.macroDeliveries.forEach(d => {
      const dk = (d.macroActivity && d.macroActivity.id) || (d.macroActivity && d.macroActivity.macroKey) || d.status.key;
      uiState.expandedMacroDeliveries[pId+'::'+g.phaseName+'::'+dk] = true;
    });
    uiState.expandedMacroDeliveries[pId+'::'+g.phaseName+'::__unmapped'] = true;
  });
  renderTaskView(p);
}
function collapseAllHierarchy(pId) {
  const p = state.projetos.find(x=>x.id===pId);
  if (!p) return;
  Object.keys(uiState.expandedPhases).forEach(k => { if (k.startsWith(pId+'::')) uiState.expandedPhases[k] = false; });
  Object.keys(uiState.expandedMacroDeliveries).forEach(k => { if (k.startsWith(pId+'::')) uiState.expandedMacroDeliveries[k] = false; });
  renderTaskView(p);
}

function projToggleFase(pId, fase) {
  const key = pId + '::' + fase;
  state.projFaseExpand[key] = !state.projFaseExpand[key];
  const p = state.projetos.find(x=>x.id===pId);
  if (p) renderTaskView(p);
}
function projExpandirTodasFases(pId, expandir) {
  const p = state.projetos.find(x=>x.id===pId);
  if (!p) return;
  [...new Set((p.tasks||[]).map(t=>t.fase))].forEach(f => state.projFaseExpand[pId+'::'+f] = expandir);
  renderTaskView(p);
}

  const grupos = groupProjectTasksHierarchy(p, tasks);

  const acoes = `

          <option value="vencimento" ${state.ordenacaoLista==='vencimento'?'selected':''}>${projetoTemMacro(p) ? 'Data de vencimento (mais próximo primeiro)' : 'Por prazo, concluídas por último'}</option>

        Modo de edição: ajuste o prazo das tarefas e clique em <strong>Salvar prazos</strong>.${projetoTemMacro(p) ? ' O prazo de uma tarefa não pode passar do fim da macro a que ela pertence (a data limite aparece abaixo do campo).' : ''} Tarefas concluídas não são editadas.</div>

// Nível 2 — Fase
function renderPhaseGroup(p, g) {
  const fase = g.phaseName;
  const key = p.id + '::' + fase;
  const aberto = !!uiState.expandedPhases[key];
  const fc = FASE_COLORS[fase] || {bg:'#f1f5f9',color:'#64748b'};
  const T = g.totals;

  // Projeto sem cronograma macro (ex.: Customização): tarefas direto na fase, sem a camada de macro
  const semMacro = !projetoTemMacro(p);
  const corpoMacros = g.macroDeliveries.map(d => renderMacroDeliveryGroup(p, fase, d)).join('');
  const corpoUnmapped = !g.unmappedTasks.length ? '' : (semMacro ? renderTarefasDiretas(p, g.unmappedTasks) : renderUnmappedGroup(p, fase, g.unmappedTasks));

  return `<div class="card" style="margin-bottom:12px;padding:0;overflow:hidden">
    <div onclick="togglePhaseExpansion('${p.id}','${fase.replace(/'/g,"\\'")}')"
         style="padding:13px 16px;background:${fc.bg};display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none">
      <i class="ti ti-chevron-${aberto?'down':'right'}" style="font-size:16px;color:${fc.color}"></i>
      <i class="ti ti-folder" style="font-size:16px;color:${fc.color}"></i>
      <div style="font-size:13px;font-weight:700;color:${fc.color};flex:1">${fase}</div>
      <span style="font-size:11px;color:${fc.color};opacity:.85">${semMacro ? '' : `${T.macroDeliveries} macro entrega${T.macroDeliveries!==1?'s':''} · `}${T.tasks} tarefa${T.tasks!==1?'s':''}</span>
      ${T.blocked>0 ? `<span class="badge badge-red" style="font-size:10px"><i class="ti ti-lock"></i>${T.blocked}</span>` : ''}
      ${T.overdue>0 ? `<span class="badge badge-red" style="font-size:10px"><i class="ti ti-alert-triangle"></i>${T.overdue}</span>` : ''}
      <span style="font-size:11px;color:${fc.color};opacity:.85">${T.completed}/${T.tasks}</span>
      <div style="width:70px;height:6px;background:#ffffff99;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${T.progress}%;background:${fc.color};border-radius:3px"></div>
      </div>
      <span style="font-size:12px;font-weight:700;color:${fc.color};min-width:38px;text-align:right">${T.progress}%</span>
    </div>
    ${aberto ? `<div style="padding:10px 12px;background:#fafbfc">${corpoMacros}${corpoUnmapped}</div>` : ''}
  </div>`;
}

         <i class="ti ti-flag-filled" style="font-size:13px"></i>Fim ${fmt(m.endDate)}${fimAtrasado?` · ${Math.abs(dlFim)}d atraso`:(dlFim!=null&&dlFim>=0&&dlFim<=7&&prog.completedTasks<prog.totalTasks?` · faltam ${dlFim}d`:'')}</span>`

// Nível 4 — Tarefa (linha dentro da macro entrega; não repete o nome da macro)
function renderHierarchicalTaskRow(p, t) {
  const dl = t.prazo ? daysLeft(t.prazo) : null;
  const vencida = dl != null && dl < 0 && t.status !== 'concluida';
  const hoje = dl === 0 && t.status !== 'concluida';
  const proximo = dl != null && dl > 0 && dl <= 3 && t.status !== 'concluida';
  let prazoHTML;
  if (!t.prazo) {
    prazoHTML = `<span style="font-size:12px;color:var(--gray-300)">sem prazo</span>`;
  } else {
    const cor = vencida ? 'var(--danger)' : hoje ? '#b45309' : proximo ? '#b45309' : 'var(--gray-600)';
    const peso = (vencida||hoje||proximo) ? '700' : '500';
    const sufixo = t.status==='concluida' ? '' : (vencida ? ` (${Math.abs(dl)}d atraso)` : hoje ? ' (hoje)' : dl===1 ? ' (amanhã)' : proximo ? ` (${dl}d)` : '');
    prazoHTML = `<span style="font-size:12.5px;color:${cor};font-weight:${peso};white-space:nowrap">${vencida?'<i class="ti ti-alert-triangle" style="font-size:12px;vertical-align:-1px"></i> ':''}${fmt(t.prazo)}${sufixo}</span>`;
  }
  if (state.listaEdicaoPrazos && isGestor() && t.status !== 'concluida') {
    const lim = limiteMacroDaTarefa(p, t);
    prazoHTML = `<div style="display:flex;flex-direction:column;gap:2px">
      <input type="date" class="form-input" style="padding:3px 6px;font-size:12px;width:140px" id="ep-${t.id}" value="${t.prazo||''}" ${lim ? `max="${lim}"` : ''}>
      ${lim ? `<span style="font-size:10.5px;color:var(--gray-400)">até ${fmt(lim)} (fim da macro)</span>` : ''}
    </div>`;
  }
  return `<tr ${vencida?'style="background:#fef2f2"':''}>
    <td><input type="checkbox" class="task-check" ${t.status==='concluida'?'checked':''} onchange="toggleTask('${p.id}','${t.id}',this.checked)"></td>
    <td style="max-width:340px;cursor:pointer;color:var(--gray-800);font-weight:500;${t.status==='concluida'?'text-decoration:line-through;color:var(--gray-400)':''}" onclick="abrirTarefa('${p.id}','${t.id}')">
      <span class="badge" style="background:${(TEMA_COLORS[t.tema]||'#64748b')}18;color:${TEMA_COLORS[t.tema]||'#64748b'};font-size:9px;margin-right:6px">${t.tema}</span>${t.tarefa} ${helpIconHTML(t)}
    </td>
    <td style="font-size:12px;color:var(--gray-600)">${t.responsavel||'—'}</td>
    <td>${statusBadge(t.status)}</td>
    <td>${prazoHTML}</td>
    <td style="font-size:12px;color:var(--gray-500)">${t.esforco||'—'}</td>
    <td>
      <div style="display:flex;align-items:center;gap:2px">
        <select class="filter-select" style="border:none;background:transparent;font-size:11px;padding:2px 2px;max-width:76px" onchange="mudarStatus('${p.id}','${t.id}',this.value)">
          ${Object.entries(STATUS_MAP).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
        ${isGestor() ? `<button class="btn btn-sm btn-excluir" style="font-size:11px" title="Excluir tarefa deste projeto" onclick="excluirTarefaProjeto('${p.id}','${t.id}')"><i class="ti ti-trash"></i> Excluir</button>` : ''}
      </div>
    </td>
  </tr>`;
}

// Exclui uma tarefa APENAS deste projeto. O checklist padrão e os demais
// projetos não são afetados. Restrito ao gestor de projetos.
async function excluirTarefaProjeto(pId, tId) {
  if (!isGestor()) { notificar('Apenas o gestor de projetos pode excluir tarefas.', 'erro'); return; }
  const p = state.projetos.find(x => x.id === pId);
  if (!p || !Array.isArray(p.tasks)) return;
  const idx = p.tasks.findIndex(t => t.id === tId);
  if (idx === -1) return;
  const t = p.tasks[idx];

  const aviso = isGoLiveMarkerTask(t)
    ? '\n\nATENÇÃO: esta é a tarefa que confirma a realização do Go-live. Sem ela, o sistema volta a usar o progresso do projeto para decidir se o Go-live aconteceu.'
    : '';
  if (!confirm(`Excluir a tarefa "${t.tarefa}" deste projeto?\n\nA exclusão vale somente para o projeto "${p.nome}". O checklist padrão e os demais projetos não são alterados.${aviso}\n\nEsta ação não pode ser desfeita.`)) return;

  if (sbClient) {
    const { data, error } = await sbClient.from('tasks').delete().eq('id', tId).select('id');
    if (error) { notificar('Não foi possível excluir a tarefa: ' + error.message, 'erro'); return; }
    if (!data || data.length === 0) {
      notificar('A tarefa não foi excluída no servidor (verifique suas permissões). Recarregue a página.', 'erro');
      return;
    }
  }
  p.tasks.splice(idx, 1);
  saveState();
  renderProjetoDetail(p);
  renderSidebar();
  notificar('Tarefa excluída deste projeto.', 'sucesso');
}

// Leva à aba de cronograma macro e destaca a atividade
function irParaCronogramaMacro(pId, macroId) {
  const p = state.projetos.find(x=>x.id===pId);
  if (!p) return;
  state.viewMode = 'macro';
  state._highlightMacroId = macroId || null;
  renderProjetoDetail(p);
  setTimeout(() => {
    if (macroId) {
      const row = document.querySelector(`[data-macro-row="${macroId}"]`);
      if (row) { row.scrollIntoView({behavior:'smooth', block:'center'}); row.style.transition='background .3s'; row.style.background='#fef9c3'; setTimeout(()=>{row.style.background='';}, 2000); }
    }
  }, 150);
}

function renderKanban(tasks, p, container) {
  const group = state.kanbanGroup;
  let groups;
  if (group === 'fase') groups = Object.keys(FASE_COLORS).filter(f => tasks.some(t=>t.fase===f));
  else if (group === 'tema') groups = [...new Set(tasks.map(t=>t.tema))];
  else groups = ['pendente','em_andamento','concluida','bloqueada'];

  const getBgColor = (g) => {
    if (group==='fase') return FASE_COLORS[g]?.color||'#64748b';
    if (group==='tema') return TEMA_COLORS[g]||'#64748b';
    return {pendente:'#64748b',em_andamento:'#d97706',concluida:'#16a34a',bloqueada:'#dc2626'}[g]||'#64748b';
  };

  container.innerHTML = `<div class="kanban-board">
    ${groups.map(g => {
      const gtasks = tasks.filter(t => group==='fase'?t.fase===g : group==='tema'?t.tema===g : t.status===g);
      const label = group==='status' ? STATUS_MAP[g]?.label||g : g;
      const color = getBgColor(g);
      return `<div class="kanban-col">
        <div class="kanban-col-header">
          <span style="color:${color}">${label}</span>
          <span class="badge" style="background:${color}18;color:${color}">${gtasks.length}</span>
        </div>
        ${gtasks.map(t => {
          const d = resolveTaskMacroDelivery(p, t);
          const ctx = d.hasDelivery ? `${t.fase.replace(/^Fase\s*/,'Fase ').split(' - ')[0]} · ${d.macroName}` : (projetoTemMacro(p) ? `${t.fase.split(' - ')[0]} · sem macro entrega` : `${t.fase.split(' - ')[0]}`);
          return `<div class="kanban-card" style="border-left-color:${TEMA_COLORS[t.tema]||'#64748b'}" onclick="abrirTarefa('${p.id}','${t.id}')">
          <div style="font-size:10px;color:var(--gray-400);margin-bottom:3px;line-height:1.3"><i class="ti ti-package" style="font-size:10px;vertical-align:-1px"></i> ${ctx}</div>
          <div class="kanban-card-title">${t.tarefa} ${helpIconHTML(t)}</div>
          <div class="kanban-card-meta">
            ${group!=='status' ? statusBadge(t.status) : `<span class="badge" style="background:${(TEMA_COLORS[t.tema]||'#64748b')}18;color:${TEMA_COLORS[t.tema]||'#64748b'}">${t.tema}</span>`}
            <div style="font-size:10px;color:var(--gray-400)">${t.esforco||''}</div>
          </div>
        </div>`;}).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

function renderCalendario(tasks, p, container) {
  const year = state.calYear, month = state.calMonth;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const today = new Date();

  const tasksByDate = {};
  tasks.filter(t=>t.prazo).forEach(t => {
    if (!tasksByDate[t.prazo]) tasksByDate[t.prazo] = [];
    tasksByDate[t.prazo].push(t);
  });

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <button class="btn btn-secondary btn-sm" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
    <div style="font-weight:600;font-size:15px">${monthNames[month]} ${year}</div>
    <button class="btn btn-secondary btn-sm" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
  </div>
  <div class="calendar-grid">
    ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-day-header">${d}</div>`).join('')}`;

  for (let i=0; i<firstDay; i++) html += `<div class="cal-day other-month"></div>`;

  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = today.getDate()===d && today.getMonth()===month && today.getFullYear()===year;
    const dayTasks = tasksByDate[dateStr]||[];
    html += `<div class="cal-day${isToday?' today':''}">
      <div class="cal-date${isToday?' today-num':''}">${d}</div>
      ${dayTasks.slice(0,3).map(t=>{
        const d = resolveTaskMacroDelivery(p, t);
        const macroTip = d.hasDelivery ? d.macroName : (projetoTemMacro(p) ? 'sem macro entrega' : '');
        const tip = `${p.nome} · ${t.fase} · ${macroTip ? macroTip + ' · ' : ''}${t.tarefa}${t.responsavel?' · '+t.responsavel:''}${t.prazo?' · '+fmt(t.prazo):''}`;
        return `<div class="cal-task" style="background:${TEMA_COLORS[t.tema]||'#64748b'}22;color:${TEMA_COLORS[t.tema]||'#64748b'}" onclick="abrirTarefa('${p.id}','${t.id}')" title="${tip.replace(/"/g,'&quot;')}">${t.tarefa}</div>`;
      }).join('')}
      ${dayTasks.length>3?`<div style="font-size:9px;color:var(--gray-400)">+${dayTasks.length-3} mais</div>`:''}
    </div>`;
  }
  html += `</div>`;

  if (!tasks.filter(t=>t.prazo).length) {
    html += `<div class="alert alert-info" style="margin-top:16px"><i class="ti ti-info-circle"></i> Nenhuma tarefa tem prazo definido. Abra uma tarefa para definir um prazo.</div>`;
  }

  container.innerHTML = `<div class="card">${html}</div>`;
}

function changeMonth(delta) {
  state.calMonth += delta;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  const p = state.projetos.find(x=>x.id===state.currentProjetoId);
  renderTaskView(p);
}

// ==================== TASK ACTIONS ====================
// Redesenha a tela de origem depois de mudar o status de uma tarefa na Lista do projeto, para o texto riscado,
// o selo de status e os contadores da fase aparecerem na hora (antes só apareciam ao recarregar a página).
// Guarda e restaura a rolagem para não voltar ao topo da lista a cada clique. Em "Editar prazos" não redesenha,
// para não descartar datas digitadas e ainda não salvas.
function redesenharAposStatus(p) {
  if (state.listaEdicaoPrazos) return;
  const rolagem = []; let n = document.getElementById('page-content');
  while (n) { if (n.scrollTop > 0) rolagem.push([n, n.scrollTop]); n = n.parentElement; }
  const y = window.scrollY || 0;
  if (state.currentPage === 'minhas-tarefas') renderMinhasTarefas();
  else if (p) renderProjetoDetail(p);
  rolagem.forEach(([el, topo]) => { el.scrollTop = topo; });
  if (y) window.scrollTo(0, y);
}

function toggleTask(pId, tId, checked) {
  const p = state.projetos.find(x=>x.id===pId);
  const t = p?.tasks?.find(x=>x.id===tId);
  if (t) {
    aplicarStatusTarefa(t, checked ? 'concluida' : 'pendente');
    saveState();
    persistirTarefa(pId, t);
    renderSidebar();
    document.getElementById('nav-'+state.currentPage)?.classList.add('active');
    redesenharAposStatus(p);
  }
}

function mudarStatus(pId, tId, status) {
  const p = state.projetos.find(x=>x.id===pId);
  const t = p?.tasks?.find(x=>x.id===tId);
  if (t) {
    aplicarStatusTarefa(t, status);
    saveState();
    persistirTarefa(pId, t);
    renderSidebar();
    document.getElementById('nav-'+state.currentPage)?.classList.add('active');
    redesenharAposStatus(p);
  }
}

function salvarTarefa(pId, tId) {
  const p = state.projetos.find(x=>x.id===pId);
  const t = p?.tasks?.find(x=>x.id===tId);
  if (!t) return;
  // Prazo além do fim da macro: avisa e pede confirmação. A 1ª vez não salva nada; ao clicar de novo no
  // botão (agora "Confirmar e salvar"), o prazo é mantido. Mudar a data de novo pede nova confirmação.
  const campoPrazoW = document.getElementById('tPrazo');
  if (campoPrazoW) {
    const prazoW = campoPrazoW.value || '';
    const selMacroW = document.getElementById('tMacroActivity');
    const macroAntesW = resolveTaskMacroDelivery(p, t).macroActivityId || t.macroActivityId || '';
    const macroW = selMacroW ? (selMacroW.value || '') : macroAntesW;
    const mObjW = macroW ? (p.macroActivities || []).find(m => m.id === macroW) : null;
    if (mObjW && macroW !== macroAntesW && !macroServeFase(p, mObjW, t.fase)) {
      notificar(`A macro "${mObjW.name}" é da "${mObjW.phase}" e esta tarefa é da "${t.fase}". Uma tarefa só pode ser ligada a uma macro da mesma fase.`, 'erro');
      return;
    }
    const limW = mObjW ? (mObjW.endDate || mObjW.startDate || null) : null;
    const mudouW = prazoW !== (t.prazo || '') || macroW !== macroAntesW;
    if (prazoW && limW && prazoW > limW && mudouW) {
      const chaveW = tId + '|' + prazoW + '|' + macroW;
      if (_prazoAcimaConfirmado !== chaveW) {
        _prazoAcimaConfirmado = chaveW;
        const caixaW = document.getElementById('tAvisoMacro');
        if (caixaW) {
          caixaW.innerHTML = `<strong><i class="ti ti-alert-triangle" style="font-size:13px;vertical-align:-2px"></i> Prazo depois do fim da macro.</strong><br>
            O prazo informado (<strong>${fmt(prazoW)}</strong>) é depois do fim da macro "${(mObjW.name || '').replace(/</g,'&lt;')}" (<strong>${fmt(limW)}</strong>).
            Para manter essa data, clique em <strong>Confirmar e salvar</strong>. Para ajustar, mude o prazo.`;
          caixaW.style.display = 'block';
        }
        const btW = document.getElementById('tBtnSalvar');
        if (btW) btW.innerHTML = '<i class="ti ti-alert-triangle"></i> Confirmar e salvar';
        return;
      }
    }
    _prazoAcimaConfirmado = null;
  }
  // Nome da tarefa: só o gestor altera
  const campoNome = document.getElementById('tNome');
  if (campoNome && isGestor()) {
    const novoNome = campoNome.value.trim();
    if (!novoNome) { notificar('O nome da tarefa não pode ficar vazio.', 'erro'); return; }
    if (novoNome !== t.tarefa) {
      if (isGoLiveMarkerTask(t)) t._goLiveMarker = true;   // o marco passa a ser identificado pela marcação, não pelo nome
      t.tarefa = novoNome;
    }
  }
  aplicarStatusTarefa(t, document.getElementById('tStatus').value);
  const novoPrazo = document.getElementById('tPrazo').value;
  // Se o usuário alterou o prazo manualmente, marca para não ser sobrescrito pelas datas da macro
  if (novoPrazo !== (t.prazo || '')) {
    t.prazo = novoPrazo;
    t._prazoManual = !!novoPrazo;         // prazo manual definido; se limpou, volta a ser automático
    t.prazoOrigem = novoPrazo ? 'manual' : null;
  }
  t.comentario = document.getElementById('tComentario').value;
  // Detalhes do bloqueio (só fazem sentido quando a tarefa está bloqueada)
  if (t.status === 'bloqueada') {
    t.bloqueioCom = document.getElementById('tBloqueioCom')?.value || '';
    t.bloqueioDesde = document.getElementById('tBloqueioDesde')?.value || null;
    t.bloqueioObs = (document.getElementById('tBloqueioObs')?.value || '').trim();
  } else {
    t.bloqueioCom = ''; t.bloqueioDesde = null; t.bloqueioObs = '';
  }
  // Vínculo opcional com atividade macro do cronograma
  const macroSel = document.getElementById('tMacroActivity');
  const macroAntes = resolveTaskMacroDelivery(p, t).macroActivityId || t.macroActivityId || '';
  let vinculoMudou = false;
  if (macroSel && (macroSel.value || '') !== macroAntes) {
    vincularTarefaAMacro(p, t, macroSel.value || null);   // grava o vínculo nas duas fontes
    vinculoMudou = true;
  }
  saveState();
  if (vinculoMudou) {
    persistirCronograma(p, [t]).then(r => { if (!r.ok) notificar('Não foi possível gravar o vínculo com a macro: ' + r.error + ' Recarregue a página para conferir.', 'erro'); });
  } else {
    persistirTarefa(pId, t);
  }
  closeModal();
  // Atualiza sidebar badge e recarrega a página de origem
  renderSidebar();
  document.getElementById('nav-'+state.currentPage)?.classList.add('active');
  if (state.currentPage === 'minhas-tarefas') {
    renderMinhasTarefas();
  } else {
    renderProjetoDetail(p);
  }
}
